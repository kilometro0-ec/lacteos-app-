<script>
    // FUNCIÓN CLAVE: Procesa la entrada física de productos al almacén
    async function confirmarIngreso() {
        const btn = document.getElementById('btn-confirmar');
        const notas = document.getElementById('nota-recepcion').value;
        
        btn.disabled = true;
        try {
            // Enviamos los items modificados (por si llegó menos cantidad)
            const res = await DairyAPI.guardarDatos("Compras", {
                pestaña: "Compras", 
                accion: "recepcion_final", // Trigger en Apps Script para subir stock
                id_operacion: idSeleccionado,
                observaciones: notas,
                datos_actualizados: JSON.stringify(itemsEnEdicion)
            });
            if (res === "OK") { 
                alert("¡Stock actualizado e ingreso registrado!");
                location.reload(); 
            }
        } catch (e) { alert("Error en el servidor"); }
    }
</script>
