<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Recepción - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="theme-color" content="#2563eb">
    <style>
        /* Animación suave para las cards */
        .card-orden {
            transition: all 0.2s ease;
        }
        .card-orden:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .badge-id {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            color: white;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .producto-card {
            transition: background 0.2s;
        }
        .producto-card:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-100 text-slate-800 min-h-screen flex flex-col pb-16">

    <div id="menu-container"></div>

    <header class="bg-gradient-to-r from-blue-700 to-blue-600 text-white shadow-lg px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-white/20 p-2 rounded-full backdrop-blur-sm">
                <i data-lucide="package-check" class="w-7 h-7"></i>
            </div>
            <div>
                <h1 class="text-2xl font-black tracking-tight">Confirmar Recepción</h1>
                <p class="text-xs text-blue-100 font-medium">Ingreso de compras agrupadas por orden</p>
            </div>
        </div>
        <div class="bg-blue-800/40 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-400/30">
            <i data-lucide="database" class="w-3 h-3 inline mr-1"></i> Sincronizado con Google Sheets
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Panel izquierdo: Órdenes pendientes (agrupadas) -->
        <div class="lg:col-span-1 bg-white/90 backdrop-blur-sm p-5 rounded-2xl shadow-lg border border-slate-200 flex flex-col h-[calc(100vh-11rem)]">
            <div class="mb-5">
                <h2 class="font-black flex items-center gap-2 text-slate-700 text-lg">
                    <i data-lucide="clock" class="w-5 h-5 text-amber-500"></i>
                    Órdenes pendientes
                </h2>
                <div class="relative mt-3">
                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchOrden" oninput="filtrarOrdenes()" placeholder="Buscar ID o proveedor..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none">
                </div>
            </div>
            <div id="listaOrdenes" class="flex-1 overflow-y-auto space-y-4 pr-1 custom-scrollbar">
                <div class="text-center py-12 text-slate-400 animate-pulse">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2 text-blue-500"></i>
                    <p class="text-sm">Cargando órdenes...</p>
                </div>
            </div>
        </div>

        <!-- Panel derecho: Detalle de la orden seleccionada -->
        <div class="lg:col-span-2 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col">
            <div id="detalleOrden" class="p-6 space-y-6 transition-all duration-300">
                <!-- Cabecera de la orden -->
                <div class="flex flex-wrap justify-between items-start gap-3 border-b pb-4 border-slate-100">
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span id="badgeId" class="badge-id text-xs px-3 py-1.5 rounded-full shadow-sm">ID: -</span>
                            <span class="bg-slate-100 text-slate-500 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">Recepción</span>
                        </div>
                        <h2 id="proveedorNombre" class="text-2xl font-black text-slate-800 mt-2">Sin selección</h2>
                        <div class="flex items-center gap-2 mt-1 text-slate-500 text-xs">
                            <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
                            <p id="fechaOrden">Fecha: --</p>
                        </div>
                    </div>
                    <div class="bg-amber-50 p-2 rounded-xl border border-amber-200 text-center">
                        <i data-lucide="package" class="w-5 h-5 text-amber-600 mx-auto"></i>
                        <span id="totalProductos" class="text-xs font-black text-amber-700 block">0 productos</span>
                    </div>
                </div>

                <!-- Lista de productos de esta orden -->
                <div>
                    <h3 class="text-sm font-black text-slate-500 uppercase tracking-wider flex items-center gap-2 mb-3">
                        <i data-lucide="list" class="w-4 h-4"></i> Detalle de productos
                    </h3>
                    <div id="listaProductos" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div>
                </div>

                <!-- Campos comunes de la recepción -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 pt-4 border-t border-slate-100 bg-slate-50/40 p-4 rounded-xl">
                    <div>
                        <label class="block text-[11px] font-black text-slate-500 uppercase mb-1 flex items-center gap-1"><i data-lucide="receipt" class="w-3 h-3"></i> Guía / Factura *</label>
                        <input type="text" id="guiaFactura" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white" placeholder="Ej: FAC-001-2025">
                    </div>
                    <div>
                        <label class="block text-[11px] font-black text-slate-500 uppercase mb-1 flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> Fecha Recepción *</label>
                        <input type="date" id="fechaRecepcion" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[11px] font-black text-slate-500 uppercase mb-1 flex items-center gap-1"><i data-lucide="message-circle" class="w-3 h-3"></i> Novedades</label>
                        <textarea id="novedades" rows="2" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white" placeholder="Productos dañados, retrasos, observaciones..."></textarea>
                    </div>
                </div>
            </div>

            <div class="p-5 border-t border-slate-200 bg-white">
                <button id="btnProcesar" onclick="procesarRecepcion()" disabled class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-black py-3.5 rounded-xl shadow-lg flex items-center justify-center gap-3 transition-all uppercase tracking-wider text-sm disabled:opacity-60 disabled:cursor-not-allowed disabled:from-slate-400 disabled:to-slate-500">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    Registrar Ingreso en Inventario
                </button>
            </div>
        </div>
    </main>

   
    <script>
        // ========== CONFIGURACIÓN ==========
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmGOmmedUD4qadRn3hRMhGq22kaRVfmEbxtlnUxYJ7_MBcF4m8rlLjyzZ2Q7JeSvwVDQ/exec"; // 👈 REEMPLAZAR

        let ordenesAgrupadas = [];
        let ordenSeleccionada = null;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            document.getElementById("fechaRecepcion").value = new Date().toISOString().split('T')[0];
            cargarOrdenes();
        });

        async function cargarOrdenes() {
            const contenedor = document.getElementById("listaOrdenes");
            contenedor.innerHTML = '<div class="text-center py-12"><i class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></i><p class="text-sm mt-2 text-slate-500">Cargando compras pendientes...</p></div>';
            try {
                const res = await fetch(`${SCRIPT_URL}?action=obtenerComprasPendientesAgrupadas`, { cache: "no-store" });
                const json = await res.json();
                if (!json.success) throw new Error(json.error);
                ordenesAgrupadas = json.data;
                renderizarOrdenes(ordenesAgrupadas);
            } catch (err) {
                contenedor.innerHTML = `<div class="text-center py-12 text-rose-500"><i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>${err.message}</div>`;
                lucide.createIcons();
            }
        }

        function renderizarOrdenes(lista) {
            const container = document.getElementById("listaOrdenes");
            if (!lista.length) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400"><i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-50"></i><p class="text-sm">No hay órdenes pendientes</p></div>';
                lucide.createIcons();
                return;
            }
            container.innerHTML = "";
            lista.forEach(ord => {
                const isSelected = ordenSeleccionada?.idCompra === ord.idCompra;
                const div = document.createElement("div");
                div.className = `card-orden p-4 rounded-xl border cursor-pointer transition-all duration-200 ${isSelected ? 'bg-blue-50 border-blue-500 ring-2 ring-blue-500/50 shadow-md' : 'bg-white border-slate-200 hover:border-blue-300 hover:shadow-md'}`;
                div.onclick = () => seleccionarOrden(ord);
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="badge-id text-[10px] px-2 py-0.5 rounded-full">${ord.idCompra}</span>
                        <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${ord.fecha}</span>
                    </div>
                    <p class="font-black text-sm text-slate-800 mt-1 truncate">${ord.proveedor}</p>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-[10px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded-full">📦 ${ord.productos.length} productos</span>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    </div>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function filtrarOrdenes() {
            const q = document.getElementById("searchOrden").value.toLowerCase().trim();
            const filtradas = ordenesAgrupadas.filter(ord => 
                ord.idCompra.toLowerCase().includes(q) || 
                ord.proveedor.toLowerCase().includes(q)
            );
            renderizarOrdenes(filtradas);
        }

        function seleccionarOrden(orden) {
            ordenSeleccionada = orden;
            renderizarOrdenes(ordenesAgrupadas);
            
            // Actualizar cabecera
            document.getElementById("badgeId").innerHTML = `ID: ${orden.idCompra}`;
            document.getElementById("proveedorNombre").innerText = orden.proveedor;
            document.getElementById("fechaOrden").innerText = `Fecha: ${orden.fecha}`;
            document.getElementById("totalProductos").innerText = `${orden.productos.length} productos`;
            
            // Renderizar productos
            const container = document.getElementById("listaProductos");
            container.innerHTML = "";
            orden.productos.forEach((prod, idx) => {
                const div = document.createElement("div");
                div.className = "producto-card p-3 bg-white rounded-xl border border-slate-200 shadow-sm transition-all";
                div.innerHTML = `
                    <div class="flex flex-wrap justify-between items-center gap-2">
                        <div class="flex-1">
                            <p class="font-black text-slate-800">${prod.nombre}</p>
                            <p class="text-xs text-slate-500">Precio distribuidor: <span class="font-bold text-emerald-600">$${prod.precioDist.toFixed(2)}</span></p>
                        </div>
                        <div class="bg-blue-100 px-3 py-1 rounded-full text-xs font-bold text-blue-700">Pedido: ${prod.cantidadPedida}</div>
                    </div>
                    <div class="mt-3 flex items-center gap-3">
                        <label class="text-xs font-bold text-slate-600 w-20">Recibido:</label>
                        <input type="number" class="cantidad-recibida w-28 border border-slate-300 rounded-lg px-2 py-1.5 text-sm text-center font-bold" data-idx="${idx}" value="${prod.cantidadPedida}" min="0" max="${prod.cantidadPedida}">
                        <span class="text-[11px] text-slate-400">máx ${prod.cantidadPedida}</span>
                    </div>
                `;
                container.appendChild(div);
            });
            
            // Limpiar campos de recepción
            document.getElementById("guiaFactura").value = "";
            document.getElementById("novedades").value = "";
            
            // Habilitar botón
            const btn = document.getElementById("btnProcesar");
            btn.disabled = false;
            btn.classList.remove("opacity-60", "cursor-not-allowed", "from-slate-400", "to-slate-500");
            btn.classList.add("from-blue-600", "to-blue-700", "hover:from-blue-700", "hover:to-blue-800");
            lucide.createIcons();
        }

        async function procesarRecepcion() {
            if (!ordenSeleccionada) return;
            
            const guia = document.getElementById("guiaFactura").value.trim();
            if (!guia) return Swal.fire("Atención", "Ingrese el número de guía o factura", "warning");
            
            const fechaReal = document.getElementById("fechaRecepcion").value;
            const novedades = document.getElementById("novedades").value;
            
            const inputs = document.querySelectorAll(".cantidad-recibida");
            const productosRecibidos = [];
            for (let input of inputs) {
                const idx = parseInt(input.dataset.idx);
                const productoOriginal = ordenSeleccionada.productos[idx];
                const recibido = parseInt(input.value) || 0;
                productosRecibidos.push({
                    nombre: productoOriginal.nombre,
                    pedido: productoOriginal.cantidadPedida,
                    recibido: recibido,
                    precioDist: productoOriginal.precioDist
                });
            }
            
            if (productosRecibidos.every(p => p.recibido === 0)) {
                return Swal.fire("Atención", "Debe ingresar al menos una cantidad recibida positiva", "warning");
            }
            
            Swal.fire({ title: 'Procesando entrada...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            
            try {
                const params = new URLSearchParams();
                params.append("action", "confirmarRecepcionAgrupada");
                params.append("idCompra", ordenSeleccionada.idCompra);
                params.append("guia", guia);
                params.append("fechaReal", fechaReal);
                params.append("novedades", novedades);
                params.append("productos", JSON.stringify(productosRecibidos));
                
                const res = await fetch(`${SCRIPT_URL}?${params.toString()}`, { cache: "no-store" });
                const json = await res.json();
                if (!json.success) throw new Error(json.error);
                
                Swal.fire({
                    title: "¡Éxito!",
                    text: "La recepción se registró y el inventario fue actualizado.",
                    icon: "success",
                    timer: 2000,
                    showConfirmButton: false
                });
                
                // Resetear y recargar
                ordenSeleccionada = null;
                document.getElementById("btnProcesar").disabled = true;
                document.getElementById("btnProcesar").classList.add("opacity-60", "cursor-not-allowed", "from-slate-400", "to-slate-500");
                cargarOrdenes();
            } catch (err) {
                Swal.fire("Error", err.message, "error");
            }
        }
    </script>
</body>
</html>
