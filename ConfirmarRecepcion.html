<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Recepción - Lógica Láctea</title>
    <!-- CONEXIÓN A ARCHIVOS RAÍZ -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <!-- Tailwind CSS (Base para estructura rápida) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para alertas interactivas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado de la página -->
    <header class="bg-blue-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="package-check" class="w-8 h-8"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Confirmar Recepción</h1>
                <p class="text-xs text-blue-100">Módulo de Entrada Física e Inventario</p>
            </div>
        </div>
        <span class="bg-blue-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-500">
            Lógica Láctea API
        </span>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo: Selección de Compra Pendiente -->
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-14rem)] min-h-[400px]">
            <div class="mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-slate-700">
                    <i data-lucide="clock" class="w-5 h-5 text-amber-500"></i>
                    Pedidos Pendientes
                </h2>
                <p class="text-xs text-slate-500">Selecciona una orden de compra</p>
            </div>

            <!-- Buscador -->
            <div class="relative mb-4">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </span>
                <input type="text" id="searchPedido" oninput="filtrarPedidos()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none" placeholder="Buscar ID o Proveedor...">
            </div>

            <div id="listaPedidos" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Loader -->
                <div class="text-center py-8 text-slate-400 text-sm animate-pulse">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    Cargando compras...
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Formulario de Verificación -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div id="formularioRecepcion" class="opacity-50 pointer-events-none transition-opacity duration-300">
                
                <div class="border-b border-slate-100 pb-4 mb-6 flex justify-between items-start">
                    <div>
                        <span id="badgeIdCompra" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-md uppercase">ID: -</span>
                        <h2 id="txtProveedor" class="text-xl font-bold text-slate-800 mt-2 italic">Sin Selección</h2>
                        <p id="txtFechaPedido" class="text-xs text-slate-500 mt-1">Fecha Pedido: --/--/----</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-400 block font-bold uppercase">Producto</span>
                        <span id="txtProducto" class="font-bold text-slate-700 block text-lg">-</span>
                    </div>
                </div>

                <!-- Comparativa Cantidades -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 text-center md:text-left">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Cantidad Pedida</label>
                        <span id="numCantidadPedida" class="text-2xl font-black text-slate-700">0</span>
                    </div>

                    <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 ring-2 ring-blue-500/20">
                        <label for="numCantidadRecibida" class="block text-[10px] font-black text-blue-600 uppercase mb-1">Cantidad Recibida</label>
                        <input type="number" id="numCantidadRecibida" oninput="calcularDiferencia()" min="0" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1 text-2xl font-black text-center text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div id="boxDiferencia" class="p-4 rounded-xl border bg-slate-50 border-slate-100 transition-colors">
                        <label class="block text-[10px] font-black text-slate-500 uppercase mb-1">Diferencia</label>
                        <div class="flex items-center justify-center md:justify-start gap-2">
                            <i id="iconDiferencia" data-lucide="minus" class="w-5 h-5"></i>
                            <span id="numDiferencia" class="text-2xl font-black">0</span>
                        </div>
                    </div>
                </div>

                <!-- Documentación -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-tight">Guía / Factura *</label>
                        <input type="text" id="txtGuiaFactura" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: GR-001-999">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-tight">Fecha Recepción *</label>
                        <input type="date" id="dateRecepcion" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1 uppercase tracking-tight">Novedades</label>
                    <textarea id="txtObservaciones" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Productos dañados, retrasos, etc."></textarea>
                </div>
            </div>

            <div class="border-t border-slate-100 pt-4">
                <button type="button" id="btnProcesar" onclick="procesarRecepcion()" disabled class="w-full bg-slate-400 text-white font-black px-6 py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 cursor-not-allowed transition-all uppercase tracking-widest text-sm">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    Ingresar a Inventario
                </button>
            </div>
        </div>
    </main>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let comprasPendientes = [];
        let compraActiva = null;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            document.getElementById('dateRecepcion').value = new Date().toISOString().split('T')[0];
            cargarDatos();
        });

        // USA CONFIG.WEB_APP_URL desde api-config.js
        async function cargarDatos() {
            try {
                const res = await fetch(`${CONFIG.WEB_APP_URL}?action=getComprasPendientes`);
                const json = await res.json();
                if(json.status === "success") {
                    comprasPendientes = json.data;
                    renderizarLista(comprasPendientes);
                }
            } catch (err) {
                Swal.fire("Error", "No se conectó con api-config.js o el servidor", "error");
            }
        }

        function renderizarLista(lista) {
            const container = document.getElementById("listaPedidos");
            container.innerHTML = lista.length ? "" : "<p class='text-center text-slate-400 py-10'>Sin pendientes</p>";
            
            lista.forEach(c => {
                const div = document.createElement("div");
                div.className = `p-4 rounded-xl border cursor-pointer transition-all ${compraActiva?.idCompra === c.idCompra ? 'bg-blue-50 border-blue-500 ring-1 ring-blue-500' : 'bg-white border-slate-200 hover:border-blue-300'}`;
                div.onclick = () => seleccionar(c);
                div.innerHTML = `
                    <div class="flex justify-between text-[10px] font-bold text-slate-400 mb-1">
                        <span>${c.idCompra}</span>
                        <span>${c.fecha}</span>
                    </div>
                    <p class="font-black text-slate-800 text-sm truncate">${c.proveedor}</p>
                    <p class="text-xs text-blue-600 font-bold">${c.producto} (${c.cantidad} Uds)</p>
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function seleccionar(c) {
            compraActiva = c;
            renderizarLista(comprasPendientes);
            
            document.getElementById("formularioRecepcion").classList.remove("opacity-50", "pointer-events-none");
            document.getElementById("badgeIdCompra").innerText = `ID: ${c.idCompra}`;
            document.getElementById("txtProveedor").innerText = c.proveedor;
            document.getElementById("txtFechaPedido").innerText = `Fecha Pedido: ${c.fecha}`;
            document.getElementById("txtProducto").innerText = c.producto;
            document.getElementById("numCantidadPedida").innerText = c.cantidad;
            document.getElementById("numCantidadRecibida").value = c.cantidad;
            
            const btn = document.getElementById("btnProcesar");
            btn.disabled = false;
            btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-black px-6 py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 cursor-pointer transition-all uppercase tracking-widest text-sm active:scale-95";
            
            calcularDiferencia();
        }

        function calcularDiferencia() {
            const pedida = parseInt(compraActiva.cantidad);
            const recibida = parseInt(document.getElementById("numCantidadRecibida").value) || 0;
            const dif = recibida - pedida;
            
            const el = document.getElementById("numDiferencia");
            const box = document.getElementById("boxDiferencia");
            el.innerText = dif > 0 ? `+${dif}` : dif;

            if(dif === 0) { box.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-300 text-emerald-700"; }
            else if(dif < 0) { box.className = "p-4 rounded-xl border bg-rose-50 border-rose-300 text-rose-700"; }
            else { box.className = "p-4 rounded-xl border bg-amber-50 border-amber-300 text-amber-700"; }
            lucide.createIcons();
        }

        async function procesarRecepcion() {
            const payload = {
                action: "confirmarRecepcion",
                idCompra: compraActiva.idCompra,
                producto: compraActiva.producto,
                cantidadRecibida: document.getElementById("numCantidadRecibida").value,
                guia: document.getElementById("txtGuiaFactura").value,
                fechaReal: document.getElementById("dateRecepcion").value,
                novedades: document.getElementById("txtObservaciones").value
            };

            if(!payload.guia) return Swal.fire("Atención", "Número de guía obligatorio", "warning");

            Swal.fire({title: 'Guardando...', didOpen: () => Swal.showLoading()});
            
            try {
                // LLAMADA AL BACKEND USANDO CONFIG.WEB_APP_URL
                await fetch(CONFIG.WEB_APP_URL, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) });
                Swal.fire("¡Éxito!", "Stock actualizado", "success");
                compraActiva = null;
                cargarDatos();
            } catch (e) {
                Swal.fire("Error", "Fallo de comunicación", "error");
            }
        }

        function filtrarPedidos() {
            const q = document.getElementById("searchPedido").value.toLowerCase();
            renderizarLista(comprasPendientes.filter(c => c.proveedor.toLowerCase().includes(q) || c.idCompra.toLowerCase().includes(q)));
        }
    </script>
</body>
</html>
