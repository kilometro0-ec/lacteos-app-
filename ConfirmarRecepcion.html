<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar Recepción - Lógica Láctea</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para alertas interactivas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons para los iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Encabezado de la página -->
    <header class="bg-blue-600 text-white shadow-md px-6 py-4 flex justify-between items-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="package-check" class="w-8 h-8"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Confirmar Recepción</h1>
                <p class="text-xs text-blue-100">Módulo de Entrada Física e Inventario</p>
            </div>
        </div>
        <span class="bg-blue-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-500">
            Lógica Láctea API
        </span>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo: Selección de Compra Pendiente -->
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-12rem)] min-h-[400px]">
            <div class="mb-4">
                <h2 class="text-lg font-bold flex items-center gap-2 text-slate-700">
                    <i data-lucide="clock" class="w-5 h-5 text-amber-500"></i>
                    Pedidos Pendientes
                </h2>
                <p class="text-xs text-slate-500">Selecciona una orden de compra para verificar</p>
            </div>

            <!-- Buscador interno de pedidos -->
            <div class="relative mb-4">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </span>
                <input type="text" id="searchPedido" oninput="filtrarPedidos()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50" placeholder="Buscar por ID o Proveedor...">
            </div>

            <!-- Lista de pedidos con scroll dinámico -->
            <div id="listaPedidos" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Estado de Carga Inicial -->
                <div class="text-center py-8 text-slate-400 text-sm animate-pulse">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    Cargando compras pendientes...
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Formulario de Verificación y Recepción -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
            <div id="formularioRecepcion" class="opacity-50 pointer-events-none transition-opacity duration-300">
                
                <!-- Cabecera del Formulario -->
                <div class="border-b border-slate-100 pb-4 mb-6 flex justify-between items-start">
                    <div>
                        <span id="badgeIdCompra" class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-1 rounded-md">ID: -</span>
                        <h2 id="txtProveedor" class="text-xl font-bold text-slate-800 mt-2">Seleccione un pedido del panel izquierdo</h2>
                        <p id="txtFechaPedido" class="text-xs text-slate-500 mt-1">Fecha de Pedido: --/--/----</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs text-slate-400 block">Producto Solicitado</span>
                        <span id="txtProducto" class="font-semibold text-slate-700 block text-lg">-</span>
                    </div>
                </div>

                <!-- Bloque de Comparación de Cantidades -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Cantidad Pedida</label>
                        <div class="flex items-center gap-2">
                            <i data-lucide="shopping-bag" class="w-5 h-5 text-slate-400"></i>
                            <span id="numCantidadPedida" class="text-2xl font-bold text-slate-700">0</span>
                        </div>
                    </div>

                    <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 ring-2 ring-blue-500/20">
                        <label for="numCantidadRecibida" class="block text-xs font-medium text-blue-600 uppercase tracking-wider mb-1">Cantidad Recibida</label>
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-square" class="w-5 h-5 text-blue-500"></i>
                            <input type="number" id="numCantidadRecibida" oninput="calcularDiferencia()" min="0" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1 text-xl font-bold text-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500" value="0">
                        </div>
                    </div>

                    <div id="boxDiferencia" class="p-4 rounded-xl border bg-slate-50 border-slate-100">
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wider mb-1">Diferencia (Sobrante/Faltante)</label>
                        <div class="flex items-center gap-2">
                            <i id="iconDiferencia" data-lucide="minus" class="w-5 h-5 text-slate-400"></i>
                            <span id="numDiferencia" class="text-2xl font-bold text-slate-700">0</span>
                        </div>
                    </div>
                </div>

                <!-- Datos de Respaldo y Guía -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                        <label for="txtGuiaFactura" class="block text-sm font-medium text-slate-600 mb-1 flex items-center gap-1.5">
                            <i data-lucide="file-text" class="w-4 h-4 text-slate-400"></i> Guía de Remisión o Factura *
                        </label>
                        <input type="text" id="txtGuiaFactura" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: GR-001-12345">
                    </div>
                    <div>
                        <label for="dateRecepcion" class="block text-sm font-medium text-slate-600 mb-1 flex items-center gap-1.5">
                            <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i> Fecha de Recepción Física *
                        </label>
                        <input type="date" id="dateRecepcion" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- Observaciones de Novedad -->
                <div class="mb-6">
                    <label for="txtObservaciones" class="block text-sm font-medium text-slate-600 mb-1 flex items-center gap-1.5">
                        <i data-lucide="alert-circle" class="w-4 h-4 text-slate-400"></i> Observaciones / Novedades
                    </label>
                    <textarea id="txtObservaciones" rows="3" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Escriba aquí si llegaron productos golpeados, dañados o si el transporte se retrasó..."></textarea>
                </div>
            </div>

            <!-- Botón de Acción -->
            <div class="border-t border-slate-100 pt-4 flex justify-end">
                <button type="button" id="btnProcesar" onclick="procesarRecepcion()" disabled class="w-full md:w-auto bg-slate-400 text-white font-semibold px-6 py-3 rounded-lg shadow-sm flex items-center justify-center gap-2 cursor-not-allowed transition-all duration-200">
                    <i data-lucide="save" class="w-5 h-5"></i>
                    Procesar Ingreso a Inventario
                </button>
            </div>
        </div>
    </main>

    <!-- Script de Lógica e Integración con Google Apps Script API -->
    <script>
        // URL de tu Web App de Google Apps Script (Coloca tu URL de despliegue aquí)
        const WEB_APP_URL = "https://script.google.com/macros/s/TU_ID_DESPLIEGUE/exec";

        let comprasPendientesGlobal = [];
        let compraSeleccionada = null;

        // Inicializar la página al cargar
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            establecerFechaActual();
            cargarComprasPendientes();
        });

        // Pone por defecto la fecha de hoy en el input date de manera local
        function establecerFechaActual() {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('dateRecepcion').value = hoy;
        }

        // Llamada a la API para traer compras pendientes
        function cargarComprasPendientes() {
            fetch(`${WEB_APP_URL}?action=getComprasPendientes`)
                .then(response => response.json())
                .then(data => {
                    if(data.status === "success") {
                        comprasPendientesGlobal = data.data;
                        renderizarListaPedidos(comprasPendientesGlobal);
                    } else {
                        mostrarError("No se pudieron extraer los datos de la hoja Compras.");
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    mostrarError("Error de conexión con la API.");
                });
        }

        // Dibuja la lista de tarjetas en el panel izquierdo
        function renderizarListaPedidos(lista) {
            const contenedor = document.getElementById("listaPedidos");
            contenedor.innerHTML = "";

            if (lista.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-12 text-slate-400 text-sm">
                        <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mx-auto mb-2"></i>
                        No hay recepciones pendientes.
                    </div>`;
                lucide.createIcons();
                return;
            }

            lista.forEach(compra => {
                const card = document.createElement("div");
                card.className = `p-4 rounded-xl border transition-all duration-150 cursor-pointer hover:border-blue-400 hover:shadow-sm ${compraSeleccionada?.idCompra === compra.idCompra ? 'border-blue-500 bg-blue-50/50 ring-1 ring-blue-500' : 'border-slate-200 bg-white'}`;
                card.onclick = () => seleccionarCompra(compra);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-xs font-bold text-slate-400">${compra.idCompra}</span>
                        <span class="text-xs text-slate-500">${compra.fecha}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 text-sm truncate">${compra.proveedor}</h3>
                    <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-100 text-xs">
                        <span class="text-slate-600 font-medium truncate max-w-[150px]">${compra.producto}</span>
                        <span class="bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-bold">Cant: ${compra.cantidad}</span>
                    </div>
                `;
                contenedor.appendChild(card);
            });
            lucide.createIcons();
        }

        // Filtro de búsqueda en tiempo real
        function filtrarPedidos() {
            const query = document.getElementById("searchPedido").value.toLowerCase();
            const filtrados = comprasPendientesGlobal.filter(c => 
                c.idCompra.toLowerCase().includes(query) || 
                c.proveedor.toLowerCase().includes(query) ||
                c.producto.toLowerCase().includes(query)
            );
            renderizarListaPedidos(filtrados);
        }

        // Carga la información de la tarjeta seleccionada en el formulario derecho
        function seleccionarCompra(compra) {
            compraSeleccionada = compra;
            
            // Re-renderizar lista izquierda para marcar el seleccionado
            renderizarListaPedidos(comprasPendientesGlobal);

            // Desbloquear formulario
            const form = document.getElementById("formularioRecepcion");
            form.classList.remove("opacity-50", "pointer-events-none");

            // Rellenar campos estáticos
            document.getElementById("badgeIdCompra").innerText = `ID: ${compra.idCompra}`;
            document.getElementById("txtProveedor").innerText = compra.proveedor;
            document.getElementById("txtFechaPedido").innerText = `Fecha de Pedido: ${compra.fecha}`;
            document.getElementById("txtProducto").innerText = compra.producto;
            document.getElementById("numCantidadPedida").innerText = compra.cantidad;
            
            // Colocar por defecto la misma cantidad pedida en el input de recibido
            document.getElementById("numCantidadRecibida").value = compra.cantidad;
            
            // Limpiar campos variables
            document.getElementById("txtGuiaFactura").value = "";
            document.getElementById("txtObservaciones").value = "";

            // Habilitar botón de acción
            const btn = document.getElementById("btnProcesar");
            btn.disabled = false;
            btn.className = "w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg shadow-md flex items-center justify-center gap-2 cursor-pointer transition-all duration-200";

            calcularDiferencia();
        }

        // Calcula dinámicamente faltantes o sobrantes
        function calcularDiferencia() {
            if (!compraSeleccionada) return;

            const pedida = parseInt(compraSeleccionada.cantidad) || 0;
            const recibida = parseInt(document.getElementById("numCantidadRecibida").value) || 0;
            const diferencia = recibida - pedida;

            const labelDiferencia = document.getElementById("numDiferencia");
            const boxDiferencia = document.getElementById("boxDiferencia");
            const iconDiferencia = document.getElementById("iconDiferencia");

            labelDiferencia.innerText = diferencia > 0 ? `+${diferencia}` : diferencia;

            // Cambiar estilos del contenedor según el cálculo matemático
            if (diferencia === 0) {
                boxDiferencia.className = "p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800";
                iconDiferencia.setAttribute("data-lucide", "check");
                labelDiferencia.className = "text-2xl font-bold text-emerald-700";
            } else if (diferencia < 0) {
                boxDiferencia.className = "p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800";
                iconDiferencia.setAttribute("data-lucide", "trending-down");
                labelDiferencia.className = "text-2xl font-bold text-rose-700";
            } else {
                boxDiferencia.className = "p-4 rounded-xl border bg-amber-50 border-amber-200 text-amber-800";
                iconDiferencia.setAttribute("data-lucide", "trending-up");
                labelDiferencia.className = "text-2xl font-bold text-amber-700";
            }
            lucide.createIcons();
        }

        // Envía la transacción completa a Google Sheets
        function procesarRecepcion() {
            const guia = document.getElementById("txtGuiaFactura").value.trim();
            const fechaRec = document.getElementById("dateRecepcion").value;
            const cantRecibida = document.getElementById("numCantidadRecibida").value;
            const obs = document.getElementById("txtObservaciones").value.trim();

            // Validaciones requeridas obligatorias
            if (!guia) {
                Swal.fire("Falta Información", "Por favor ingresa el número de Guía o Factura de respaldo.", "warning");
                return;
            }
            if (!fechaRec) {
                Swal.fire("Falta Información", "Por favor selecciona la fecha real de recepción física.", "warning");
                return;
            }
            if (!cantRecibida || parseInt(cantRecibida) < 0) {
                Swal.fire("Cantidad Inválida", "La cantidad recibida no puede ser un valor negativo.", "warning");
                return;
            }

            // Confirmación visual con SweetAlert2
            Swal.fire({
                title: '¿Confirmar Ingreso?',
                text: `Se actualizará el stock de '${compraSeleccionada.producto}' con un total de ${cantRecibida} unidades ingresadas.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563eb',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, ingresar a inventario',
                cancelButtonText: 'Cancelar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Mostrar pantalla de carga integrada
                    Swal.fire({
                        title: 'Procesando...',
                        text: 'Actualizando registro de compra y sumando stock...',
                        allowOutsideClick: false,
                        didOpen: () => { Swal.showLoading(); }
                    });

                    // Estructuración de la carga útil (Payload) de la API transaccional
                    const payload = {
                        action: "confirmarRecepcion",
                        idCompra: compraSeleccionada.idCompra,
                        producto: compraSeleccionada.producto,
                        cantidadRecibida: parseInt(cantRecibida),
                        fechaRecepcion: fechaRec,
                        observaciones: `Guía: ${guia}. ${obs}`
                    };

                    // Enlace POST a Google Apps Script
                    fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors", // Nota: cambiar según configuración de CORS del script
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    })
                    .then(() => {
                        // Al usar 'no-cors' la respuesta es opaca, asumimos éxito si no hay catch
                        Swal.fire({
                            title: '¡Recibido con Éxito!',
                            text: 'La mercadería ha sido registrada y el inventario fue actualizado de forma automatizada.',
                            icon: 'success',
                            confirmButtonColor: '#2563eb'
                        });
                        
                        // Resetear la interfaz
                        resetearFormulario();
                        cargarComprasPendientes();
                    })
                    .catch(error => {
                        console.error("Error al procesar:", error);
                        Swal.fire("Error Operativo", "No se pudo completar la transacción en el servidor.", "error");
                    });
                }
            });
        }

        // Limpia el panel derecho tras un proceso exitoso
        function resetearFormulario() {
            compraSeleccionada = null;
            document.getElementById("formularioRecepcion").classList.add("opacity-50", "pointer-events-none");
            document.getElementById("badgeIdCompra").innerText = `ID: -`;
            document.getElementById("txtProveedor").innerText = "Seleccione un pedido del panel izquierdo";
            document.getElementById("txtFechaPedido").innerText = "Fecha de Pedido: --/--/----";
            document.getElementById("txtProducto").innerText = "-";
            document.getElementById("numCantidadPedida").innerText = "0";
            document.getElementById("numCantidadRecibida").value = "0";
            document.getElementById("txtGuiaFactura").value = "";
            document.getElementById("txtObservaciones").value = "";
            
            const boxDiferencia = document.getElementById("boxDiferencia");
            boxDiferencia.className = "p-4 rounded-xl border bg-slate-50 border-slate-100";
            document.getElementById("numDiferencia").innerText = "0";

            const btn = document.getElementById("btnProcesar");
            btn.disabled = true;
            btn.className = "w-full md:w-auto bg-slate-400 text-white font-semibold px-6 py-3 rounded-lg shadow-sm flex items-center justify-center gap-2 cursor-not-allowed transition-all duration-200";
            establecerFechaActual();
            lucide.createIcons();
        }

        function mostrarError(mensaje) {
            Swal.fire({
                title: "Error de Sistema",
                text: mensaje,
                icon: "error",
                confirmButtonColor: "#ef4444"
            });
        }
    </script>
</body>
</html>
