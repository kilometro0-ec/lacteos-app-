<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Inventario Pro | Lógica Láctea</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<script src="api-config.js"></script>

<link rel="stylesheet" href="estilos-lacteos.css">

<style>
body{background:#f8fafc;font-family:sans-serif;padding-bottom:110px}
.input-sutil{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:8px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;text-transform:uppercase}
</style>

</head>

<body>

<header class="p-4 bg-white border-b">
<h1 class="font-black text-xl">INVENTARIO PRO</h1>
</header>

<main class="p-4">

<!-- STATS -->
<div class="grid grid-cols-3 gap-2 mb-4 text-center">
<div class="bg-white p-3 rounded-xl border">
Bodega<br><b id="bodega">$0</b>
</div>
<div class="bg-white p-3 rounded-xl border">
Críticos<br><b id="criticos">0</b>
</div>
<div class="bg-white p-3 rounded-xl border">
Stock<br><b id="total">0</b>
</div>
</div>

<!-- BUSCADOR -->
<input id="filtro" class="input-sutil" placeholder="Buscar producto...">

<!-- GRID -->
<div id="grid" class="grid grid-cols-2 gap-3 mt-3"></div>

</main>

<!-- BOTÓN AGREGAR -->
<button onclick="abrirModal()"
class="fixed bottom-6 right-6 bg-indigo-600 text-white w-14 h-14 rounded-full text-2xl">
+
</button>

<!-- MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);padding:20px">

<div style="background:white;padding:20px;border-radius:20px;max-width:400px;margin:auto">

<h2 class="font-black mb-3">Nuevo Producto</h2>

<input id="n-nombre" class="input-sutil" placeholder="Nombre">
<input id="n-dist" class="input-sutil" placeholder="Costo Distribuidor">
<input id="n-pvp" class="input-sutil" placeholder="Precio Venta">
<input id="n-stock" class="input-sutil" placeholder="Stock">

<!-- 🔥 PROVEEDOR -->
<select id="n-proveedor" class="input-sutil">
<option value="">SELECCIONAR PROVEEDOR</option>
</select>

<button onclick="guardar()" class="btn bg-green-600 text-white mt-2">
GUARDAR
</button>

<button onclick="cerrarModal()" class="btn bg-gray-200 mt-2">
CANCELAR
</button>

</div>

</div>

<script>

let inventario = [];

// ======================= CARGAR =======================

async function cargar(){

const data = await DairyAPI.obtenerDatos("Inventario");

inventario = data || [];

render(inventario);

}

// ======================= RENDER =======================

function render(lista){

let bodega=0,crit=0,total=0;

const grid=document.getElementById("grid");

grid.innerHTML="";

lista.forEach(p=>{

const stock=Number(p.Stock)||0;
const precio=Number(p.Precio_Venta)||0;

bodega+=stock*precio;
total+=stock;
if(stock<=5) crit++;

grid.innerHTML+=`
<div class="bg-white p-3 rounded-xl border">
<div class="text-[10px]">${p.ID}</div>
<div class="font-black text-sm">${p.Producto}</div>
<div class="text-xs">Stock: ${stock}</div>
<div class="text-green-600 font-bold">$${precio}</div>
<div class="text-[10px] text-gray-400">${p["Proveedor Habitual"]||""}</div>
</div>
`;

});

document.getElementById("bodega").innerText="$"+bodega.toFixed(0);
document.getElementById("criticos").innerText=crit;
document.getElementById("total").innerText=total;

}

// ======================= PROVEEDORES =======================

async function cargarProveedores(){

const data = await DairyAPI.obtenerDatos("Proveedores");

const sel=document.getElementById("n-proveedor");

sel.innerHTML='<option value="">SELECCIONAR PROVEEDOR</option>';

data.forEach(p=>{

const op=document.createElement("option");
op.value=p["Nombre del Proveedor"];
op.textContent=p["Nombre del Proveedor"];
sel.appendChild(op);

});

}

// ======================= GUARDAR =======================

async function guardar(){

const nombre=document.getElementById("n-nombre").value;
const dist=document.getElementById("n-dist").value;
const pvp=document.getElementById("n-pvp").value;
const stock=document.getElementById("n-stock").value;
const prov=document.getElementById("n-proveedor").value||"SIN PROVEEDOR";

await DairyAPI.enviarDatos({

action:"guardar",
pestaña:"Inventario",

Fecha:new Date().toLocaleString("es-EC"),

Producto:nombre,
Stock:Number(stock),
Precio_Distribuidor:Number(dist),
Precio_Venta:Number(pvp),
"Proveedor Habitual":prov

});

cerrarModal();
await cargar();

}

// ======================= MODAL =======================

function abrirModal(){
document.getElementById("modal").style.display="block";
}

function cerrarModal(){
document.getElementById("modal").style.display="none";
}

// ======================= INIT =======================

window.onload=()=>{

cargar();
cargarProveedores();

}

</script>

</body>
</html>
