<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Lógica Láctea</title>
    <!-- CONEXIÓN A ARCHIVOS RAÍZ -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <!-- Tailwind CSS para diseño y maquetación -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para notificaciones de stock y confirmaciones -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado del Módulo -->
    <header class="bg-slate-900 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="boxes" class="w-8 h-8 text-blue-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Kárdex y Control de Inventario</h1>
                <p class="text-xs text-slate-400">Existencias en Tiempo Real y Alertas de Reabastecimiento</p>
            </div>
        </div>
        <button onclick="abrirModalAjuste()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all border border-blue-400 shadow-sm active:scale-95">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Ajustar Stock Manual
        </button>
    </header>

    <!-- Barra de Filtros y Resumen Rápido -->
    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Buscador -->
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </span>
                <input type="text" id="buscarProducto" oninput="filtrarInventario()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none" placeholder="Buscar por código o producto...">
            </div>
            
            <!-- Indicadores de Estado Rápidos -->
            <div class="flex gap-4 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                <div class="bg-rose-50 border border-rose-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span class="text-[11px] font-bold text-rose-700 uppercase" id="lblCriticos">0 Críticos</span>
                </div>
                <div class="bg-amber-50 border border-amber-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-[11px] font-bold text-amber-700 uppercase" id="lblPorAgotar">0 Por Agotar</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-[11px] font-bold text-emerald-700 uppercase" id="lblOptimos">0 Óptimos</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Tabla de Existencias -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6">Código</th>
                            <th class="py-3 px-4">Descripción del Producto</th>
                            <th class="py-3 px-4 text-right">Precio Compra</th>
                            <th class="py-3 px-4 text-right">Precio Venta</th>
                            <th class="py-3 px-4 text-center">Stock Actual</th>
                            <th class="py-3 px-6 text-center">Estado Logístico</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyInventario" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <!-- Loader Dinámico -->
                        <tr>
                            <td colspan="6" class="text-center py-20 text-slate-400">
                                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-blue-600"></i>
                                <p class="text-xs">Sincronizando estados con la base central de Almacén...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Formulario: Ajuste Manual de Inventario -->
    <div id="modalAjuste" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="sliders-horizontal" class="w-4 h-4 text-blue-400"></i> Ajuste Físico de Stock</h3>
                <button type="button" onclick="cerrarModalAjuste()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="formAjuste" onsubmit="guardarAjusteManual(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Seleccionar Producto *</label>
                    <select id="adj_producto" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                        <!-- Se llena dinámicamente -->
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Tipo de Ajuste *</label>
                        <select id="adj_tipo" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-slate-50">
                            <option value="INGRESO">Suma (+) Ingreso</option>
                            <option value="EGRESO">Resta (-) Merma/Baja</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Cantidad Unidades *</label>
                        <input type="number" id="adj_cantidad" min="1" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 font-bold outline-none" placeholder="Ej: 5">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Motivo / Justificación *</label>
                    <textarea id="adj_motivo" required rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ej: Auditoría física de inventario / Producto roto"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" onclick="cerrarModalAjuste()" class="w-full py-2 border rounded-lg font-bold text-slate-600 hover:bg-slate-50 text-xs uppercase tracking-wider">Cancelar</button>
                    <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 shadow-md text-xs uppercase tracking-wider">Aplicar Cambio</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let inventarioGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarInventario();
        });

        // Consumo unificado usando tu api-config unificada
        async function cargarInventario() {
            try {
                // Lee de la hoja central de "Inventario"
                const datos = await DairyAPI.obtenerDatos("Inventario");
                
                if (Array.isArray(datos)) {
                    inventarioGlobal = datos;
                    renderizarInventario(inventarioGlobal);
                    calcularResumenContadores(inventarioGlobal);
                    llenarSelectProductos(inventarioGlobal);
                } else if (datos && datos.status === "error") {
                    throw new Error(datos.message);
                }
            } catch (err) {
                console.error("Error al conectar con la API de Lógica Láctea:", err);
                document.getElementById("tbodyInventario").innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-10 text-rose-500 font-bold">
                            <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                            Fallo de sincronización con api-config.js o Google Sheets.
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        // Renderizado de tabla con lógicas de semáforo de criticidad
        function renderizarInventario(lista) {
            const tbody = document.getElementById("tbodyInventario");
            tbody.innerHTML = lista.length ? "" : "<tr><td colspan='6' class='text-center py-10 text-slate-400'>No se encontraron productos coincidentes.</td></tr>";

            lista.forEach(p => {
                const stock = parseInt(p.stock) || 0;
                const min = parseInt(p.stockMinimo) || 10; 
                
                let badgeClass = "";
                let badgeText = "";
                let rowAlertClass = "";

                if (stock <= 0) {
                    badgeClass = "bg-rose-100 text-rose-800 border border-rose-200";
                    badgeText = "Agotado (Crítico)";
                    rowAlertClass = "bg-rose-50/40 hover:bg-rose-50";
                } else if (stock <= min) {
                    badgeClass = "bg-amber-100 text-amber-800 border border-amber-200";
                    badgeText = "Stock Bajo";
                    rowAlertClass = "bg-amber-50/30 hover:bg-amber-50/60";
                } else {
                    badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-200";
                    badgeText = "Óptimo";
                    rowAlertClass = "hover:bg-slate-50";
                }

                const tr = document.createElement("tr");
                tr.className = `transition-colors ${rowAlertClass}`;
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-mono text-[11px] text-slate-400 font-bold">#${p.id || p.codigo || 'S/N'}</td>
                    <td class="py-3.5 px-4 font-bold text-slate-800">${p.producto}</td>
                    <td class="py-3.5 px-4 text-right text-slate-500 font-mono">$${parseFloat(p.precioCompra || 0).toFixed(2)}</td>
                    <td class="py-3.5 px-4 text-right text-blue-700 font-bold font-mono">$${parseFloat(p.precioVenta || 0).toFixed(2)}</td>
                    <td class="py-3.5 px-4 text-center font-black text-slate-800 text-base">${stock}</td>
                    <td class="py-3.5 px-6 text-center">
                        <span class="px-2.5 py-1 rounded-md font-black text-[10px] uppercase tracking-wider ${badgeClass}">
                            ${badgeText}
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Calcula contadores superiores de la barra de filtros
        function calcularResumenContadores(lista) {
            let criticos = 0;
            let porAgotar = 0;
            let optimos = 0;

            lista.forEach(p => {
                const stock = parseInt(p.stock) || 0;
                const min = parseInt(p.stockMinimo) || 10;

                if (stock <= 0) criticos++;
                else if (stock <= min) porAgotar++;
                else optimos++;
            });

            document.getElementById("lblCriticos").innerText = `${criticos} Críticos`;
            document.getElementById("lblPorAgotar").innerText = `${porAgotar} Por Agotar`;
            document.getElementById("lblOptimos").innerText = `${optimos} Óptimos`;
        }

        function filtrarInventario() {
            const query = document.getElementById("buscarProducto").value.toLowerCase();
            const filtrados = inventarioGlobal.filter(p => 
                (p.producto && p.producto.toLowerCase().includes(query)) || 
                (p.id && p.id.toLowerCase().includes(query))
            );
            renderizarInventario(filtrados);
        }

        function llenarSelectProductos(lista) {
            const select = document.getElementById("adj_producto");
            select.innerHTML = '<option value="">-- Elige un Producto --</option>';
            lista.forEach(p => {
                select.innerHTML += `<option value="${p.id}">${p.producto} (Actual: ${p.stock} Uds)</option>`;
            });
        }

        function abrirModalAjuste() {
            document.getElementById("formAjuste").reset();
            document.getElementById("modalAjuste").classList.remove("hidden");
            lucide.createIcons();
        }

        function cerrarModalAjuste() {
            document.getElementById("modalAjuste").classList.add("hidden");
        }

        // Escritura asíncrona hacia el backend de Google Sheets usando DairyAPI
        async function guardarAjusteManual(e) {
            e.preventDefault();

            const payload = {
                action: "ajusteInventarioManual",
                idProducto: document.getElementById("adj_producto").value,
                tipoMovimiento: document.getElementById("adj_tipo").value,
                cantidad: document.getElementById("adj_cantidad").value,
                motivo: document.getElementById("adj_motivo").value,
                fecha: new Date().toISOString().split('T')[0]
            };

            Swal.fire({
                title: 'Impactando Kárdex...',
                text: 'Procesando movimiento en la base central...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                // Guarda la transacción directamente en la pestaña de Kárdex/Ajustes
                await DairyAPI.guardarDatos("KardexMovimientos", payload);

                Swal.fire({
                    title: 'Ajuste Aplicado',
                    text: 'El stock se ha recalculado y actualizado con éxito.',
                    icon: 'success',
                    confirmButtonColor: '#2563eb'
                });
                
                cerrarModalAjuste();
                cargarInventario(); // Recarga local e inmediata de la cuadrícula
            } catch (err) {
                console.error(err);
                Swal.fire("Error", "No se pudo sincronizar el ajuste manual con la base de datos.", "error");
            }
        }
    </script>
</body>
</html>
