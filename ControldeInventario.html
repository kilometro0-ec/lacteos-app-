<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Inventario Pro | Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
      body { background: #f8fafc; padding-bottom: 100px; font-family: system-ui; }
      .card-prod { background: white; border-radius: 1rem; padding: 12px; border: 1px solid #e2e8f0; margin-bottom: 8px; }
      .prod-title { font-size: 13px; font-weight: 800; text-transform: uppercase; }
      .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
      .modal.active { display: flex; }
      .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; }
      .btn-primary { background: #6366f1; color: white; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; }
      .loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; }
      .loading.active { display: flex; }
      .stats-card { background: white; border-radius: 1rem; padding: 12px; text-align: center; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="loading" id="loading">
    <div class="bg-white p-6 rounded-2xl text-center">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
        <p>Cargando...</p>
    </div>
</div>

<header class="fixed top-0 w-full bg-white/90 backdrop-blur p-4 flex justify-between items-center border-b z-50">
    <h1 class="text-xl font-black">🥛 LÓGICA LÁCTEA</h1>
    <div class="flex gap-3">
        <button onclick="descargarPDF()" class="text-indigo-600">📄</button>
        <button onclick="location.reload()" class="text-gray-400">🔄</button>
    </div>
</header>

<main class="pt-20 px-4">
    <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="stats-card"><span class="text-xs text-gray-500">💰 BODEGA</span><br><span id="totalBodega" class="font-bold text-lg">$0</span></div>
        <div class="stats-card"><span class="text-xs text-gray-500">⚠️ CRÍTICOS</span><br><span id="totalCriticos" class="font-bold text-lg">0</span></div>
        <div class="stats-card"><span class="text-xs text-gray-500">📦 STOCK</span><br><span id="totalStock" class="font-bold text-lg">0</span></div>
    </div>

    <input type="text" id="search" placeholder="🔍 Buscar producto..." class="input-field mb-4" oninput="filtrar()">

    <div id="lista-productos" class="space-y-2"></div>
</main>

<button onclick="abrirModal()" class="fixed bottom-6 right-6 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg text-2xl flex items-center justify-center">+</button>

<!-- MODAL CREAR PRODUCTO - SIN CAMPO STOCK -->
<div id="modalProducto" class="modal">
    <div class="bg-white w-full max-w-sm mx-4 p-6 rounded-2xl">
        <h2 class="text-xl font-black mb-4">Nuevo Producto</h2>
        <input type="text" id="prodNombre" placeholder="Nombre del producto *" class="input-field">
        <input type="number" id="prodCosto" placeholder="Costo distribuidor $" class="input-field" step="0.01">
        <input type="number" id="prodPvp" placeholder="Precio venta PVP $ *" class="input-field" step="0.01">
        <select id="prodProveedor" class="input-field">
            <option value="GENERAL">GENERAL</option>
        </select>
        <button onclick="crearProducto()" class="btn-primary">Guardar Producto</button>
        <button onclick="cerrarModal()" class="w-full mt-2 text-gray-500">Cancelar</button>
    </div>
</div>

<script>
// ==================== API CONFIG ====================
const API_URL = "https://script.google.com/macros/s/AKfycbziATkvhWLT263Pa43Eppw8cRuRXW7IyNsGo0r7Ox0ePlb7sX7j0EoRJvyxzImCsLSgRg/exec";

let productos = [];

function showLoading(show) {
    const loading = document.getElementById('loading');
    show ? loading.classList.add('active') : loading.classList.remove('active');
}

// ==================== CARGAR PRODUCTOS ====================
async function cargarProductos() {
    showLoading(true);
    try {
        const res = await fetch(`${API_URL}?action=obtener&pestaña=Inventario`);
        const data = await res.json();
        
        if (Array.isArray(data)) {
            productos = data.map(p => ({
                id: p.ID,
                nombre: p.Producto,
                stock: Number(p.Stock) || 0,
                pvp: Number(p.Precio_Venta) || 0,
                costo: Number(p.Precio_Distribuidor) || 0,
                proveedor: p["Proveedor Habitual"] || "GENERAL"
            }));
            renderizar();
        }
    } catch(e) {
        console.error(e);
        alert("Error: " + e.message);
    }
    showLoading(false);
}

async function cargarProveedores() {
    try {
        const res = await fetch(`${API_URL}?action=obtener&pestaña=Proveedores`);
        const data = await res.json();
        if (Array.isArray(data)) {
            const proveedores = data.map(p => p['Nombre del Proveedor'] || p['Proveedor']).filter(v => v);
            if (!proveedores.includes('GENERAL')) proveedores.unshift('GENERAL');
            const select = document.getElementById('prodProveedor');
            select.innerHTML = proveedores.map(p => `<option value="${p}">${p}</option>`).join('');
        }
    } catch(e) { console.error(e); }
}

// ==================== RENDERIZAR ====================
function renderizar() {
    const busqueda = document.getElementById('search').value.toLowerCase();
    const filtrados = productos.filter(p => p.nombre.toLowerCase().includes(busqueda));
    
    let bodega = 0, criticos = 0, stockTotal = 0;
    const container = document.getElementById('lista-productos');
    container.innerHTML = '';
    
    filtrados.forEach(p => {
        bodega += p.pvp * p.stock;
        if (p.stock <= 5) criticos++;
        stockTotal += p.stock;
        
        const card = document.createElement('div');
        card.className = 'card-prod';
        card.innerHTML = `
            <div class="flex justify-between items-start">
                <span class="text-xs text-gray-400">${p.id}</span>
            </div>
            <div class="prod-title mt-1">${escapeHtml(p.nombre)}</div>
            <div class="flex justify-between items-end mt-2">
                <div>
                    <span class="text-2xl font-bold ${p.stock <= 5 ? 'text-red-500' : 'text-indigo-600'}">${p.stock}</span>
                    <span class="text-xs">u</span>
                </div>
                <div class="text-green-600 font-bold">$${p.pvp.toFixed(2)}</div>
            </div>
            <div class="text-xs text-gray-400 mt-1">${escapeHtml(p.proveedor)}</div>
        `;
        // SIN onclick - no editar stock
        container.appendChild(card);
    });
    
    document.getElementById('totalBodega').innerText = `$${bodega.toFixed(0)}`;
    document.getElementById('totalCriticos').innerText = criticos;
    document.getElementById('totalStock').innerText = stockTotal;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]);
}

function filtrar() { renderizar(); }

// ==================== CREAR PRODUCTO (SIN STOCK) ====================
async function crearProducto() {
    const nombre = document.getElementById('prodNombre').value.trim().toUpperCase();
    const costo = parseFloat(document.getElementById('prodCosto').value) || 0;
    const pvp = parseFloat(document.getElementById('prodPvp').value) || 0;
    const proveedor = document.getElementById('prodProveedor').value;
    
    if (!nombre) { alert("⚠️ Nombre requerido"); return; }
    if (pvp <= 0) { alert("⚠️ Precio de venta mayor a 0"); return; }
    
    showLoading(true);
    
    try {
        const params = new URLSearchParams({
            action: "guardar",
            pestaña: "Inventario",
            Fecha: new Date().toISOString(),
            Producto: nombre,
            Stock: 0,
            Precio_Distribuidor: costo,
            Precio_Venta: pvp,
            Ventas: 0,
            Proveedor_Habitual: proveedor
        });
        
        const res = await fetch(`${API_URL}?${params.toString()}`);
        const result = await res.json();
        
        if (result.success) {
            alert(`✅ Producto "${nombre}" creado`);
            cerrarModal();
            // Limpiar formulario
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodCosto').value = '';
            document.getElementById('prodPvp').value = '';
            await cargarProductos();
        } else {
            throw new Error(result.error || "Error");
        }
    } catch(e) {
        alert("❌ Error: " + e.message);
    }
    showLoading(false);
}

// ==================== PDF ====================
function descargarPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.text("INVENTARIO LÓGICA LÁCTEA", 14, 20);
    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 14, 28);
    const body = productos.map(p => [p.id, p.nombre, p.stock, `$${p.pvp.toFixed(2)}`, p.proveedor]);
    doc.autoTable({ startY: 35, head: [['ID', 'Producto', 'Stock', 'PVP', 'Proveedor']], body, theme: 'grid', headStyles: { fillColor: [99, 102, 241] } });
    doc.save('Inventario.pdf');
}

function abrirModal() { document.getElementById('modalProducto').classList.add('active'); }
function cerrarModal() { document.getElementById('modalProducto').classList.remove('active'); }

// ==================== INICIO ====================
window.onload = async () => {
    await cargarProveedores();
    await cargarProductos();
};
</script>

</body>
</html>
