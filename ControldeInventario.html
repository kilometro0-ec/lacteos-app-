<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Inventario - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <div id="menu-container"></div>

    <header class="bg-slate-900 text-white shadow-md px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="flex items-center gap-3">
            <i data-lucide="boxes" class="w-8 h-8 text-blue-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Kárdex y Control de Inventario</h1>
                <p class="text-xs text-slate-400">Existencias + Ventas acumuladas</p>
            </div>
        </div>
        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
            <button onclick="abrirModalProducto()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm active:scale-95">
                <i data-lucide="plus-circle" class="w-4 h-4"></i> Agregar Producto
            </button>
            <button onclick="solicitarFormatoExportacion()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-sm active:scale-95">
                <i data-lucide="download" class="w-4 h-4"></i> Exportar Catálogo
            </button>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-4 justify-between items-center">
            <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto flex-1">
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                    </span>
                    <input type="text" id="buscarProducto" oninput="procesarFiltros()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 bg-slate-50 outline-none" placeholder="Buscar por ID o descripción...">
                </div>
                <select id="filtroEstadoLogistico" onchange="procesarFiltros()" class="border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none text-slate-600 font-medium">
                    <option value="TODOS">🔍 Todos los Estados</option>
                    <option value="CRITICO">🚨 Críticos / Agotados</option>
                    <option value="BAJO">⚠️ Stock Bajo</option>
                    <option value="OPTIMO">✅ Óptimos</option>
                </select>
            </div>
            <div class="flex gap-3 w-full lg:w-auto overflow-x-auto pb-1 lg:pb-0">
                <div onclick="filtrarPorBadge('TODOS')" class="cursor-pointer hover:opacity-80 bg-blue-50 border border-blue-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <span class="text-[11px] font-bold text-blue-700 uppercase" id="lblTotalProductos">0 Totales</span>
                </div>
                <div onclick="filtrarPorBadge('CRITICO')" class="cursor-pointer hover:opacity-80 bg-rose-50 border border-rose-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                    <span class="text-[11px] font-bold text-rose-700 uppercase" id="lblCriticos">0 Críticos</span>
                </div>
                <div onclick="filtrarPorBadge('BAJO')" class="cursor-pointer hover:opacity-80 bg-amber-50 border border-amber-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-[11px] font-bold text-amber-700 uppercase" id="lblPorAgotar">0 Por Agotar</span>
                </div>
                <div onclick="filtrarPorBadge('OPTIMO')" class="cursor-pointer hover:opacity-80 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-1.5 flex items-center gap-2 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="text-[11px] font-bold text-emerald-700 uppercase" id="lblOptimos">0 Óptimos</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm" id="tablaInventarioFormatos">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6">ID (SKU)</th>
                            <th class="py-3 px-4">Producto</th>
                            <th class="py-3 px-4 text-right">Precio Dist.</th>
                            <th class="py-3 px-4 text-right">Precio Venta</th>
                            <th class="py-3 px-4 text-center">Stock</th>
                            <th class="py-3 px-4 text-center">Ventas</th>
                            <th class="py-3 px-4">Proveedor</th>
                            <th class="py-3 px-6 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyInventario" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <tr><td colspan="8" class="text-center py-20 text-slate-400"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4"></i>Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL PRODUCTO -->
    <div id="modalProducto" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2" id="modalProductoTitulo"> <i data-lucide="package-plus" class="w-4 h-4 text-emerald-400"></i> Producto</h3>
                <button type="button" onclick="cerrarModalProducto()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="formProducto" onsubmit="guardarProducto(event)" class="p-6 space-y-4">
                <input type="hidden" id="prod_id_interno">
                <input type="hidden" id="prod_stock_actual" value="0">
                <input type="hidden" id="prod_ventas_actual" value="0">
                <div><label class="block text-xs font-bold text-slate-500 mb-1">ID SKU (auto)</label><input type="text" id="prod_codigo" readonly class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100 font-mono"></div>
                <div><label class="block text-xs font-bold text-slate-500 mb-1">Nombre *</label><input type="text" id="prod_nombre" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Precio Dist. ($)</label><input type="number" step="0.01" id="prod_costo" required class="w-full border rounded-lg px-3 py-2 text-right"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Precio Venta ($)</label><input type="number" step="0.01" id="prod_venta" required class="w-full border rounded-lg px-3 py-2 text-right text-blue-600 font-bold"></div>
                </div>
                <div><label class="block text-xs font-bold text-slate-500 mb-1">Proveedor Habitual</label><select id="prod_proveedor" required class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50"><option value="" disabled selected>Cargando...</option></select></div>
                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" onclick="cerrarModalProducto()" class="w-full py-2 border rounded-lg font-bold text-slate-600">Cancelar</button>
                    <button type="submit" class="w-full py-2 bg-emerald-600 text-white rounded-lg font-bold shadow-md">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL KÁRDEX -->
    <div id="modalKardex" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-3xl w-full shadow-2xl overflow-hidden">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="history" class="w-4 h-4 text-amber-400"></i> Historial Kárdex</h3>
                <div><button onclick="exportarKardexPDF()" class="mr-2 bg-amber-600 px-3 py-1 rounded text-xs font-bold">📄 PDF</button>
                <button onclick="cerrarModalKardex()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
            </div>
            <div class="p-6">
                <p class="text-sm text-slate-500 mb-4 font-bold" id="kardexProductoNombre">Producto: ...</p>
                <div class="overflow-y-auto max-h-72 border border-slate-100 rounded-lg">
                    <table class="w-full text-left text-xs" id="tablaKardex">
                        <thead class="bg-slate-100 text-slate-500 sticky top-0"><tr><th class="p-2.5">Fecha</th><th class="p-2.5">Acción</th><th class="p-2.5 text-center">Cantidad</th><th class="p-2.5">Origen</th></tr></thead>
                        <tbody id="tbodyKardex"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

        <script>
        // ========== CONFIGURACIÓN ==========
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqNPYrijF4teLAG-Xx73YIaTVdsZMDS5hMIY-BTVTzVy6gViGspHV3SVWwRyUtD-rpWg/exec"; // 🔁 REEMPLAZAR

        let inventarioGlobal = [];
        let proveedoresLista = [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarInventario();
            cargarProveedores();
        });

        // ========== PETICIONES GET ==========
        async function obtenerDatos(sheet) {
            const res = await fetch(`${SCRIPT_URL}?action=getData&sheet=${encodeURIComponent(sheet)}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json.data;
        }
        async function guardarDatos(sheet, data) {
            const params = new URLSearchParams({ action: "saveData", sheet });
            for (let [k, v] of Object.entries(data)) if (v != null) params.append(k, v);
            const res = await fetch(`${SCRIPT_URL}?${params.toString()}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json;
        }
        async function eliminarProducto(id) {
            const res = await fetch(`${SCRIPT_URL}?action=deleteProduct&sheet=Inventario&id=${encodeURIComponent(id)}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json;
        }
        async function obtenerKardex(nombreProducto) {
            const res = await fetch(`${SCRIPT_URL}?action=getKardex&producto=${encodeURIComponent(nombreProducto)}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json.data || [];
        }

        // ========== PROVEEDORES ==========
        async function cargarProveedores() {
            try {
                const data = await obtenerDatos("Proveedores");
                proveedoresLista = data;
                const select = document.getElementById("prod_proveedor");
                select.innerHTML = '<option value="" disabled selected>-- Seleccione --</option>';
                data.forEach(p => {
                    const nombre = p["Nombre del Proveedor"] || p["Nombre"] || p["nombre"];
                    if (nombre) select.appendChild(new Option(nombre, nombre));
                });
            } catch (err) { console.error(err); }
        }

        // ========== INVENTARIO ==========
        async function cargarInventario() {
            const tbody = document.getElementById("tbodyInventario");
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10">Cargando...</td></tr>';
            try {
                const data = await obtenerDatos("Inventario");
                inventarioGlobal = data.map(p => ({
                    ID: String(p.ID || "").trim(),
                    Producto: p.Producto || "Sin nombre",
                    Stock: parseInt(p.Stock ?? 0),
                    Precio_Distribuidor: parseFloat(p.Precio_Distribuidor ?? 0),
                    Precio_Venta: parseFloat(p.Precio_Venta ?? 0),
                    Ventas: parseInt(p.Ventas ?? 0),
                    Proveedor_Habitual: p["Proveedor Habitual"] || p.Proveedor_Habitual || ""
                })).sort((a,b) => b.Stock - a.Stock);
                procesarFiltros();
                actualizarContadores();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-10 text-rose-500">Error: ${err.message}</td></tr>`;
            }
        }

        function procesarFiltros() {
            const busqueda = (document.getElementById("buscarProducto")?.value || "").toLowerCase();
            const estado = document.getElementById("filtroEstadoLogistico")?.value || "TODOS";
            const filtrados = inventarioGlobal.filter(p => {
                const match = p.ID.toLowerCase().includes(busqueda) || p.Producto.toLowerCase().includes(busqueda);
                let ok = true;
                if (estado === "CRITICO") ok = p.Stock <= 0;
                else if (estado === "BAJO") ok = p.Stock > 0 && p.Stock <= 5;
                else if (estado === "OPTIMO") ok = p.Stock > 5;
                return match && ok;
            });
            renderizarTabla(filtrados);
        }

        function renderizarTabla(lista) {
            const tbody = document.getElementById("tbodyInventario");
            if (!lista.length) { tbody.innerHTML = '<tr><td colspan="8" class="text-center py-10">No hay productos</td></tr>'; lucide.createIcons(); return; }
            tbody.innerHTML = "";
            lista.forEach(p => {
                const row = tbody.insertRow();
                row.className = p.Stock <= 0 ? "bg-rose-50" : (p.Stock <= 5 ? "bg-amber-50" : "");
                row.innerHTML = `
                    <td class="py-3 px-6 font-mono text-xs">#${p.ID}</td>
                    <td class="py-3 px-4 font-bold">${escapeHtml(p.Producto)}</td>
                    <td class="py-3 px-4 text-right">$${p.Precio_Distribuidor.toFixed(2)}</td>
                    <td class="py-3 px-4 text-right text-blue-700 font-bold">$${p.Precio_Venta.toFixed(2)}</td>
                    <td class="py-3 px-4 text-center font-black text-base">${p.Stock}</td>
                    <td class="py-3 px-4 text-center font-black text-emerald-700">${p.Ventas}</td>
                    <td class="py-3 px-4 text-xs">${p.Proveedor_Habitual || "—"}</td>
                    <td class="py-3 px-6 text-center">
                        <button onclick='editarProducto(${JSON.stringify(p).replace(/'/g, "&#39;")})' class="p-1.5 bg-slate-100 rounded hover:bg-blue-100"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick='verKardex("${p.ID}", "${escapeHtml(p.Producto).replace(/"/g, '&quot;')}")' class="p-1.5 bg-slate-100 rounded hover:bg-amber-100"><i data-lucide="history" class="w-4 h-4"></i></button>
                        <button onclick='eliminarProductoConfirm("${p.ID}")' class="p-1.5 bg-slate-100 rounded hover:bg-rose-100"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
            });
            lucide.createIcons();
        }

        function actualizarContadores() {
            const criticos = inventarioGlobal.filter(p => p.Stock <= 0).length;
            const bajos = inventarioGlobal.filter(p => p.Stock > 0 && p.Stock <= 5).length;
            const optimos = inventarioGlobal.filter(p => p.Stock > 5).length;
            document.getElementById("lblTotalProductos").innerText = `${inventarioGlobal.length} Totales`;
            document.getElementById("lblCriticos").innerText = `${criticos} Críticos`;
            document.getElementById("lblPorAgotar").innerText = `${bajos} Por Agotar`;
            document.getElementById("lblOptimos").innerText = `${optimos} Óptimos`;
        }

        function filtrarPorBadge(estado) {
            document.getElementById("filtroEstadoLogistico").value = estado;
            procesarFiltros();
        }

        // ========== MODAL PRODUCTO ==========
        function editarProducto(producto) {
            document.getElementById("formProducto").reset();
            document.getElementById("modalProductoTitulo").innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-blue-400"></i> Editar Producto';
            document.getElementById("prod_id_interno").value = producto.ID;
            document.getElementById("prod_codigo").value = producto.ID;
            document.getElementById("prod_nombre").value = producto.Producto;
            document.getElementById("prod_costo").value = producto.Precio_Distribuidor;
            document.getElementById("prod_venta").value = producto.Precio_Venta;
            document.getElementById("prod_stock_actual").value = producto.Stock;
            document.getElementById("prod_ventas_actual").value = producto.Ventas;
            document.getElementById("prod_proveedor").value = producto.Proveedor_Habitual;
            document.getElementById("modalProducto").classList.remove("hidden");
            lucide.createIcons();
        }

        function abrirModalProducto() {
            document.getElementById("formProducto").reset();
            document.getElementById("modalProductoTitulo").innerHTML = '<i data-lucide="package-plus" class="w-4 h-4 text-emerald-400"></i> Nuevo Producto';
            document.getElementById("prod_id_interno").value = "";
            let max = 0;
            inventarioGlobal.forEach(i => { let n = parseInt(i.ID.replace(/\D/g,"")); if (!isNaN(n) && n>max) max=n; });
            document.getElementById("prod_codigo").value = `P-${max+1}`;
            document.getElementById("prod_stock_actual").value = "0";
            document.getElementById("prod_ventas_actual").value = "0";
            document.getElementById("prod_nombre").value = "";
            document.getElementById("prod_costo").value = "";
            document.getElementById("prod_venta").value = "";
            document.getElementById("prod_proveedor").value = "";
            document.getElementById("modalProducto").classList.remove("hidden");
            lucide.createIcons();
        }

        function cerrarModalProducto() { document.getElementById("modalProducto").classList.add("hidden"); }

        async function guardarProducto(e) {
            e.preventDefault();
            const data = {
                Fecha: new Date().toISOString(),
                ID: document.getElementById("prod_codigo").value,
                Producto: document.getElementById("prod_nombre").value,
                Stock: parseInt(document.getElementById("prod_stock_actual").value),
                Precio_Distribuidor: parseFloat(document.getElementById("prod_costo").value),
                Precio_Venta: parseFloat(document.getElementById("prod_venta").value),
                Ventas: parseInt(document.getElementById("prod_ventas_actual").value),
                "Proveedor Habitual": document.getElementById("prod_proveedor").value,
            };
            const oldId = document.getElementById("prod_id_interno").value;
            if (oldId) data.oldId = oldId;
            Swal.fire({ title: 'Guardando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await guardarDatos("Inventario", data);
                Swal.fire({ icon: 'success', title: 'Guardado', timer: 1500, showConfirmButton: false });
                cerrarModalProducto();
                cargarInventario();
                cargarProveedores();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        async function eliminarProductoConfirm(id) {
            const confirm = await Swal.fire({ title: '¿Eliminar?', text: `ID ${id}`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'Sí' });
            if (!confirm.isConfirmed) return;
            Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await eliminarProducto(id);
                Swal.fire({ icon: 'success', title: 'Eliminado', timer: 1500 });
                cargarInventario();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        // ========== KÁRDEX ==========
        let kardexActual = [];
        async function verKardex(idProducto, nombreProducto) {
            const modal = document.getElementById("modalKardex");
            const tbody = document.getElementById("tbodyKardex");
            const titulo = document.getElementById("kardexProductoNombre");
            titulo.innerText = `Producto: ${nombreProducto} (#${idProducto})`;
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-8">Cargando...</td></tr>';
            modal.classList.remove("hidden");
            lucide.createIcons();
            try {
                const movimientos = await obtenerKardex(nombreProducto);
                kardexActual = movimientos;
                tbody.innerHTML = "";
                if (movimientos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-slate-400">Sin movimientos</td></tr>';
                    return;
                }
                movimientos.forEach(m => {
                    const esIngreso = m.accion === "INGRESO";
                    const tr = tbody.insertRow();
                    tr.innerHTML = `
                        <td class="p-2.5 text-xs">${m.fecha || 'S/F'}</td>
                        <td class="p-2.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-black ${esIngreso ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${m.accion}</span></td>
                        <td class="p-2.5 text-center font-bold ${esIngreso ? 'text-emerald-600' : 'text-rose-600'}">${esIngreso ? '+' : '-'}${m.cantidad}</td>
                        <td class="p-2.5 text-xs">${m.referencia || ''}</td>
                    `;
                });
                lucide.createIcons();
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-rose-500">Error: ${err.message}</td></tr>`;
            }
        }

        function cerrarModalKardex() { document.getElementById("modalKardex").classList.add("hidden"); }

        function exportarKardexPDF() {
            if (!kardexActual || kardexActual.length === 0) {
                Swal.fire("Sin datos", "No hay movimientos para exportar", "info");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const titulo = document.getElementById("kardexProductoNombre").innerText;
            doc.setFontSize(14);
            doc.text(titulo, 14, 15);
            doc.setFontSize(10);
            doc.text(`Generado: ${new Date().toLocaleString()}`, 14, 22);
            const columnas = ["Fecha", "Acción", "Cantidad", "Origen"];
            const filas = kardexActual.map(m => [m.fecha || "", m.accion, (m.accion === "INGRESO" ? "+" : "-") + m.cantidad, m.referencia || ""]);
            doc.autoTable({
                head: [columnas],
                body: filas,
                startY: 30,
                theme: 'striped',
                headStyles: { fillColor: [15, 23, 42] }
            });
            doc.save(`kardex_${titulo.replace(/[^a-z0-9]/gi, '_')}.pdf`);
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }

        // Exponer funciones globales
        window.abrirModalProducto = abrirModalProducto;
        window.editarProducto = editarProducto;
        window.cerrarModalProducto = cerrarModalProducto;
        window.guardarProducto = guardarProducto;
        window.eliminarProductoConfirm = eliminarProductoConfirm;
        window.verKardex = verKardex;
        window.cerrarModalKardex = cerrarModalKardex;
        window.exportarKardexPDF = exportarKardexPDF;
        window.procesarFiltros = procesarFiltros;
        window.filtrarPorBadge = filtrarPorBadge;
        window.solicitarFormatoExportacion = function() {
            Swal.fire({
                title: 'Exportar Inventario', icon: 'question', showCancelButton: true, showDenyButton: true,
                confirmButtonText: '📊 Excel', denyButtonText: '📄 PDF'
            }).then(res => {
                if (res.isConfirmed) exportarExcel();
                else if (res.isDenied) exportarPDF();
            });
        };
        function exportarExcel() {
            if (!inventarioGlobal.length) return;
            const data = inventarioGlobal.map(p => ({ ID: p.ID, Producto: p.Producto, "Precio Dist": p.Precio_Distribuidor, "Precio Venta": p.Precio_Venta, Stock: p.Stock, Ventas: p.Ventas, Proveedor: p.Proveedor_Habitual }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventario");
            XLSX.writeFile(wb, `inventario_${new Date().toISOString().slice(0,10)}.xlsx`);
        }
        function exportarPDF() {
            if (!inventarioGlobal.length) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape' });
            doc.text("Inventario - Lógica Láctea", 14, 15);
            doc.autoTable({
                head: [["ID","Producto","P.Dist","P.Venta","Stock","Ventas","Proveedor"]],
                body: inventarioGlobal.map(p => [p.ID, p.Producto, p.Precio_Distribuidor, p.Precio_Venta, p.Stock, p.Ventas, p.Proveedor_Habitual]),
                startY: 22, theme: 'striped', headStyles: { fillColor: [15,23,42] }
            });
            doc.save(`inventario_${new Date().toISOString().slice(0,10)}.pdf`);
        }
    </script>
</body>
</html>
