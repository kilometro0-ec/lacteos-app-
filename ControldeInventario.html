<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Kardex de Inventario | Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js?v=1.4"></script>
    <script src="menu-logic.js?v=1.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0284c7' } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="pb-32 bg-slate-50 text-slate-800">
    <header class="fixed top-0 w-full z-40 flex justify-between items-center px-6 h-20 bg-gradient-to-r from-sky-700 to-sky-900 text-white shadow-md">
        <div>
            <h1 class="text-[9px] font-black text-sky-200 uppercase tracking-widest">Almacén Central</h1>
            <h2 class="text-base font-black uppercase tracking-tight">Kardex de Inventario</h2>
        </div>
        <span class="material-symbols-outlined text-2xl">inventory</span>
    </header>

    <main class="pt-24 px-4 max-w-xl mx-auto space-y-4">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-3.5 text-sky-600">search</span>
            <input type="text" id="buscador" oninput="filtrar()" placeholder="Buscar producto en stock..." class="w-full rounded-2xl border-none shadow-sm py-3.5 pl-12 text-xs font-bold focus:ring-2 focus:ring-sky-600/20 bg-white">
        </div>
        <div id="grid-inventario" class="grid gap-3"></div>
    </main>
    <nav id="menu-container"></nav>

    <script>
        let inventario = [];
        async function cargar() {
            try {
                inventario = await DairyAPI.obtenerDatos("Inventario");
                renderizar(inventario);
            } catch(e) { console.error(e); }
        }
        function renderizar(lista) {
            document.getElementById('grid-inventario').innerHTML = lista.map(i => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <h3 class="text-xs font-black uppercase text-slate-800 leading-tight">${i.Producto}</h3>
                        <p class="text-[10px] text-slate-400 font-bold mt-1">Proveedor: ${i.Proveedor_Habitual || 'Sin Asignar'}</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-black bg-sky-50 text-sky-700 px-3 py-1.5 rounded-xl border border-sky-100">${i.Stock} Uds</span>
                        <p class="text-[10px] font-black text-slate-600 mt-2">PVP: $${parseFloat(i.Precio_Venta || 0).toFixed(2)}</p>
                    </div>
                </div>`).join('');
        }
        function filtrar() {
            const b = document.getElementById('buscador').value.toLowerCase();
            renderizar(inventario.filter(i => i.Producto.toLowerCase().includes(b)));
        }
        window.onload = cargar;
    </script>
</body>
</html>
