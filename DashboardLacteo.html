<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Lógica Láctea - Dashboard Total</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: "#a21caf", 
            secondary: "#db2777", 
            success: "#16a34a", 
            electric: "#0055ff", 
            background: "#faf5ff", 
            outline: "#e9d5ff" 
          }
        }
      }
    }
    </script>

    <script>

const fInput = document.getElementById('filtro-fecha');

const hoy = new Date();

fInput.value = new Date(
  hoy - (hoy.getTimezoneOffset() * 60000)
).toISOString().split('T')[0];

function mostrarCargando(show){
  document.getElementById('loading-overlay').style.display =
    show ? 'flex' : 'none';
}

function norm(t){
  return (t || "")
    .toString()
    .trim()
    .toUpperCase();
}

/* =========================
   FILTROS
========================= */

function cumpleFiltro(fechaVenta, periodo, fechaSeleccionada){

  if(!fechaVenta) return false;

  const fV = new Date(fechaVenta);

  if(isNaN(fV)) return false;

  const hoy = new Date();

  if(periodo === 'hoy'){
    return fV.toDateString() === hoy.toDateString();
  }

  if(periodo === 'semana'){

    const inicioSemana = new Date(hoy);

    inicioSemana.setDate(
      hoy.getDate() - hoy.getDay() + 1
    );

    inicioSemana.setHours(0,0,0,0);

    return fV >= inicioSemana;
  }

  if(periodo === 'mes'){

    return (
      fV.getMonth() === hoy.getMonth() &&
      fV.getFullYear() === hoy.getFullYear()
    );
  }

  if(periodo.startsWith("mes-")){

    const resta = Number(periodo.split("-")[1]);

    const fechaMes = new Date(
      hoy.getFullYear(),
      hoy.getMonth() - resta,
      1
    );

    return (
      fV.getMonth() === fechaMes.getMonth() &&
      fV.getFullYear() === fechaMes.getFullYear()
    );
  }

  if(periodo === 'personalizado'){

    return (
      fV.toISOString().split('T')[0]
      === fechaSeleccionada
    );
  }

  return true;
}

/* =========================
   MAIN
========================= */

async function cargarDatos(){

  mostrarCargando(true);

  const periodo =
    document.getElementById('periodo-filtro').value;

  const fSel = fInput.value;

  fInput.classList.toggle(
    'hidden',
    periodo !== 'personalizado'
  );

  try{

    const [inventario, ventas, compras] =
      await Promise.all([

      DairyAPI.obtenerDatos("Inventario"),
      DairyAPI.obtenerDatos("Ventas"),
      DairyAPI.obtenerDatos("Compras")

    ]);

    const inv = inventario || [];
    const ven = ventas || [];
    const com = compras || [];

    /* =========================
       INVENTARIO
    ========================= */

    const costos = {};

    let valorBodega = 0;
    let proyeccion = 0;

    inv.forEach(p=>{

      const prod = norm(p.Producto);

      const costo =
        Number(p.Precio_Distribuidor) || 0;

      const venta =
        Number(p.Precio_Venta) || 0;

      const stock =
        Number(p.Stock) || 0;

      costos[prod] = costo;

      valorBodega += costo * stock;

      proyeccion +=
        (venta - costo) * stock;
    });

    document.getElementById(
      'valor-invertido'
    ).innerText =
      `$${valorBodega.toFixed(2)}`;

    document.getElementById(
      'ganancia-proyectada'
    ).innerText =
      `$${proyeccion.toFixed(2)}`;

    /* =========================
       STOCK TOTAL
    ========================= */

    const badgeStock =
      document.getElementById('badge-stock');

    badgeStock.innerText = inv.length;

    badgeStock.classList.remove('hidden');

    if(inv.length > 0){
      document
        .getElementById('btn-stock')
        .classList.add('pulse-notif');
    }

    /* =========================
       VENTAS
    ========================= */

    let totalVentas = 0;
    let utilidad = 0;
    let porCobrar = 0;

    let totalAnterior = 0;

    const ranking = {};
    const pedidos = {};

    ven.forEach(v=>{

      const prod = norm(v.Producto);

      const cantidad =
        Number(v.Cantidad) || 0;

      const total =
        Number(v.Total) || 0;

      const estado =
        norm(v.Estado);

      const fecha = new Date(v.Fecha);

      if(
        cumpleFiltro(
          fecha,
          periodo,
          fSel
        )
      ){

        totalVentas += total;

        utilidad += total -
          ((costos[prod] || 0) * cantidad);

        ranking[prod] =
          (ranking[prod] || 0)
          + cantidad;
      }

      /* =========================
         COMPARATIVA
      ========================= */

      const hoyNow = new Date();

      if(periodo === "hoy"){

        const ayer = new Date();
        ayer.setDate(hoyNow.getDate()-1);

        if(
          fecha.toDateString()
          === ayer.toDateString()
        ){
          totalAnterior += total;
        }
      }

      if(periodo === "semana"){

        const inicioActual =
          new Date(hoyNow);

        inicioActual.setDate(
          hoyNow.getDate()
          - hoyNow.getDay() + 1
        );

        const inicioAnterior =
          new Date(inicioActual);

        inicioAnterior.setDate(
          inicioActual.getDate()-7
        );

        const finAnterior =
          new Date(inicioActual);

        if(
          fecha >= inicioAnterior &&
          fecha < finAnterior
        ){
          totalAnterior += total;
        }
      }

      if(periodo === "mes"){

        const mesAnterior =
          new Date(
            hoyNow.getFullYear(),
            hoyNow.getMonth()-1,
            1
          );

        if(
          fecha.getMonth()
            === mesAnterior.getMonth()
          &&
          fecha.getFullYear()
            === mesAnterior.getFullYear()
        ){
          totalAnterior += total;
        }
      }

      if(estado === "PENDIENTE"){

        porCobrar += total;

        if(v.ID_Venta){

          if(!pedidos[v.ID_Venta]){

            const dias =
              Math.floor(
                (hoyNow - fecha)
                / (1000*60*60*24)
              );

            pedidos[v.ID_Venta] = {
              cliente: v.Cliente,
              dias,
              total: 0
            };
          }

          pedidos[v.ID_Venta].total += total;
        }
      }

    });

    /* =========================
       COMPARATIVA %
    ========================= */

    let porcentaje = 0;

    if(totalAnterior > 0){

      porcentaje =
        (
          (
            totalVentas - totalAnterior
          )
          / totalAnterior
        ) * 100;
    }

    const txt =
      porcentaje >= 0
      ? `▲ +${porcentaje.toFixed(1)}%`
      : `▼ ${porcentaje.toFixed(1)}%`;

    document.getElementById(
      'porcentaje-ventas'
    ).innerText = txt;

    if(periodo === "hoy"){

      document.getElementById(
        'comparativa-ventas'
      ).innerText =
        `Ayer: $${totalAnterior.toFixed(2)}`;
    }

    if(periodo === "semana"){

      document.getElementById(
        'comparativa-ventas'
      ).innerText =
        `Semana pasada: $${totalAnterior.toFixed(2)}`;
    }

    if(periodo === "mes"){

      document.getElementById(
        'comparativa-ventas'
      ).innerText =
        `Mes pasado: $${totalAnterior.toFixed(2)}`;
    }

    /* =========================
       UI PRINCIPAL
    ========================= */

    document.getElementById(
      'ventas-total-hoy'
    ).innerText =
      `$${totalVentas.toFixed(2)}`;

    document.getElementById(
      'ganancia-real'
    ).innerText =
      `$${utilidad.toFixed(2)}`;

    document.getElementById(
      'por-recaudar'
    ).innerText =
      `$${porCobrar.toFixed(2)}`;

    document.getElementById(
      'label-dinero'
    ).innerText =
      `Ventas ${periodo.toUpperCase()}`;

    /* =========================
       PEDIDOS
    ========================= */

    const lista =
      document.getElementById(
        'lista-pedidos'
      );

    const ordenados =
      Object.entries(pedidos)
      .sort((a,b)=>
        b[1].dias - a[1].dias
      );

    lista.innerHTML =
      ordenados.length
      ?
      ordenados.map(([id,p])=>`

      <div class="p-3 bg-white rounded-2xl border flex justify-between items-center">

        <div>

          <div class="text-[10px] font-black uppercase">
            ${p.cliente}
          </div>

          <div class="text-[9px] text-red-600 font-bold">
            RETRASO ${p.dias} DÍAS
          </div>

        </div>

        <div class="text-xs font-black text-amber-600">
          $${p.total.toFixed(2)}
        </div>

      </div>

      `).join('')
      :
      '<p class="text-center text-slate-300">Sin pedidos</p>';

    /* =========================
       BADGE RUTA
    ========================= */

    const badgeRuta =
      document.getElementById(
        'badge-ruta'
      );

    badgeRuta.innerText =
      ordenados.length;

    if(ordenados.length > 0){

      badgeRuta.classList.remove(
        'hidden'
      );

      document
        .getElementById('btn-ruta')
        .classList.add('pulse-notif');

    }else{

      badgeRuta.classList.add(
        'hidden'
      );
    }

    /* =========================
       COMPRAS PENDIENTES
    ========================= */

    const pendientesCompras =
      com.filter(c=>
        norm(c.Estado_Entrega)
        === "PENDIENTE"
      );

    const badgeRecepcion =
      document.getElementById(
        'badge-recepcion'
      );

    badgeRecepcion.innerText =
      pendientesCompras.length;

    if(pendientesCompras.length > 0){

      badgeRecepcion.classList.remove(
        'hidden'
      );

      document
        .getElementById('btn-recepcion')
        .classList.add('pulse-notif');

    }else{

      badgeRecepcion.classList.add(
        'hidden'
      );
    }

    /* =========================
       RANKING
    ========================= */

    document.getElementById(
      'ranking-productos'
    ).innerHTML =

      Object.entries(ranking)

      .sort((a,b)=>b[1]-a[1])

      .slice(0,4)

      .map(([n,c],i)=>`

      <div class="flex justify-between p-2 bg-purple-50 rounded-xl text-[10px] font-bold">

        <span>
          ${i+1}. ${n}
        </span>

        <span class="text-primary">
          ${c}
        </span>

      </div>

      `).join('');

    /* =========================
       STOCK CRITICO
    ========================= */

    const criticos =
      inv.filter(p=>{

      const s =
        Number(p.Stock) || 0;

      return s > 0 && s <= 5;
    });

    document.getElementById(
      'cont-criticos'
    ).innerHTML =

      criticos.length

      ?

      criticos.map(p=>`

      <div class="flex justify-between p-2 bg-red-50 rounded-xl text-[10px] font-bold">

        <span>
          ${p.Producto}
        </span>

        <span class="text-red-600">
          ${p.Stock}
        </span>

      </div>

      `).join('')

      :

      '<p class="text-center text-slate-300">Stock estable</p>';

  }catch(err){

    console.error(err);

  }finally{

    mostrarCargando(false);
  }
}

window.onload = cargarDatos;

</script>
</body>
</html>
