<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Lógica Láctea - Dashboard Total</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: "#a21caf", 
            secondary: "#db2777", 
            success: "#16a34a", 
            electric: "#0055ff", 
            background: "#faf5ff", 
            outline: "#e9d5ff" 
          }
        }
      }
    }
    <script>
const fInput = document.getElementById('filtro-fecha');
const hoy = new Date();
fInput.value = new Date(hoy - (hoy.getTimezoneOffset() * 60000))
  .toISOString().split('T')[0];

function mostrarCargando(show) {
  document.getElementById('loading-overlay').style.display =
    show ? 'flex' : 'none';
}

// 🔥 FIX CRÍTICO: SIEMPRE DEVOLVER ARRAY
function normalizar(res) {
  if (Array.isArray(res)) return res;
  if (res && Array.isArray(res.data)) return res.data;
  return [];
}

function cumpleFiltro(fechaVenta, periodo, fechaSeleccionada) {
  if (!fechaVenta) return false;

  const fV = new Date(fechaVenta);
  if (isNaN(fV.getTime())) return false;

  if (periodo === 'hoy')
    return fV.toDateString() === hoy.toDateString();

  if (periodo === 'semana') {
    const diff = hoy.getDate() - hoy.getDay() + (hoy.getDay() === 0 ? -6 : 1);
    const lunes = new Date(hoy);
    lunes.setDate(diff);
    lunes.setHours(0,0,0,0);
    return fV >= lunes;
  }

  if (periodo === 'mes')
    return fV.getMonth() === hoy.getMonth() &&
           fV.getFullYear() === hoy.getFullYear();

  return fV.toISOString().split('T')[0] === fechaSeleccionada;
}

async function cargarDatos() {

  mostrarCargando(true);

  const periodo = document.getElementById('periodo-filtro').value;
  const fSel = fInput.value;
  fInput.classList.toggle('hidden', periodo !== 'personalizado');

  try {

    const [resInv, resVentas, resCompras] = await Promise.all([
      DairyAPI.obtenerDatos("Inventario"),
      DairyAPI.obtenerDatos("Ventas"),
      DairyAPI.obtenerDatos("Compras")
    ]);

    // 🔥 FIX AQUÍ
    const inventario = normalizar(resInv);
    const ventas = normalizar(resVentas);
    const compras = normalizar(resCompras);

    // ================= INVENTARIO =================
    const costosMap = {};
    let valorBodega = 0;
    let proyeccionG = 0;

    inventario.forEach(p => {
      const c = parseFloat(String(p.Precio_Distribuidor || 0).replace(',', '.')) || 0;
      const v = parseFloat(String(p.Precio_Venta || 0).replace(',', '.')) || 0;
      const s = parseFloat(p.Stock) || 0;

      costosMap[p.Producto] = c;

      valorBodega += c * s;
      proyeccionG += (v - c) * s;
    });

    document.getElementById('valor-invertido').innerText = `$${valorBodega.toFixed(2)}`;
    document.getElementById('ganancia-proyectada').innerText = `$${proyeccionG.toFixed(2)}`;

    // ================= VENTAS =================
    let tVentas = 0;
    let tUtilidad = 0;
    let tPorCobrar = 0;

    const ranking = {};
    const pedidosPendientes = {};

    ventas.forEach(v => {

      const cantidad = parseFloat(v.Cantidad) || 0;
      const total = parseFloat(String(v.Total || v["Precio Total"] || 0).replace(',', '.')) || 0;

      const estado = String(v.Estado || "").toUpperCase();
      const producto = v.Producto || "SIN PRODUCTO";
      const id = v.ID_Venta;

      if (cumpleFiltro(v.Fecha, periodo, fSel)) {

        tVentas += total;

        const costo = costosMap[producto] || 0;
        tUtilidad += total - (costo * cantidad);

        ranking[producto] = (ranking[producto] || 0) + cantidad;
      }

      if (estado === "PENDIENTE") {

        tPorCobrar += total;

        if (id && !pedidosPendientes[id]) {
          const fecha = new Date(v.Fecha);
          const dias = isNaN(fecha) ? 0 : Math.floor((hoy - fecha) / (1000*60*60*24));

          pedidosPendientes[id] = {
            cliente: v.Cliente || "Cliente",
            dias,
            total: 0
          };
        }

        if (id) pedidosPendientes[id].total += total;
      }
    });

    document.getElementById('ventas-total-hoy').innerText = `$${tVentas.toFixed(2)}`;
    document.getElementById('ganancia-real').innerText = `$${tUtilidad.toFixed(2)}`;
    document.getElementById('por-recaudar').innerText = `$${tPorCobrar.toFixed(2)}`;
    document.getElementById('label-dinero').innerText = `Ventas ${periodo.toUpperCase()}`;

    // ================= PEDIDOS =================
    const lista = document.getElementById('lista-pedidos');

    const ordenados = Object.entries(pedidosPendientes)
      .sort((a,b) => b[1].dias - a[1].dias);

    lista.innerHTML = ordenados.length
      ? ordenados.map(([id,p]) => `
        <div class="p-3 bg-white rounded-2xl border flex justify-between items-center">
          <div>
            <div class="text-[10px] font-black">${p.cliente}</div>
            <div class="text-[9px] text-red-500">
              RETRASO ${p.dias} DÍAS (ID ${id})
            </div>
          </div>
          <div class="font-black text-amber-600">
            $${p.total.toFixed(2)}
          </div>
        </div>
      `).join('')
      : `<p class="text-center text-slate-300 text-xs">Sin pendientes</p>`;

    document.getElementById('badge-ruta').innerText = ordenados.length;
    document.getElementById('badge-ruta')
      .classList.toggle('hidden', ordenados.length === 0);

    // ================= COMPRAS =================
    const comprasPend = compras.filter(c =>
      String(c.Estado_Entrega || "").toUpperCase() === "PENDIENTE"
    );

    const badge = document.getElementById('badge-recepcion');

    if (comprasPend.length > 0) {
      badge.innerText = [...new Set(comprasPend.map(c => c.ID_Compra))].length;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }

    // ================= TOP =================
    const rankDiv = document.getElementById('ranking-productos');

    rankDiv.innerHTML = Object.entries(ranking)
      .sort((a,b) => b[1]-a[1])
      .slice(0,4)
      .map(([n,c],i)=>`
        <div class="flex justify-between p-2 bg-purple-50 rounded-xl text-[10px]">
          <span>${i+1}. ${n}</span>
          <span class="text-primary">${c} ud.</span>
        </div>
      `).join('') || `<p class="text-center text-slate-300 text-[9px]">Sin datos</p>`;

    // ================= STOCK =================
    const crit = inventario.filter(p => {
      const s = parseFloat(p.Stock) || 0;
      return s > 0 && s <= 5;
    });

    const cont = document.getElementById('cont-criticos');

    cont.innerHTML = crit.length
      ? crit.map(p => `
        <div class="flex justify-between p-2 bg-red-50 rounded-xl text-[10px]">
          <span>${p.Producto}</span>
          <span class="text-red-600 font-black">${p.Stock}</span>
        </div>
      `).join('')
      : `<p class="text-center text-slate-300 text-[9px]">Stock estable</p>`;

  } catch (e) {
    console.error("ERROR DASHBOARD:", e);
    alert("Error conectando con el servidor");
  }

  setTimeout(() => mostrarCargando(false), 400);
}

window.onload = cargarDatos;
</script>
</body>
</html>
