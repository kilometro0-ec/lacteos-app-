<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Lógica Láctea - Dashboard Total</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: "#a21caf", 
            secondary: "#db2777", 
            success: "#16a34a", 
            electric: "#0055ff", 
            background: "#faf5ff", 
            outline: "#e9d5ff" 
          }
        }
      }
    }
    </script>

    <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .rotate-animation { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(4px);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }

    .glass-card { background: linear-gradient(135deg, #a21caf 0%, #6b21a8 100%); }

    .pulse-notif { animation: shadow-pulse 1.5s infinite; }
    @keyframes shadow-pulse {
        0% { box-shadow: 0 0 0 0px rgba(0, 85, 255, 0.4); }
        70% { box-shadow: 0 0 0 8px rgba(0, 85, 255, 0); }
        100% { box-shadow: 0 0 0 0px rgba(0, 85, 255, 0); }
    }
    </style>
</head>

<body class="bg-background text-[#1f012a] font-[Work_Sans] antialiased pb-10">

<div id="loading-overlay">
    <div class="flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-5xl text-primary rotate-animation">sync</span>
        <span class="text-[10px] font-black uppercase tracking-widest text-primary italic">Sincronizando...</span>
    </div>
</div>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-24 bg-white border-b border-outline shadow-sm">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-primary border border-purple-200">
      <span class="material-symbols-outlined text-3xl">analytics</span>
    </div>

    <div class="flex flex-col">
        <h1 class="text-xs font-black text-primary">Lógica Láctea</h1>

        <select id="periodo-filtro" onchange="cargarDatos()" class="text-[11px] font-black bg-transparent">
            <option value="hoy">Hoy</option>
            <option value="semana">Semana</option>
            <option value="mes">Mes</option>
            <option value="personalizado">Día</option>
        </select>

        <input type="date" id="filtro-fecha" onchange="cargarDatos()" class="hidden">
    </div>
  </div>

  <button onclick="cargarDatos()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center">
    <span class="material-symbols-outlined">sync</span>
  </button>
</header>

<main class="pt-28 px-4 max-w-7xl mx-auto space-y-5">

<!-- CARD -->
<div class="glass-card p-6 rounded-[2.5rem] text-white">

    <p id="label-dinero" class="text-xs">Ventas</p>
    <h2 id="ventas-total-hoy" class="text-4xl font-black">$0.00</h2>

    <div class="grid grid-cols-2 gap-4 mt-4">
        <div>
            <p>Utilidad</p>
            <p id="ganancia-real">$0</p>
        </div>
        <div>
            <p>Proyección</p>
            <p id="ganancia-proyectada">$0</p>
        </div>
    </div>

</div>

<!-- BOTONES -->
<div class="grid grid-cols-2 gap-3">

<button onclick="location.href='RegistrodeVentas.html'">Vender</button>
<button onclick="location.href='GestióndeDespachos.html'">Despachos</button>
<button onclick="location.href='ControldeInventario.html'">Stock</button>
<button onclick="location.href='ConfirmarRecepcion.html'">Recepción</button>
<button onclick="location.href='Proveedores.html'">Proveedores</button>
<button onclick="location.href='GestiondeClientes.html'">Clientes</button>

</div>

<!-- LISTAS -->
<section>
  <div id="lista-pedidos"></div>
</section>

<section>
  <div id="ranking-productos"></div>
</section>

<section>
  <div id="cont-criticos"></div>
</section>

</main>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzmON_L0C1Ci2sQxMPAUDKN2nbPI3HZGAlqFjNkrF7ZHK2jaI-RMqagzL_3S6pkgZxl5w/exec";

const DairyAPI = {
  obtenerDatos: async (sheet) => {
    const res = await fetch(`${API_URL}?pestaña=${sheet}`);
    const json = await res.json();
    return json.data || [];
  }
};

const fInput = document.getElementById('filtro-fecha');
const hoy = new Date();

fInput.value = new Date(hoy - hoy.getTimezoneOffset()*60000)
  .toISOString().split('T')[0];

function mostrarCargando(s) {
  document.getElementById('loading-overlay').style.display = s ? 'flex':'none';
}

function normalizar(d){
  if(Array.isArray(d)) return d;
  if(d?.data) return d.data;
  return [];
}

function cumpleFiltro(f,p,sel){
  if(!f) return false;
  const d = new Date(f);
  if(isNaN(d)) return false;
  return true;
}

async function cargarDatos(){

mostrarCargando(true);

const [inv,v,com] = await Promise.all([
  DairyAPI.obtenerDatos("Inventario"),
  DairyAPI.obtenerDatos("Ventas"),
  DairyAPI.obtenerDatos("Compras")
]);

const inventario = normalizar(inv);
const ventas = normalizar(v);
const compras = normalizar(com);

let ventasTotal=0, utilidad=0, cobrar=0;
let ranking={};

const costos={};

inventario.forEach(p=>{
  costos[p.Producto]=+p.Precio_Distribuidor||0;
});

ventas.forEach(v=>{
  const t=+v.Total||0;
  const c=+v.Cantidad||0;

  ventasTotal+=t;
  utilidad+=t-(costos[v.Producto]||0)*c;

  ranking[v.Producto]=(ranking[v.Producto]||0)+c;

  if(v.Estado==="PENDIENTE") cobrar+=t;
});

document.getElementById("ventas-total-hoy").innerText="$"+ventasTotal.toFixed(2);
document.getElementById("ganancia-real").innerText="$"+utilidad.toFixed(2);
document.getElementById("ganancia-proyectada").innerText="$"+utilidad.toFixed(2);

const r=document.getElementById("ranking-productos");
r.innerHTML=Object.entries(ranking).slice(0,4).map(([n,c])=>
`<div>${n} - ${c}</div>`).join("");

const c=document.getElementById("cont-criticos");
c.innerHTML="OK";

mostrarCargando(false);
}

window.onload=cargarDatos;
</script>

</body>
</html>
