<!DOCTYPE html>
<html class="light" lang="es">
<head>

    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: "#a21caf", 
            secondary: "#db2777", 
            success: "#16a34a", 
            electric: "#0055ff",

    <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .rotate-animation { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    #loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(4px);
        z-index: 9999;
        justify-content: center;
        align-items: center;
    }

    .glass-card { background: linear-gradient(135deg, #a21caf 0%, #6b21a8 100%); }
    
    .pulse-notif { animation: shadow-pulse 1.5s infinite; }
    @keyframes shadow-pulse {
        0% { box-shadow: 0 0 0 0px rgba(0, 85, 255, 0.4); }
        70% { box-shadow: 0 0 0 8px rgba(0, 85, 255, 0); }
        100% { box-shadow: 0 0 0 0px rgba(0, 85, 255, 0); }
    }
    </style>
</head>

<body class="bg-background text-[#1f012a] font-[Work_Sans] antialiased pb-10">

<!-- Overlay de Carga -->
<div id="loading-overlay">
    <div class="flex flex-col items-center gap-2">
        <span class="material-symbols-outlined text-5xl text-primary rotate-animation">sync</span>
        <span class="text-[10px] font-black uppercase tracking-widest text-primary italic">Sincronizando...</span>
    </div>
</div>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-4 h-24 bg-white border-b border-outline shadow-sm">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-primary border border-purple-200">
      <span class="material-symbols-outlined text-3xl">analytics</span>
    </div>
    <div class="flex flex-col">
        <h1 class="text-xs font-black text-primary tracking-tight uppercase italic leading-none mb-1">Lógica Láctea</h1>
        <select id="periodo-filtro" onchange="cargarDatos()" class="text-[11px] font-black border-none p-0 bg-transparent text-slate-600 focus:ring-0 uppercase">
            <option value="hoy">Hoy</option>
            <option value="semana">Esta Semana</option>
            <option value="mes">Este Mes</option>
            <option value="personalizado">Día Específico</option>
        </select>
        <input type="date" id="filtro-fecha" onchange="cargarDatos()" class="hidden text-[10px] font-bold border-none p-0 bg-transparent text-gray-500 focus:ring-0">
    </div>
  </div>
  <button onclick="cargarDatos()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center border border-slate-100 active:scale-90 transition-transform">
    <span class="material-symbols-outlined text-slate-500">sync</span>
  </button>
</header>

<main class="pt-28 px-4 max-w-7xl mx-auto space-y-5">

    <!-- 1. CARD DE DINERO -->
    <div class="glass-card p-6 rounded-[2.5rem] shadow-2xl text-white relative overflow-hidden">
        <div class="relative z-10 space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <p id="label-dinero" class="text-[10px] font-black uppercase tracking-[0.2em] text-purple-200 italic">Ventas Totales</p>
                    <h2 id="ventas-total-hoy" class="text-5xl font-black tracking-tighter">$0.00</h2>
                </div>
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md border border-white/30">
                    <span class="material-symbols-outlined text-3xl">payments</span>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 border-t border-white/20 pt-4">
                <div>
                    <p class="text-[9px] font-bold uppercase text-purple-200">Utilidad Actual</p>
                    <p id="ganancia-real" class="text-xl font-black text-green-300">$0.00</p>
                </div>
                <div class="text-right">
                    <p class="text-[9px] font-bold uppercase text-purple-200 italic text-amber-200">Ganancia Proyectada</p>
                    <p id="ganancia-proyectada" class="text-xl font-black text-amber-300">$0.00</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-black/20 p-2 rounded-xl flex flex-col border border-white/10">
                    <span class="text-[8px] font-bold uppercase text-white/70">Costo en Bodega</span>
                    <span id="valor-invertido" class="font-black text-xs">$0.00</span>
                </div>
                <div class="bg-black/20 p-2 rounded-xl flex flex-col border border-white/10">
                    <span class="text-[8px] font-bold uppercase text-white/70">Cuentas por Cobrar</span>
                    <span id="por-recaudar" class="font-black text-xs">$0.00</span>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTONES -->
    <div class="grid grid-cols-2 gap-3">
        <button onclick="location.href='RegistrodeVentas.html'" class="bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
          <div class="w-12 h-12 rounded-2xl bg-purple-100 text-primary flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-3xl">add_shopping_cart</span>
          </div>
          <span class="text-[11px] font-black uppercase text-slate-800">Vender</span>
        </button>
        
        <button id="btn-ruta" onclick="location.href='GestióndeDespachos.html'" class="relative bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
          <span id="badge-ruta" class="absolute top-3 right-5 bg-red-600 text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
          <div class="w-12 h-12 rounded-2xl bg-green-100 text-success flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-3xl font-bold">local_shipping</span>
          </div>
          <span class="text-[11px] font-black uppercase text-slate-800">En Ruta</span>
        </button>

        <button onclick="location.href='ControldeInventario.html'" class="bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
          <div class="w-12 h-12 rounded-2xl bg-pink-100 text-secondary flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-3xl">inventory</span>
          </div>
          <span class="text-[11px] font-black uppercase text-slate-800">Stock</span>
        </button>

        <button id="btn-recepcion" onclick="location.href='ConfirmarRecepcion.html'" class="relative bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
            <span id="badge-recepcion" class="absolute top-3 right-5 bg-red-600 text-white text-[10px] font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
            <div class="w-12 h-12 rounded-2xl bg-blue-100 text-electric flex items-center justify-center mb-1">
              <span class="material-symbols-outlined text-3xl font-bold">inventory_2</span>
            </div>
            <span class="text-[11px] font-black uppercase text-electric">Recibir</span>
        </button>

        <button onclick="location.href='Proveedores.html'" class="bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
          <div class="w-12 h-12 rounded-2xl bg-slate-100 text-slate-700 flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-3xl">factory</span>
          </div>
          <span class="text-[11px] font-black uppercase text-slate-800">Proveedores</span>
        </button>

        <button onclick="location.href='GestiondeClientes.html'" class="bg-white border border-outline p-4 rounded-[2rem] flex flex-col items-center shadow-sm active:scale-95 transition-all">
          <div class="w-12 h-12 rounded-2xl bg-purple-50 text-primary flex items-center justify-center mb-1">
            <span class="material-symbols-outlined text-3xl">groups</span>
          </div>
          <span class="text-[11px] font-black uppercase text-slate-800">Clientes</span>
        </button>
    </div>

    <!-- DESPACHOS -->
    <section class="bg-white p-6 rounded-[2.5rem] border border-outline shadow-sm">
        <h3 class="text-[10px] font-black text-amber-600 mb-4 uppercase tracking-[0.1em] flex items-center justify-between italic">
            <span class="flex items-center gap-2"><span class="material-symbols-outlined text-sm font-bold">priority_high</span> Prioridad de Despacho</span>
            <span class="text-[8px] text-slate-400">ORDEN: MÁS ANTIGUO PRIMERO</span>
        </h3>
        <div id="lista-pedidos" class="space-y-3"></div>
    </section>

    <!-- RANKING -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <section class="bg-white p-6 rounded-[2.5rem] border border-outline shadow-sm">

            <div id="ranking-productos" class="space-y-2"></div>
        </section>

        <section class="bg-white p-6 rounded-[2.5rem] border border-red-100 shadow-sm">
            <h3 class="text-[10px] font-black text-red-500 mb-4 uppercase tracking-widest italic">Agotándose (Stock 1-5)</h3>
            <div id="cont-criticos" class="grid grid-cols-1 gap-2"></div>
        </section>
    </div>

</main>

<!-- 🔥 SOLO CAMBIÓ LA LÓGICA -->
<script>

const fInput = document.getElementById('filtro-fecha');

const hoy = new Date();

fInput.value = new Date(
    hoy.getTime() - (hoy.getTimezoneOffset() * 60000)
).toISOString().split('T')[0];

function mostrarCargando(show) {
    document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
}

function obtenerArraySeguro(respuesta) {

    if (Array.isArray(respuesta)) return respuesta;

    if (respuesta && respuesta.status === "OK" && Array.isArray(respuesta.data)) {
        return respuesta.data;
    }

    return [];
}

function numero(valor) {

    if (valor === null || valor === undefined || valor === "") return 0;

    return parseFloat(
        String(valor)
        .replace("$", "")
        .replace(",", ".")
        .trim()
    ) || 0;
}

function cumpleFiltro(fechaVenta, periodo, fechaSeleccionada) {

    if (!fechaVenta) return false;

    const fecha = new Date(fechaVenta);

    if (isNaN(fecha.getTime())) return false;

    const hoyLocal = new Date();

    if (periodo === "hoy") {
        return fecha.toDateString() === hoyLocal.toDateString();
    }

    if (periodo === "semana") {

        const lunes = new Date(hoyLocal);

        lunes.setDate(
            hoyLocal.getDate() -
            hoyLocal.getDay() +
            (hoyLocal.getDay() === 0 ? -6 : 1)
        );

        lunes.setHours(0,0,0,0);

        return fecha >= lunes;
    }

    if (periodo === "mes") {

        return (
            fecha.getMonth() === hoyLocal.getMonth() &&
            fecha.getFullYear() === hoyLocal.getFullYear()
        );
    }

    return (
        fecha.toISOString().split('T')[0] === fechaSeleccionada
    );
}

async function cargarDatos() {

    mostrarCargando(true);

    const periodo = document.getElementById('periodo-filtro').value;

    const fechaSeleccionada = fInput.value;

    fInput.classList.toggle(
        'hidden',
        periodo !== 'personalizado'
    );

    try {

        const [
            inventarioRes,
            ventasRes,
            comprasRes
        ] = await Promise.all([

            DairyAPI.obtenerDatos("Inventario"),
            DairyAPI.obtenerDatos("Ventas"),
            DairyAPI.obtenerDatos("Compras")

        ]);

        const inventario = obtenerArraySeguro(inventarioRes);

        const ventas = obtenerArraySeguro(ventasRes);

        const compras = obtenerArraySeguro(comprasRes);

        // =========================
        // INVENTARIO
        // =========================

        let valorBodega = 0;

        let proyeccion = 0;

        const costosMap = {};

        inventario.forEach(item => {

            const costo = numero(item.Precio_Distribuidor);

            const venta = numero(item.Precio_Venta);

            const stock = numero(item.Stock);

            costosMap[item.Producto] = costo;

            valorBodega += (costo * stock);

            proyeccion += ((venta - costo) * stock);

        });

        document.getElementById('valor-invertido').innerText =
            `$${valorBodega.toFixed(2)}`;

        document.getElementById('ganancia-proyectada').innerText =
            `$${proyeccion.toFixed(2)}`;

        // =========================
        // VENTAS
        // =========================

        let totalVentas = 0;

        let utilidad = 0;

        let porCobrar = 0;

        const ranking = {};

        const pedidosPendientes = {};

        ventas.forEach(v => {

            const cantidad = numero(v.Cantidad);

            const total =
                numero(v["Precio Total"]) ||
                numero(v.Total) ||
                (cantidad * numero(v.Precio_PVP));

            const estado =
                String(v.Estado || "")
                .trim()
                .toUpperCase();

            const producto = v.Producto || "SIN PRODUCTO";

            const idVenta = v.ID_Venta || "S/N";

            if (
                cumpleFiltro(
                    v.Fecha,
                    periodo,
                    fechaSeleccionada
                )
            ) {

                totalVentas += total;

                const costoBase = costosMap[producto] || 0;

                utilidad += (
                    total -
                    (costoBase * cantidad)
                );

                ranking[producto] =
                    (ranking[producto] || 0) + cantidad;
            }

            if (estado === "PENDIENTE") {

                porCobrar += total;

                if (!pedidosPendientes[idVenta]) {

                    const fechaPedido = new Date(v.Fecha);

                    const dias =
                        Math.floor(
                            (hoy - fechaPedido)
                            /
                            (1000 * 60 * 60 * 24)
                        );

                    pedidosPendientes[idVenta] = {
                        cliente: v.Cliente || "Consumidor Final",
                        dias,
                        total: 0
                    };
                }

                pedidosPendientes[idVenta].total += total;
            }
        });

        document.getElementById('ventas-total-hoy').innerText =
            `$${totalVentas.toFixed(2)}`;

        document.getElementById('ganancia-real').innerText =
            `$${utilidad.toFixed(2)}`;

        document.getElementById('por-recaudar').innerText =
            `$${porCobrar.toFixed(2)}`;

        document.getElementById('label-dinero').innerText =
            `Ventas ${periodo.toUpperCase()}`;

        // =========================
        // PEDIDOS PENDIENTES
        // =========================

        const listaPedidos =
            document.getElementById('lista-pedidos');

        const pedidosOrdenados =
            Object.entries(pedidosPendientes)
            .sort((a,b) => b[1].dias - a[1].dias);

        listaPedidos.innerHTML =
            pedidosOrdenados.map(([id,p]) => `

            <div class="p-3 bg-white rounded-2xl border ${p.dias > 1 ? 'border-l-4 border-l-red-500 shadow-md' : 'border-slate-100'} flex justify-between items-center">

                <div class="flex flex-col">

                    <span class="text-[10px] font-black uppercase text-slate-700">
                        ${p.cliente}
                    </span>

                    <span class="text-[9px] font-bold ${p.dias > 1 ? 'text-red-600' : 'text-amber-500'} italic">
                        RETRASO: ${p.dias} DÍAS (ID: ${id})
                    </span>

                </div>

                <span class="text-amber-600 font-black italic text-xs">
                    $${p.total.toFixed(2)}
                </span>

            </div>

        `).join('')

        ||

        `<p class="text-center text-slate-300 text-xs italic">
            Sin pendientes
        </p>`;

        const badgeRuta =
            document.getElementById('badge-ruta');

        badgeRuta.innerText = pedidosOrdenados.length;

        badgeRuta.classList.toggle(
            'hidden',
            pedidosOrdenados.length === 0
        );

        // =========================
        // COMPRAS PENDIENTES
        // =========================

        const comprasPendientes =
            compras.filter(c =>
                String(c.Estado_Entrega || "")
                .trim()
                .toUpperCase() === "PENDIENTE"
            );

        const badgeRecepcion =
            document.getElementById('badge-recepcion');

        const btnRecepcion =
            document.getElementById('btn-recepcion');

        if (comprasPendientes.length > 0) {

            const ids =
                [...new Set(
                    comprasPendientes.map(c => c.ID_Compra)
                )];

            badgeRecepcion.innerText = ids.length;

            badgeRecepcion.classList.remove('hidden');

            btnRecepcion.classList.add('pulse-notif');

        } else {

            badgeRecepcion.classList.add('hidden');

            btnRecepcion.classList.remove('pulse-notif');
        }

        // =========================
        // TOP PRODUCTOS
        // =========================

        const rankingDiv =
            document.getElementById('ranking-productos');

        rankingDiv.innerHTML =

            Object.entries(ranking)

            .sort((a,b) => b[1] - a[1])

            .slice(0,4)

            .map(([nombre,cantidad],i) => `

                <div class="flex justify-between p-2 bg-purple-50 rounded-xl text-[10px] font-bold">

                    <span>
                        ${i + 1}. ${nombre}
                    </span>

                    <span class="text-primary">
                        ${cantidad} ud.
                    </span>

                </div>

            `).join('')

            ||

            `<p class="text-center text-slate-300 text-[9px]">
                Sin datos
            </p>`;

        // =========================
        // STOCK CRÍTICO
        // =========================

        const criticos =
            inventario.filter(p => {

                const stock = numero(p.Stock);

                return stock > 0 && stock <= 5;

            });

        const contCriticos =
            document.getElementById('cont-criticos');

        contCriticos.innerHTML =

            criticos.map(p => `

                <div class="flex justify-between p-2 bg-red-50 rounded-xl border border-red-100 text-[10px]">

                    <span class="font-black uppercase text-red-900">
                        ${p.Producto}
                    </span>

                    <span class="font-black text-red-600 uppercase">
                        ${p.Stock} UD
                    </span>

                </div>

            `).join('')

            ||

            `<p class="text-center text-slate-300 text-[9px] italic">
                Stock estable
            </p>`;

    } catch (error) {

        console.error("ERROR DASHBOARD:", error);

        alert("Error conectando con el servidor.");

    } finally {

        setTimeout(() => {

            mostrarCargando(false);

        }, 500);
    }
}

window.onload = cargarDatos;

</script>

</body>
