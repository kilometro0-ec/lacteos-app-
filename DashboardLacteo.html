<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Lógica Láctea - Dashboard Total</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: "#a21caf", 
            secondary: "#db2777", 
            success: "#16a34a", 
            electric: "#0055ff", 
            background: "#faf5ff", 
            outline: "#e9d5ff" 
          }
        }
      }
    }
const fInput = document.getElementById('filtro-fecha');

const hoy = new Date();
fInput.value = new Date(
    hoy.getTime() - (hoy.getTimezoneOffset() * 60000)
).toISOString().split('T')[0];

function mostrarCargando(show) {
    document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
}

function obtenerArraySeguro(respuesta) {
    if (Array.isArray(respuesta)) return respuesta;
    if (respuesta && respuesta.status === "OK" && Array.isArray(respuesta.data)) return respuesta.data;
    return [];
}

function numero(valor) {
    if (valor === null || valor === undefined || valor === "") return 0;
    return parseFloat(
        String(valor)
            .replace("$", "")
            .replace(",", ".")
            .trim()
    ) || 0;
}

/* FIX FECHA ROBUSTO */
function parseFecha(f) {
    if (!f) return null;
    const d = new Date(f);
    return isNaN(d.getTime()) ? null : d;
}

function cumpleFiltro(fechaVenta, periodo, fechaSeleccionada) {
    const fecha = parseFecha(fechaVenta);
    if (!fecha) return false;

    const hoyLocal = new Date();

    if (periodo === "hoy") {
        return fecha.toDateString() === hoyLocal.toDateString();
    }

    if (periodo === "semana") {
        const lunes = new Date(hoyLocal);
        lunes.setDate(hoyLocal.getDate() - hoyLocal.getDay() + (hoyLocal.getDay() === 0 ? -6 : 1));
        lunes.setHours(0, 0, 0, 0);
        return fecha >= lunes;
    }

    if (periodo === "mes") {
        return (
            fecha.getMonth() === hoyLocal.getMonth() &&
            fecha.getFullYear() === hoyLocal.getFullYear()
        );
    }

    return fecha.toISOString().split('T')[0] === fechaSeleccionada;
}

async function cargarDatos() {

    mostrarCargando(true);

    const periodo = document.getElementById('periodo-filtro').value;
    const fechaSeleccionada = fInput.value;

    fInput.classList.toggle('hidden', periodo !== 'personalizado');

    try {

        const [inventarioRes, ventasRes, comprasRes] = await Promise.all([
            DairyAPI.obtenerDatos("Inventario"),
            DairyAPI.obtenerDatos("Ventas"),
            DairyAPI.obtenerDatos("Compras")
        ]);

        const inventario = obtenerArraySeguro(inventarioRes);
        const ventas = obtenerArraySeguro(ventasRes);
        const compras = obtenerArraySeguro(comprasRes);

        // ================= INVENTARIO =================
        let valorBodega = 0;
        let proyeccion = 0;
        const costosMap = {};

        inventario.forEach(item => {
            const costo = numero(item.Precio_Distribuidor);
            const venta = numero(item.Precio_Venta);
            const stock = numero(item.Stock);

            costosMap[item.Producto] = costo;

            valorBodega += costo * stock;
            proyeccion += (venta - costo) * stock;
        });

        document.getElementById('valor-invertido').innerText = `$${valorBodega.toFixed(2)}`;
        document.getElementById('ganancia-proyectada').innerText = `$${proyeccion.toFixed(2)}`;

        // ================= VENTAS =================
        let totalVentas = 0;
        let utilidad = 0;
        let porCobrar = 0;

        const ranking = {};
        const pedidosPendientes = {};

        ventas.forEach(v => {

            const cantidad = numero(v.Cantidad);
            const total = numero(v.Total) || (cantidad * numero(v.Precio_PVP));

            const estado = String(v.Estado || "").trim().toUpperCase();
            const producto = v.Producto || "SIN PRODUCTO";
            const idVenta = v.ID_Venta || "S/N";

            if (cumpleFiltro(v.Fecha, periodo, fechaSeleccionada)) {

                totalVentas += total;

                const costoBase = costosMap[producto] || 0;
                utilidad += total - (costoBase * cantidad);

                ranking[producto] = (ranking[producto] || 0) + cantidad;
            }

            if (estado === "PENDIENTE") {

                porCobrar += total;

                const fechaPedido = parseFecha(v.Fecha);

                const dias = fechaPedido
                    ? Math.floor((hoy - fechaPedido) / (1000 * 60 * 60 * 24))
                    : 0;

                if (!pedidosPendientes[idVenta]) {
                    pedidosPendientes[idVenta] = {
                        cliente: v.Cliente || "Consumidor Final",
                        dias,
                        total: 0
                    };
                }

                pedidosPendientes[idVenta].total += total;
            }
        });

        document.getElementById('ventas-total-hoy').innerText = `$${totalVentas.toFixed(2)}`;
        document.getElementById('ganancia-real').innerText = `$${utilidad.toFixed(2)}`;
        document.getElementById('por-recaudar').innerText = `$${porCobrar.toFixed(2)}`;
        document.getElementById('label-dinero').innerText = `Ventas ${periodo.toUpperCase()}`;

        // ================= PEDIDOS =================
        const listaPedidos = document.getElementById('lista-pedidos');

        const pedidosOrdenados = Object.entries(pedidosPendientes)
            .sort((a, b) => b[1].dias - a[1].dias);

        listaPedidos.innerHTML = pedidosOrdenados.length
            ? pedidosOrdenados.map(([id, p]) => `
                <div class="p-3 bg-white rounded-2xl border flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black uppercase">${p.cliente}</span>
                        <span class="text-[9px] text-red-600 italic">
                            RETRASO: ${p.dias} DÍAS (ID: ${id})
                        </span>
                    </div>
                    <span class="text-amber-600 font-black">$${p.total.toFixed(2)}</span>
                </div>
            `).join("")
            : `<p class="text-center text-slate-300 text-xs italic">Sin pendientes</p>`;

        // badge ruta
        const badgeRuta = document.getElementById('badge-ruta');
        badgeRuta.innerText = pedidosOrdenados.length;
        badgeRuta.classList.toggle('hidden', pedidosOrdenados.length === 0);

        // ================= COMPRAS =================
        const comprasPendientes = compras.filter(c =>
            String(c.Estado_Entrega || "").trim().toUpperCase() === "PENDIENTE"
        );

        const badgeRecepcion = document.getElementById('badge-recepcion');
        const btnRecepcion = document.getElementById('btn-recepcion');

        if (comprasPendientes.length > 0) {
            const ids = [...new Set(comprasPendientes.map(c => c.ID_Compra))];
            badgeRecepcion.innerText = ids.length;
            badgeRecepcion.classList.remove('hidden');
            btnRecepcion.classList.add('pulse-notif');
        } else {
            badgeRecepcion.classList.add('hidden');
            btnRecepcion.classList.remove('pulse-notif');
        }

        // ================= TOP =================
        const rankingDiv = document.getElementById('ranking-productos');

        rankingDiv.innerHTML = Object.entries(ranking)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 4)
            .map(([n, c], i) => `
                <div class="flex justify-between p-2 bg-purple-50 rounded-xl text-[10px] font-bold">
                    <span>${i + 1}. ${n}</span>
                    <span class="text-primary">${c} ud.</span>
                </div>
            `).join("") || `<p class="text-center text-slate-300 text-[9px]">Sin datos</p>`;

        // ================= STOCK CRÍTICO =================
        const criticos = inventario.filter(p => {
            const stock = numero(p.Stock);
            return stock > 0 && stock <= 5;
        });

        const contCriticos = document.getElementById('cont-criticos');

        contCriticos.innerHTML = criticos.length
            ? criticos.map(p => `
                <div class="flex justify-between p-2 bg-red-50 rounded-xl text-[10px]">
                    <span>${p.Producto}</span>
                    <span class="text-red-600 font-black">${p.Stock} UD</span>
                </div>
            `).join("")
            : `<p class="text-center text-slate-300 text-[9px]">Stock estable</p>`;

    } catch (error) {
        console.error(error);
        alert("Error conectando con el servidor.");
    } finally {
        setTimeout(() => mostrarCargando(false), 400);
    }
}

window.onload = cargarDatos;
        
</body>
</html>
