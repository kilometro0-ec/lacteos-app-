<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Lógica Láctea | Gestión de Clientes</title>

    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: "#a21caf", 
                secondary: "#db2777",
                surface: "#ffffff",
                background: "#fdfaff"
              }
            }
          }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #fdfaff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
        .fade-in { animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(162, 28, 175, 0.1); }
        .card-premium { transition: all 0.3s ease; border: 1px solid rgba(162, 28, 175, 0.05); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 10, 25, 0.4); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-content { animation: modalSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); max-height: 90vh; overflow-y: auto; }
        @keyframes modalSlide { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        
        #overlay-loading {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 200;
            backdrop-filter: blur(8px);
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #a21caf; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="text-slate-800 pb-32">

<div id="overlay-loading">
    <div class="bg-white rounded-3xl p-8 text-center">
        <div class="spinner mx-auto mb-4"></div>
        <p class="font-bold text-slate-800">Procesando...</p>
    </div>
</div>

<!-- CABECERA -->
<header class="fixed top-0 w-full h-20 glass-header flex justify-between items-center px-6 z-50">
    <div class="flex items-center gap-4" onclick="window.location.href='DashboardLacteo.html'" style="cursor:pointer">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-primary to-fuchsia-400 flex items-center justify-center text-white shadow-lg">
            <span class="material-symbols-outlined text-2xl">workspace_premium</span>
        </div>
        <div>
            <h1 class="text-lg font-extrabold tracking-tight text-slate-900 leading-none uppercase">Ranking</h1>
            <p class="text-[10px] font-bold text-primary tracking-widest uppercase opacity-60">Clientes</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <button onclick="abrirModalNuevo()" class="w-10 h-10 rounded-xl bg-primary text-white flex items-center justify-center shadow-lg active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-xl">person_add</span>
        </button>
        <input type="text" id="buscador" oninput="filtrarClientes()" placeholder="Buscar..." 
            class="w-24 focus:w-40 transition-all duration-300 bg-fuchsia-50/50 border-none rounded-xl px-4 py-2 text-xs font-semibold outline-none focus:ring-2 focus:ring-primary/20">
    </div>
</header>

<main class="pt-28 px-6 max-w-2xl mx-auto space-y-8">
    <!-- DASHBOARD DE ESTADÍSTICAS -->
    <section class="grid grid-cols-2 gap-4 fade-in">
        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-fuchsia-50">
            <p class="text-[10px] uppercase font-black tracking-widest text-slate-400">Total Clientes</p>
            <h2 id="total-clientes" class="text-3xl font-extrabold text-slate-900">0</h2>
        </div>
        <div class="bg-gradient-to-br from-primary to-fuchsia-600 p-6 rounded-[2.5rem] shadow-xl text-white">
            <p class="text-[10px] uppercase font-black tracking-widest opacity-80">Recaudación</p>
            <h2 id="total-dinero" class="text-2xl font-extrabold">$0.00</h2>
        </div>
    </section>

    <!-- LISTADO DE CLIENTES -->
    <section id="lista-clientes" class="space-y-4 fade-in">
        <div class="text-center py-10 text-slate-400 font-bold animate-pulse">Sincronizando base de datos...</div>
    </section>
</main>

<!-- MODAL FORMULARIO CLIENTE -->
<div id="modal-cliente" class="modal" onclick="event.target === this && cerrarModal()">
    <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl modal-content relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-secondary"></div>
        
        <div class="flex justify-between items-start mb-6">
            <div>
                <h2 id="modal-titulo" class="text-2xl font-black text-slate-900">Nuevo Cliente</h2>
                <p class="text-xs font-bold text-primary uppercase">Datos Obligatorios</p>
            </div>
            <button onclick="cerrarModal()" class="w-10 h-10 rounded-2xl bg-slate-50 text-slate-400 flex items-center justify-center">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <form id="form-cliente" class="space-y-4">
            <input type="hidden" id="edit-id-original">
            <input type="hidden" id="edit-nombre-original">

            <!-- Nombre -->
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Nombre Completo</label>
                <input type="text" id="c-nombre" required class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary">
            </div>

            <!-- CI y Teléfono -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">CI / RUC (10-13)</label>
                    <input type="text" id="c-ruc" required minlength="10" maxlength="13" pattern="\d*" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Teléfono (09...)</label>
                    <input type="tel" id="c-tel" required pattern="09\d{8}" maxlength="10" placeholder="0984016027" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <!-- Dirección -->
            <div class="space-y-1">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Dirección Principal</label>
                <input type="text" id="c-dir" required class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary">
            </div>

            <!-- Sector y Referencia -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Sector</label>
                    <select id="c-sector" required class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary appearance-none">
                        <option value="">ELEGIR...</option>
                        <option value="NORTE">NORTE</option>
                        <option value="SUR">SUR</option>
                        <option value="CENTRO">CENTRO</option>
                        <option value="VALLES">VALLES</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Referencia</label>
                    <input type="text" id="c-ref" class="w-full bg-slate-50 border-none rounded-2xl p-4 text-sm font-bold focus:ring-2 focus:ring-primary">
                </div>
            </div>

            <!-- Botones -->
            <div class="pt-4 space-y-3">
                <button type="submit" id="btn-guardar" class="w-full py-5 rounded-[2rem] bg-slate-900 text-white font-black text-xs uppercase tracking-widest shadow-xl active:scale-95 transition-all">
                    Guardar Cliente
                </button>
                <button type="button" id="btn-eliminar" onclick="confirmarEliminar()" class="hidden w-full py-3 text-red-500 font-bold text-[10px] uppercase border border-red-50 rounded-2xl bg-red-50/50">
                    Eliminar permanentemente
                </button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL HISTORIAL -->
<div id="modal-historial" class="modal" onclick="event.target === this && cerrarHistorial()">
    <div class="bg-white w-full max-w-md rounded-[3rem] p-8 shadow-2xl modal-content">
        <div class="flex justify-between items-center mb-6">
            <h2 id="hist-nombre" class="text-xl font-black text-slate-900 uppercase">Ventas</h2>
            <button onclick="cerrarHistorial()" class="text-slate-400"><span class="material-symbols-outlined">close</span></button>
        </div>
        <div id="hist-lista" class="max-h-[50vh] overflow-y-auto space-y-3 pr-2"></div>
    </div>
</div>

<div id="menu-container"></div>

<script>
let clientesData = [];
let ventasData = [];
let esEdicion = false;

function mostrarLoading(mostrar) {
    document.getElementById('overlay-loading').style.display = mostrar ? 'flex' : 'none';
}

// 1. CARGA DE DATOS DESDE API
async function cargarDatos() {
    mostrarLoading(true);
    try {
        const [clientes, ventas] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Ventas")
        ]);

        ventasData = Array.isArray(ventas) ? ventas : [];
        const statsVentas = {};
        let factGlobal = 0;

        // Procesar TODAS las ventas (no solo ENTREGADAS)
        ventasData.forEach(v => {
            const cliente = String(v.Cliente || "").trim();
            if (!cliente || cliente === "CONSUMO_INTERNO") return;
            
            // Buscar el total - puede estar en "Total" o "G" dependiendo del header
            const total = parseFloat(v.Total || v.G || 0);
            
            if (!statsVentas[cliente]) {
                statsVentas[cliente] = { total: 0, cantidad: 0, pedidos: [] };
            }
            statsVentas[cliente].total += total;
            statsVentas[cliente].cantidad += 1;
            statsVentas[cliente].pedidos.push({
                fecha: v.Fecha || v.B || "Fecha no disponible",
                producto: v.Producto || v.D || "Producto",
                total: total,
                estado: v.Estado || v.H || "PENDIENTE"
            });
            factGlobal += total;
        });

        // Unificar con Clientes
        clientesData = (Array.isArray(clientes) ? clientes : []).map(c => {
            const nombre = String(c.Nombre || "").trim();
            const s = statsVentas[nombre] || { total: 0, cantidad: 0, pedidos: [] };
            return { 
                ...c, 
                montoTotal: s.total, 
                numVentas: s.cantidad, 
                pedidos: s.pedidos.sort((a,b) => new Date(b.fecha) - new Date(a.fecha))
            };
        });

        clientesData.sort((a, b) => b.montoTotal - a.montoTotal);
        renderizar(clientesData);
        
        document.getElementById('total-clientes').innerText = clientesData.length;
        document.getElementById('total-dinero').innerText = `$${factGlobal.toFixed(2)}`;
    } catch (e) {
        console.error("Error crítico:", e);
        document.getElementById('lista-clientes').innerHTML = `<div class="text-center py-10 text-red-500 font-bold">❌ Error al conectar: ${e.message}</div>`;
    }
    mostrarLoading(false);
}

// 2. RENDERIZADO DE TARJETAS
function renderizar(lista) {
    const container = document.getElementById('lista-clientes');
    if (!lista || lista.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-slate-400 font-bold">📋 No hay clientes registrados</div>`;
        return;
    }

    container.innerHTML = lista.map((c, index) => {
        let colorMedalla = "bg-slate-50 text-slate-400";
        if (index === 0 && c.montoTotal > 0) colorMedalla = "bg-yellow-400 text-white shadow-lg";
        if (index === 1 && c.montoTotal > 0) colorMedalla = "bg-slate-300 text-white shadow-md";
        if (index === 2 && c.montoTotal > 0) colorMedalla = "bg-orange-300 text-white shadow-md";

        // Tratamiento de teléfono para WhatsApp
        const telRaw = String(c.Teléfono || c["Teléfono"] || "").trim();
        const telLimpio = telRaw.replace(/\D/g, '');
        let telWhatsApp = telLimpio;
        if (telLimpio.startsWith('0') && telLimpio.length === 10) {
            telWhatsApp = '593' + telLimpio.substring(1);
        } else if (telLimpio.length === 9) {
            telWhatsApp = '593' + telLimpio;
        }

        return `
            <div class="bg-white p-5 rounded-[2.5rem] card-premium flex flex-col gap-4 shadow-sm border border-fuchsia-50">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 rounded-[1.5rem] ${colorMedalla} flex items-center justify-center shrink-0">
                        <span class="font-black text-xl">${index + 1}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-start gap-2">
                            <h3 class="font-extrabold text-slate-900 truncate uppercase text-sm flex-1" title="${c.Nombre}">${c.Nombre || 'Sin Nombre'}</h3>
                            <span class="text-[9px] font-black bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md shrink-0">${c.Sector || 'SUR'}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-xl font-black text-secondary">$${(c.montoTotal || 0).toFixed(2)}</span>
                            <span class="text-[9px] font-black bg-fuchsia-50 text-primary px-2 py-0.5 rounded-full uppercase">${c.numVentas || 0} Ventas</span>
                        </div>
                        <div class="text-[8px] text-slate-400 mt-1 truncate">
                            📍 ${c.Dirección || 'Sin dirección'}
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-4 gap-2">
                    <button onclick="abrirHistorial('${String(c.Nombre).replace(/'/g, "\\'")}')" class="flex flex-col items-center justify-center py-2 rounded-2xl bg-fuchsia-50 text-primary active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-lg">history</span>
                        <span class="text-[8px] font-bold uppercase">Ventas</span>
                    </button>
                    ${telLimpio ? `
                        <a href="https://wa.me/${telWhatsApp}" target="_blank" class="flex flex-col items-center justify-center py-2 rounded-2xl bg-green-50 text-green-600 active:scale-95 transition-all">
                            <span class="material-symbols-outlined text-lg">chat</span>
                            <span class="text-[8px] font-bold uppercase">WhatsApp</span>
                        </a>
                        <a href="tel:${telLimpio}" class="flex flex-col items-center justify-center py-2 rounded-2xl bg-blue-50 text-blue-600 active:scale-95 transition-all">
                            <span class="material-symbols-outlined text-lg">call</span>
                            <span class="text-[8px] font-bold uppercase">Llamar</span>
                        </a>
                    ` : `
                        <div class="opacity-30 flex flex-col items-center justify-center py-2 bg-slate-50 rounded-2xl">
                            <span class="material-symbols-outlined text-lg text-slate-400">block</span>
                        </div>
                        <div class="opacity-30 flex flex-col items-center justify-center py-2 bg-slate-50 rounded-2xl">
                            <span class="material-symbols-outlined text-lg text-slate-400">block</span>
                        </div>
                    `}
                    <button onclick="abrirModalEditar('${String(c.Nombre).replace(/'/g, "\\'")}')" class="flex flex-col items-center justify-center py-2 rounded-2xl bg-slate-50 text-slate-500 active:scale-95 transition-all">
                        <span class="material-symbols-outlined text-lg">edit</span>
                        <span class="text-[8px] font-bold uppercase">Perfil</span>
                    </button>
                </div>
            </div>`;
    }).join('');
}

// 3. LÓGICA DE MODALES
function abrirModalNuevo() {
    esEdicion = false;
    document.getElementById('form-cliente').reset();
    document.getElementById('modal-titulo').innerText = "Nuevo Cliente";
    document.getElementById('btn-eliminar').classList.add('hidden');
    document.getElementById('modal-cliente').classList.add('active');
}

function abrirModalEditar(nombre) {
    const c = clientesData.find(cli => cli.Nombre === nombre);
    if(!c) return;
    esEdicion = true;
    document.getElementById('modal-titulo').innerText = "Editar Perfil";
    document.getElementById('edit-id-original').value = c.ID || "";
    document.getElementById('edit-nombre-original').value = c.Nombre || "";
    document.getElementById('c-id').value = c.ID || "";
    document.getElementById('c-nombre').value = c.Nombre || "";
    document.getElementById('c-ruc').value = c.CI_RUC || "";
    document.getElementById('c-tel').value = c.Teléfono || "";
    document.getElementById('c-dir').value = c.Dirección || "";
    document.getElementById('c-sector').value = c.Sector || "";
    document.getElementById('c-ref').value = c.Referencia || "";
    document.getElementById('btn-eliminar').classList.remove('hidden');
    document.getElementById('modal-cliente').classList.add('active');
}

function cerrarModal() { 
    document.getElementById('modal-cliente').classList.remove('active');
    document.getElementById('form-cliente').reset();
}

// 4. GUARDAR / ACTUALIZAR
document.getElementById('form-cliente').onsubmit = async (e) => {
    e.preventDefault();
    
    const ruc = document.getElementById('c-ruc').value.trim();
    const tel = document.getElementById('c-tel').value.trim();
    const sector = document.getElementById('c-sector').value;

    if(ruc.length < 10) return alert("❌ El CI/RUC debe tener al menos 10 dígitos");
    if(!tel.match(/^09\d{8}$/)) return alert("❌ Teléfono inválido. Debe ser 09XXXXXXXX");
    if(!sector) return alert("❌ Por favor, seleccione un sector");

    const btn = document.getElementById('btn-guardar');
    btn.disabled = true;
    btn.innerText = "Sincronizando...";
    mostrarLoading(true);

    const ahora = new Date();
    const fechaHora = ahora.toLocaleDateString() + " " + ahora.toLocaleTimeString();

    const datos = {
        pestaña: "Clientes",
        ID: esEdicion ? document.getElementById('c-id').value : `C-${Date.now().toString().slice(-6)}`,
        Nombre: document.getElementById('c-nombre').value.trim().toUpperCase(),
        CI_RUC: ruc,
        Teléfono: tel,
        Dirección: document.getElementById('c-dir').value.trim(),
        Referencia: document.getElementById('c-ref').value.trim(),
        Sector: sector,
        "Fecha Registro": esEdicion ? "" : fechaHora
    };

    try {
        await DairyAPI.enviarDatos(datos);
        alert("✅ Cliente guardado correctamente");
        cerrarModal();
        await cargarDatos();
    } catch (err) {
        alert("❌ Error de conexión: " + err.message);
    } finally {
        btn.disabled = false;
        btn.innerText = "Guardar Cliente";
        mostrarLoading(false);
    }
};

// 5. ELIMINAR CLIENTE
async function confirmarEliminar() {
    const nombre = document.getElementById('edit-nombre-original').value;
    if(!confirm(`⚠️ ¿Desea eliminar definitivamente a ${nombre}?\n\nEsta acción no se puede deshacer.`)) return;
    
    mostrarLoading(true);
    try {
        await DairyAPI.eliminarDato("Clientes", document.getElementById('c-id').value);
        alert("✅ Cliente eliminado");
        cerrarModal();
        await cargarDatos();
    } catch (e) { 
        alert("❌ Error al eliminar: " + e.message);
    }
    mostrarLoading(false);
}

// 6. HISTORIAL DE VENTAS
function abrirHistorial(nombre) {
    const c = clientesData.find(cli => cli.Nombre === nombre);
    if(!c) return;
    
    document.getElementById('hist-nombre').innerHTML = `${c.Nombre} <span class="text-[10px] text-primary ml-2">$${(c.montoTotal || 0).toFixed(2)}</span>`;
    
    if (!c.pedidos || c.pedidos.length === 0) {
        document.getElementById('hist-lista').innerHTML = `<div class="text-center py-8 text-slate-400 bg-slate-50 rounded-3xl">
            📭 No hay ventas registradas para este cliente
        </div>`;
    } else {
        document.getElementById('hist-lista').innerHTML = c.pedidos.map(p => `
            <div class="bg-slate-50 p-4 rounded-2xl border-l-4 ${p.estado === 'INTERNO' ? 'border-l-amber-500' : 'border-l-primary'}">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-black text-slate-400 uppercase">${new Date(p.fecha).toLocaleDateString() || p.fecha}</p>
                        <p class="text-[12px] font-black text-slate-800 uppercase mt-1">${p.producto}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-black text-primary">$${p.total.toFixed(2)}</p>
                        <span class="text-[8px] font-bold ${p.estado === 'INTERNO' ? 'text-amber-600' : 'text-green-600'}">${p.estado}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }
    document.getElementById('modal-historial').classList.add('active');
}

function cerrarHistorial() { 
    document.getElementById('modal-historial').classList.remove('active');
}

// 7. FILTRO DE CLIENTES
function filtrarClientes() {
    const q = document.getElementById('buscador').value.toLowerCase().trim();
    if (!q) {
        renderizar(clientesData);
    } else {
        const filtrados = clientesData.filter(c => 
            String(c.Nombre).toLowerCase().includes(q) ||
            String(c.CI_RUC).toLowerCase().includes(q) ||
            String(c.Sector).toLowerCase().includes(q)
        );
        renderizar(filtrados);
    }
}

// 8. INICIALIZACIÓN
window.onload = cargarDatos;
</script>

</body>
</html>
