<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ranking Clientes | Lógica Láctea</title>

    <!-- Librerías (Mismas que tu inventario) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="stylesheet" href="estilos-lacteos.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <style>
      body { 
        background-color: var(--surface); 
        padding-bottom: 110px; 
        -webkit-user-select: none; 
        user-select: none;
      }
      
      /* ID CARDS SUPERIORES - COPIA EXACTA */
      .id-card-top {
        background: white; border-radius: 1.2rem; padding: 12px 5px;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        border: 1px solid var(--outline); box-shadow: var(--shadow-sm);
        transition: all 0.3s ease;
      }
      .id-card-top .label { font-size: 9px; font-weight: 800; text-transform: uppercase; color: var(--primary); margin-bottom: 2px; }
      .id-card-top .value { font-size: 15px; font-weight: 900; color: #1f012a; }

      /* PRODUCT CARDS (Adaptadas a Clientes) - COPIA EXACTA */
      .card-prod { 
        background: white; border-radius: 1.5rem; border: 1px solid var(--outline); 
        padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
        min-height: 145px; position: relative; transition: all 0.2s;
        cursor: pointer; box-shadow: var(--shadow-sm);
      }
      .card-prod:active { transform: scale(0.98); }
      
      .prod-title { 
        font-size: 11px; font-weight: 800; color: #1f012a; 
        line-height: 1.2; text-transform: uppercase; 
        overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; 
      }

      /* MODALES - COPIA EXACTA */
      .modal-custom { 
        display: none; position: fixed; inset: 0; 
        background: rgba(31, 1, 42, 0.7); z-index: 1000; 
        align-items: center; justify-content: center; 
        padding: 20px; backdrop-filter: blur(8px); 
      }
      .modal-custom.active { display: flex; }
    </style>
</head>
<body>

<!-- HEADER (Estructura idéntica a Inventario) -->
<header class="fixed top-0 w-full h-16 bg-white/80 backdrop-blur-md border-b border-purple-100 flex justify-between items-center px-4 z-50">
    <div class="flex flex-col">
        <h1 id="header-title" class="brand-logo text-xl leading-none">RANKING</h1>
        <span id="sync-indicator" class="text-[9px] font-black text-orange-500">SINCRONIZANDO...</span>
    </div>
    <div class="flex gap-3">
        <button onclick="window.location.reload()" class="text-slate-300 active:rotate-180 transition-transform">
            <span class="material-symbols-outlined text-3xl">sync</span>
        </button>
    </div>
</header>

<main class="pt-20 px-4">
    <!-- INDICADORES SUPERIORES (Estructura idéntica a Inventario) -->
    <section id="stats-header" class="grid grid-cols-3 gap-2 mb-6">
        <div class="id-card-top">
            <span class="label">Clientes</span>
            <span id="total-clientes" class="value">0</span>
        </div>
        <div class="id-card-top border-green-100">
            <span class="label text-green-500">Recaudado</span>
            <span id="total-dinero" class="value text-green-700">$0</span>
        </div>
        <div class="id-card-top">
            <span class="label">Top</span>
            <span id="top-nombre" class="value text-[10px] truncate w-full text-center px-1">---</span>
        </div>
    </section>

    <!-- BUSCADOR -->
    <div class="relative mb-6">
        <span class="material-symbols-outlined absolute left-4 top-3.5 text-primary">search</span>
        <input type="text" id="filtro" oninput="filtrar()" placeholder="Buscar cliente..." class="input-sutil pl-12 bg-white">
    </div>

    <!-- GRID DE PRODUCTOS (Ahora Clientes) -->
    <div id="grid-productos" class="grid grid-cols-2 gap-3 mb-24"></div>
</main>

<!-- BOTÓN AGREGAR -->
<button onclick="abrirModal('modal-nuevo-prod')" class="fixed bottom-24 right-6 w-14 h-14 bg-magenta text-white rounded-full shadow-2xl flex items-center justify-center z-[60] active:scale-90 transition-transform" style="background: var(--primary);">
    <span class="material-symbols-outlined text-3xl">person_add</span>
</button>

<div id="menu-container"></div>

<!-- MODAL: GESTIÓN / EDICIÓN (Misma estructura modal-custom) -->
<div id="modal-nuevo-prod" class="modal-custom">
    <div class="bg-white w-full max-w-xs rounded-[2.5rem] p-6 space-y-3 shadow-2xl">
        <h2 id="modal-titulo" class="text-center font-black text-primary uppercase mb-2">Cliente</h2>
        <input type="hidden" id="edit-nombre-original">
        <input type="hidden" id="c-id">
        <input type="text" id="c-nombre" placeholder="NOMBRE COMPLETO" class="input-sutil uppercase text-sm">
        <div class="grid grid-cols-2 gap-2">
            <input type="text" id="c-ruc" placeholder="CI / RUC" class="input-sutil text-sm">
            <input type="tel" id="c-tel" placeholder="TELÉFONO" class="input-sutil text-sm">
        </div>
        <input type="text" id="c-dir" placeholder="DIRECCIÓN" class="input-sutil text-sm">
        <div class="grid grid-cols-2 gap-2">
            <select id="c-sector" class="input-sutil text-sm">
                <option value="SUR">SUR</option>
                <option value="NORTE">NORTE</option>
                <option value="CENTRO">CENTRO</option>
                <option value="VALLES">VALLES</option>
            </select>
            <input type="text" id="c-ref" placeholder="REFERENCIA" class="input-sutil text-sm">
        </div>
        <button onclick="guardarCliente()" class="btn-magenta mt-4" style="background: #059669;">GUARDAR DATOS</button>
        <button id="btn-eliminar" onclick="confirmarEliminar()" class="hidden w-full text-[10px] font-black text-red-400 text-center mt-2 uppercase">Eliminar Cliente</button>
        <button onclick="cerrarModal('modal-nuevo-prod')" class="w-full text-label text-slate-400 text-center mt-2">Cerrar</button>
    </div>
</div>

<script>
let clientesData = [];

async function cargarDatos() {
    try {
        const [clientes, ventas] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Ventas")
        ]);

        const sync = document.getElementById('sync-indicator');
        sync.innerText = "CONECTADO ✓";
        sync.className = "text-[9px] font-black text-green-500";

        const statsVentas = {};
        let factGlobal = 0;

        if (Array.isArray(ventas)) {
            ventas.forEach(v => {
                if (String(v.Estado || v.Estado_Entrega || "").trim().toUpperCase() === "ENTREGADO") {
                    const key = String(v.Cliente).trim().toLowerCase();
                    const monto = parseFloat(String(v["Precio Total"]).replace(',', '.')) || 0;
                    if (!statsVentas[key]) statsVentas[key] = { t: 0, c: 0 };
                    statsVentas[key].t += monto;
                    statsVentas[key].c += 1;
                    factGlobal += monto;
                }
            });
        }

        clientesData = (Array.isArray(clientes) ? clientes : []).map(c => {
            const s = statsVentas[String(c.Nombre).trim().toLowerCase()] || { t: 0, c: 0 };
            return { ...c, montoTotal: s.t, numVentas: s.c };
        });

        clientesData.sort((a, b) => b.montoTotal - a.montoTotal);
        renderizar(clientesData);
        
        document.getElementById('total-clientes').innerText = clientesData.length;
        document.getElementById('total-dinero').innerText = `$${Math.round(factGlobal)}`;
        if(clientesData[0]) document.getElementById('top-nombre').innerText = clientesData[0].Nombre;
    } catch (e) { console.error(e); }
}

function renderizar(lista) {
    const container = document.getElementById('grid-productos');
    container.innerHTML = "";

    lista.forEach((c, index) => {
        const card = document.createElement('div');
        card.className = `card-prod`;
        
        // El diseño interno mantiene la jerarquía de las tarjetas de inventario
        card.innerHTML = `
            <div class="flex justify-between items-start mb-1">
                <span class="text-[8px] font-black text-slate-300 italic">RANK: ${index + 1}</span>
                <span class="text-[8px] font-black text-primary bg-purple-50 px-1.5 rounded-full uppercase">${c.Sector || 'SUR'}</span>
            </div>
            <h3 class="prod-title">${c.Nombre || 'SIN NOMBRE'}</h3>
            <div class="flex justify-between items-end mt-auto pt-2">
                <span class="font-black text-xl text-primary">$${Math.round(c.montoTotal)}</span>
                <span class="font-black text-green-600 text-[10px] uppercase">${c.numVentas} Vtas</span>
            </div>
        `;

        card.onclick = () => abrirEditar(c);
        container.appendChild(card);
    });
}

function abrirModal(id) { 
    document.getElementById('modal-titulo').innerText = "NUEVO CLIENTE";
    document.getElementById('btn-eliminar').classList.add('hidden');
    document.getElementById(id).classList.add('active'); 
}

function abrirEditar(c) {
    document.getElementById('modal-titulo').innerText = "EDITAR CLIENTE";
    document.getElementById('edit-nombre-original').value = c.Nombre;
    document.getElementById('c-id').value = c.ID || "";
    document.getElementById('c-nombre').value = c.Nombre;
    document.getElementById('c-ruc').value = c.CI_RUC || "";
    document.getElementById('c-tel').value = c.Teléfono || "";
    document.getElementById('c-dir').value = c.Dirección || "";
    document.getElementById('c-sector').value = c.Sector || "";
    document.getElementById('c-ref').value = c.Referencia || "";
    document.getElementById('btn-eliminar').classList.remove('hidden');
    document.getElementById('modal-nuevo-prod').classList.add('active');
}

function cerrarModal(id) { document.getElementById(id).classList.remove('active'); }

async function guardarCliente() {
    const nom = document.getElementById('c-nombre').value.toUpperCase();
    if (!nom) return;

    const datos = {
        pestaña: "Clientes",
        ID: document.getElementById('c-id').value || "CL-" + Date.now(),
        Nombre: nom,
        CI_RUC: document.getElementById('c-ruc').value,
        Teléfono: document.getElementById('c-tel').value,
        Dirección: document.getElementById('c-dir').value,
        Referencia: document.getElementById('c-ref').value,
        Sector: document.getElementById('c-sector').value,
        "Fecha Registro": new Date().toLocaleString()
    };

    const original = document.getElementById('edit-nombre-original').value;
    if(original) {
        datos.accion = "editar_cliente";
        datos.nombreOriginal = original;
    }

    await DairyAPI.enviarDatos(datos);
    cerrarModal('modal-nuevo-prod');
    cargarDatos();
}

async function confirmarEliminar() {
    const nombre = document.getElementById('edit-nombre-original').value;
    if(confirm(`¿Eliminar a ${nombre}?`)) {
        await DairyAPI.enviarDatos({ accion: "eliminar_proveedor", pestaña: "Clientes", nombre: nombre });
        cerrarModal('modal-nuevo-prod');
        cargarDatos();
    }
}

function filtrar() { 
    const b = document.getElementById('filtro').value.toLowerCase();
    renderizar(clientesData.filter(c => c.Nombre.toLowerCase().includes(b))); 
}

window.onload = cargarDatos;
</script>

</body>
</html>
