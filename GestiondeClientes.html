<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gestión de Clientes - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="theme-color" content="#4338ca">
    <style>
        .ranking-badge {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            font-weight: 800;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            margin-right: 8px;
        }
        .tabla-ranking th, .tabla-ranking td {
            vertical-align: middle;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <div id="menu-container"></div>

    <header class="bg-indigo-900 text-white shadow-md px-6 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="flex items-center gap-3">
            <i data-lucide="trophy" class="w-8 h-8 text-yellow-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Ranking de Clientes</h1>
                <p class="text-xs text-indigo-200">Ordenados por mayor consumo histórico</p>
            </div>
        </div>
        <button onclick="abrirModalCliente()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all shadow-sm active:scale-95">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Registrar Nuevo Cliente
        </button>
    </header>

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </span>
                <input type="text" id="buscarCliente" oninput="filtrarClientes()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none" placeholder="Buscar por Nombre, CI o RUC...">
            </div>
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-100 px-3 py-2 rounded-lg border border-slate-200">
                Total Clientes: <span id="txtContadorClientes" class="text-indigo-700 font-black text-sm ml-1">0</span>
            </div>
        </div>
    </nav>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6 text-center"># Ranking</th>
                            <th class="py-3 px-6">CI / RUC</th>
                            <th class="py-3 px-4">Nombre / Razón Social</th>
                            <th class="py-3 px-4 text-right">Total Gastado</th>
                            <th class="py-3 px-4">Teléfono</th>
                            <th class="py-3 px-4">Dirección</th>
                            <th class="py-3 px-4">Sector</th>
                            <th class="py-3 px-4">Referencia</th>
                            <th class="py-3 px-4">Fecha Registro</th>
                            <th class="py-3 px-6 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <tr><td colspan="10" class="text-center py-20 text-slate-400"><i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-indigo-600"></i><p>Cargando ranking de clientes...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL CLIENTE (ALTA/EDICIÓN) -->
    <div id="modalCliente" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl overflow-hidden">
            <div class="bg-indigo-950 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2" id="modalTitulo"><i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i> Ficha de Registro</h3>
                <button type="button" onclick="cerrarModalCliente()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="formCliente" onsubmit="guardarCliente(event)" class="p-6 space-y-4">
                <input type="hidden" id="clienteIdOriginal">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">CI / RUC *</label><input type="text" id="ci_ruc" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Nombre / Razón Social *</label><input type="text" id="nombre" required class="w-full border rounded-lg px-3 py-2 text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Teléfono</label><input type="text" id="telefono" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
                    <div><label class="block text-xs font-bold text-slate-500 mb-1">Sector</label><select id="sector" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-50"><option value="">Seleccionar...</option><option>NORTE</option><option>CENTRO</option><option>SUR</option><option>VALLES</option></select></div>
                    <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">Dirección</label><input type="text" id="direccion" class="w-full border rounded-lg px-3 py-2 text-sm"></div>
                    <div class="md:col-span-2"><label class="block text-xs font-bold text-slate-500 mb-1">Referencia de Ubicación</label><input type="text" id="referencia" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Ej: Junto a la tienda, portón verde"></div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="cerrarModalCliente()" class="w-1/2 py-2 border rounded-lg font-bold text-slate-600">Cancelar</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-md">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    
    <script>
        // ========== CONFIGURACIÓN ==========
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzi8lrMuUrMN6Rfm50SjpfpfTKXYbdPNEjy8GiyyjjgGsTKu3GD-Q8CIbXmkRRN8nzHcg/exec"; // 🔁 REEMPLAZAR

        let clientesGlobal = []; // Array de clientes con datos básicos + totalGastado

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarClientes();
        });

        // ========== PETICIONES GET ==========
        async function obtenerClientesConRanking() {
            const res = await fetch(`${SCRIPT_URL}?action=getClientesConRanking`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json.data; // esperado: array de objetos con { id, ci_ruc, nombre, telefono, direccion, sector, referencia, fechaRegistro, totalGastado }
        }

        async function guardarClienteEnSheet(datos) {
            const params = new URLSearchParams({ action: "guardarCliente" });
            for (let [k, v] of Object.entries(datos)) if (v != null) params.append(k, v);
            const res = await fetch(`${SCRIPT_URL}?${params.toString()}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json;
        }

        async function eliminarClienteSheet(id) {
            const res = await fetch(`${SCRIPT_URL}?action=eliminarCliente&id=${encodeURIComponent(id)}`, { cache: "no-store" });
            const json = await res.json();
            if (!json.success) throw new Error(json.error);
            return json;
        }

        // ========== CARGAR Y RENDERIZAR RANKING ==========
        async function cargarClientes() {
            const tbody = document.getElementById("tbodyClientes");
            tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10">Cargando ranking...</td></tr>';
            try {
                const data = await obtenerClientesConRanking();
                if (!Array.isArray(data)) throw new Error("Datos inválidos");
                clientesGlobal = data;
                renderizarClientes(clientesGlobal);
                document.getElementById("txtContadorClientes").innerText = clientesGlobal.length;
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="10" class="text-center py-10 text-rose-500">Error: ${err.message}</td></tr>`;
            }
        }

        function renderizarClientes(lista) {
            const tbody = document.getElementById("tbodyClientes");
            tbody.innerHTML = "";
            if (!lista || lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center py-10 text-slate-400">No hay clientes registrados</td></tr>';
                lucide.createIcons();
                return;
            }
            lista.forEach((c, index) => {
                // Asegurar valores por defecto
                const id = c.id || c.ci_ruc || "";
                const nombre = c.nombre || "";
                const ci_ruc = c.ci_ruc || c.id || "";
                const telefono = c.telefono || "";
                const direccion = c.direccion || "";
                const sector = c.sector || "";
                const referencia = c.referencia || "";
                const fechaRegistro = c.fechaRegistro || "";
                const totalGastado = typeof c.totalGastado === 'number' ? c.totalGastado : 0;
                const puesto = index + 1;
                
                const tr = tbody.insertRow();
                tr.className = "hover:bg-indigo-50/20 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-6 text-center font-black"><div class="ranking-badge mx-auto">${puesto}</div></td>
                    <td class="py-3 px-6 font-mono font-bold text-indigo-900">${escapeHtml(ci_ruc)}</td>
                    <td class="py-3 px-4 font-black text-slate-800">${escapeHtml(nombre)}</td>
                    <td class="py-3 px-4 text-right font-bold text-emerald-700">$${totalGastado.toFixed(2)}</td>
                    <td class="py-3 px-4">${escapeHtml(telefono)}</td>
                    <td class="py-3 px-4 max-w-xs truncate" title="${escapeHtml(direccion)}">${escapeHtml(direccion)}</td>
                    <td class="py-3 px-4">${escapeHtml(sector)}</td>
                    <td class="py-3 px-4">${escapeHtml(referencia)}</td>
                    <td class="py-3 px-4 text-slate-500 text-xs">${escapeHtml(fechaRegistro)}</td>
                    <td class="py-3 px-6 text-center">
                        <button onclick='editarCliente(${JSON.stringify({...c, id: id}).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:text-indigo-800 p-1 rounded hover:bg-indigo-50" title="Editar"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick='contactarCliente("${escapeHtml(telefono)}")' class="text-green-600 hover:text-green-800 p-1 rounded hover:bg-green-50" title="WhatsApp"><i data-lucide="phone" class="w-4 h-4"></i></button>
                        <button onclick='eliminarCliente("${escapeHtml(id)}")' class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50" title="Eliminar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </td>
                `;
            });
            lucide.createIcons();
        }

        function filtrarClientes() {
            const query = document.getElementById("buscarCliente").value.toLowerCase().trim();
            const filtrados = clientesGlobal.filter(c => 
                (c.nombre || "").toLowerCase().includes(query) ||
                (c.ci_ruc || c.id || "").toLowerCase().includes(query)
            );
            renderizarClientes(filtrados);
        }

        // ========== MODAL CRUD ==========
        function abrirModalCliente(cliente = null) {
            document.getElementById("formCliente").reset();
            document.getElementById("clienteIdOriginal").value = "";
            if (cliente) {
                document.getElementById("modalTitulo").innerHTML = '<i data-lucide="edit-3" class="w-4 h-4 text-indigo-400"></i> Editar Cliente';
                document.getElementById("ci_ruc").value = cliente.ci_ruc || cliente.id || "";
                document.getElementById("nombre").value = cliente.nombre || "";
                document.getElementById("telefono").value = cliente.telefono || "";
                document.getElementById("sector").value = cliente.sector || "";
                document.getElementById("direccion").value = cliente.direccion || "";
                document.getElementById("referencia").value = cliente.referencia || "";
                document.getElementById("clienteIdOriginal").value = cliente.id || cliente.ci_ruc;
            } else {
                document.getElementById("modalTitulo").innerHTML = '<i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i> Nuevo Cliente';
            }
            document.getElementById("modalCliente").classList.remove("hidden");
            lucide.createIcons();
        }

        function cerrarModalCliente() {
            document.getElementById("modalCliente").classList.add("hidden");
        }

        async function guardarCliente(e) {
            e.preventDefault();
            const datos = {
                id: document.getElementById("ci_ruc").value.trim(),
                nombre: document.getElementById("nombre").value.trim(),
                telefono: document.getElementById("telefono").value.trim(),
                sector: document.getElementById("sector").value,
                direccion: document.getElementById("direccion").value.trim(),
                referencia: document.getElementById("referencia").value.trim(),
                fechaRegistro: new Date().toISOString().split('T')[0]
            };
            const idOriginal = document.getElementById("clienteIdOriginal").value;
            if (idOriginal) datos.oldId = idOriginal;

            Swal.fire({ title: 'Guardando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await guardarClienteEnSheet(datos);
                Swal.fire({ icon: 'success', title: 'Guardado', timer: 1500, showConfirmButton: false });
                cerrarModalCliente();
                cargarClientes(); // recarga ranking
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        async function eliminarCliente(id) {
            if (!id) return Swal.fire('Error', 'ID no válido', 'error');
            const confirm = await Swal.fire({ title: '¿Eliminar?', text: `ID: ${id}`, icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc2626', confirmButtonText: 'Sí' });
            if (!confirm.isConfirmed) return;
            Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                await eliminarClienteSheet(id);
                Swal.fire({ icon: 'success', title: 'Eliminado', timer: 1500 });
                cargarClientes();
            } catch (err) {
                Swal.fire('Error', err.message, 'error');
            }
        }

        function contactarCliente(telefono) {
            if (!telefono) return Swal.fire("Sin teléfono", "Este cliente no tiene número registrado", "info");
            const num = telefono.replace(/[^0-9]/g, '');
            window.open(`https://wa.me/${num}`, '_blank');
        }

        function editarCliente(cliente) {
            abrirModalCliente(cliente);
        }

        function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m)); }

        // Exponer globales
        window.abrirModalCliente = abrirModalCliente;
        window.cerrarModalCliente = cerrarModalCliente;
        window.guardarCliente = guardarCliente;
        window.eliminarCliente = eliminarCliente;
        window.contactarCliente = contactarCliente;
        window.editarCliente = editarCliente;
        window.filtrarClientes = filtrarClientes;
        window.cargarClientes = cargarClientes;
    </script>
</body>
</html>
