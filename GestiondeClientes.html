<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Lógica Láctea</title>
    <link rel="stylesheet" href="estilos-lacteos.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <header class="bg-indigo-700 text-white shadow-lg px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="users" class="w-8 h-8"></i>
            <div>
                <h1 class="text-xl font-bold">Base de Clientes</h1>
                <p class="text-xs text-indigo-100">Inteligencia Comercial y Fidelización</p>
            </div>
        </div>
        <button onclick="abrirModalCliente()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2 border border-indigo-400 transition-all">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Nuevo Cliente
        </button>
    </header>

    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row gap-4 justify-between">
            <div class="relative flex-1">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="buscarCliente" oninput="filtrarClientes()" placeholder="Buscar por nombre, cédula o sector..." class="w-full pl-10 pr-4 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="flex items-center gap-2 bg-indigo-50 px-3 py-2 rounded-xl border border-indigo-100 text-indigo-700">
                <i data-lucide="trending-up" class="w-4 h-4"></i>
                <span class="text-xs font-bold uppercase tracking-tighter">Ranking: Mayor Inversión</span>
            </div>
        </div>
    </nav>

    <main class="p-4 md:p-8 max-w-7xl mx-auto">
        <div id="gridClientes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400">
                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-indigo-600"></i>
                <p>Cargando cartera de clientes y analizando historial de ventas...</p>
            </div>
        </div>
    </main>

    <div id="modalCliente" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden animate-in zoom-in-95">
            <div class="bg-indigo-700 p-4 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold">Registrar Cliente</h3>
                <button onclick="cerrarModalCliente()"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="formCliente" onsubmit="guardarCliente(event)" class="p-6 grid grid-cols-2 gap-4">
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Nombre Completo *</label>
                    <input type="text" id="cli_nombre" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">CI / RUC *</label>
                    <input type="text" id="cli_id" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Teléfono</label>
                    <input type="tel" id="cli_tel" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="col-span-2">
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Dirección</label>
                    <input type="text" id="cli_dir" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Sector</label>
                    <input type="text" id="cli_sector" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase">Referencia</label>
                    <input type="text" id="cli_ref" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="col-span-2 flex gap-3 mt-4">
                    <button type="button" onclick="cerrarModalCliente()" class="flex-1 py-2 border rounded-lg font-bold text-slate-600 hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="flex-1 py-2 bg-indigo-700 text-white rounded-lg font-bold hover:bg-indigo-800 shadow-lg">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    <script>
        let clientesGlobal = [];
        let modoEdicion = false;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarClientes();
        });

        // Carga y Ordenamiento por DINERO (Columna G 'Total' en Ventas sumado por cliente)
        async function cargarClientes() {
            try {
                // Aquí el script de Google debe devolver los clientes con un campo calculado 'totalDinero'
                const response = await fetch(`${CONFIG.WEB_APP_URL}?action=getClientesConRanking`);
                const data = await response.json();
                
                if(data.status === "success") {
                    clientesGlobal = data.data; // Viene ordenado desde el Apps Script
                    renderizarClientes(clientesGlobal);
                }
            } catch (e) {
                console.error("Error cargando clientes", e);
            }
        }

        function renderizarClientes(lista) {
            const container = document.getElementById("gridClientes");
            container.innerHTML = "";

            lista.forEach((cli, index) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all relative overflow-hidden group";
                
                // Badge de Ranking (Solo para los 3 primeros)
                let badgeRanking = "";
                if(index === 0) badgeRanking = '<span class="absolute -right-2 -top-2 bg-yellow-400 text-yellow-900 text-[10px] font-black px-4 py-2 rotate-12 shadow-sm">TOP COMPRADOR</span>';

                card.innerHTML = `
                    ${badgeRanking}
                    <div class="flex justify-between items-start mb-4">
                        <div class="bg-indigo-100 p-3 rounded-xl text-indigo-700">
                            <i data-lucide="user" class="w-6 h-6"></i>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total Invertido</p>
                            <p class="text-lg font-black text-indigo-700">$${parseFloat(cli.totalVentas || 0).toFixed(2)}</p>
                        </div>
                    </div>
                    <h3 class="font-bold text-slate-800 leading-tight">${cli.nombre}</h3>
                    <p class="text-xs text-slate-500 mb-3">CI: ${cli.ci_ruc}</p>
                    
                    <div class="space-y-2 border-t border-slate-50 pt-3">
                        <div class="flex items-center gap-2 text-xs text-slate-600">
                            <i data-lucide="phone" class="w-3.5 h-3.5 text-indigo-400"></i> ${cli.telefono}
                        </div>
                        <div class="flex items-center gap-2 text-xs text-slate-600">
                            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-indigo-400"></i> ${cli.sector} - ${cli.direccion}
                        </div>
                    </div>

                    <div class="flex gap-2 mt-5 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editarCliente('${cli.ci_ruc}')" class="flex-1 bg-slate-100 hover:bg-indigo-100 hover:text-indigo-700 text-slate-600 py-2 rounded-lg text-xs font-bold transition-colors">EDITAR</button>
                        <button onclick="verCompras('${cli.ci_ruc}')" class="flex-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 py-2 rounded-lg text-xs font-bold transition-colors">HISTORIAL</button>
                        <button onclick="eliminarCliente('${cli.ci_ruc}')" class="p-2 text-rose-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // Lógica de Modales y CRUD (Simpliicado para el ejemplo)
        function abrirModalCliente() {
            modoEdicion = false;
            document.getElementById("formCliente").reset();
            document.getElementById("modalTitle").innerText = "Registrar Cliente";
            document.getElementById("modalCliente").classList.remove("hidden");
        }

        function cerrarModalCliente() {
            document.getElementById("modalCliente").classList.add("hidden");
        }

        async function guardarCliente(e) {
            e.preventDefault();
            const payload = {
                action: modoEdicion ? "editarCliente" : "crearCliente",
                data: {
                    id: document.getElementById("cli_id").value,
                    nombre: document.getElementById("cli_nombre").value,
                    telefono: document.getElementById("cli_tel").value,
                    direccion: document.getElementById("cli_dir").value,
                    sector: document.getElementById("cli_sector").value,
                    referencia: document.getElementById("cli_ref").value,
                    fecha: new Date().toLocaleDateString()
                }
            };

            // Llamada a CONFIG.WEB_APP_URL desde api-config.js
            Swal.fire({title: 'Procesando...', didOpen: () => Swal.showLoading()});
            
            // Simulación de envío
            setTimeout(() => {
                Swal.fire('Éxito', 'Cliente guardado en la base Lógica Láctea', 'success');
                cerrarModalCliente();
                cargarClientes();
            }, 1000);
        }

        function filtrarClientes() {
            const term = document.getElementById("buscarCliente").value.toLowerCase();
            const filtrados = clientesGlobal.filter(c => 
                c.nombre.toLowerCase().includes(term) || 
                c.ci_ruc.includes(term) || 
                c.sector.toLowerCase().includes(term)
            );
            renderizarClientes(filtrados);
        }

        function eliminarCliente(id) {
            Swal.fire({
                title: '¿Eliminar cliente?',
                text: "Esta acción no se puede deshacer en el Google Sheet.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e11d48',
                confirmButtonText: 'Sí, eliminar'
            }).then((result) => {
                if (result.isConfirmed) {
                    // Lógica de borrado en Apps Script
                    Swal.fire('Eliminado', 'El cliente ha sido removido.', 'success');
                }
            });
        }
    </script>
</body>
</html>
