<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes - Lógica Láctea</title>
    <!-- CONEXIÓN A ARCHIVOS RAÍZ -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <!-- Tailwind CSS para maquetación ágil -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para flujos de confirmación y feedback visual -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado del Módulo -->
    <header class="bg-indigo-900 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="users" class="w-8 h-8 text-indigo-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Cartera de Clientes</h1>
                <p class="text-xs text-indigo-200">Altas, Búsquedas y Control de Cuentas Comerciales</p>
            </div>
        </div>
        <button onclick="abrirModalCliente()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all border border-indigo-400 shadow-sm active:scale-95">
            <i data-lucide="user-plus" class="w-4 h-4"></i> Registrar Nuevo Cliente
        </button>
    </header>

    <!-- Barra de Búsqueda y Estadísticas -->
    <nav class="bg-white border-b border-slate-200 p-4 sticky top-0 z-10 shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row gap-4 justify-between items-center">
            <!-- Input Reactivo -->
            <div class="relative w-full sm:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                </span>
                <input type="text" id="buscarCliente" oninput="filtrarClientes()" class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 bg-slate-50 outline-none" placeholder="Buscar por Nombre, CI o RUC...">
            </div>
            
            <!-- Contador Resumen -->
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-100 px-3 py-2 rounded-lg border border-slate-200">
                Total Registrados: <span id="txtContadorClientes" class="text-indigo-700 font-black text-sm ml-1">0</span>
            </div>
        </div>
    </nav>

    <!-- Tabla Principal de Clientes -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6">Identificación (CI/RUC)</th>
                            <th class="py-3 px-4">Razón Social / Nombre</th>
                            <th class="py-3 px-4">Teléfono de Contacto</th>
                            <th class="py-3 px-4">Dirección de Despacho</th>
                            <th class="py-3 px-6 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <!-- Loader Dinámico -->
                        <tr>
                            <td colspan="5" class="text-center py-20 text-slate-400">
                                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-indigo-600"></i>
                                <p class="text-xs">Sincronizando registros con la base central de Clientes...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Formulario: Alta de Clientes -->
    <div id="modalCliente" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden animate-in zoom-in-95">
            <div class="bg-indigo-950 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold flex items-center gap-2"><i data-lucide="user-plus" class="w-4 h-4 text-indigo-400"></i> Ficha de Registro Comercial</h3>
                <button type="button" onclick="cerrarModalCliente()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <form id="formCliente" onsubmit="guardarClienteNuevo(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Identificación (RUC / Cédula) *</label>
                    <input type="text" id="cli_id" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 font-mono outline-none" placeholder="Ej: 1723456789001">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Nombre Completo / Razón Social *</label>
                    <input type="text" id="cli_nombre" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej: Distribuidora Lácteos Centro">
                </div>
                
                <div class="grid grid-cols-1 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Teléfono / Celular</label>
                        <input type="text" id="cli_telefono" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej: 0987654321">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1 uppercase tracking-tight">Dirección de Entrega / Facturación</label>
                    <textarea id="cli_direccion" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej: Av. Amazonas N24 y Orellana"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2">
                    <button type="button" onclick="cerrarModalCliente()" class="w-full py-2 border rounded-lg font-bold text-slate-600 hover:bg-slate-50 text-xs uppercase tracking-wider">Cancelar</button>
                    <button type="submit" class="w-full py-2 bg-indigo-600 text-white rounded-lg font-bold hover:bg-indigo-700 shadow-md text-xs uppercase tracking-wider">Registrar Ficha</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let clientesGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarClientes();
        });

        // Consumo unificado usando el estándar unificado de Lógica Láctea
        async function cargarClientes() {
            try {
                // Consume los datos de la pestaña o dataset "Clientes"
                const datos = await DairyAPI.obtenerDatos("Clientes");
                
                if (Array.isArray(datos)) {
                    clientesGlobal = datos;
                    renderizarClientes(clientesGlobal);
                    document.getElementById("txtContadorClientes").innerText = clientesGlobal.length;
                } else if (datos && datos.status === "error") {
                    throw new Error(datos.message);
                }
            } catch (err) {
                console.error("Error al enlazar base de datos:", err);
                document.getElementById("tbodyClientes").innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-10 text-rose-500 font-bold">
                            <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                            Fallo al conectar con el archivo api-config.js o Google Sheets.
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        // Renderizado dinámico seguro protegiendo contra nulos o llaves mal nombradas
        function renderizarClientes(lista) {
            const tbody = document.getElementById("tbodyClientes");
            tbody.innerHTML = lista.length ? "" : "<tr><td colspan='5' class='text-center py-10 text-slate-400 italic'>No se encontraron registros en el maestro de clientes.</td></tr>";

            lista.forEach(c => {
                // Homologación de llaves por si vienen como ci_ruc o id
                const identificacion = c.ci_ruc || c.id || "S/I";
                const telefono = c.telefono || '';
                const direccion = c.direccion || '';

                const tr = document.createElement("tr");
                tr.className = "hover:bg-indigo-50/20 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-mono font-bold text-indigo-900">${identificacion}</td>
                    <td class="py-3.5 px-4 font-black text-slate-800">${c.nombre || c.razonSocial}</td>
                    <td class="py-3.5 px-4 text-slate-600">${telefono ? telefono : '<span class="text-slate-300 italic">No registrado</span>'}</td>
                    <td class="py-3.5 px-4 text-slate-500 max-w-xs truncate" title="${direccion}">${direccion ? direccion : '<span class="text-slate-300 italic">No registrada</span>'}</td>
                    <td class="py-3.5 px-6 text-center">
                        <button onclick="contactarCliente('${telefono}')" class="text-indigo-600 hover:text-indigo-800 p-1 rounded hover:bg-indigo-50 transition-colors" title="Contactar WhatsApp">
                            <i data-lucide="phone" class="w-4 h-4 mx-auto"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function filtrarClientes() {
            const query = document.getElementById("buscarCliente").value.toLowerCase();
            const filtrados = clientesGlobal.filter(c => {
                const nombre = (c.nombre || c.razonSocial || "").toLowerCase();
                const id = (c.ci_ruc || c.id || "").toLowerCase();
                return nombre.includes(query) || id.includes(query);
            });
            renderizarClientes(filtrados);
        }

        function abrirModalCliente() {
            document.getElementById("formCliente").reset();
            document.getElementById("modalCliente").classList.remove("hidden");
        }

        function cerrarModalCliente() {
            document.getElementById("modalCliente").classList.add("hidden");
        }

        // Escritura asíncrona segura mediante la API unificada
        async function guardarClienteNuevo(e) {
            e.preventDefault();

            const payload = {
                action: "registrarCliente",
                ci_ruc: document.getElementById("cli_id").value.trim(),
                nombre: document.getElementById("cli_nombre").value.trim(),
                telefono: document.getElementById("cli_telefono").value.trim(),
                direccion: document.getElementById("cli_direccion").value.trim()
            };

            Swal.fire({
                title: 'Registrando en Cartera...',
                text: 'Dando de alta nueva ficha de cliente...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            try {
                // Guarda los datos usando la abstracción unificada en la colección "Clientes"
                await DairyAPI.guardarDatos("Clientes", payload);

                Swal.fire({
                    title: 'Cliente Guardado',
                    text: 'La ficha comercial se ha estructurado con éxito.',
                    icon: 'success',
                    confirmButtonColor: '#4f46e5'
                });
                
                cerrarModalCliente();
                cargarClientes(); // Recarga la grilla inmediatamente
            } catch (err) {
                console.error("Error al persistir el cliente:", err);
                Swal.fire("Error Estructural", "No se pudo sincronizar el alta de cliente con Google Sheets.", "error");
            }
        }

        function contactarCliente(telefono) {
            if(!telefono || telefono.trim() === "") {
                return Swal.fire("Datos Incompletos", "Este cliente no tiene un teléfono celular vinculado.", "info");
            }
            // Limpia caracteres no numéricos para la URL de WhatsApp
            const numeroLimpio = telefono.replace(/[^0-9]/g, '');
            window.open(`https://wa.me/${numeroLimpio}`, '_blank');
        }
    </script>
</body>
</html>
