<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Base de Clientes | Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js?v=1.4"></script>
    <script src="menu-logic.js?v=1.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0d9488' } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="pb-32 bg-slate-50 text-slate-800">
    <header class="fixed top-0 w-full z-40 flex justify-between items-center px-6 h-20 bg-gradient-to-r from-teal-700 to-teal-900 text-white shadow-md">
        <div>
            <h1 class="text-[9px] font-black text-teal-200 uppercase tracking-widest">Comercial</h1>
            <h2 class="text-base font-black uppercase tracking-tight">Directorio de Clientes</h2>
        </div>
        <span class="material-symbols-outlined text-2xl">group</span>
    </header>

    <main class="pt-24 px-4 max-w-xl mx-auto space-y-4">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-3.5 text-teal-600">search</span>
            <input type="text" id="buscador" oninput="filtrar()" placeholder="Buscar por Nombre o Cédula/RUC..." class="w-full rounded-2xl border-none shadow-sm py-3.5 pl-12 text-xs font-bold focus:ring-2 focus:ring-teal-600/20 bg-white">
        </div>
        <div id="lista-clientes" class="grid gap-3"></div>
    </main>
    <nav id="menu-container"></nav>

    <script>
        let clientes = [];
        async function cargar() {
            try {
                clientes = await DairyAPI.obtenerDatos("Clientes");
                renderizar(clientes);
            } catch(e) { console.error(e); }
        }
        function renderizar(lista) {
            document.getElementById('lista-clientes').innerHTML = lista.map(c => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-xs font-black uppercase text-slate-900">${c.Nombre}</h3>
                            <p class="text-[9px] text-slate-400 font-bold">RUC/CI: ${c.CI_RUC}</p>
                        </div>
                        <span class="text-[9px] font-black bg-teal-50 text-teal-700 px-2 py-1 rounded-md uppercase border border-teal-100">${c.Sector || 'N/A'}</span>
                    </div>
                    <div class="text-[11px] font-medium text-slate-500 flex items-center gap-1">
                        <span class="material-symbols-outlined text-xs text-teal-600">call</span> ${c.Teléfono}
                    </div>
                </div>`).join('');
        }
        function filtrar() {
            const b = document.getElementById('buscador').value.toLowerCase();
            renderizar(clientes.filter(c => c.Nombre.toLowerCase().includes(b) || c.CI_RUC.toLowerCase().includes(b)));
        }
        window.onload = cargar;
    </script>
</body>
</html>
