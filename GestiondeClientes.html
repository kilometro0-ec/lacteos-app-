<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Lógica Láctea | Ranking de Clientes</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                primary: "#a21caf",
                secondary: "#db2777",
                background: "#faf5ff",
                outline: "#e9d5ff"
              }
            }
          }
        }
    </script>

    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
        .active-icon { font-variation-settings: 'FILL' 1 !important; }
        body { font-family: 'Work Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .medal-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }

        /* Estilos del Modal */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>

<body class="bg-background text-gray-900 pb-40">

<header class="fixed top-0 w-full h-16 bg-white border-b border-outline flex justify-between items-center px-4 shadow-sm z-50">
  <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='DashboardLacteo.html'">
    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-primary font-bold">
        <span class="material-symbols-outlined text-3xl active-icon">workspace_premium</span>
    </div>
    <h1 class="text-xl font-black text-primary tracking-tight uppercase">Ranking</h1>
  </div>
  <div class="relative">
      <input type="text" id="buscador" oninput="filtrarClientes()" placeholder="Buscar cliente..." class="w-32 focus:w-48 transition-all bg-purple-50 border-none rounded-full px-4 py-2 text-xs font-bold outline-none focus:ring-2 focus:ring-primary">
  </div>
</header>

<main class="pt-20 px-4 max-w-7xl mx-auto space-y-6">
  
  <!-- INDICADORES PRINCIPALES -->
  <section class="grid grid-cols-2 gap-4 fade-in">
    <div class="bg-primary p-5 rounded-[2rem] text-white shadow-lg text-center">
      <p class="text-[10px] uppercase font-black tracking-widest opacity-80">Clientes Registrados</p>
      <h2 id="total-clientes" class="text-3xl font-black">0</h2>
    </div>
    <div class="bg-white p-5 rounded-[2rem] border border-outline shadow-sm flex flex-col justify-center text-center">
      <p class="text-[10px] text-secondary uppercase font-black tracking-widest">Recaudación Total</p>
      <h2 id="total-dinero" class="text-3xl font-black text-secondary">$0.00</h2>
    </div>
  </section>

  <!-- LISTA DE RANKING -->
  <section id="lista-clientes" class="space-y-4 fade-in" style="animation-delay: 0.1s;">
      <div class="flex flex-col items-center justify-center py-20 gap-4">
          <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
          <p class="text-gray-400 italic font-bold">Analizando historial de ventas...</p>
      </div>
  </section>
</main>

<!-- MODAL DE HISTORIAL DE PEDIDOS -->
<div id="modal-historial" class="modal" onclick="event.target === this && cerrarModal()">
    <div class="bg-white w-full max-w-md rounded-[2.5rem] p-6 space-y-4 shadow-2xl scale-in transform transition-transform">
        <div class="flex justify-between items-center border-b border-gray-50 pb-4">
            <div>
                <h2 id="modal-nombre-cliente" class="text-xl font-black text-primary uppercase leading-none">Cargando...</h2>
                <p class="text-[10px] font-bold text-gray-400 uppercase mt-1">Historial de entregas</p>
            </div>
            <button onclick="cerrarModal()" class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-400">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div id="modal-lista-pedidos" class="max-h-[60vh] overflow-y-auto space-y-3 pr-2 custom-scroll">
            <!-- Los pedidos se cargan aquí -->
        </div>
    </div>
</div>

<div id="menu-container"></div>

<script>
let clientesData = [];

// CARGA DE DATOS DESDE GOOGLE SHEETS
async function cargarDatos() {
    try {
        const [clientes, ventas] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Ventas")
        ]);

        const statsVentas = {};
        let facturacionGlobal = 0;

        // 1. Procesar Ventas (Basado en tus columnas: "Cliente", "Estado", "Precio Total")
        if (Array.isArray(ventas)) {
            ventas.forEach(v => {
                if (String(v.Estado).trim().toUpperCase() === "ENTREGADO") {
                    const nombreKey = String(v.Cliente).trim().toLowerCase();
                    
                    // Manejo de decimales (Coma a Punto)
                    const montoRaw = v["Precio Total"] ? v["Precio Total"].toString().replace(',', '.') : "0";
                    const monto = parseFloat(montoRaw) || 0;

                    if (!statsVentas[nombreKey]) {
                        statsVentas[nombreKey] = { totalDinero: 0, conteo: 0, historial: [] };
                    }
                    
                    statsVentas[nombreKey].totalDinero += monto;
                    statsVentas[nombreKey].conteo += 1;
                    statsVentas[nombreKey].historial.push(v);
                    facturacionGlobal += monto;
                }
            });
        }

        // 2. Mapear Clientes
        const rawClientes = Array.isArray(clientes) ? clientes : [];
        clientesData = rawClientes.map(c => {
            const key = String(c.Nombre).trim().toLowerCase();
            const stats = statsVentas[key] || { totalDinero: 0, conteo: 0, historial: [] };
            return { 
                ...c, 
                montoTotal: stats.totalDinero,
                numVentas: stats.conteo,
                pedidos: stats.historial 
            };
        });

        // 3. Ordenar por MONTO (Mayor a Menor)
        clientesData.sort((a, b) => b.montoTotal - a.montoTotal);

        renderizarClientes(clientesData);

        // Actualizar indicadores
        document.getElementById('total-clientes').innerText = rawClientes.length;
        document.getElementById('total-dinero').innerText = `$${facturacionGlobal.toFixed(2)}`;

    } catch (e) {
        console.error("Error en carga:", e);
        document.getElementById('lista-clientes').innerHTML = `<p class="text-center text-red-500 font-bold py-10 uppercase">Error de conexión con la base de datos</p>`;
    }
}

function renderizarClientes(lista) {
    const container = document.getElementById('lista-clientes');
    container.innerHTML = "";

    if(lista.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 font-bold py-10 uppercase text-xs tracking-widest">No se encontraron clientes</p>`;
        return;
    }

    lista.forEach((c, index) => {
        let medalStyle = "bg-purple-50 text-primary";
        let iconName = "person";

        if (c.montoTotal > 0) {
            if (index === 0) { medalStyle = "bg-yellow-400 text-white medal-shadow ring-4 ring-yellow-100 scale-105"; iconName = "workspace_premium"; }
            else if (index === 1) { medalStyle = "bg-slate-300 text-white medal-shadow ring-4 ring-slate-100 scale-105"; iconName = "workspace_premium"; }
            else if (index === 2) { medalStyle = "bg-orange-400 text-white medal-shadow ring-4 ring-orange-100 scale-105"; iconName = "workspace_premium"; }
        }

        container.innerHTML += `
            <div class="bg-white p-5 rounded-[2.2rem] border border-outline shadow-sm flex items-center gap-4 transition-all hover:border-primary/30">
                
                <div class="w-14 h-14 rounded-2xl ${medalStyle} flex items-center justify-center shrink-0">
                    <span class="material-symbols-outlined text-3xl font-bold">${iconName}</span>
                </div>

                <div class="flex-1 min-w-0">
                    <h3 class="font-extrabold text-gray-800 leading-tight uppercase text-[12px] truncate">${c.Nombre}</h3>
                    <div class="flex items-baseline gap-1">
                        <span class="text-2xl font-black text-secondary">$${c.montoTotal.toFixed(2)}</span>
                    </div>
                    
                    <div class="flex gap-2 mt-2">
                        <button onclick="abrirHistorial('${c.Nombre.replace(/'/g, "\\'")}')" class="text-[9px] font-black text-primary bg-purple-50 px-3 py-1.5 rounded-xl uppercase">
                             Ventas (${c.numVentas})
                        </button>
                        <button onclick="irAEditar('${c.Nombre.replace(/'/g, "\\'")}')" class="text-[9px] font-black text-gray-400 bg-gray-50 px-3 py-1.5 rounded-xl uppercase">
                            Editar
                        </button>
                    </div>
                </div>

                <div class="shrink-0 flex flex-col items-center gap-1">
                    <span class="text-[10px] font-black text-gray-300">#${index + 1}</span>
                    <button onclick="verMapa('${c.Dirección}')" class="w-11 h-11 rounded-2xl bg-purple-50 flex items-center justify-center text-primary active:bg-primary active:text-white">
                        <span class="material-symbols-outlined text-2xl">location_on</span>
                    </button>
                </div>
            </div>`;
    });
}

// FUNCIONES DE INTERACCIÓN
function abrirHistorial(nombre) {
    const cliente = clientesData.find(c => c.Nombre === nombre);
    if (!cliente || cliente.pedidos.length === 0) return alert("Este cliente no tiene compras entregadas todavía.");

    document.getElementById('modal-nombre-cliente').innerText = cliente.Nombre;
    const lista = document.getElementById('modal-lista-pedidos');
    lista.innerHTML = "";

    cliente.pedidos.forEach(p => {
        const totalNum = parseFloat(p["Precio Total"].toString().replace(',', '.')) || 0;
        lista.innerHTML += `
            <div class="bg-gray-50 p-4 rounded-3xl border border-gray-100 flex justify-between items-center">
                <div>
                    <p class="text-[11px] font-black text-gray-700 uppercase">${p.Producto}</p>
                    <p class="text-[9px] font-bold text-gray-400 uppercase">Cant: ${p.Cantidad} | ${new Date(p.Fecha).toLocaleDateString()}</p>
                </div>
                <div class="text-right">
                    <p class="text-sm font-black text-primary">$${totalNum.toFixed(2)}</p>
                </div>
            </div>`;
    });

    document.getElementById('modal-historial').classList.add('active');
}

function cerrarModal() {
    document.getElementById('modal-historial').classList.remove('active');
}

function irAEditar(nombre) {
    // Redirige a tu página de edición enviando el nombre como parámetro
    window.location.href = `EditarCliente.html?nombre=${encodeURIComponent(nombre)}`;
}

function filtrarClientes() {
    const query = document.getElementById('buscador').value.toLowerCase();
    const filtrados = clientesData.filter(c => String(c.Nombre).toLowerCase().includes(query));
    renderizarClientes(filtrados);
}

function verMapa(dir) {
    if(!dir || dir === "undefined") return alert("Sin dirección registrada");
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`, '_blank');
}

window.onload = cargarDatos;
</script>
</body>
</html>
