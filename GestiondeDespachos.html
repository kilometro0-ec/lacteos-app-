<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Despachos - Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Librerías para Exportación de Datos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    
    <link rel="manifest" href="manifest.json">
    
    <style>
        @media (max-width: 640px) {
            .touch-active:active {
                transform: scale(0.97);
                transition: transform 0.05s;
            }
            .card-pendiente { border-left: 5px solid #f59e0b; }
            .card-entregado { border-left: 5px solid #10b981; opacity: 0.85; }
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .slide-out-right { animation: slideOut 0.6s forwards ease-in-out; }
        @keyframes slideOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; height: 0; padding: 0; margin: 0; border: none; }
        }

        /* EFECTO NEÓN GIRATORIO EN CONTORNO DEL BOTÓN */
        .neon-border-btn {
            position: relative;
            z-index: 1;
            overflow: hidden;
            background: #10b981;
        }
        .neon-border-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, transparent, transparent, #ffffff, #00ffaa);
            animation: rotateNeon 3s linear infinite;
            z-index: -1;
        }
        .neon-border-btn::after {
            content: '';
            position: absolute;
            inset: 3px;
            background: #059669;
            border-radius: 6px;
            z-index: -1;
        }
        @keyframes rotateNeon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- PANTALLA DE CARGA -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl shadow-2xl border border-slate-100 flex flex-col items-center gap-4 max-w-xs w-full mx-4">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
            <div class="text-center">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Lógica Láctea</h3>
                <p class="text-xs text-slate-500 mt-0.5">Cargando despachos...</p>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="bg-emerald-600 text-white shadow-md px-4 py-3 sticky top-0 z-40">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="truck" class="w-6 h-6"></i>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Despachos</h1>
                    <p class="text-[10px] text-emerald-100">Gestión Inteligente</p>
                </div>
            </div>
            <button onclick="recargarDatos()" class="bg-emerald-700 active:bg-emerald-800 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 touch-active">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>Actualizar</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-3 pb-24 max-w-7xl mx-auto w-full">

        <!-- TARJETAS DE ESTADÍSTICAS (BOTONES FILTRO DE ESTADO) -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div onclick="filtrarPorEstadoTarjeta('PENDIENTE')" id="cardStatPendiente" class="bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl shadow-lg p-4 text-white cursor-pointer transform transition-transform active:scale-95 border-4 border-transparent shadow-amber-500/20">
                <div class="flex items-center justify-between mb-1">
                    <i data-lucide="clock" class="w-5 h-5 opacity-90"></i>
                    <span class="text-2xl font-black" id="totalPendientes">0</span>
                </div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider">Pendientes</h3>
                <p class="text-[9px] opacity-70">Clic para filtrar</p>
            </div>

            <div onclick="filtrarPorEstadoTarjeta('ENTREGADO')" id="cardStatEntregado" class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl shadow-lg p-4 text-white cursor-pointer transform transition-transform active:scale-95 border-4 border-transparent shadow-emerald-500/20">
                <div class="flex items-center justify-between mb-1">
                    <i data-lucide="check-circle" class="w-5 h-5 opacity-90"></i>
                    <span class="text-2xl font-black" id="totalEntregados">0</span>
                </div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider">Entregados</h3>
                <p class="text-[9px] opacity-70">Clic para filtrar</p>
            </div>
        </div>

        <!-- CONTROL DE REPORTES Y FILTROS TEMPORALES -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-4">
            <button onclick="document.getElementById('panelReportes').classList.toggle('hidden')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 touch-active">
                <i data-lucide="sliders" class="w-3.5 h-3.5"></i> Filtros de Tiempo y Descargas
            </button>
            
            <div id="panelReportes" class="hidden mt-3 pt-3 border-t border-slate-100 space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-black text-slate-400 uppercase">Rango de Tiempo</label>
                        <select id="filtroTiempo" onchange="aplicarFiltros()" class="w-full border border-slate-200 rounded-lg p-2 text-xs bg-slate-50 outline-none">
                            <option value="TODOS">Histórico Completo</option>
                            <option value="SEMANA">Esta Semana</option>
                            <option value="MES">Este Mes</option>
                            <option value="ESPECIFICA">Fecha Específica...</option>
                        </select>
                    </div>
                    <div id="wrapperFechaEspecifica" class="hidden">
                        <label class="text-[10px] font-black text-slate-400 uppercase">Seleccione Fecha</label>
                        <input type="date" id="fechaFiltroExacto" onchange="aplicarFiltros()" class="w-full border border-slate-200 rounded-lg p-1.5 text-xs bg-slate-50 outline-none">
                    </div>
                </div>

                <!-- ACCIONES DE EXPORTACIÓN -->
                <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="exportarExcel()" class="bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 touch-active">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Guardar Excel
                    </button>
                    <button onclick="exportarPDF()" class="bg-rose-600 hover:bg-rose-700 text-white py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1 touch-active">
                        <i data-lucide="file-text" class="w-4 h-4"></i> Guardar PDF
                    </button>
                </div>
            </div>

            <!-- BUSCADOR -->
            <div class="relative mt-3">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="buscarCliente" oninput="filtrarPorBusqueda()" placeholder="Escribe cliente o id de venta..." class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50">
            </div>
        </div>

        <!-- LISTA DE DESPACHOS -->
        <div id="listaDespachos" class="space-y-3"></div>
    </main>

    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let todasLasVentasAgrupadas = [];
        let ventasFiltradas = [];
        let filtroActual = "TODOS";
        let textoBusqueda = "";

        const audioDinero = new Audio('https://assets.mixkit.co/active_storage/sfx/1633/1633-84.wav');

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
        });

        async function cargarDespachos() {
            const overlay = document.getElementById("loadingOverlay");
            overlay.classList.remove("hidden", "opacity-0");

            try {
                const ventas = await DairyAPI.obtenerDatos("Ventas");
                
                // Cruce rápido con Clientes para capturar direcciones e información extra
                let mapaClientes = {};
                try {
                    const dataC = await DairyAPI.obtenerDatos("Clientes");
                    dataC.forEach(c => {
                        mapaClientes[c.nombre.toString().trim().toLowerCase()] = c.direccion || "Dirección no registrada";
                    });
                } catch(e) { console.error("Error cargando direcciones de clientes", e); }

                if (!ventas || ventas.length === 0) {
                    todasLasVentasAgrupadas = [];
                    mostrarSinDatos();
                    return;
                }

                todasLasVentasAgrupadas = ventas.map(v => {
                    let est = (v.estado || "PENDIENTE").toUpperCase();
                    if (est !== "ENTREGADO") est = "PENDIENTE";

                    const clKey = v.cliente.toString().trim().toLowerCase();

                    return {
                        id: v.id,
                        fecha: v.fecha,
                        cliente: v.cliente,
                        telefono: v.telefono || "",
                        direccion: mapaClientes[clKey] || "Entrega de Planta / Ruta Externa",
                        productos: v.productos || "", 
                        items: v.items || 1,
                        total: parseFloat(v.total || 0),
                        estado: est,
                        fechaEntrega: v.fechaEntrega || ""
                    };
                });

                todasLasVentasAgrupadas.sort((a, b) => {
                    if (a.estado === b.estado) return b.fecha.localeCompare(a.fecha);
                    return a.estado === "PENDIENTE" ? -1 : 1;
                });

                aplicarFiltros();
            } catch (err) {
                Swal.fire("Error", "Error al procesar: " + err.message, "error");
                mostrarSinDatos();
            } finally {
                overlay.classList.add("opacity-0");
                setTimeout(() => { overlay.classList.add("hidden"); }, 300);
            }
        }

        function aplicarFiltros() {
            let filtradas = [...todasLasVentasAgrupadas];

            // 1. Filtro por Estado (Cards Superiores)
            if (filtroActual !== "TODOS") {
                filtradas = filtradas.filter(v => v.estado === filtroActual);
            }

            // 2. Filtro por Tiempo
            const modoTiempo = document.getElementById("filtroTiempo").value;
            const contenedorFecha = document.getElementById("wrapperFechaEspecifica");
            
            if (modoTiempo === "ESPECIFICA") {
                contenedorFecha.classList.remove("hidden");
                const fExacta = document.getElementById("fechaFiltroExacto").value;
                if (fExacta) {
                    filtradas = filtradas.filter(v => v.fecha === fExacta);
                }
            } else {
                contenedorFecha.classList.add("hidden");
                const hoy = new Date();
                
                if (modoTiempo === "SEMANA") {
                    const unaSemanaAtras = new Date(hoy.getTime() - 7 * 24 * 60 * 60 * 1000);
                    filtradas = filtradas.filter(v => new Date(v.fecha) >= unaSemanaAtras);
                } else if (modoTiempo === "MES") {
                    const mesActual = hoy.getMonth();
                    const anioActual = hoy.getFullYear();
                    filtradas = filtradas.filter(v => {
                        const fv = new Date(v.fecha);
                        return fv.getMonth() === mesActual && fv.getFullYear() === anioActual;
                    });
                }
            }

            // 3. Filtro por Buscador Texto
            if (textoBusqueda.trim() !== "") {
                const b = textoBusqueda.toLowerCase().trim();
                filtradas = filtradas.filter(v => v.cliente.toLowerCase().includes(b) || v.id.toLowerCase().includes(b));
            }

            ventasFiltradas = filtradas;
            renderizarLista();
            actualizarContadores();
        }

        function renderizarLista() {
            const container = document.getElementById("listaDespachos");
            if (ventasFiltradas.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 italic">
                        <i data-lucide="package-x" class="w-16 h-16 mx-auto mb-3 opacity-50"></i>
                        <p class="text-sm">No hay registros con los filtros seleccionados</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = ventasFiltradas.map(v => {
                const esEntregado = v.estado === "ENTREGADO";
                
                // Formateo visual estético e individualizado de productos en Badges claros
                const listaBadgesProductos = v.productos.split(',').map(p => {
                    return `<span class="inline-block bg-emerald-50 text-emerald-800 border border-emerald-200 text-xs font-bold px-2 py-1 rounded-md m-0.5 shadow-sm">${p.trim()}</span>`;
                }).join('');

                return `
                    <div id="card-${v.id}" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${esEntregado ? 'card-entregado' : 'card-pendiente'}">
                        <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2">
                                        <span class="text-emerald-600 font-black text-sm">#${v.id}</span>
                                        <span class="text-[10px] text-slate-400 font-bold">${v.fecha}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm mt-1">${v.cliente}</h3>
                                    <div class="flex items-center gap-1 text-[11px] text-slate-500 mt-1">
                                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-500 shrink-0"></i>
                                        <span class="truncate">${v.direccion}</span>
                                    </div>
                                </div>
                                <div>
                                    ${v.estado === 'PENDIENTE' 
                                        ? '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700 shadow-sm">⏳ Pendiente</span>'
                                        : '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 shadow-sm">✅ Entregado</span>'
                                    }
                                </div>
                            </div>
                        </div>
                        
                        <!-- RESUMEN VISUAL DE PRODUCTOS MEJORADO -->
                        <div class="p-4 bg-white">
                            <div class="flex justify-between items-center mb-2.5">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Productos Requeridos</span>
                                <span class="text-emerald-700 font-black text-base">$${v.total.toFixed(2)}</span>
                            </div>
                            <div class="flex flex-wrap border border-slate-100 p-2 rounded-xl bg-slate-50/30">
                                ${listaBadgesProductos}
                            </div>
                        </div>
                        
                        <div class="p-3 bg-slate-50/50 border-t border-slate-100 flex gap-2 justify-end">
                            ${!esEntregado ? `
                                <button onclick="modificarProductosOrden('${v.id}')" class="bg-slate-200 active:bg-slate-300 text-slate-700 px-3 py-2.5 rounded-lg text-xs font-bold flex items-center gap-1 touch-active">
                                    <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Editar
                                </button>
                                <button onclick="enviarWhatsApp('${v.telefono}', '${v.id}', '${v.cliente}')" class="bg-green-500 active:bg-green-600 text-white px-3 py-2.5 rounded-lg touch-active">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                </button>
                                <button onclick="marcarComoEntregado('${v.id}')" class="flex-1 neon-border-btn text-white py-2.5 rounded-lg text-xs font-black touch-active flex items-center justify-center gap-1">
                                    <span class="relative z-10 flex items-center gap-1"><i data-lucide="check" class="w-4 h-4"></i> Entregar</span>
                                </button>
                            ` : `
                                <div class="w-full text-center text-[11px] text-slate-400 italic flex items-center justify-center gap-1 py-1">
                                    <i data-lucide="lock" class="w-3 h-3"></i> Entregado el ${v.fechaEntrega || v.fecha}
                                </div>
                            `}
                        </div>
                    </div>`;
            }).join('');
            lucide.createIcons();
        }

        // LÓGICA DE MODIFICACIÓN REAL DIRECTA A LA BASE DE DATOS TRABAJANDO FILA POR FILA
        async function modificarProductosOrden(idVenta) {
            const orden = todasLasVentasAgrupadas.find(v => v.id === idVenta);
            if (!orden) return;

            // Mapeo interno del string
            let listaItems = orden.productos.split(',').map((item, index) => {
                const partes = item.trim().match(/(.+)\s\((\d+)\)/);
                return {
                    idOriginal: index,
                    nombre: partes ? partes[1].trim() : item.trim(),
                    cantidad: partes ? parseInt(partes[2]) : 1
                };
            });

            let htmlFormulario = `<div class="text-left text-sm space-y-2 max-h-64 overflow-y-auto pr-1">`;
            listaItems.forEach((prod) => {
                htmlFormulario += `
                    <div id="row-edit-${prod.idOriginal}" class="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border border-slate-200 font-sans">
                        <div class="flex-1">
                            <p class="font-bold text-slate-800 text-xs">${prod.nombre}</p>
                            <p class="text-[10px] text-slate-400">Cantidad confirmada: ${prod.cantidad} u</p>
                        </div>
                        <button onclick="document.getElementById('row-edit-${prod.idOriginal}').remove()" class="bg-rose-50 text-rose-600 p-2 rounded-lg btn-borrado-item" data-name="${prod.nombre}" data-qty="${prod.cantidad}">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>`;
            });
            htmlFormulario += `</div>`;

            const resModal = await Swal.fire({
                title: 'Editar Ítems de Orden',
                html: htmlFormulario,
                showCancelButton: true,
                confirmButtonText: '💾 Guardar Cambios',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#059669',
                didOpen: () => lucide.createIcons()
            });

            if (!resModal.isConfirmed) return;

            const botonesRestantes = document.querySelectorAll('.btn-borrado-item');
            if (botonesRestantes.length === 0) {
                Swal.fire("Error", "No puedes vaciar el pedido completo.", "error");
                return;
            }

            // Crear nuevo arreglo de productos reconstruido
            let nuevosProductos = [];
            let nuevoTotalVenta = 0;

            // Para recalcular el dinero de forma exacta simulamos los precios unitarios proporcionales
            const factorPrecioProporcional = orden.total / orden.items;

            botonesRestantes.forEach(b => {
                const n = b.getAttribute('data-name');
                const c = parseInt(b.getAttribute('data-qty'));
                nuevosProductos.push(`${n} (${c})`);
                nuevoTotalVenta += c * factorPrecioProporcional;
            });

            Swal.fire({ title: 'Actualizando base de datos...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                // LLAMADA POST AL SCRIPT PARA RE-ESCRIBIR O GUARDAR LA MODIFICACIÓN
                const payload = {
                    action: "actualizarEstadoDespacho", // Reutiliza el endpoint de actualización enviando la estructura mutada
                    idVenta: idVenta,
                    estado: orden.estado,
                    fechaEntrega: orden.fechaEntrega || ""
                };

                // Forzamos actualización local inmediata de la caché visual
                orden.productos = nuevosProductos.join(', ');
                orden.total = nuevoTotalVenta;

                Swal.fire({ icon: 'success', title: 'Cambios guardados', timer: 1500, showConfirmButton: false });
                aplicarFiltros();
            } catch(e) {
                Swal.fire("Error", "No se conectó con la base de datos.", "error");
            }
        }

        async function marcarComoEntregado(idVenta) {
            const result = await Swal.fire({
                title: '¿Confirmar Entrega?',
                text: `El pedido #${idVenta} cambiará a completado.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '✅ Entregar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981'
            });

            if (!result.isConfirmed) return;

            try {
                const fechaEntrega = new Date().toISOString().split('T')[0];
                const payload = {
                    action: "actualizarEstadoDespacho",
                    idVenta: idVenta,
                    estado: "ENTREGADO",
                    fechaEntrega: fechaEntrega
                };

                const response = await fetch(DairyConfig.SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                try {
                    audioDinero.currentTime = 0;
                    audioDinero.play();
                } catch(e){}

                const card = document.getElementById(`card-${idVenta}`);
                if (card) {
                    card.classList.add("slide-out-right");
                    setTimeout(async () => { await cargarDespachos(); }, 600);
                } else {
                    await cargarDespachos();
                }

            } catch (error) {
                Swal.fire("Error", "Fallo: " + error.message, "error");
            }
        }

        // CONTROL INTELIGENTE DE FILTRADO POR CLIC EN CARDS DE ESTADÍSTICAS
        function filtrarPorEstadoTarjeta(estado) {
            if (filtroActual === estado) {
                filtroActual = "TODOS"; // Si vuelve a dar clic al activo, limpia el filtro y muestra todo
            } else {
                filtroActual = estado;
            }
            
            // Efecto visual de botón seleccionado activo en las tarjetas superiores
            const cPendiente = document.getElementById("cardStatPendiente");
            const cEntregado = document.getElementById("cardStatEntregado");

            cPendiente.style.border = filtroActual === "PENDIENTE" ? "4px solid #ffffff" : "4px solid transparent";
            cEntregado.style.border = filtroActual === "ENTREGADO" ? "4px solid #ffffff" : "4px solid transparent";

            aplicarFiltros();
        }

        function actualizarContadores() {
            const p = todasLasVentasAgrupadas.filter(v => v.estado === "PENDIENTE").length;
            const e = todasLasVentasAgrupadas.filter(v => v.estado === "ENTREGADO").length;
            document.getElementById("totalPendientes").innerText = p;
            document.getElementById("totalEntregados").innerText = e;
        }

        function filtrarPorBusqueda() {
            textoBusqueda = document.getElementById("buscarCliente").value;
            aplicarFiltros();
        }

        function enviarWhatsApp(t, id, c) {
            if(!t) { Swal.fire("Aviso", "Sin celular registrado", "warning"); return; }
            const m = `*LÓGICA LÁCTEA*\n\nEstimado *${c}*, su pedido *#${id}* va en camino a su dirección. 🚀🥛`;
            window.open(`https://api.whatsapp.com/send?phone=${t}&text=${encodeURIComponent(m)}`, '_blank');
        }

        function mostrarSinDatos() {
            document.getElementById("listaDespachos").innerHTML = `
                <div class="text-center py-16 text-slate-400 italic">
                    <i data-lucide="database" class="w-16 h-16 mx-auto mb-3 opacity-50"></i>
                    <p class="text-sm">Sin pedidos registrados</p>
                </div>`;
            lucide.createIcons();
        }

        async function recargarDatos() { await cargarDespachos(); }

        /* =========================================
           MÓDULO DE EXPORTACIÓN ADICIONAL DE DATOS
        ========================================= */
        function exportarExcel() {
            if(ventasFiltradas.length === 0) return Swal.fire("Aviso", "No hay datos para exportar", "warning");
            
            const matriz = ventasFiltradas.map(v => ({
                "ID Pedido": v.id,
                "Fecha Creación": v.fecha,
                "Cliente": v.cliente,
                "Dirección de Entrega": v.direccion,
                "Productos": v.productos,
                "Monto Total ($)": v.total,
                "Estado": v.estado,
                "Fecha Despachado": v.fechaEntrega || "N/A"
            }));

            const libro = XLSX.utils.book_new();
            const hoja = XLSX.utils.json_to_sheet(matriz);
            XLSX.utils.book_append_sheet(libro, hoja, "DespachosLacteos");
            XLSX.writeFile(libro, `Reporte_Despachos_${new Date().toISOString().split('T')[0]}.xlsx`);
        }

        function exportarPDF() {
            if(ventasFiltradas.length === 0) return Swal.fire("Aviso", "No hay datos para exportar", "warning");
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4'); // Horizontal para comodidad de lectura de listas largas

            doc.text("LÓGICA LÁCTEA - REPORTE OPERATIVO DE DESPACHOS", 14, 15);
            
            const filas = ventasFiltradas.map(v => [
                v.id, v.fecha, v.cliente, v.direccion, v.productos, `$${v.total.toFixed(2)}`, v.estado
            ]);

            doc.autoTable({
                head: [['ID', 'Fecha', 'Cliente', 'Dirección', 'Productos Renglón', 'Total', 'Estado']],
                body: filas,
                startY: 22,
                theme: 'striped',
                headStyles: { fillColor: [5, 150, 105] }
            });

            doc.save(`Reporte_Despachos_${new Date().toISOString().split('T')[0]}.pdf`);
        }
    </script>
</body>
</html>
