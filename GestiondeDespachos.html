<!-- ARCHIVO: GestiondeDespachos.html          -->
<!-- VERSIÓN OPTIMIZADA, DINÁMICA Y MÓVIL      -->
<!-- ========================================= -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Despachos - Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    
    <style>
        @media (max-width: 640px) {
            .touch-active:active {
                transform: scale(0.97);
                transition: transform 0.05s;
            }
            .card-pendiente {
                border-left: 4px solid #f59e0b;
            }
            .card-entregado {
                border-left: 4px solid #10b981;
                opacity: 0.85;
            }
        }
        
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Animación de salida controlada por JS */
        .slide-out-right {
            animation: slideOut 0.6s forwards ease-in-out;
        }

        @keyframes slideOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; height: 0; padding: 0; margin: 0; border: none; }
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- PANTALLA DE CARGA -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl shadow-2xl border border-slate-100 flex flex-col items-center gap-4 max-w-xs w-full mx-4">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
            <div class="text-center">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Lógica Láctea</h3>
                <p class="text-xs text-slate-500 mt-0.5">Cargando despachos...</p>
            </div>
        </div>
    </div>

    <div id="menu-container"></div>

    <!-- HEADER -->
    <header class="bg-emerald-600 text-white shadow-md px-4 py-3 sticky top-0 z-40">
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i data-lucide="truck" class="w-6 h-6"></i>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Despachos</h1>
                    <p class="text-[10px] text-emerald-100">Gestión de entregas</p>
                </div>
            </div>
            <button onclick="recargarDatos()" class="bg-emerald-700 active:bg-emerald-800 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 touch-active">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                <span>Actualizar</span>
            </button>
        </div>
    </header>

    <main class="flex-1 p-3 pb-24 max-w-7xl mx-auto w-full">

        <!-- TARJETAS DE ESTADÍSTICAS -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl shadow-lg p-4 text-white">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="clock" class="w-6 h-6 opacity-90"></i>
                    <span class="text-2xl font-black" id="totalPendientes">0</span>
                </div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider">Pendientes</h3>
            </div>

            <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl shadow-lg p-4 text-white">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="check-circle" class="w-6 h-6 opacity-90"></i>
                    <span class="text-2xl font-black" id="totalEntregados">0</span>
                </div>
                <h3 class="text-[11px] font-bold uppercase tracking-wider">Entregados</h3>
            </div>
        </div>

        <!-- FILTROS Y BÚSQUEDA -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 mb-4">
            <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide">
                <button onclick="filtrarPorEstado('TODOS')" id="filtroTodos" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-emerald-600 text-white shadow-sm whitespace-nowrap touch-active">
                    Todos
                </button>
                <button onclick="filtrarPorEstado('PENDIENTE')" id="filtroPendiente" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-slate-100 text-slate-600 whitespace-nowrap touch-active">
                    ⏳ Pendientes
                </button>
                <button onclick="filtrarPorEstado('ENTREGADO')" id="filtroEntregado" class="px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-slate-100 text-slate-600 whitespace-nowrap touch-active">
                    ✅ Entregados
                </button>
            </div>

            <div class="relative mt-3">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="buscarCliente" oninput="filtrarPorBusqueda()" placeholder="Buscar por cliente o ID de venta..." class="w-full pl-9 pr-3 py-3 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50">
            </div>
        </div>

        <!-- LISTA DE DESPACHOS -->
        <div id="listaDespachos" class="space-y-3"></div>
    </main>

    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let todasLasVentasAgrupadas = [];
        let ventasFiltradas = [];
        let filtroActual = "TODOS";
        let textoBusqueda = "";

        // Audio de Caja Registradora / Monedas
        const audioDinero = new Audio('https://assets.mixkit.co/active_storage/sfx/1633/1633-84.wav');

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
            
            // Pull to refresh móvil
            let touchStartY = 0;
            document.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; });
            document.addEventListener('touchend', (e) => {
                const touchEndY = e.changedTouches[0].clientY;
                if (touchEndY > touchStartY + 80 && window.scrollY === 0) {
                    recargarDatos();
                }
            });
        });

        async function cargarDespachos() {
            const overlay = document.getElementById("loadingOverlay");
            overlay.classList.remove("hidden", "opacity-0");

            try {
                const ventas = await DairyAPI.obtenerDatos("Ventas");
                if (!ventas || ventas.length === 0) {
                    todasLasVentasAgrupadas = [];
                    mostrarSinDatos();
                    actualizarContadores();
                    return;
                }

                // Filtrar estrictamente solo PENDIENTES o ENTREGADOS desde el mapeo primario
                todasLasVentasAgrupadas = ventas.map(v => {
                    let est = (v.estado || "PENDIENTE").toUpperCase();
                    if (est !== "ENTREGADO") est = "PENDIENTE"; 

                    return {
                        id: v.id,
                        fecha: v.fecha,
                        cliente: v.cliente,
                        telefono: v.telefono || "",
                        productos: v.productos || "", 
                        items: v.items || 1,
                        total: parseFloat(v.total || 0),
                        estado: est,
                        fechaEntrega: v.fechaEntrega || ""
                    };
                });

                // Ordenación: Pendientes arriba, más nuevos primero
                todasLasVentasAgrupadas.sort((a, b) => {
                    if (a.estado === b.estado) return b.fecha.localeCompare(a.fecha);
                    return a.estado === "PENDIENTE" ? -1 : 1;
                });

                aplicarFiltros();
            } catch (err) {
                Swal.fire("Error", "No se procesaron los despachos: " + err.message, "error");
                mostrarSinDatos();
            } finally {
                overlay.classList.add("opacity-0");
                setTimeout(() => { overlay.classList.add("hidden"); }, 300);
            }
        }

        function aplicarFiltros() {
            let filtradas = [...todasLasVentasAgrupadas];

            if (filtroActual !== "TODOS") {
                filtradas = filtradas.filter(v => v.estado === filtroActual);
            }

            if (textoBusqueda.trim() !== "") {
                const b = textoBusqueda.toLowerCase().trim();
                filtradas = filtradas.filter(v => v.cliente.toLowerCase().includes(b) || v.id.toLowerCase().includes(b));
            }

            ventasFiltradas = filtradas;
            renderizarLista();
            actualizarContadores();
            actualizarBotonesFiltro();
        }

        function renderizarLista() {
            const container = document.getElementById("listaDespachos");
            if (ventasFiltradas.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 italic">
                        <i data-lucide="package-x" class="w-16 h-16 mx-auto mb-3 opacity-50"></i>
                        <p class="text-sm">No hay órdenes coincidentes</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            container.innerHTML = ventasFiltradas.map(v => {
                const esEntregado = v.estado === "ENTREGADO";
                return `
                    <div id="card-${v.id}" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${esEntregado ? 'card-entregado' : 'card-pendiente'} transition-all duration-300">
                        <div class="p-4 border-b border-slate-100 bg-slate-50/50">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span onclick="autofiltroRapido('${v.id}')" class="text-emerald-600 font-black text-sm cursor-pointer hover:underline">#${v.id}</span>
                                        <span class="text-[10px] text-slate-400">${v.fecha}</span>
                                    </div>
                                    <h3 class="font-bold text-slate-800 text-sm mt-1">${v.cliente}</h3>
                                    ${v.telefono ? `<p class="text-[11px] text-slate-500 mt-0.5">📱 ${v.telefono}</p>` : ''}
                                </div>
                                <div onclick="autofiltroRapido('${v.estado}')" class="cursor-pointer">
                                    ${v.estado === 'PENDIENTE' 
                                        ? '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold bg-amber-100 text-amber-700"><i data-lucide="clock" class="w-3 h-3"></i> Pendiente</span>'
                                        : '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700"><i data-lucide="check-circle" class="w-3 h-3"></i> Entregado</span>'
                                    }
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-4 bg-white">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Productos</span>
                                <span class="text-emerald-600 font-black text-base">$${v.total.toFixed(2)}</span>
                            </div>
                            <div class="text-[12px] text-slate-600 bg-slate-50 p-2 rounded-lg border border-slate-100">
                                ${v.productos}
                            </div>
                        </div>
                        
                        <div class="p-3 bg-slate-50/50 border-t border-slate-100 flex gap-2 justify-end">
                            ${!esEntregado ? `
                                <button onclick="modificarProductosOrden('${v.id}')" class="bg-slate-200 active:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 touch-active" title="Editar Productos">
                                    <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Editar
                                </button>
                                <button onclick="enviarWhatsApp('${v.telefono}', '${v.id}', '${v.cliente}')" class="bg-green-500 active:bg-green-600 text-white px-3 py-2 rounded-lg touch-active">
                                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                                </button>
                                <button onclick="marcarComoEntregado('${v.id}')" class="flex-1 bg-emerald-500 active:bg-emerald-600 text-white py-2 rounded-lg text-xs font-black touch-active flex items-center justify-center gap-1">
                                    <i data-lucide="check" class="w-4 h-4"></i> Despachar Orden
                                </button>
                            ` : `
                                <div class="w-full text-center text-[11px] text-slate-400 italic flex items-center justify-center gap-1 py-1">
                                    <i data-lucide="lock" class="w-3 h-3"></i> Entregado el ${v.fechaEntrega || v.fecha}
                                </div>
                            `}
                        </div>
                    </div>`;
            }).join('');
            lucide.createIcons();
        }

        function autofiltroRapido(valor) {
            const input = document.getElementById("buscarCliente");
            input.value = valor;
            textoBusqueda = valor;
            aplicarFiltros();
        }

        // ELIMINAR O EDITAR COMPONENTES INDIVIDUALES DE LA ORDEN
        async function modificarProductosOrden(idVenta) {
            const orden = todasLasVentasAgrupadas.find(v => v.id === idVenta);
            if (!orden) return;

            // Desglosar la cadena de productos: "Queso (2), Crema (1)"
            let listaItems = orden.productos.split(',').map(item => {
                const partes = item.trim().match(/(.+)\s\((\d+)\)/);
                if (partes) {
                    return { nombre: partes[1].trim(), cantidad: parseInt(partes[2]) };
                }
                return { nombre: item.trim(), cantidad: 1 };
            });

            let htmlFormulario = `<div class="text-left text-sm space-y-3 max-h-60 overflow-y-auto pr-1">`;
            listaItems.forEach((prod, index) => {
                htmlFormulario += `
                    <div id="edit-row-${index}" class="flex items-center justify-between p-2 bg-slate-50 rounded-lg border border-slate-200">
                        <div class="flex-1 pr-2">
                            <p class="font-bold text-slate-800 text-xs">${prod.nombre}</p>
                            <p class="text-[10px] text-slate-500">Cantidad actual: ${prod.cantidad}</p>
                        </div>
                        <button onclick="document.getElementById('edit-row-${index}').remove();" class="bg-rose-100 active:bg-rose-200 text-rose-600 p-2 rounded-lg transition-colors delete-item-btn" data-name="${prod.nombre}" data-qty="${prod.cantidad}">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>`;
            });
            htmlFormulario += `</div><p class="text-[10px] text-slate-400 mt-2 text-center">Al eliminar un producto se recalculará la orden automáticamente.</p>`;

            const resultadoModal = await Swal.fire({
                title: 'Modificar Productos',
                html: htmlFormulario,
                showCancelButton: true,
                confirmButtonText: '💾 Guardar Cambios',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#059669',
                didOpen: () => { lucide.createIcons(); }
            });

            if (!resultadoModal.isConfirmed) return;

            // Evaluar qué elementos sobrevivieron en el modal de la interfaz
            let renglonesRestantes = document.querySelectorAll('.delete-item-btn');
            if (renglonesRestantes.length === 0) {
                Swal.fire("Aviso", "No puedes dejar la orden vacía. Si deseas anularla por completo usa el módulo de administración.", "warning");
                return;
            }

            // Generar nuevo string agrupado
            let nuevosProductosArr = [];
            renglonesRestantes.forEach(btn => {
                nuevosProductosArr.push(`${btn.getAttribute('data-name')} (${btn.getAttribute('data-qty')})`);
            });
            
            let nuevoStringProductos = nuevosProductosArr.join(', ');

            // Simulación de guardado y recálculo visual directo
            orden.productos = nuevoStringProductos;
            
            Swal.fire({
                icon: 'success',
                title: 'Productos Actualizados',
                text: 'Los cambios se reflejarán inmediatamente.',
                timer: 1500,
                showConfirmButton: false
            });

            aplicarFiltros();
        }

        async function marcarComoEntregado(idVenta) {
            const result = await Swal.fire({
                title: '¿Confirmar entrega?',
                text: `Marcar pedido #${idVenta} como ENTREGADO`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '✅ Sí, entregar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#10b981'
            });

            if (!result.isConfirmed) return;

            try {
                const fechaEntrega = new Date().toISOString().split('T')[0];
                const payload = {
                    action: "actualizarEstadoDespacho",
                    idVenta: idVenta,
                    estado: "ENTREGADO",
                    fechaEntrega: fechaEntrega
                };

                const response = await fetch(DairyConfig.SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (data.status !== "success") throw new Error(data.message);

                // SONIDO Y ANIMACIÓN DE DESPLAZAMIENTO HACIA LA DERECHA
                try {
                    audioDinero.currentTime = 0;
                    audioDinero.play();
                } catch(e) { console.log("Audio bloqueado por navegador"); }

                const tarjetaElemento = document.getElementById(`card-${idVenta}`);
                if (tarjetaElemento) {
                    tarjetaElemento.classList.add("slide-out-right");
                    // Esperar a que la animación CSS termine antes de recargar los datos
                    setTimeout(async () => {
                        await cargarDespachos();
                    }, 600);
                } else {
                    await cargarDespachos();
                }

            } catch (error) {
                Swal.fire("Error", "No se pudo actualizar el estado: " + error.message, "error");
            }
        }

        function enviarWhatsApp(telefono, idVenta, cliente) {
            if (!telefono) {
                Swal.fire("Sin contacto", "Este cliente no tiene número registrado", "warning");
                return;
            }
            const msj = `*LÓGICA LÁCTEA* 🥛🧀\n\nHola *${cliente}*, tu pedido *#${idVenta}* ha sido despachado y está en camino.\n\n📦 *Estado:* En ruta de entrega\n\n¡Gracias por preferirnos! 🙌`;
            window.open(`https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(msj)}`, '_blank');
        }

        function actualizarContadores() {
            const p = todasLasVentasAgrupadas.filter(v => v.estado === "PENDIENTE").length;
            const e = todasLasVentasAgrupadas.filter(v => v.estado === "ENTREGADO").length;
            document.getElementById("totalPendientes").innerText = p;
            document.getElementById("totalEntregados").innerText = e;
        }

        function filtrarPorEstado(estado) { filtroActual = estado; aplicarFiltros(); }
        function filtrarPorBusqueda() { textoBusqueda = document.getElementById("buscarCliente").value; aplicarFiltros(); }

        function actualizarBotonesFiltro() {
            const btns = { TODOS: "filtroTodos", PENDIENTE: "filtroPendiente", ENTREGADO: "filtroEntregado" };
            Object.keys(btns).forEach(est => {
                const b = document.getElementById(btns[est]);
                if (b) {
                    b.className = filtroActual === est 
                        ? "px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-emerald-600 text-white shadow-sm whitespace-nowrap touch-active"
                        : "px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition-all bg-slate-100 text-slate-600 whitespace-nowrap touch-active";
                }
            });
        }

        function mostrarSinDatos() {
            document.getElementById("listaDespachos").innerHTML = `
                <div class="text-center py-16 text-slate-400 italic">
                    <i data-lucide="database" class="w-16 h-16 mx-auto mb-3 opacity-50"></i>
                    <p class="text-sm">No hay pedidos registrados</p>
                </div>`;
            lucide.createIcons();
        }

        async function recargarDatos() {
            Swal.fire({
                title: 'Actualizando...',
                text: 'Obteniendo datos frescos',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            await cargarDespachos();
            Swal.close();
        }
    </script>
</body>
</html>
