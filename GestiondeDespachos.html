<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Despachos - Lógica Láctea</title>

    <link rel="stylesheet" href="estilos-lacteos.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col pb-20 select-none">

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4 max-w-xs w-full mx-4">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
            <div class="text-center">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Lógica Láctea</h3>
                <p class="text-xs text-slate-500 mt-0.5">Cargando hoja de ruta...</p>
            </div>
        </div>
    </div>

    <div id="menu-container"></div>

    <!-- CABECERA ADAPTADA A MÓVIL -->
    <header class="bg-emerald-600 text-white shadow-md px-4 py-3 sticky top-0 z-40 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i data-lucide="truck" class="w-6 h-6"></i>
            <div>
                <h1 class="text-lg font-black tracking-tight">Rutas y Despachos</h1>
                <p class="text-[10px] text-emerald-100 -mt-0.5">Panel de Última Milla</p>
            </div>
        </div>

        <button onclick="recargarDatos()" class="bg-emerald-700 active:bg-emerald-800 text-white p-2 rounded-xl text-sm font-bold flex items-center justify-center transition-all shadow-inner">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>
    </header>

    <main class="flex-1 p-3 max-w-7xl mx-auto w-full space-y-4">

        <!-- TARJETAS DE ESTADÍSTICAS EN FILA COMPACTA (MÓVIL-FIRST) -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-blue-600 rounded-xl p-3 text-white text-center shadow-sm">
                <span class="block text-xl font-black tracking-tight leading-none mb-1" id="totalEnCola">0</span>
                <span class="text-[9px] font-bold uppercase tracking-wider opacity-90 block">En Cola</span>
            </div>

            <div class="bg-amber-500 rounded-xl p-3 text-white text-center shadow-sm">
                <span class="block text-xl font-black tracking-tight leading-none mb-1" id="totalEnTransit">0</span>
                <span class="text-[9px] font-bold uppercase tracking-wider opacity-90 block">En Ruta</span>
            </div>

            <div class="bg-emerald-600 rounded-xl p-3 text-white text-center shadow-sm">
                <span class="block text-xl font-black tracking-tight leading-none mb-1" id="totalEntregadas">0</span>
                <span class="text-[9px] font-bold uppercase tracking-wider opacity-90 block">Listos</span>
            </div>
        </div>

        <!-- BÚSQUEDA Y FILTROS DESLIZABLES -->
        <div class="bg-white rounded-xl shadow-sm p-3 space-y-3 border border-slate-200">
            <div class="relative w-full">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="buscarCliente" oninput="filtrarPorBusqueda()" placeholder="Buscar cliente o ID de venta..." class="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition-all">
            </div>

            <!-- Scroll horizontal nativo con el dedo para los filtros sin romper la pantalla -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 scrollbar-none snap-x -mx-1 px-1">
                <button onclick="filtrarPorEstado('TODOS')" id="filtroTodos" class="snap-mini px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-emerald-600 text-white">
                    Todos
                </button>
                <button onclick="filtrarPorEstado('EN COLA')" id="filtroCola" class="snap-mini px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-slate-100 text-slate-600">
                    En Cola
                </button>
                <button onclick="filtrarPorEstado('EN TRÁNSITO')" id="filtroTransito" class="snap-mini px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-slate-100 text-slate-600">
                    En Ruta
                </button>
                <button onclick="filtrarPorEstado('ENTREGADO')" id="filtroEntregado" class="snap-mini px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-slate-100 text-slate-600">
                    Entregados
                </button>
            </div>
        </div>

        <!-- CONTENEDOR DINÁMICO TIPO TARJETAS PARA CELULARES -->
        <div id="contenedorDespachos" class="space-y-3">
            <!-- Render dinámico desde JavaScript -->
            <div class="text-center py-12 text-slate-400 italic bg-white rounded-xl border border-slate-200">
                <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 opacity-40 animate-pulse"></i>
                Cargando despachos...
            </div>
        </div>
    </main>

    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let todasLasVentas = [];
        let ventasFiltradas = [];
        let filtroActual = "TODOS";
        let textoBusqueda = "";

        const ESTADOS = {
            EN_COLA: "EN COLA",
            EN_TRANSITO: "EN TRÁNSITO",
            ENTREGADO: "ENTREGADO"
        };

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
        });

        async function cargarDespachos() {
            const overlay = document.getElementById("loadingOverlay");
            overlay.classList.remove("hidden", "opacity-0");

            try {
                const ventas = await DairyAPI.obtenerDatos("Ventas");
                
                if (!ventas || ventas.length === 0) {
                    todasLasVentas = [];
                    mostrarMensajeSinDatos();
                    actualizarContadores();
                    return;
                }

                todasLasVentas = ventas.map(venta => ({
                    id: venta.id || venta.idVenta || venta.ID_Venta || "N/A",
                    fecha: venta.fecha || venta.Fecha || "Sin fecha",
                    cliente: venta.cliente || venta.Cliente || "Cliente no especificado",
                    items: venta.items || venta.cantidad || venta.Cantidad || "0",
                    total: venta.total || venta.Total || "0",
                    estado: (venta.estado || venta.Estado || "EN COLA").toUpperCase(),
                    telefono: venta.telefono || venta.Telefono || "",
                    productos: venta.productos || venta.producto || venta.Producto || ""
                }));

                aplicarFiltros();

            } catch (err) {
                console.error("Error al cargar despachos:", err);
                Swal.fire({ title: "Error", text: "No se cargaron los datos: " + err.message, icon: "error", confirmButtonColor: '#059669' });
                mostrarMensajeSinDatos();
            } finally {
                overlay.classList.add("opacity-0");
                setTimeout(() => { overlay.classList.add("hidden"); }, 300);
            }
        }

        function aplicarFiltros() {
            let filtradas = [...todasLasVentas];

            if (filtroActual !== "TODOS") {
                filtradas = filtradas.filter(venta => venta.estado === filtroActual);
            }

            if (textoBusqueda.trim() !== "") {
                const busqueda = textoBusqueda.toLowerCase().trim();
                filtradas = filtradas.filter(venta => 
                    venta.cliente.toLowerCase().includes(busqueda) ||
                    venta.id.toString().toLowerCase().includes(busqueda)
                );
            }

            ventasFiltradas = filtradas;
            renderizarTarjetasMoviles();
            actualizarContadores();
            actualizarBotonesFiltro();
        }

        // RENDERIZADO ADAPTADO A FORMATO TARJETA DE CELULAR
        function renderizarTarjetasMoviles() {
            const contenedor = document.getElementById("contenedorDespachos");
            
            if (ventasFiltradas.length === 0) {
                contenedor.innerHTML = `
                    <div class="text-center py-16 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
                        <p class="text-sm font-medium">No hay despachos en esta lista</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            contenedor.innerHTML = ventasFiltradas.map(venta => `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex flex-col gap-3 relative overflow-hidden">
                    
                    <!-- ENCABEZADO DE LA TARJETA (ID Y ESTADO) -->
                    <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                        <span class="font-mono font-black text-emerald-600 text-sm bg-emerald-50 px-2.5 py-1 rounded-lg">#${venta.id}</span>
                        <div>${renderizarBadgeEstado(venta.estado)}</div>
                    </div>

                    <!-- DATOS DEL CLIENTE -->
                    <div class="space-y-1">
                        <h4 class="font-black text-slate-800 text-base leading-tight">${venta.cliente}</h4>
                        <p class="text-xs text-slate-500 font-medium truncate">${venta.productos || 'Sin descripción de productos'}</p>
                        
                        <div class="flex items-center gap-4 pt-1">
                            <span class="text-sm font-black text-slate-900">$${parseFloat(venta.total).toFixed(2)}</span>
                            <span class="text-xs text-slate-400 font-semibold">${venta.fecha}</span>
                        </div>
                    </div>

                    <!-- SECCIÓN DE ACCIONES: BOTONES GRANDES APARTE PARA EL DEDO -->
                    <div class="grid grid-cols-1 gap-2 pt-1">
                        <div class="flex gap-2">
                            <!-- BOTÓN DE GOOGLE MAPS -->
                            <button onclick="abrirDireccion('${venta.cliente}')" class="flex-1 bg-slate-100 active:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-all">
                                <i data-lucide="map-pin" class="w-4 h-4 text-emerald-600"></i> Ubicación
                            </button>

                            <!-- BOTÓN AUXILIAR ELIMINAR -->
                            <button onclick="anularPedido('${venta.id}')" class="bg-rose-50 active:bg-rose-100 border border-rose-200 text-rose-600 px-4 rounded-xl flex items-center justify-center transition-all">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>

                        <!-- ACCIONES OPERATIVAS SEGÚN EL ESTADO -->
                        <div class="w-full">
                            ${renderizarBotonesAccionCelular(venta)}
                        </div>
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function renderizarBadgeEstado(estado) {
            switch(estado) {
                case ESTADOS.EN_COLA:
                    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-black bg-blue-100 text-blue-700 uppercase tracking-wider">En Cola</span>';
                case ESTADOS.EN_TRANSITO:
                    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-black bg-amber-100 text-amber-700 uppercase tracking-wider">En Ruta</span>';
                case ESTADOS.ENTREGADO:
                    return '<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-black bg-emerald-100 text-emerald-700 uppercase tracking-wider">Entregado</span>';
                default:
                    return `<span class="px-2.5 py-0.5 rounded-full text-[10px] font-black bg-gray-100 text-gray-600 uppercase tracking-wider">${estado}</span>`;
            }
        }

        function renderizarBotonesAccionCelular(venta) {
            switch(venta.estado) {
                case ESTADOS.EN_COLA:
                    return `
                        <button onclick="cambiarEstado('${venta.id}', '${ESTADOS.EN_TRANSITO}')" class="w-full bg-amber-500 active:bg-amber-600 text-white py-3.5 rounded-xl text-sm font-black tracking-wide shadow-sm flex items-center justify-center gap-2">
                            <i data-lucide="play" class="w-4 h-4 fill-white"></i> INICIAR RUTA
                        </button>
                    `;
                case ESTADOS.EN_TRANSITO:
                    return `
                        <div class="flex flex-col gap-2">
                            <button onclick="cambiarEstado('${venta.id}', '${ESTADOS.ENTREGADO}')" class="w-full bg-emerald-600 active:bg-emerald-700 text-white py-3.5 rounded-xl text-sm font-black tracking-wide shadow-sm flex items-center justify-center gap-2">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> MARCAR ENTREGADO
                            </button>
                            <button onclick="enviarWhatsApp('${venta.telefono}', '${venta.id}', '${venta.cliente}', '${venta.productos}', '${venta.total}')" class="w-full bg-green-500 active:bg-green-600 text-white py-3 rounded-xl text-xs font-black tracking-wide shadow-sm flex items-center justify-center gap-1.5">
                                <i data-lucide="message-circle" class="w-4 h-4 fill-white"></i> NOTIFICAR POR WHATSAPP
                            </button>
                        </div>
                    `;
                case ESTADOS.ENTREGADO:
                    return `
                        <div class="w-full text-center py-2 bg-emerald-50 border border-emerald-200 rounded-xl text-xs font-bold text-emerald-700 flex items-center justify-center gap-1">
                            <i data-lucide="shield-check" class="w-4 h-4"></i> ENTREGA COMPLETADA CON ÉXITO
                        </div>
                    `;
                default:
                    return `
                        <button onclick="cambiarEstado('${venta.id}', '${ESTADOS.EN_COLA}')" class="w-full bg-slate-600 active:bg-slate-700 text-white py-3 rounded-xl text-xs font-black tracking-wide">
                            REINTEGRAR A LA COLA
                        </button>
                    `;
            }
        }

        async function cambiarEstado(idVenta, nuevoEstado) {
            const confirmacion = await Swal.fire({
                title: '¿Confirmar Cambio?',
                text: `El pedido cambiará a "${nuevoEstado}"`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#059669',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, cambiar',
                cancelButtonText: 'No'
            });

            if (!confirmacion.isConfirmed) return;

            Swal.fire({
                title: 'Procesando...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const payload = {
                    action: "actualizarEstadoDespacho",
                    idVenta: idVenta,
                    estado: nuevoEstado,
                    fechaEntrega: nuevoEstado === "ENTREGADO" ? new Date().toISOString().split('T')[0] : ""
                };

                await DairyAPI.guardarDatos("Ventas", payload);

                Swal.fire({ title: "¡Actualizado!", icon: "success", timer: 1000, showConfirmButton: false });
                setTimeout(cargarDespachos, 300);

            } catch (error) {
                console.error(error);
                Swal.fire("Error", "No se guardaron los cambios: " + error.message, "error");
            }
        }

        function abrirDireccion(cliente) {
            const query = encodeURIComponent(cliente);
            window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
        }

        async function enviarWhatsApp(telefonoExistente, idVenta, cliente, productos, total) {
            let telefonoDestino = telefonoExistente;

            if (!telefonoDestino || telefonoDestino.trim() === "") {
                const { value: nuevoTelefono } = await Swal.fire({
                    title: 'Número Celular',
                    text: `Escriba el número para ${cliente}:`,
                    input: 'tel',
                    inputPlaceholder: 'Ej: 0998765432',
                    showCancelButton: true,
                    confirmButtonColor: '#059669',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Enviar',
                    cancelButtonText: 'Cancelar'
                });

                if (!nuevoTelefono) return;
                telefonoDestino = nuevoTelefono;
            }

            let numLimpio = telefonoDestino.replace(/[^0-9]/g, '');
            if (numLimpio.startsWith('0')) {
                numLimpio = '593' + numLimpio.substring(1);
            }

            const mensaje = `Hola *${cliente}*, tu pedido *#${idVenta}* está en camino con nuestro repartidor. 🚚\n\n*Detalle:* ${productos}\n*Total:* $${parseFloat(total).toFixed(2)}\n\n*LÓGICA LÁCTEA* 🥛🧀`;
            
            window.open(`https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        async function anularPedido(idVenta) {
            const confirmacion = await Swal.fire({
                title: '¿Eliminar Pedido?',
                text: `Esta acción borrará de manera definitiva el pedido #${idVenta}.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, borrar',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmacion.isConfirmed) return;

            Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await DairyAPI.guardarDatos("Ventas", {
                    action: "eliminarDespacho", 
                    idVenta: idVenta
                });

                Swal.fire({ title: "Eliminado", icon: "success", timer: 1000, showConfirmButton: false });
                setTimeout(cargarDespachos, 300);

            } catch (error) {
                Swal.fire("Error", "No se pudo eliminar.", "error");
            }
        }

        function actualizarContadores() {
            const enCola = todasLasVentas.filter(v => v.estado === ESTADOS.EN_COLA).length;
            const enTransito = todasLasVentas.filter(v => v.estado === ESTADOS.EN_TRANSITO).length;
            const entregadas = todasLasVentas.filter(v => v.estado === ESTADOS.ENTREGADO).length;

            document.getElementById("totalEnCola").innerText = enCola;
            document.getElementById("totalEnTransit").innerText = enTransito;
            document.getElementById("totalEntregadas").innerText = entregadas;
        }

        function filtrarPorEstado(estado) {
            filtroActual = estado;
            aplicarFiltros();
        }

        function filtrarPorBusqueda() {
            textoBusqueda = document.getElementById("buscarCliente").value;
            aplicarFiltros();
        }

        function actualizarBotonesFiltro() {
            const botones = {
                TODOS: document.getElementById("filtroTodos"),
                "EN COLA": document.getElementById("filtroCola"),
                "EN TRÁNSITO": document.getElementById("filtroTransito"),
                "ENTREGADO": document.getElementById("filtroEntregado")
            };

            Object.keys(botones).forEach(estado => {
                const btn = botones[estado];
                if (!btn) return;
                if (filtroActual === estado) {
                    btn.className = "px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-emerald-600 text-white shadow-md";
                } else {
                    btn.className = "px-4 py-2 rounded-xl text-xs font-black uppercase tracking-wider whitespace-nowrap transition-all bg-white text-slate-600 border border-slate-200 shadow-sm";
                }
            });
        }

        function mostrarMensajeSinDatos() {
            const contenedor = document.getElementById("contenedorDespachos");
            contenedor.innerHTML = `
                <div class="text-center py-16 text-slate-400 bg-white rounded-2xl border border-slate-200 shadow-sm">
                    <i data-lucide="database" class="w-12 h-12 mx-auto mb-2 opacity-40"></i>
                    <p class="text-sm font-medium">No hay ventas registradas en el sistema</p>
                </div>
            `;
            lucide.createIcons();
        }

        async function recargarDatos() {
            Swal.fire({
                title: 'Actualizando...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            await cargarDespachos();
            Swal.close();
        }
    </script>
</body>
</html>
