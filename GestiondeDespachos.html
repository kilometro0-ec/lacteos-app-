<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Despachos - Lógica Láctea</title>

    <link rel="stylesheet" href="estilos-lacteos.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16 relative">

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl shadow-2xl border border-slate-100 flex flex-col items-center gap-4 max-w-xs w-full mx-4">
            <div class="w-12 h-12 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
            <div class="text-center">
                <h3 class="text-sm font-black text-slate-800 uppercase tracking-wider">Lógica Láctea</h3>
                <p class="text-xs text-slate-500 mt-0.5">Cargando despachos...</p>
            </div>
        </div>
    </div>

    <div id="menu-container"></div>

    <header class="bg-emerald-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="truck" class="w-8 h-8"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Control de Despachos</h1>
                <p class="text-xs text-emerald-100">Gestión simplificada de entregas</p>
            </div>
        </div>

        <button onclick="recargarDatos()" class="bg-emerald-700 hover:bg-emerald-800 text-white p-2.5 rounded-xl text-sm font-bold flex items-center justify-center transition-all shadow-inner">
            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        </button>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">

        <!-- TARJETAS DE ESTADÍSTICAS SIMPLIFICADAS (2 COLUMNAS) -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-md p-5 text-white">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="clock" class="w-7 h-7 opacity-90"></i>
                    <span class="text-3xl font-black" id="totalPendientes">0</span>
                </div>
                <h3 class="text-xs font-bold uppercase tracking-wider opacity-90">Pendientes</h3>
            </div>

            <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl shadow-md p-5 text-white">
                <div class="flex items-center justify-between mb-2">
                    <i data-lucide="check-circle" class="w-7 h-7 opacity-90"></i>
                    <span class="text-3xl font-black" id="totalEntregados">0</span>
                </div>
                <h3 class="text-xs font-bold uppercase tracking-wider opacity-90">Entregados</h3>
            </div>
        </div>

        <!-- FILTROS Y BÚSQUEDA -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 space-y-4 md:space-y-0 md:flex md:gap-4 md:justify-between md:items-center">
            <div class="flex gap-2 w-full md:w-auto overflow-x-auto pb-2 md:pb-0 scrollbar-none">
                <button onclick="filtrarPorEstado('TODOS')" id="filtroTodos" class="px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-emerald-600 text-white shadow-sm whitespace-nowrap">
                    Todos
                </button>
                <button onclick="filtrarPorEstado('PENDIENTE')" id="filtroPendiente" class="px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-slate-100 text-slate-600 whitespace-nowrap">
                    Pendientes
                </button>
                <button onclick="filtrarPorEstado('ENTREGADO')" id="filtroEntregado" class="px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-slate-100 text-slate-600 whitespace-nowrap">
                    Entregados
                </button>
            </div>

            <div class="relative w-full md:w-72">
                <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input type="text" id="buscarCliente" oninput="filtrarPorBusqueda()" placeholder="Buscar cliente o ID..." class="w-full pl-9 pr-3 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
        </div>

        <!-- TABLA DE DESPACHOS -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto select-none">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase tracking-wider text-[11px]">
                            <th class="py-4 px-5">ID Venta</th>
                            <th class="py-4 px-5">Cliente / Info</th>
                            <th class="py-4 px-5 text-center">Total</th>
                            <th class="py-4 px-5 text-center">Estado</th>
                            <th class="py-4 px-5 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyDespachos">
                        <tr>
                            <td colspan="5" class="text-center py-16 text-slate-400 italic">
                                <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                                Cargando despachos...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let todasLasVentas = [];
        let ventasFiltradas = [];
        let filtroActual = "TODOS";
        let textoBusqueda = "";

        const ESTADOS = {
            PENDIENTE: "PENDIENTE",
            ENTREGADO: "ENTREGADO"
        };

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
        });

        async function cargarDespachos() {
            const overlay = document.getElementById("loadingOverlay");
            overlay.classList.remove("hidden", "opacity-0");

            try {
                const ventas = await DairyAPI.obtenerDatos("Ventas");
                
                if (!ventas || ventas.length === 0) {
                    todasLasVentas = [];
                    mostrarMensajeSinDatos();
                    actualizarContadores();
                    return;
                }

                todasLasVentas = ventas.map(venta => {
                    // Mapeo inteligente si viene de "EN COLA" o "EN TRÁNSITO" a "PENDIENTE"
                    let est = (venta.estado || venta.ESTADO || "PENDIENTE").toUpperCase();
                    if (est === "EN COLA" || est === "EN TRÁNSITO") {
                        est = "PENDIENTE";
                    }

                    return {
                        id: venta.id || venta.ID_VENTA || "N/A",
                        fecha: venta.fecha || venta.FECHA || "Sin fecha",
                        cliente: venta.cliente || venta.CLIENTE || "Cliente no especificado",
                        items: venta.items || venta.ITEMS || "0",
                        total: venta.total || venta.TOTAL || "0",
                        estado: est,
                        telefono: venta.telefono || venta.TELEFONO || "",
                        productos: venta.productos || venta.PRODUCTOS || ""
                    };
                });

                aplicarFiltros();

            } catch (err) {
                console.error("Error al cargar despachos:", err);
                Swal.fire("Error", "No se cargaron los datos: " + err.message, "error");
                mostrarMensajeSinDatos();
            } finally {
                overlay.classList.add("opacity-0");
                setTimeout(() => { overlay.classList.add("hidden"); }, 300);
            }
        }

        function aplicarFiltros() {
            let filtradas = [...todasLasVentas];

            if (filtroActual !== "TODOS") {
                filtradas = filtradas.filter(venta => venta.estado === filtroActual);
            }

            if (textoBusqueda.trim() !== "") {
                const busqueda = textoBusqueda.toLowerCase().trim();
                filtradas = filtradas.filter(venta => 
                    venta.cliente.toLowerCase().includes(busqueda) ||
                    venta.id.toString().toLowerCase().includes(busqueda)
                );
            }

            ventasFiltradas = filtradas;
            renderizarTabla();
            actualizarContadores();
            actualizarBotonesFiltro();
        }

        function renderizarTabla() {
            const tbody = document.getElementById("tbodyDespachos");
            
            if (ventasFiltradas.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center py-16 text-slate-400 italic">
                            <i data-lucide="package-x" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                            No hay registros que coincidan
                        </td>
                    </tr>
                `;
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = ventasFiltradas.map(venta => `
                <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                    <td class="py-4 px-5 font-bold text-emerald-600 text-sm font-mono">#${venta.id}</td>
                    <td class="py-4 px-5">
                        <div class="font-black text-slate-800 text-sm leading-tight">${venta.cliente}</div>
                        <div class="text-[11px] text-slate-500 font-medium mt-0.5 truncate max-w-[180px] md:max-w-xs">${venta.productos || 'Sin detalle de ítems'}</div>
                        
                        <!-- ACCESOS DE RUTA RÁPIDOS -->
                        <div class="flex items-center gap-3 mt-1.5">
                            <button onclick="abrirDireccion('${venta.cliente}')" class="text-blue-600 hover:text-blue-700 font-bold text-[11px] flex items-center gap-0.5 active:scale-95 transition-all">
                                <i data-lucide="map-pin" class="w-3 h-3 text-blue-500"></i> Ubicación
                            </button>
                            ${venta.telefono ? `<span class="text-[10px] text-slate-400 font-medium">📱 ${venta.telefono}</span>` : ''}
                        </div>
                    </td>
                    <td class="py-4 px-5 text-center">
                        <div class="text-slate-900 font-black text-sm">$${parseFloat(venta.total).toFixed(2)}</div>
                        <div class="text-[10px] text-slate-400 font-medium">${venta.items} items</div>
                    </td>
                    <td class="py-4 px-5 text-center">
                        ${renderizarBadge(venta.estado)}
                    </td>
                    <td class="py-4 px-5 text-center">
                        <div class="flex gap-1.5 justify-center items-center">
                            ${renderizarAccionesSimplificadas(venta)}
                            
                            <!-- BOTÓN ELIMINAR ACCESIBLE -->
                            <button onclick="anularPedido('${venta.id}')" class="bg-rose-50 border border-rose-200 text-rose-600 p-2 rounded-xl transition-all active:scale-90" title="Eliminar">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            lucide.createIcons();
        }

        function renderizarBadge(estado) {
            if (estado === ESTADOS.PENDIENTE) {
                return '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-black bg-blue-100 text-blue-700 tracking-wider uppercase">PENDIENTE</span>';
            }
            return '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10px] font-black bg-emerald-100 text-emerald-700 tracking-wider uppercase">ENTREGADO</span>';
        }

        function renderizarAccionesSimplificadas(venta) {
            if (venta.estado === ESTADOS.PENDIENTE) {
                return `
                    <button onclick="entregarPedido('${venta.id}', '${venta.telefono}', '${venta.cliente}')" class="bg-emerald-600 active:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1 min-h-[40px] shadow-sm uppercase tracking-wide">
                        <i data-lucide="check" class="w-4 h-4"></i> Entregar
                    </button>
                `;
            }
            return `
                <button onclick="enviarWhatsApp('${venta.telefono}', '${venta.id}', '${venta.cliente}')" class="bg-green-500 active:bg-green-600 text-white px-3 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1 min-h-[40px] shadow-sm">
                    <i data-lucide="message-circle" class="w-4 h-4 fill-white"></i> Notificar
                </button>
            `;
        }

        async function entregarPedido(idVenta, telefono, cliente) {
            const confirmacion = await Swal.fire({
                title: '¿Confirmar Entrega?',
                text: `El pedido #${idVenta} se registrará como completado.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#059669',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, Entregado',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmacion.isConfirmed) return;

            Swal.fire({ title: 'Procesando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                const payload = {
                    action: "actualizarEstadoDespacho",
                    idVenta: idVenta,
                    estado: ESTADOS.ENTREGADO,
                    fechaEntrega: new Date().toISOString().split('T')[0]
                };

                await DairyAPI.guardarDatos("Ventas", payload);

                // Al entregar con éxito, le ofrecemos mandar el WhatsApp altiro
                const preguntarWS = await Swal.fire({
                    title: '¡Entrega Registrada!',
                    text: '¿Deseas enviar el comprobante de entrega por WhatsApp ahora mismo?',
                    icon: 'success',
                    showCancelButton: true,
                    confirmButtonColor: '#22c55e',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Sí, enviar mensaje',
                    cancelButtonText: 'Cerrar sin enviar'
                });

                if (preguntarWS.isConfirmed) {
                    await enviarWhatsApp(telefono, idVenta, cliente);
                }

                await cargarDespachos();

            } catch (error) {
                console.error(error);
                Swal.fire("Error", "No se guardó el cambio: " + error.message, "error");
            }
        }

        function abrirDireccion(cliente) {
            const query = encodeURIComponent(cliente);
            window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
        }

        async function enviarWhatsApp(telefonoExistente, idVenta, cliente) {
            let telefonoDestino = telefonoExistente;

            if (!telefonoDestino || telefonoDestino.trim() === "") {
                const { value: nuevoTelefono } = await Swal.fire({
                    title: 'Número Celular',
                    text: `Escriba el celular para ${cliente}:`,
                    input: 'tel',
                    inputPlaceholder: 'Ej: 0998765432',
                    showCancelButton: true,
                    confirmButtonColor: '#059669',
                    cancelButtonColor: '#64748b',
                    confirmButtonText: 'Enviar',
                    cancelButtonText: 'Cancelar'
                });

                if (!nuevoTelefono) return;
                telefonoDestino = nuevoTelefono;
            }

            let numLimpio = telefonoDestino.replace(/[^0-9]/g, '');
            if (numLimpio.startsWith('0')) {
                numLimpio = '593' + numLimpio.substring(1);
            }

            const mensaje = `Estimado(a) *${cliente}*, su pedido *#${idVenta}* ha sido entregado exitosamente. ✔️\n\n¡Muchas gracias por su confianza!\n*LÓGICA LÁCTEA* 🥛🧀`;
            window.open(`https://api.whatsapp.com/send?phone=${numLimpio}&text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        async function anularPedido(idVenta) {
            const confirmacion = await Swal.fire({
                title: '¿Eliminar despacho?',
                text: `Esta acción borrará de forma definitiva el despacho #${idVenta}.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmacion.isConfirmed) return;

            Swal.fire({ title: 'Eliminando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await DairyAPI.guardarDatos("Ventas", {
                    action: "eliminarDespacho",
                    idVenta: idVenta
                });

                Swal.fire({ title: "¡Eliminado!", icon: "success", timer: 1000, showConfirmButton: false });
                await cargarDespachos();

            } catch (error) {
                Swal.fire("Error", "No se pudo eliminar el despacho.", "error");
            }
        }

        function actualizarContadores() {
            const pendientes = todasLasVentas.filter(v => v.estado === ESTADOS.PENDIENTE).length;
            const entregados = todasLasVentas.filter(v => v.estado === ESTADOS.ENTREGADO).length;

            document.getElementById("totalPendientes").innerText = pendientes;
            document.getElementById("totalEntregados").innerText = entregados;
        }

        function filtrarPorEstado(estado) {
            filtroActual = estado;
            aplicarFiltros();
        }

        function filtrarPorBusqueda() {
            textoBusqueda = document.getElementById("buscarCliente").value;
            aplicarFiltros();
        }

        function actualizarBotonesFiltro() {
            const botones = {
                TODOS: document.getElementById("filtroTodos"),
                PENDIENTE: document.getElementById("filtroPendiente"),
                ENTREGADO: document.getElementById("filtroEntregado")
            };

            Object.keys(botones).forEach(estado => {
                const btn = botones[estado];
                if (!btn) return;
                if (filtroActual === estado) {
                    btn.className = "px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-emerald-600 text-white shadow-sm whitespace-nowrap";
                } else {
                    btn.className = "px-5 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-white text-slate-600 border border-slate-200 whitespace-nowrap shadow-xs";
                }
            });
        }

        function mostrarMensajeSinDatos() {
            const tbody = document.getElementById("tbodyDespachos");
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center py-16 text-slate-400 italic">
                        <i data-lucide="database" class="w-12 h-12 mx-auto mb-3 opacity-50"></i>
                        No hay despachos registrados
                    </td>
                </tr>
            `;
            lucide.createIcons();
        }

        async function recargarDatos() {
            Swal.fire({ title: 'Actualizando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            await cargarDespachos();
            Swal.close();
        }
    </script>
</body>
</html>
