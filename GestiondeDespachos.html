<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Despachos - Lógica Láctea</title>
    <!-- Tailwind CSS para diseño fluido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para flujos de confirmación y carga -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado del Módulo -->
    <header class="bg-cyan-900 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="truck" class="w-8 h-8 text-cyan-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Control de Despachos y Rutas</h1>
                <p class="text-xs text-cyan-200">Monitoreo de Entregas, Estados de Envío y Logística de Última Milla</p>
            </div>
        </div>
        <button onclick="cargarDespachos()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all border border-cyan-400 shadow-sm active:scale-95">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar Rutas
        </button>
    </header>

    <!-- Tarjetas de Estado Logístico Rápido -->
    <section class="max-w-7xl mx-auto w-full p-4 md:p-8 grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Órdenes en Cola</span>
                <span id="cardPendientes" class="text-2xl font-black text-amber-600">0</span>
            </div>
            <div class="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">En Tránsito</span>
                <span id="cardRuta" class="text-2xl font-black text-cyan-600">0</span>
            </div>
            <div class="p-2.5 bg-cyan-50 text-cyan-600 rounded-lg"><i data-lucide="package-open" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Entregas Exitosas</span>
                <span id="cardEntregados" class="text-2xl font-black text-emerald-600">0</span>
            </div>
            <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
        </div>
    </section>

    <!-- Tabla de Control Transaccional -->
    <main class="p-4 md:p-8 max-w-7xl mx-auto w-full pt-0">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6">ID Venta</th>
                            <th class="py-3 px-4">Fecha</th>
                            <th class="py-3 px-4">Cliente / Destino</th>
                            <th class="py-3 px-4">Items / Total</th>
                            <th class="py-3 px-4 text-center">Estado Actual</th>
                            <th class="py-3 px-6 text-center">Acciones Logísticas</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyDespachos" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <!-- Loader Dinámico -->
                        <tr>
                            <td colspan="6" class="text-center py-20 text-slate-400">
                                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-cyan-600"></i>
                                <p class="text-xs">Maquetando hoja de ruta desde el servidor de Ventas...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let despachosGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
        });

        async function cargarDespachos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Ventas");
                
                if (Array.isArray(datos)) {
                    despachosGlobal = datos;
                    renderizarDespachos(despachosGlobal);
                    actualizarTarjetasMetricas(despachosGlobal);
                } else if (datos && datos.status === "error") {
                    throw new Error(datos.message);
                }
            } catch (err) {
                console.error("Error al sincronizar bitácora de rutas:", err);
                document.getElementById("tbodyDespachos").innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-10 text-rose-500 font-bold">
                            <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                            Error de comunicación con api-config.js o Google Sheets.<br>
                            <span class="text-xs font-normal text-slate-400">${err.message}</span>
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        function renderizarDespachos(lista) {
            const tbody = document.getElementById("tbodyDespachos");
            tbody.innerHTML = lista.length ? "" : "<tr><td colspan='6' class='text-center py-10 text-slate-400 italic'>No hay ventas registradas.</td></tr>";

            const pedidosAgrupados = {};

            lista.forEach(item => {
                const idVenta = item.ID_Venta || item.id_venta;
                if(!idVenta || idVenta === "ID_Venta") return;

                const totalFila = parseFloat(item.Total || 0);
                const descProducto = `${item.Producto || 'Producto'} (x${item.Cantidad || 1})`;

                if (!pedidosAgrupados[idVenta]) {
                    pedidosAgrupados[idVenta] = {
                        idVenta: idVenta,
                        fecha: item.Fecha || '-',
                        cliente: item.Cliente || "Consumidor Final",
                        productos: [descProducto],
                        montoTotal: totalFila,
                        estado: (item.Estado || "PENDIENTE").toUpperCase()
                    };
                } else {
                    pedidosAgrupados[idVenta].productos.push(descProducto);
                    pedidosAgrupados[idVenta].montoTotal += totalFila;
                }
            });

            const despachosUnicos = Object.values(pedidosAgrupados);

            despachosUnicos.forEach(d => {
                let badgeClass = "";
                let botonFlujo = "";
                const estado = d.estado;

                // Definición del ciclo logístico principal
                if (estado === "PENDIENTE") {
                    badgeClass = "bg-amber-100 text-amber-800 border border-amber-200";
                    botonFlujo = `
                        <button onclick="actualizarEstadoDespacho('${d.idVenta}', 'EN RUTA')" class="bg-cyan-600 hover:bg-cyan-700 text-white px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 shadow-sm transition-all active:scale-95">
                            <i data-lucide="play" class="w-3 h-3"></i> Despachar
                        </button>
                    `;
                } else if (estado === "EN RUTA") {
                    badgeClass = "bg-cyan-100 text-cyan-800 border border-cyan-200 animate-pulse";
                    botonFlujo = `
                        <button onclick="actualizarEstadoDespacho('${d.idVenta}', 'ENTREGADO')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 shadow-sm transition-all active:scale-95">
                            <i data-lucide="check" class="w-3 h-3"></i> Entregado
                        </button>
                    `;
                } else if (estado === "ENTREGADO") {
                    badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-200";
                    botonFlujo = `
                        <span class="text-emerald-600 text-[11px] font-bold flex items-center gap-1 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 shadow-sm">
                            <i data-lucide="shield-check" class="w-3.5 h-3.5"></i> Completado
                        </span>
                    `;
                } else {
                    badgeClass = "bg-slate-100 text-slate-700 border border-slate-200";
                    botonFlujo = `<span class="text-slate-400 text-[11px] italic">${estado}</span>`;
                }

                const listaProductosText = d.productos.join(', ');

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50/60 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-mono font-bold text-slate-600">#${d.idVenta}</td>
                    <td class="py-3.5 px-4 font-mono text-xs text-slate-500">${d.fecha}</td>
                    <td class="py-3.5 px-4">
                        <div class="font-black text-slate-800">${d.cliente}</div>
                        <!-- BOTÓN DIRECCIÓN (MAPS) -->
                        <button onclick="abrirDireccion('${d.cliente}')" class="text-cyan-600 hover:text-cyan-700 font-bold text-[11px] flex items-center gap-1 mt-0.5 transition-all active:translate-x-0.5">
                            <i data-lucide="map-pin" class="w-3 h-3 text-cyan-500"></i> Ver ubicación en mapa
                        </button>
                    </td>
                    <td class="py-3.5 px-4 text-slate-600">
                        <div class="text-xs truncate max-w-[200px] font-semibold text-slate-500" title="${listaProductosText}">${listaProductosText}</div>
                        <div class="text-xs font-bold text-cyan-700">$${d.montoTotal.toFixed(2)}</div>
                    </td>
                    <td class="py-3.5 px-4 text-center">
                        <span class="px-2 py-0.5 rounded-md font-black text-[10px] uppercase tracking-wider ${badgeClass}">
                            ${estado}
                        </span>
                    </td>
                    <!-- PANEL DE ACCIONES LOGÍSTICAS COMPLETO -->
                    <td class="py-3.5 px-6">
                        <div class="flex items-center justify-center gap-2">
                            ${botonFlujo}
                            
                            <!-- BOTÓN WHATSAPP -->
                            <button onclick="enviarMensajeWhatsapp('${d.idVenta}', '${d.cliente}', '${listaProductosText}', '${d.montoTotal.toFixed(2)}')" class="bg-emerald-500 hover:bg-emerald-600 text-white p-1.5 rounded shadow-sm transition-all active:scale-90" title="Notificar por WhatsApp">
                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                            </button>

                            <!-- BOTÓN ELIMINAR / ANULAR ORDEN -->
                            <button onclick="eliminarOrdenDespacho('${d.idVenta}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-1.5 rounded border border-rose-200 shadow-sm transition-all active:scale-90" title="Eliminar / Anular Pedido">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Métrica reactiva calculada basándose en IDs únicos
        function actualizarTarjetasMetricas(lista) {
            let p = 0, r = 0, e = 0;
            const visitados = new Set();

            lista.forEach(item => {
                const idVenta = item.ID_Venta || item.id_venta;
                if (!idVenta || idVenta === "ID_Venta" || visitados.has(idVenta)) return;
                
                visitados.add(idVenta);
                const est = (item.Estado || "PENDIENTE").toUpperCase();
                
                if (est === "PENDIENTE") p++;
                else if (est === "EN RUTA") r++;
                else if (est === "ENTREGADO") e++;
            });

            document.getElementById("cardPendientes").innerText = p;
            document.getElementById("cardRuta").innerText = r;
            document.getElementById("cardEntregados").innerText = e;
        }

        // FUNCIÓN 1: ABRIR DIRECCIÓN EN MAPS
        function abrirDireccion(cliente) {
            const query = encodeURIComponent(cliente);
            const url = `https://www.google.com/maps/search/?api=1&query=${query}`;
            window.open(url, '_blank');
        }

        // FUNCIÓN 2: WHATSAPP DINÁMICO PIDIENDO TELÉFONO
        async function enviarMensajeWhatsapp(idVenta, cliente, productos, total) {
            const { value: telefono } = await Swal.fire({
                title: 'Notificar Entrega',
                text: `Ingrese el número de WhatsApp para el cliente: ${cliente}`,
                input: 'tel',
                inputPlaceholder: 'Ej: 0998765432 o 593998765432',
                showCancelButton: true,
                confirmButtonColor: '#10b981',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<i class="inline-block mr-1" data-lucide="send"></i> Enviar Mensaje',
                didOpen: () => { lucide.createIcons(); }
            });

            if (!telefono) return; // Si cancela o no digita nada, frena el flujo

            let msg = `*🥛 LÓGICA LÁCTEA - CONTROL DE ENTREGAS *\n\n`;
            msg += `Hola *${cliente}*, su pedido ya se encuentra procesado en nuestra logística.\n\n`;
            msg += `• *Orden:* #${idVenta}\n`;
            msg += `• *Detalle:* ${productos}\n`;
            msg += `• *Monto Total:* $${total}\n\n`;
            msg += `¡Gracias por elegirnos! Nos vemos pronto en su entrega.`;

            let numLimpio = telefono.replace(/[^0-9]/g, '');
            if (numLimpio.startsWith('0')) {
                numLimpio = '593' + numLimpio.substring(1);
            }

            window.open(`https://wa.me/${numLimpio}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // FUNCIÓN 3: ELIMINAR / ANULAR ORDEN DESDE LA INTERFAZ
        async function eliminarOrdenDespacho(idVenta) {
            const result = await Swal.fire({
                title: '¿Anular este despacho?',
                text: `Esta acción eliminará todas las líneas vinculadas al ID Venta #${idVenta} en Google Sheets de forma permanente.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            });

            if (!result.isConfirmed) return;

            Swal.fire({
                title: 'Eliminando de la base...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                action: "eliminarDespacho",
                idVenta: idVenta
            };

            try {
                // Envía la acción de remoción apuntando a la hoja física de Ventas
                await DairyAPI.guardarDatos("Ventas", payload);

                Swal.fire('Eliminado', `La orden #${idVenta} fue removida con éxito.`, 'success');
                cargarDespachos(); // Recarga la cuadrícula refrescada
            } catch (err) {
                console.error("Error al remover orden:", err);
                Swal.fire("Error", "No se pudo realizar el borrado en Google Sheets.", "error");
            }
        }

        // Sincronización base de cambio de estados
        async function actualizarEstadoDespacho(idVenta, nuevoEstado) {
            Swal.fire({
                title: 'Sincronizando Estado...',
                text: `Modificando Pedido #${idVenta} a: ${nuevoEstado}`,
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                action: "actualizarEstadoDespacho",
                idVenta: idVenta,
                estado: nuevoEstado,
                fechaEntrega: nuevoEstado === "ENTREGADO" ? new Date().toISOString().split('T')[0] : ""
            };

            try {
                await DairyAPI.guardarDatos("Ventas", payload);
                Swal.fire({
                    title: 'Cambio Confirmado',
                    text: `La orden #${idVenta} cambió a ${nuevoEstado} con éxito.`,
                    icon: 'success',
                    confirmButtonColor: '#0891b2'
                });
                cargarDespachos();
            } catch (err) {
                console.error("Error al actualizar estado logístico:", err);
                Swal.fire("Error de Conexión", "No se pudo impactar el cambio en Google Sheets.", "error");
            }
        }
    </script>
</body>
</html>
