<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas Premium - Lógica Láctea</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <style>
        body { background-color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 120px; }
        .input-premium { 
            width: 100%; padding: 1rem; background: #f1f5f9; border: 2px solid transparent; 
            border-radius: 1.2rem; font-weight: 700; transition: all 0.3s; outline: none;
        }
        .input-premium:focus { background: white; border-color: #a21caf; box-shadow: 0 10px 20px -5px rgba(162, 28, 175, 0.1); }
        
        .card-prod { 
            background: white; border-radius: 1.5rem; padding: 1rem; 
            display: flex; align-items: center; justify-content: space-between;
            border: 1px solid #f1f5f9; margin-bottom: 0.75rem;
        }
        .btn-cant { width: 40px; height: 40px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-weight: 800; transition: all 0.2s; }
        
        #pantalla-carga {
            position: fixed; inset: 0; background: rgba(255,255,255,0.9); 
            backdrop-filter: blur(10px); z-index: 9999; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .nav-inferior {
            position: fixed; bottom: 20px; left: 20px; right: 20px;
            background: #0f172a; border-radius: 2rem; padding: 15px;
            display: flex; justify-content: space-around; z-index: 1000;
        }
    </style>
</head>
<body>

<div id="pantalla-carga">
    <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="font-black text-slate-800 uppercase text-xs tracking-widest">Sincronizando...</p>
</div>

<header class="p-6 pt-10">
    <h1 class="text-3xl font-800 text-slate-900 tracking-tighter italic">VENTAS<span class="text-primary">.</span></h1>
    <p id="display-id" class="text-[10px] font-800 text-slate-400 mt-1 uppercase tracking-widest"></p>
</header>

<main class="px-6 space-y-6">
    <!-- SECCIÓN CLIENTE -->
    <section class="bg-white p-6 rounded-[2.5rem] shadow-xl shadow-slate-200/50">
        <div class="flex justify-between items-center mb-4">
            <span class="text-[10px] font-800 text-slate-400 uppercase">Cliente</span>
            <button onclick="alternarNuevoCliente()" class="text-[10px] font-800 text-primary uppercase underline">Nuevo +</button>
        </div>
        
        <select id="select-cliente" class="input-premium mb-4">
            <option value="">SELECCIONAR CLIENTE</option>
        </select>

        <div id="form-nuevo-cliente" class="hidden space-y-3 pt-4 border-t border-slate-50">
            <input type="text" id="nc-nombre" placeholder="NOMBRE COMPLETO" class="input-premium text-xs">
            <input type="number" id="nc-ruc" placeholder="RUC / CÉDULA" class="input-premium text-xs">
            <button onclick="guardarNuevoCliente()" class="w-full py-4 bg-primary text-white bg-fuchsia-600 rounded-2xl font-800 text-xs uppercase">Registrar Cliente</button>
        </div>
    </section>

    <!-- LISTA PRODUCTOS -->
    <section>
        <div class="relative mb-4">
            <span class="material-symbols-outlined absolute left-4 top-3.5 text-slate-400">search</span>
            <input type="text" id="buscador" oninput="filtrar()" placeholder="Buscar producto..." class="input-premium pl-12 text-xs">
        </div>
        <div id="lista-productos"></div>
    </section>
</main>

<!-- CARRITO FLOTANTE -->
<div class="fixed bottom-32 left-6 right-6 bg-white p-6 rounded-[2.5rem] shadow-2xl border border-slate-100 z-50">
    <div class="flex justify-between items-end mb-4">
        <div>
            <p class="text-[10px] font-800 text-slate-400 uppercase">Total Pedido</p>
            <p id="total-dinero" class="text-4xl font-800 text-slate-900 leading-none">$0.00</p>
        </div>
        <input type="date" id="fecha-entrega" class="bg-slate-50 border-none rounded-xl text-[10px] font-800 p-2">
    </div>
    <button onclick="finalizarVenta()" class="w-full py-5 bg-slate-900 text-white rounded-[1.5rem] font-800 uppercase text-xs tracking-widest shadow-xl shadow-slate-300">Confirmar Venta</button>
</div>

<script>
let inventario = [];
let carrito = {};
let idVentaGlobal = "";

async function inicializar() {
    idVentaGlobal = "V-" + Date.now().toString().slice(-6);
    document.getElementById('display-id').innerText = "ID VENTA: " + idVentaGlobal;
    document.getElementById('fecha-entrega').valueAsDate = new Date();

    try {
        const [resInv, resCli] = await Promise.all([
            DairyAPI.obtenerDatos("Inventario"),
            DairyAPI.obtenerDatos("Clientes")
        ]);

        inventario = resInv;
        
        // Cargar Clientes
        const select = document.getElementById('select-cliente');
        resCli.sort((a,b) => a.Nombre.localeCompare(b.Nombre)).forEach(c => {
            let opt = document.createElement('option');
            opt.value = c.Nombre;
            opt.innerText = c.Nombre;
            select.appendChild(opt);
        });

        renderizarProductos();
    } catch (e) {
        alert("Error cargando base de datos");
    }
}

function renderizarProductos() {
    const contenedor = document.getElementById('lista-productos');
    contenedor.innerHTML = "";
    
    inventario.forEach(p => {
        const cant = carrito[p.Producto] || 0;
        contenedor.innerHTML += `
            <div class="card-prod" data-name="${p.Producto.toLowerCase()}">
                <div class="flex-1">
                    <p class="text-xs font-800 text-slate-800 uppercase">${p.Producto}</p>
                    <p class="text-[10px] font-700 text-primary mt-0.5">$${parseFloat(p.Precio_Venta).toFixed(2)}</p>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 p-1 rounded-xl">
                    <button onclick="updateCant('${p.Producto}', -1)" class="btn-cant bg-white text-slate-400 shadow-sm">-</button>
                    <span class="w-4 text-center font-800 text-xs">${cant}</span>
                    <button onclick="updateCant('${p.Producto}', 1)" class="btn-cant bg-slate-900 text-white shadow-md">+</button>
                </div>
            </div>
        `;
    });
}

function updateCant(nombre, cambio) {
    const p = inventario.find(i => i.Producto === nombre);
    const actual = carrito[nombre] || 0;
    const nuevo = actual + cambio;

    if (nuevo >= 0) {
        if (cambio > 0 && nuevo > parseInt(p.Stock)) {
            return alert("Stock insuficiente (" + p.Stock + " disp.)");
        }
        carrito[nombre] = nuevo;
        renderizarProductos();
        calcularTotal();
    }
}

function calcularTotal() {
    let total = 0;
    Object.keys(carrito).forEach(nombre => {
        const p = inventario.find(i => i.Producto === nombre);
        total += (carrito[nombre] * parseFloat(p.Precio_Venta));
    });
    document.getElementById('total-dinero').innerText = "$" + total.toFixed(2);
}

async function finalizarVenta() {
    const cliente = document.getElementById('select-cliente').value;
    const fechaEnt = document.getElementById('fecha-entrega').value;
    const items = Object.keys(carrito).filter(n => carrito[n] > 0);

    if (!cliente) return alert("Selecciona un cliente");
    if (items.length === 0) return alert("Agrega productos");

    document.getElementById('pantalla-carga').style.display = 'flex';

    try {
        for (const nombre of items) {
            const p = inventario.find(i => i.Producto === nombre);
            const cantidad = carrito[nombre];
            const pvp = parseFloat(p.Precio_Venta);
            const total = cantidad * pvp;

            // ESTE OBJETO SIGUE TU HOJA DE EXCEL EXACTAMENTE
            const payload = {
                pestaña: "Ventas",
                ID_Venta: idVentaGlobal,
                Fecha: new Date().toLocaleDateString(),
                Cliente: cliente,
                Producto: nombre,
                Cantidad: cantidad,
                "Precio PVP": pvp, // IMPORTANTE: El nombre debe ser idéntico al encabezado
                "Precio Total": total,
                Estado: "PENDIENTE",
                Fecha_Entrega: fechaEnt
            };

            await DairyAPI.enviarDatos(payload);
        }
        
        alert("VENTA GUARDADA CORRECTAMENTE");
        location.reload();
    } catch (e) {
        alert("Error al guardar");
        document.getElementById('pantalla-carga').style.display = 'none';
    }
}

function filtrar() {
    const q = document.getElementById('buscador').value.toLowerCase();
    document.querySelectorAll('.card-prod').forEach(card => {
        card.style.display = card.dataset.name.includes(q) ? 'flex' : 'none';
    });
}

function alternarNuevoCliente() {
    document.getElementById('form-nuevo-cliente').classList.toggle('hidden');
}

async function guardarNuevoCliente() {
    const nombre = document.getElementById('nc-nombre').value.toUpperCase();
    const ruc = document.getElementById('nc-ruc').value;
    if (!nombre || !ruc) return alert("Completa los datos");

    await DairyAPI.enviarDatos({
        pestaña: "Clientes",
        ID: "C-" + Date.now().toString().slice(-4),
        Nombre: nombre,
        CI_RUC: ruc,
        "Fecha Registro": new Date().toLocaleDateString()
    });
    alert("Cliente registrado");
    location.reload();
}

window.onload = inicializar;
</script>

</body>
</html>
