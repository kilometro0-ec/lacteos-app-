<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Despachos Pro - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { background-color: #fcfcfd; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 120px; }
        .card-premium { background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.04); }
        .card-reprogramado { background: #fffbeb; border: 1px solid #fde68a; }
        .nav-glass { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 12px; z-index: 1000; }
        .modal-blur { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: flex-end; }
        .sheet-bottom { background: white; width: 100%; border-radius: 3rem 3rem 0 0; padding: 30px; animation: slideUp 0.4s cubic-bezier(0, 1, 0, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<header class="px-6 pt-10 pb-6 flex justify-between items-end">
    <div>
        <p class="text-[10px] font-800 text-slate-400 uppercase tracking-widest">Logística Pro</p>
        <h1 class="text-3xl font-800 text-slate-900 tracking-tighter">Rutas de hoy</h1>
    </div>
    <button onclick="cargarDatos()" class="w-11 h-11 flex items-center justify-center bg-slate-900 text-white rounded-2xl">
        <span id="refresh-icon" class="material-symbols-outlined">sync</span>
    </button>
</header>

<div class="px-6 grid grid-cols-2 gap-4 mb-8">
    <div class="bg-indigo-50 p-5 rounded-[2rem] border border-indigo-100">
        <p id="cont-pend" class="text-2xl font-800 text-indigo-700">0</p>
        <p class="text-[9px] font-800 text-indigo-400 uppercase tracking-wider">Pendientes</p>
    </div>
    <div class="bg-emerald-50 p-5 rounded-[2rem] border border-emerald-100">
        <p id="cont-ent" class="text-2xl font-800 text-emerald-700">0</p>
        <p class="text-[9px] font-800 text-emerald-400 uppercase tracking-wider">Completados</p>
    </div>
</div>

<main id="contenedor-pedidos" class="px-6 space-y-6"></main>

<!-- Modal Edición -->
<div id="modal-edit" class="modal-blur" onclick="cerrarEdicion()">
    <div class="sheet-bottom" onclick="event.stopPropagation()">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <h2 class="text-xl font-800 text-slate-900 mb-1">Editar Pedido</h2>
        <p id="edit-id-display" class="text-xs font-bold text-indigo-600 mb-6"></p>
        <input type="date" id="edit-fecha" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold mb-6">
        <div id="edit-productos-list" class="space-y-2 mb-6"></div>
        <div class="flex gap-3">
            <button onclick="cerrarEdicion()" class="flex-1 py-4 text-slate-400 font-800 text-xs">CANCELAR</button>
            <button onclick="guardarCambiosPedido()" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-800 text-xs">GUARDAR</button>
        </div>
    </div>
</div>

<div id="menu-container"></div>

<script>
let pedidosLocal = [];
let pedidoEnEdicion = null;

async function cargarDatos() {
    const icon = document.getElementById('refresh-icon');
    icon.classList.add('animate-spin');
    try {
        const [ventas, clientes] = await Promise.all([
            DairyAPI.obtenerDatos("Ventas"),
            DairyAPI.obtenerDatos("Clientes")
        ]);
        
        const agrupados = {};
        let completados = 0;

        ventas.forEach(v => {
            const estado = String(v.Estado || "").trim().toUpperCase();
            if(estado === "ENTREGADO") { completados++; return; }
            if(estado === "PENDIENTE" || estado === "REPROGRAMADO") {
                const id = v.ID_Venta;
                if(!agrupados[id]) {
                    agrupados[id] = { id, cliente: v.Cliente, total: 0, items: [], fecha: v.Fecha_Entrega, estado, direccion: clientes.find(c => c.Nombre === v.Cliente)?.Dirección || "Sin dirección" };
                }
                const sub = parseFloat(v.Cantidad) * parseFloat(v.Precio_PVP);
                agrupados[id].items.push({ ...v, subtotal: sub });
                agrupados[id].total += sub;
            }
        });

        pedidosLocal = Object.values(agrupados).reverse();
        document.getElementById('cont-ent').innerText = completados;
        renderizar();
    } finally { icon.classList.remove('animate-spin'); }
}

function renderizar() {
    const container = document.getElementById('contenedor-pedidos');
    document.getElementById('cont-pend').innerText = pedidosLocal.length;
    container.innerHTML = "";

    pedidosLocal.forEach(ped => {
        const esRepro = ped.estado === "REPROGRAMADO";
        container.innerHTML += `
            <div class="card-premium p-6 ${esRepro ? 'card-reprogramado' : ''}">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <span class="text-[9px] font-800 text-slate-400 uppercase">ID: ${ped.id}</span>
                        <h2 class="text-xl font-800 text-slate-800 uppercase leading-tight">${ped.cliente}</h2>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="abrirEdicion('${ped.id}')" class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-600"><span class="material-symbols-outlined">edit</span></button>
                        <button onclick="window.open('https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ped.direccion)}') "class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600"><span class="material-symbols-outlined">directions</span></button>
                    </div>
                </div>
                <div class="space-y-1 mb-6">
                    ${ped.items.map(it => `<div class="flex justify-between text-xs font-bold text-slate-500"><span>${it.Producto} x${it.Cantidad}</span><span>$${it.subtotal.toFixed(2)}</span></div>`).join('')}
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <p class="text-3xl font-800 text-slate-900">$${ped.total.toFixed(2)}</p>
                    <button onclick="marcarEntregado('${ped.id}')" class="h-12 px-6 bg-emerald-600 text-white rounded-xl font-800 text-xs">ENTREGADO</button>
                </div>
            </div>`;
    });
}

function abrirEdicion(id) {
    pedidoEnEdicion = JSON.parse(JSON.stringify(pedidosLocal.find(p => p.id === id)));
    document.getElementById('edit-id-display').innerText = `EDITANDO ID: ${id}`;
    document.getElementById('edit-fecha').value = pedidoEnEdicion.fecha;
    document.getElementById('modal-edit').style.display = 'flex';
}

function cerrarEdicion() { document.getElementById('modal-edit').style.display = 'none'; }

async function marcarEntregado(id) {
    if(!confirm("¿Confirmar entrega?")) return;
    await DairyAPI.enviarDatos({ pestaña: "Ventas", accion: "MARCAR_ENTREGADO", ID_Venta: id });
    cargarDatos();
}

async function guardarCambiosPedido() {
    const nuevaFecha = document.getElementById('edit-fecha').value;
    const esRepro = nuevaFecha !== pedidoEnEdicion.fecha;
    await DairyAPI.enviarDatos({ pestaña: "Ventas", accion: "ELIMINAR_PEDIDO_ID", ID_Venta: pedidoEnEdicion.id });
    for(let it of pedidoEnEdicion.items) {
        await DairyAPI.enviarDatos({ pestaña: "Ventas", ID_Venta: pedidoEnEdicion.id, Cliente: pedidoEnEdicion.cliente, Producto: it.Producto, Cantidad: it.Cantidad, Precio_PVP: it.Precio_PVP, Fecha_Entrega: nuevaFecha, Estado: esRepro ? "REPROGRAMADO" : "PENDIENTE" });
    }
    cerrarEdicion();
    cargarDatos();
}

function renderMenu() {
    const opciones = [
        { nombre: 'Panel', icon: 'dashboard', link: 'DashboardLacteo.html' },
        { nombre: 'Ventas', icon: 'add_shopping_cart', link: 'Ventas.html' },
        { nombre: 'Rutas', icon: 'local_shipping', link: 'Rutas.html' }
    ];
    let html = '<nav class="nav-glass flex justify-around items-center">';
    opciones.forEach(opt => {
        const esActivo = window.location.pathname.includes(opt.link) ? 'text-indigo-600' : 'text-slate-400';
        html += `<button onclick="location.href='${opt.link}'" class="flex flex-col items-center gap-1"><span class="material-symbols-outlined ${esActivo}">${opt.icon}</span><span class="text-[8px] font-800 uppercase ${esActivo}">${opt.nombre}</span></button>`;
    });
    document.getElementById('menu-container').innerHTML = html + '</nav>';
}

window.onload = () => { cargarDatos(); renderMenu(); };
</script>
</body>
</html>
