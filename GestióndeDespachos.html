<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Despachos - Lógica Láctea</title>
    <!-- CONEXIÓN A ARCHIVOS RAÍZ -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <!-- Tailwind CSS para diseño fluido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para flujos de confirmación y carga -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado del Módulo -->
    <header class="bg-cyan-900 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="truck" class="w-8 h-8 text-cyan-400"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Control de Despachos y Rutas</h1>
                <p class="text-xs text-cyan-200">Monitoreo de Entregas, Estados de Envío y Logística de Última Milla</p>
            </div>
        </div>
        <button onclick="cargarDespachos()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-all border border-cyan-400 shadow-sm active:scale-95">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Sincronizar Rutas
        </button>
    </header>

    <!-- Tarjetas de Estado Logístico Rápido -->
    <section class="max-w-7xl mx-auto w-full p-4 md:p-8 grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Órdenes en Cola</span>
                <span id="cardPendientes" class="text-2xl font-black text-amber-600">0</span>
            </div>
            <div class="p-2.5 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="clock" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">En Tránsito</span>
                <span id="cardRuta" class="text-2xl font-black text-cyan-600">0</span>
            </div>
            <div class="p-2.5 bg-cyan-50 text-cyan-600 rounded-lg"><i data-lucide="package-open" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
            <div>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Entregas Exitosas</span>
                <span id="cardEntregados" class="text-2xl font-black text-emerald-600">0</span>
            </div>
            <div class="p-2.5 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
        </div>
    </section>

    <!-- Tabla de Control Transaccional -->
    <main class="p-4 md:p-8 max-w-7xl mx-auto w-full pt-0">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                            <th class="py-3 px-6">ID Venta</th>
                            <th class="py-3 px-4">Fecha</th>
                            <th class="py-3 px-4">Cliente</th>
                            <th class="py-3 px-4">Dirección de Entrega</th>
                            <th class="py-3 px-4 text-center">Estado Actual</th>
                            <th class="py-3 px-6 text-center">Acción Logística</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyDespachos" class="divide-y divide-slate-100 font-medium text-slate-700">
                        <!-- Loader Dinámico -->
                        <tr>
                            <td colspan="6" class="text-center py-20 text-slate-400">
                                <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto mb-4 text-cyan-600"></i>
                                <p class="text-xs">Maquetando hoja de ruta desde el servidor de Almacén...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let despachosGlobal = [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            cargarDespachos();
        });

        // Consumo utilizando el estándar global de Lógica Láctea
        async function cargarDespachos() {
            try {
                // Se solicitan los registros de la colección u hoja "Despachos" (o "Ventas" según tu esquema)
                const datos = await DairyAPI.obtenerDatos("Despachos");
                
                if (Array.isArray(datos)) {
                    despachosGlobal = datos;
                    renderizarDespachos(despachosGlobal);
                    actualizarTarjetasMetricas(despachosGlobal);
                } else if (datos && datos.status === "error") {
                    throw new Error(datos.message);
                }
            } catch (err) {
                console.error("Error al sincronizar bitácora de rutas:", err);
                document.getElementById("tbodyDespachos").innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center py-10 text-rose-500 font-bold">
                            <i data-lucide="alert-triangle" class="w-8 h-8 mx-auto mb-2"></i>
                            Error de comunicación con api-config.js o Google Sheets.
                        </td>
                    </tr>
                `;
                lucide.createIcons();
            }
        }

        // Renderizado de filas logísticas con semáforo de estados y protección de llaves nulas
        function renderizarDespachos(lista) {
            const tbody = document.getElementById("tbodyDespachos");
            tbody.innerHTML = lista.length ? "" : "<tr><td colspan='6' class='text-center py-10 text-slate-400 italic'>No hay órdenes registradas pendientes de despacho.</td></tr>";

            lista.forEach(d => {
                let badgeClass = "";
                let botonAccion = "";
                
                // Homologación de llaves seguras e ID transaccional
                const idVenta = d.idVenta || d.id || d.codigo || "S/I";
                const estado = (d.estado || "PENDIENTE").toUpperCase();
                const cliente = d.cliente || d.nombreCliente || d.razonSocial || "Cliente Genérico";
                const direccion = d.direccion || d.direccionEntrega || '';

                // Reglas visuales según el estado del ciclo de vida del pedido
                if (estado === "PENDIENTE") {
                    badgeClass = "bg-amber-100 text-amber-800 border border-amber-200";
                    botonAccion = `
                        <button onclick="actualizarEstadoDespacho('${idVenta}', 'EN RUTA')" class="bg-cyan-600 hover:bg-cyan-700 text-white px-2.5 py-1 rounded text-[10px] font-black uppercase tracking-wider flex items-center gap-1 mx-auto transition-all active:scale-95 shadow-sm">
                            <i data-lucide="play" class="w-3 h-3"></i> Despachar
                        </button>
                    `;
                } else if (estado === "EN RUTA") {
                    badgeClass = "bg-cyan-100 text-cyan-800 border border-cyan-200 animate-pulse";
                    botonAccion = `
                        <button onclick="actualizarEstadoDespacho('${idVenta}', 'ENTREGADO')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-[10px] font-black uppercase tracking-wider flex items-center gap-1 mx-auto transition-all active:scale-95 shadow-sm">
                            <i data-lucide="check" class="w-3 h-3"></i> Entregado
                        </button>
                    `;
                } else if (estado === "ENTREGADO") {
                    badgeClass = "bg-emerald-100 text-emerald-800 border border-emerald-200";
                    botonAccion = `
                        <span class="text-slate-400 text-[11px] italic flex items-center justify-center gap-1">
                            <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500"></i> Finalizado
                        </span>
                    `;
                } else {
                    // Estado de contingencia por si manejan cancelaciones u otros estados
                    badgeClass = "bg-slate-100 text-slate-700 border border-slate-200";
                    botonAccion = `<span class="text-slate-400 text-[11px] italic">${estado}</span>`;
                }

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50/60 transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-6 font-mono font-bold text-slate-600">#${idVenta}</td>
                    <td class="py-3.5 px-4 font-mono text-xs text-slate-500">${d.fecha || '-'}</td>
                    <td class="py-3.5 px-4 font-black text-slate-800">${cliente}</td>
                    <td class="py-3.5 px-4 text-slate-500 max-w-xs truncate" title="${direccion}">${direccion ? direccion : '<span class="text-slate-300 italic">Retira en planta</span>'}</td>
                    <td class="py-3.5 px-4 text-center">
                        <span class="px-2 py-0.5 rounded-md font-black text-[10px] uppercase tracking-wider ${badgeClass}">
                            ${estado}
                        </span>
                    </td>
                    <td class="py-3.5 px-6 text-center">${botonAccion}</td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // Calcula el conteo de indicadores superiores de manera reactiva
        function actualizarTarjetasMetricas(lista) {
            let p = 0, r = 0, e = 0;
            lista.forEach(d => {
                const est = (d.estado || "PENDIENTE").toUpperCase();
                if (est === "PENDIENTE") p++;
                else if (est === "EN RUTA") r++;
                else if (est === "ENTREGADO") e++;
            });
            document.getElementById("cardPendientes").innerText = p;
            document.getElementById("cardRuta").innerText = r;
            document.getElementById("cardEntregados").innerText = e;
        }

        // Envía la mutación de estado de forma asíncrona y segura a la API unificada
        async function actualizarEstadoDespacho(idVenta, nuevoEstado) {
            Swal.fire({
                title: 'Actualizando Bitácora...',
                text: `Cambiando orden al estado: ${nuevoEstado}`,
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            const payload = {
                action: "actualizarEstadoDespacho",
                idVenta: idVenta,
                estado: nuevoEstado,
                fechaCambio: new Date().toISOString().split('T')[0]
            };

            try {
                // Se envía la mutación mediante el método global de guardado/actualización
                await DairyAPI.guardarDatos("Despachos", payload);

                Swal.fire({
                    title: 'Ruta Actualizada',
                    text: `El pedido #${idVenta} avanzó en la cadena de distribución con éxito.`,
                    icon: 'success',
                    confirmButtonColor: '#0891b2'
                });
                
                cargarDespachos(); // Actualización en caliente de la vista completa
            } catch (err) {
                console.error("Error al actualizar estado logístico:", err);
                Swal.fire("Error Logístico", "No se pudo sincronizar el cambio de estado con el servidor central de Google Sheets.", "error");
            }
        }
    </script>
</body>
</html>
