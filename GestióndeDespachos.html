<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Despachos | Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js?v=1.4"></script>
    <script src="menu-logic.js?v=1.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#ea580c' } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="pb-32 bg-slate-50 text-slate-800">
    <header class="fixed top-0 w-full z-40 flex justify-between items-center px-6 h-20 bg-gradient-to-r from-orange-600 to-orange-800 text-white shadow-md">
        <div>
            <h1 class="text-[9px] font-black text-orange-200 uppercase tracking-widest">Distribución</h1>
            <h2 class="text-base font-black uppercase tracking-tight">Rutas de Despacho</h2>
        </div>
        <span class="material-symbols-outlined text-2xl">local_shipping</span>
    </header>

    <main class="pt-24 px-4 max-w-xl mx-auto space-y-4">
        <div id="lista-despachos" class="grid gap-3"></div>
    </main>
    <nav id="menu-container"></nav>

    <script>
        async function cargar() {
            try {
                const ventas = await DairyAPI.obtenerDatos("Ventas");
                const pendientes = (ventas || []).filter(v => String(v.Estado).trim().toUpperCase() === "PENDIENTE");
                renderizar(pendientes);
            } catch(e) { console.error(e); }
        }
        function renderizar(lista) {
            if(lista.length === 0) {
                document.getElementById('lista-despachos').innerHTML = `<p class="text-center text-slate-400 font-bold py-10 text-xs uppercase">No hay despachos pendientes.</p>`;
                return;
            }
            document.getElementById('lista-despachos').innerHTML = lista.map(v => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-center">
                        <p class="text-[10px] font-black text-orange-600 uppercase">${v.ID_Venta}</p>
                        <span class="text-[9px] font-black text-orange-700 bg-orange-50 px-2.5 py-1 rounded-md uppercase border border-orange-100">Por Despachar</span>
                    </div>
                    <h3 class="text-xs font-black uppercase text-slate-800">${v.Cliente}</h3>
                    <p class="text-[11px] font-medium text-slate-500">${v.Producto} — <span class="font-extrabold text-slate-800">${v.Cantidad} Uds</span></p>
                </div>`).join('');
        }
        window.onload = cargar;
    </script>
</body>
</html>
