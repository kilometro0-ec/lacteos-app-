<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Despachos - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { background-color: #f8fafc; padding-bottom: 90px; font-family: sans-serif; }
        .card-pro { background: white; border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05); overflow: hidden; }
        .btn-mapa-azul { background-color: #eff6ff; color: #2563eb; border: 1px solid #dbeafe; border-radius: 1.2rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .btn-verde { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; font-weight: 900; text-transform: uppercase; border-radius: 1.2rem; }
        .nav-fija { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid #f3e8ff; padding: 10px 0; z-index: 9999; }
        .menu-grid { max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; color: #94a3b8; font-size: 8px; font-weight: 800; text-transform: uppercase; }
        .active-btn { color: #a21caf; }
        .modal-custom { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); z-index: 10001; display: none; align-items: center; justify-content: center; padding: 25px; }
        .modal-box { background: white; width: 100%; max-width: 300px; border-radius: 2.5rem; padding: 30px; text-align: center; }
    </style>
</head>
<body>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-20 bg-white/80 backdrop-blur-md border-b border-purple-50">
    <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-[#a21caf] to-[#db2777] flex items-center justify-center text-white">
            <span class="material-symbols-outlined font-black">local_shipping</span>
        </div>
        <h1 class="font-black text-slate-800">DESPACHOS</h1>
    </div>
    <button onclick="cargarDatos()" class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center border border-slate-100">
        <span id="refresh-icon" class="material-symbols-outlined text-slate-500">sync</span>
    </button>
</header>

<main class="pt-24 px-5 max-w-lg mx-auto space-y-6">
    <!-- STATS -->
    <div class="grid grid-cols-2 gap-4">
        <div class="bg-white p-5 rounded-[2rem] border border-orange-50 text-center">
            <p id="cont-pend" class="text-3xl font-black text-orange-500">0</p>
            <p class="text-[10px] font-black text-slate-400 uppercase">Pendientes</p>
        </div>
        <div class="bg-white p-5 rounded-[2rem] border border-green-50 text-center">
            <p id="cont-ent" class="text-3xl font-black text-green-500">0</p>
            <p class="text-[10px] font-black text-slate-400 uppercase">Entregados</p>
        </div>
    </div>

    <!-- CONTENEDOR DE PEDIDOS -->
    <div id="contenedor-pedidos" class="space-y-6 pb-20"></div>
</main>

<!-- MODAL CONFIRMACIÓN -->
<div id="modal-confirm" class="modal-custom">
    <div class="modal-box">
        <div id="confirm-icon" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"></div>
        <h3 id="confirm-title" class="font-black text-slate-800 text-lg mb-2"></h3>
        <p id="confirm-text" class="text-slate-500 text-[11px] mb-6"></p>
        <div class="flex gap-3">
            <button onclick="cerrarModal('modal-confirm')" class="flex-1 py-3 font-black text-slate-400 text-xs uppercase">No</button>
            <button id="confirm-ok" class="flex-1 py-4 rounded-2xl font-black text-white text-xs uppercase">Confirmar</button>
        </div>
    </div>
</div>

<div id="menu-container"></div>

<script>
let pedidosLocal = [];
let statsSesion = JSON.parse(localStorage.getItem('statsDespachos')) || { pedidos: 0 };

async function cargarDatos() {
    const icon = document.getElementById('refresh-icon');
    icon?.classList.add('animate-spin');
    try {
        const [ventas, clientes] = await Promise.all([
            DairyAPI.obtenerDatos("Ventas"),
            DairyAPI.obtenerDatos("Clientes")
        ]);
        
        const agrupados = {};
        ventas.filter(v => String(v.Estado).trim().toUpperCase() === "PENDIENTE").forEach(v => {
            const idV = v.ID_Venta || "S/N";
            if (!agrupados[idV]) {
                agrupados[idV] = {
                    id: idV, cliente: v.Cliente, total: 0, items: [],
                    direccion: clientes.find(c => String(c.Nombre).trim().toLowerCase() === String(v.Cliente).trim().toLowerCase())?.Dirección || "Sin Dirección"
                };
            }
            const sub = parseFloat(String(v.Total || 0).replace(',', '.')) || 0;
            agrupados[idV].items.push({ producto: v.Producto, cant: v.Cantidad, precio: sub });
            agrupados[idV].total += sub;
        });
        
        pedidosLocal = Object.values(agrupados).reverse();
        renderizar();
    } catch (e) { console.error(e); }
    finally { icon?.classList.remove('animate-spin'); }
}

function renderizar() {
    const container = document.getElementById('contenedor-pedidos');
    document.getElementById('cont-pend').innerText = pedidosLocal.length;
    document.getElementById('cont-ent').innerText = statsSesion.pedidos;
    
    if(pedidosLocal.length === 0) {
        container.innerHTML = '<div class="text-center py-20 text-slate-300 font-black uppercase text-[10px]">Ruta Finalizada</div>';
        return;
    }

    container.innerHTML = pedidosLocal.map(ped => `
        <div class="card-pro p-6 space-y-5">
            <div class="flex justify-between items-start">
                <div>
                    <span class="bg-purple-50 text-[#a21caf] text-[10px] font-black px-2 py-1 rounded-lg">ID: ${ped.id}</span>
                    <h2 class="text-xl font-black text-slate-800 uppercase mt-2">${ped.cliente}</h2>
                    <p class="text-[10px] text-slate-400 font-bold mt-1">${ped.direccion}</p>
                </div>
                <button onclick="abrirMapa('${ped.direccion}')" class="btn-mapa-azul">
                    <span class="material-symbols-outlined">location_on</span>
                </button>
            </div>
            <div class="bg-slate-50/50 rounded-2xl p-3">
                ${ped.items.map(it => `
                    <div class="flex justify-between items-center py-2 border-b border-white last:border-0">
                        <span class="text-xs font-bold text-slate-600 uppercase">${it.producto} <span class="text-purple-400">x${it.cant}</span></span>
                        <!-- PASAMOS ID, PRODUCTO Y CANTIDAD PARA RECOBRAR STOCK -->
                        <button onclick="askDelete('${ped.id}', '${it.producto}', ${it.cant})" class="w-8 h-8 flex items-center justify-center bg-red-50 text-red-400 rounded-xl">
                            <span class="material-symbols-outlined text-sm">delete</span>
                        </button>
                    </div>
                `).join('')}
            </div>
            <div class="flex justify-between items-center pt-2">
                <p class="text-3xl font-black text-slate-900">$${ped.total.toFixed(2)}</p>
                <button onclick="askEntrega('${ped.id}')" class="btn-verde px-8 h-14">ENTREGADO</button>
            </div>
        </div>
    `).join('');
}

async function askEntrega(id) {
    showConfirm("¿Entregado?", "Se marcará como completado en el sistema.", "success", async () => {
        try {
            const hoy = new Date().toLocaleDateString('es-ES');
            await DairyAPI.enviarDatos({ 
                pestaña: "Ventas", 
                accion: "editar_estado", 
                ID_Venta: id, 
                Estado: "ENTREGADO", 
                Fecha_Entrega: hoy 
            });
            statsSesion.pedidos++;
            localStorage.setItem('statsDespachos', JSON.stringify(statsSesion));
            cargarDatos();
        } catch (e) { alert("Error"); }
    });
}

async function askDelete(id, prod, cant) {
    showConfirm("¿Eliminar?", `Se devolverán ${cant} unidades al stock.`, "delete", async () => {
        try {
            await DairyAPI.enviarDatos({ 
                pestaña: "Ventas", 
                accion: "eliminar_item_y_devolver_stock", 
                ID_Venta: id, 
                Producto: prod, 
                Cantidad: cant 
            });
            cargarDatos();
        } catch (e) { alert("Error al borrar"); }
    });
}

function abrirMapa(dir) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`);
}

function showConfirm(title, text, type, onOk) {
    const modal = document.getElementById('modal-confirm');
    const okBtn = document.getElementById('confirm-ok');
    document.getElementById('confirm-title').innerText = title;
    document.getElementById('confirm-text').innerText = text;
    modal.style.display = 'flex';
    
    const isDelete = type === 'delete';
    document.getElementById('confirm-icon').className = `w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${isDelete ? 'bg-red-50 text-red-500' : 'bg-green-50 text-green-500'}`;
    document.getElementById('confirm-icon').innerHTML = `<span class="material-symbols-outlined text-3xl">${isDelete ? 'delete' : 'check'}</span>`;
    okBtn.className = `flex-1 py-4 rounded-2xl font-black text-white text-xs uppercase ${isDelete ? 'bg-red-500' : 'bg-green-600'}`;
    
    okBtn.onclick = () => { onOk(); cerrarModal('modal-confirm'); };
}

function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

function renderMenu() {
    const container = document.getElementById('menu-container');
    const opciones = [
        { nombre: 'Panel', icon: 'dashboard', link: 'DashboardLacteo.html' },
        { nombre: 'Ventas', icon: 'add_shopping_cart', link: 'RegistrodeVentas.html' },
        { nombre: 'Despachos', icon: 'local_shipping', link: 'GestióndeDespachos.html' }
    ];
    let html = '<nav class="nav-fija"><div class="menu-grid">';
    opciones.forEach(opt => {
        const active = window.location.pathname.includes(opt.link) ? 'active-btn' : '';
        html += `<button onclick="location.href='${opt.link}'" class="nav-btn ${active}"><span class="material-symbols-outlined">${opt.icon}</span><span>${opt.nombre}</span></button>`;
    });
    container.innerHTML = html + '</div></nav>';
}

window.onload = () => { cargarDatos(); renderMenu(); };
</script>
</body>
</html>
