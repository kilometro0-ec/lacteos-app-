<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Rutas Pro - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        body { background-color: #fcfcfd; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 120px; }
        .card-premium { background: white; border-radius: 2.5rem; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.04); transition: all 0.3s ease; }
        .card-reprogramado { background: #fffbeb; border: 1px solid #fde68a; }
        .btn-icon { width: 44px; height: 44px; border-radius: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .nav-glass { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-radius: 2rem; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 20px 40px rgba(0,0,0,0.1); padding: 12px; z-index: 1000; }
        .modal-blur { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 2000; display: none; align-items: flex-end; }
        .sheet-bottom { background: white; width: 100%; border-radius: 3rem 3rem 0 0; padding: 30px; animation: slideUp 0.4s cubic-bezier(0, 1, 0, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<header class="px-6 pt-10 pb-6 flex justify-between items-end">
    <div>
        <p class="text-[10px] font-800 text-slate-400 uppercase tracking-widest">Logística Pro</p>
        <h1 class="text-3xl font-800 text-slate-900 tracking-tighter">Rutas de hoy</h1>
    </div>
    <button onclick="cargarDatos()" class="btn-icon bg-slate-900 text-white shadow-lg shadow-slate-200">
        <span id="refresh-icon" class="material-symbols-outlined text-xl">sync</span>
    </button>
</header>

<div class="px-6 grid grid-cols-2 gap-4 mb-8">
    <div class="bg-indigo-50 p-5 rounded-[2rem] border border-indigo-100">
        <p id="cont-pend" class="text-2xl font-800 text-indigo-700">0</p>
        <p class="text-[9px] font-800 text-indigo-400 uppercase tracking-wider">Pendientes</p>
    </div>
    <div id="btn-historial" class="bg-emerald-50 p-5 rounded-[2rem] border border-emerald-100">
        <p id="cont-ent" class="text-2xl font-800 text-emerald-700">0</p>
        <p class="text-[9px] font-800 text-emerald-400 uppercase tracking-wider">Completados</p>
    </div>
</div>

<main id="contenedor-pedidos" class="px-6 space-y-6"></main>

<!-- Bottom Sheet Edición -->
<div id="modal-edit" class="modal-blur" onclick="cerrarEdicion()">
    <div class="sheet-bottom" onclick="event.stopPropagation()">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <h2 class="text-xl font-800 text-slate-900 mb-1">Editar Pedido</h2>
        <p id="edit-id-display" class="text-xs font-bold text-indigo-600 mb-6"></p>
        <div class="space-y-4">
            <div>
                <label class="text-[10px] font-800 text-slate-400 uppercase mb-2 block">Nueva Fecha de Entrega</label>
                <input type="date" id="edit-fecha" class="w-full p-4 bg-slate-50 border-none rounded-2xl font-bold text-slate-700">
            </div>
            <div id="edit-productos-list" class="space-y-2 max-h-40 overflow-y-auto py-2"></div>
        </div>
        <div class="flex gap-3 mt-8">
            <button onclick="cerrarEdicion()" class="flex-1 py-4 font-800 text-slate-400 uppercase text-xs">Cancelar</button>
            <button id="btn-guardar" onclick="guardarCambiosPedido()" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-800 uppercase text-xs shadow-xl">Guardar</button>
        </div>
    </div>
</div>

<div id="menu-container"></div>

<script>
let pedidosLocal = [];
let pedidoEnEdicion = null;

async function cargarDatos() {
    const icon = document.getElementById('refresh-icon');
    icon?.classList.add('animate-spin');
    try {
        const [ventas, clientes] = await Promise.all([
            DairyAPI.obtenerDatos("Ventas"),
            DairyAPI.obtenerDatos("Clientes")
        ]);
        
        const agrupados = {};
        let entregadosCount = 0;

        ventas.forEach(v => {
            const estado = String(v.Estado || "").trim().toUpperCase();
            if (estado === "ENTREGADO") {
                entregadosCount++;
                return;
            }

            if (estado === "PENDIENTE" || estado === "REPROGRAMADO") {
                const idV = v.ID_Venta;
                if (!agrupados[idV]) {
                    agrupados[idV] = {
                        id: idV, 
                        cliente: v.Cliente, 
                        total: 0, 
                        items: [],
                        fecha: v.Fecha_Entrega,
                        estado: estado,
                        direccion: clientes.find(c => c.Nombre === v.Cliente)?.Dirección || "Sin dirección"
                    };
                }
                
                const cant = parseFloat(String(v.Cantidad || 0).replace(',', '.'));
                const pvp = parseFloat(String(v.Precio_PVP || 0).replace('$', '').replace(',', '.'));
                const subtotal = cant * pvp;
                
                agrupados[idV].items.push({ Producto: v.Producto, Cantidad: cant, Precio_PVP: pvp, subtotal });
                agrupados[idV].total += subtotal;
            }
        });

        pedidosLocal = Object.values(agrupados).reverse();
        document.getElementById('cont-ent').innerText = entregadosCount;
        renderizar();
    } catch (e) { 
        console.error("Error cargando datos:", e); 
    } finally { 
        icon?.classList.remove('animate-spin'); 
    }
}

function renderizar() {
    const container = document.getElementById('contenedor-pedidos');
    document.getElementById('cont-pend').innerText = pedidosLocal.length;
    container.innerHTML = pedidosLocal.length === 0 ? '<p class="text-center text-slate-400 py-10">No hay rutas pendientes</p>' : "";

    pedidosLocal.forEach((ped) => {
        const esRepro = ped.estado === "REPROGRAMADO";
        container.innerHTML += `
            <div class="card-premium p-6 ${esRepro ? 'card-reprogramado' : ''}">
                <div class="flex justify-between items-start mb-4">
                    <div class="flex-1">
                        <span class="text-[9px] font-800 uppercase text-slate-400">ID: ${ped.id}</span>
                        <h2 class="text-xl font-800 text-slate-800 uppercase leading-tight">${ped.cliente}</h2>
                        <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">📍 ${ped.direccion}</p>
                    </div>
                    <div class="flex gap-2">
                         <button onclick="abrirEdicion('${ped.id}')" class="btn-icon bg-slate-100 text-slate-600"><span class="material-symbols-outlined">edit_square</span></button>
                         <button onclick="abrirMapa('${ped.direccion}')" class="btn-icon bg-blue-50 text-blue-600"><span class="material-symbols-outlined">directions</span></button>
                    </div>
                </div>
                <div class="space-y-2 mb-6">
                    ${ped.items.map(it => `
                        <div class="flex justify-between text-xs font-bold text-slate-500">
                            <span>${it.Producto} <span class="text-slate-300">x${it.Cantidad}</span></span>
                            <span class="text-slate-800">$${it.subtotal.toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <p class="text-3xl font-800 text-slate-900">$${ped.total.toFixed(2)}</p>
                    <button onclick="marcarEntregado('${ped.id}')" class="h-14 px-8 bg-emerald-600 text-white rounded-2xl font-800 uppercase text-xs shadow-lg">Entregado</button>
                </div>
            </div>`;
    });
}

function abrirEdicion(id) {
    pedidoEnEdicion = JSON.parse(JSON.stringify(pedidosLocal.find(p => p.id === id)));
    document.getElementById('edit-id-display').innerText = `ORDEN #${id}`;
    document.getElementById('edit-fecha').value = pedidoEnEdicion.fecha;
    document.getElementById('modal-edit').style.display = 'flex';
}

function cerrarEdicion() { document.getElementById('modal-edit').style.display = 'none'; }

async function guardarCambiosPedido() {
    const btn = document.getElementById('btn-guardar');
    const nuevaFecha = document.getElementById('edit-fecha').value;
    const esRepro = nuevaFecha !== pedidoEnEdicion.fecha;
    
    btn.innerText = "PROCESANDO...";
    btn.disabled = true;

    try {
        await DairyAPI.enviarDatos({ pestaña: "Ventas", accion: "ELIMINAR_PEDIDO_ID", ID_Venta: pedidoEnEdicion.id });
        for(let item of pedidoEnEdicion.items) {
            await DairyAPI.enviarDatos({
                pestaña: "Ventas",
                ID_Venta: pedidoEnEdicion.id,
                Cliente: pedidoEnEdicion.cliente,
                Producto: item.Producto,
                Cantidad: item.Cantidad,
                Precio_PVP: item.Precio_PVP,
                Fecha_Entrega: nuevaFecha,
                Estado: esRepro ? "REPROGRAMADO" : "PENDIENTE"
            });
        }
        cerrarEdicion();
        cargarDatos();
    } catch(e) { alert("Error al guardar"); }
    finally { btn.innerText = "GUARDAR"; btn.disabled = false; }
}

async function marcarEntregado(id) {
    if(!confirm("¿Confirmar entrega?")) return;
    try {
        await DairyAPI.enviarDatos({ pestaña: "Ventas", accion: "MARCAR_ENTREGADO", ID_Venta: id });
        cargarDatos();
    } catch(e) { alert("Error al marcar"); }
}

function abrirMapa(dir) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dir)}`, '_blank'); }

function renderMenu() {
    const container = document.getElementById('menu-container');
    const opciones = [
        { nombre: 'Panel', icon: 'dashboard', link: 'DashboardLacteo.html' },
        { nombre: 'Ventas', icon: 'add_shopping_cart', link: 'Ventas.html' },
        { nombre: 'Rutas', icon: 'local_shipping', link: 'Rutas.html' }
    ];
    let html = '<nav class="nav-glass flex justify-around items-center">';
    opciones.forEach(opt => {
        const esActivo = window.location.pathname.includes(opt.link) ? 'text-indigo-600' : 'text-slate-400';
        html += `<button onclick="location.href='${opt.link}'" class="flex flex-col items-center gap-1">
            <span class="material-symbols-outlined ${esActivo}">${opt.icon}</span>
            <span class="text-[8px] font-800 uppercase ${esActivo}">${opt.nombre}</span>
        </button>`;
    });
    container.innerHTML = html + '</nav>';
}

window.onload = () => { cargarDatos(); renderMenu(); };
</script>
</body>
</html>
