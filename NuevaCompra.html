<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .sugerencias-list { max-height: 250px; overflow-y: auto; }
        .sugerencia-item { transition: all 0.2s ease; }
        .sugerencia-item:hover { background-color: #fef3c7; transform: translateX(5px); }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Menú -->
    <div class="bg-amber-900 text-white p-4 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥛 Lógica Láctea</h1>
            <nav class="flex gap-4">
                <a href="#" class="hover:text-amber-300">Inicio</a>
                <a href="#" class="hover:text-amber-300">Compras</a>
                <a href="#" class="hover:text-amber-300">Inventario</a>
            </nav>
        </div>
    </div>

    <!-- Encabezado -->
    <header class="bg-amber-800 text-white shadow-md px-6 py-4 no-print">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-bag" class="w-8 h-8 text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold">Orden de Compra a Proveedor</h1>
                <p class="text-xs text-amber-200">Genera la orden, descarga PDF y envía por WhatsApp</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo -->
        <div class="space-y-6 lg:col-span-1 no-print">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Datos de la Compra
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Factura N°</label>
                    <input type="text" id="com_factura" class="w-full border rounded-lg px-3 py-2 text-sm font-mono bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Proveedor *</label>
                    <div class="relative">
                        <input type="text" id="com_proveedor" 
                               class="w-full border rounded-lg px-3 py-2 text-sm" 
                               placeholder="Escribe para buscar proveedor..." 
                               autocomplete="off">
                        <div id="sugerenciasProveedor" class="absolute z-20 w-full bg-white border rounded-lg mt-1 hidden shadow-lg sugerencias-list"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Fecha de Pedido</label>
                    <input type="text" id="fecha_pedido" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="w-4 h-4 text-amber-600"></i> Agregar Producto
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Producto</label>
                    <select id="sel_producto" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="">Cargando productos...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Cantidad</label>
                        <input type="number" id="txt_cantidad" min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Precio Distribuidor</label>
                        <input type="text" id="txt_costo" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                    </div>
                </div>
                <button onclick="agregarItemAlCarrito()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-sm font-bold transition-all">
                    + Agregar Producto
                </button>
            </div>
        </div>

        <!-- Tabla Carrito y PDF -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="overflow-x-auto no-print">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="py-3 px-4 text-left">Código</th>
                            <th class="py-3 px-4 text-left">Producto</th>
                            <th class="py-3 px-4 text-center">Cantidad</th>
                            <th class="py-3 px-4 text-right">Precio</th>
                            <th class="py-3 px-4 text-right">Subtotal</th>
                            <th class="py-3 px-4 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCarrito">
                        <tr>
                            <td colspan="6" class="text-center py-20 text-slate-400">
                                <i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>
                                Carrito vacío
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Vista para PDF (oculta normalmente) -->
            <div id="pdfContent" class="print-only" style="padding: 20px;"></div>

            <div class="bg-slate-50 p-5 border-t flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                <div>
                    <span class="text-xs text-slate-400 uppercase font-bold">Total Compra</span>
                    <span id="lblTotalCompra" class="text-3xl font-bold text-slate-900 ml-2">$0.00</span>
                </div>
                <div class="flex gap-3 flex-wrap">
                    <button onclick="enviarWhatsApp()" class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                    </button>
                    <button onclick="descargarPDF()" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="printer" class="w-4 h-4"></i> Descargar PDF
                    </button>
                    <button onclick="guardarCompra()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar en Google Sheets
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURACIÓN ====================
        // ⚠️ IMPORTANTE: Abre este archivo LOCALMENTE (no desde GitHub Pages)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd8JyMA9NRqsxqoH762o3iR2khHpemBoVxCl-aMOEtxdp2FTnHE68p-hgnDGg-q83tog/exec";
        
        let catalogoProductos = [];
        let catalogoProveedores = [];
        let carritoDeCompras = [];

        // ==================== API ====================
        const DairyAPI = {
            async obtenerDatos(hoja) {
                try {
                    const url = `${SCRIPT_URL}?action=obtenerDatos&hoja=${encodeURIComponent(hoja)}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    if (result.status === 'success') return result.data;
                    throw new Error(result.message);
                } catch (error) {
                    console.error(`Error en obtenerDatos (${hoja}):`, error);
                    throw error;
                }
            },
            async registrarCompra(data) {
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'registrarNuevaCompra', ...data })
                    });
                    return { status: 'success' };
                } catch (error) {
                    console.error('Error al registrar compra:', error);
                    throw error;
                }
            }
        };

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            
            Swal.fire({
                title: 'Cargando datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            try {
                await Promise.all([cargarProductos(), cargarProveedores()]);
                generarFacturaAuto();
                configurarFecha();
                configurarBuscadorProveedores();
                Swal.close();
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los datos', 'error');
            }
        });

        function generarFacturaAuto() {
            const fecha = new Date();
            const anio = fecha.getFullYear();
            const mes = String(fecha.getMonth() + 1).padStart(2, '0');
            const dia = String(fecha.getDate()).padStart(2, '0');
            const random = Math.floor(Math.random() * 1000000);
            const factura = `FAC-${anio}${mes}${dia}-${random}`;
            document.getElementById("com_factura").value = factura;
        }

        function configurarFecha() {
            const fecha = new Date();
            const fechaStr = fecha.toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            document.getElementById("fecha_pedido").value = fechaStr;
        }

        // ==================== PRODUCTOS ====================
        async function cargarProductos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Inventario");
                
                if (datos && datos.length > 0) {
                    catalogoProductos = datos.filter(p => p.ID && p.Producto).map(p => ({
                        id: p.ID,
                        producto: p.Producto,
                        precio: parseFloat(String(p.Precio_Distribuidor).replace('$', '').replace(',', '.')) || 0
                    }));
                } else {
                    catalogoProductos = [
                        { id: "P-103", producto: "Yogurt de Fruta 1/2 L", precio: 0.70 },
                        { id: "P-128", producto: "Queso Mozarella 500g", precio: 3.50 },
                        { id: "P-164", producto: "Queso Cremoso 500 g", precio: 3.00 },
                        { id: "P-169", producto: "Yogurt Griego semi Endulzado 1L", precio: 2.93 },
                        { id: "P-172", producto: "Yogurt Griego 0 Azucar 1L", precio: 3.58 }
                    ];
                }
                
                const select = document.getElementById("sel_producto");
                select.innerHTML = '<option value="">-- Selecciona un producto --</option>';
                catalogoProductos.forEach(p => {
                    select.innerHTML += `<option value="${p.id}" data-precio="${p.precio}">${p.producto} (${p.id}) - $${p.precio.toFixed(2)}</option>`;
                });
                
                document.getElementById("sel_producto").addEventListener("change", (e) => {
                    const opt = e.target.options[e.target.selectedIndex];
                    const precio = parseFloat(opt.dataset.precio) || 0;
                    document.getElementById("txt_costo").value = precio.toFixed(2);
                });
            } catch (err) {
                console.error("Error cargando productos:", err);
            }
        }

        // ==================== PROVEEDORES ====================
        async function cargarProveedores() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                
                if (datos && datos.length > 0) {
                    catalogoProveedores = datos.filter(p => {
                        return p["Nombre del Proveedor"] || p.Nombre || p.proveedor;
                    }).map(p => ({
                        nombre: p["Nombre del Proveedor"] || p.Nombre || p.proveedor,
                        telefono: p["Contacto / Teléfono"] || p.telefono || '',
                        ciudad: p.Ciudad || p.ciudad || '',
                        direccion: p.Direccion || p.direccion || '',
                        ruc: p.RUC || p.ruc || ''
                    }));
                } else {
                    catalogoProveedores = [
                        { nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE", direccion: "Calle Rivas", ruc: "123456789" },
                        { nombre: "Kilómetro 0", telefono: "0984016027", ciudad: "Quito", direccion: "Moro Moro", ruc: "1111111111" }
                    ];
                }
            } catch (err) {
                console.error("Error cargando proveedores:", err);
                catalogoProveedores = [
                    { nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE" }
                ];
            }
        }

        function configurarBuscadorProveedores() {
            const input = document.getElementById("com_proveedor");
            const sugerencias = document.getElementById("sugerenciasProveedor");

            input.addEventListener("input", () => {
                const texto = input.value.toLowerCase().trim();
                
                if (texto.length < 1) {
                    sugerencias.classList.add("hidden");
                    return;
                }
                
                const filtrados = catalogoProveedores.filter(p => 
                    p.nombre && p.nombre.toLowerCase().includes(texto)
                );
                
                if (filtrados.length === 0) {
                    sugerencias.classList.add("hidden");
                    return;
                }
                
                sugerencias.innerHTML = "";
                filtrados.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "sugerencia-item px-3 py-2 cursor-pointer border-b text-sm";
                    div.innerHTML = `
                        <div class="font-bold text-amber-800">${p.nombre}</div>
                        <div class="text-xs text-slate-500">📞 ${p.telefono || 'N/A'} | 📍 ${p.ciudad || 'N/A'}</div>
                    `;
                    div.onclick = () => {
                        input.value = p.nombre;
                        sugerencias.classList.add("hidden");
                    };
                    sugerencias.appendChild(div);
                });
                sugerencias.classList.remove("hidden");
            });

            document.addEventListener("click", (e) => {
                if (e.target !== input) {
                    sugerencias.classList.add("hidden");
                }
            });
        }

        // ==================== CARRITO ====================
        function agregarItemAlCarrito() {
            const select = document.getElementById("sel_producto");
            const id = select.value;
            const cantidad = parseInt(document.getElementById("txt_cantidad").value);
            const precio = parseFloat(document.getElementById("txt_costo").value);

            if (!id || cantidad < 1 || precio <= 0) {
                Swal.fire("Error", "Selecciona un producto y cantidad válida", "warning");
                return;
            }

            const producto = catalogoProductos.find(p => p.id === id);
            const existente = carritoDeCompras.find(i => i.id === id);
            
            if (existente) {
                existente.cantidad += cantidad;
            } else {
                carritoDeCompras.push({
                    id: id,
                    producto: producto.producto,
                    cantidad: cantidad,
                    precio: precio
                });
            }

            document.getElementById("txt_cantidad").value = "1";
            document.getElementById("sel_producto").value = "";
            document.getElementById("txt_costo").value = "";
            renderizarCarrito();
            
            Swal.fire({
                title: "✓ Agregado",
                text: `${cantidad} x ${producto.producto}`,
                icon: "success",
                timer: 1500,
                showConfirmButton: false
            });
        }

        function removerItem(index) {
            carritoDeCompras.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            let total = 0;

            if (carritoDeCompras.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-slate-400"><i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>Carrito vacío</td></tr>`;
                document.getElementById("lblTotalCompra").innerText = "$0.00";
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = "";
            carritoDeCompras.forEach((item, idx) => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="py-3 px-4 font-mono text-xs">${item.id}</td>
                        <td class="py-3 px-4">${item.producto}</td>
                        <td class="py-3 px-4 text-center font-bold">${item.cantidad}</td>
                        <td class="py-3 px-4 text-right">$${item.precio.toFixed(2)}</td>
                        <td class="py-3 px-4 text-right font-bold">$${subtotal.toFixed(2)}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="removerItem(${idx})" class="text-red-500 hover:text-red-700">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById("lblTotalCompra").innerText = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        // ==================== GENERAR PDF (Versión Bonita) ====================
        function generarHTMLPDF() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            const factura = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            
            // Buscar datos completos del proveedor
            const proveedorData = catalogoProveedores.find(p => p.nombre === proveedor) || { 
                nombre: proveedor, 
                telefono: '', 
                direccion: '', 
                ruc: '',
                ciudad: ''
            };
            
            let tablaProductos = '';
            carritoDeCompras.forEach(item => {
                const subtotal = item.cantidad * item.precio;
                tablaProductos += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 8px; text-align: left;">${item.id}</td>
                        <td style="padding: 8px; text-align: left;">${item.producto}</td>
                        <td style="padding: 8px; text-align: center;">${item.cantidad}</td>
                        <td style="padding: 8px; text-align: right;">$${item.precio.toFixed(2)}</td>
                        <td style="padding: 8px; text-align: right;">$${subtotal.toFixed(2)}</td>
                    </tr>
                `;
            });

            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>Orden de Compra - ${factura}</title>
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body {
                            font-family: 'Arial', sans-serif;
                            background: white;
                            padding: 40px;
                            font-size: 14px;
                        }
                        .container {
                            max-width: 900px;
                            margin: 0 auto;
                            background: white;
                        }
                        .header {
                            text-align: center;
                            margin-bottom: 30px;
                            border-bottom: 3px solid #b45309;
                            padding-bottom: 20px;
                        }
                        .header h1 {
                            color: #b45309;
                            font-size: 28px;
                            margin-bottom: 5px;
                        }
                        .header h2 {
                            color: #78350f;
                            font-size: 16px;
                            font-weight: normal;
                        }
                        .titulo-orden {
                            background: #fef3c7;
                            text-align: center;
                            padding: 10px;
                            margin: 20px 0;
                            border-radius: 8px;
                        }
                        .titulo-orden h3 {
                            color: #b45309;
                            font-size: 18px;
                        }
                        .info-section {
                            margin-bottom: 20px;
                            border: 1px solid #e2e8f0;
                            border-radius: 10px;
                            overflow: hidden;
                        }
                        .info-title {
                            background: #fef3c7;
                            padding: 10px 15px;
                            font-weight: bold;
                            color: #b45309;
                            font-size: 14px;
                            border-bottom: 1px solid #e2e8f0;
                        }
                        .info-content {
                            padding: 15px;
                            display: grid;
                            grid-template-columns: 1fr 1fr;
                            gap: 10px;
                        }
                        .info-item {
                            margin-bottom: 5px;
                        }
                        .info-label {
                            font-weight: bold;
                            color: #4a5568;
                            font-size: 11px;
                            text-transform: uppercase;
                        }
                        .info-value {
                            font-size: 13px;
                            color: #1a202c;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin: 0;
                        }
                        th {
                            background: #fef3c7;
                            padding: 10px;
                            text-align: left;
                            font-weight: bold;
                            color: #78350f;
                            font-size: 12px;
                            border-bottom: 2px solid #b45309;
                        }
                        td {
                            padding: 8px;
                            border-bottom: 1px solid #e2e8f0;
                        }
                        .total-section {
                            text-align: right;
                            margin-top: 20px;
                            padding: 15px;
                            background: #fef3c7;
                            border-radius: 8px;
                        }
                        .total-label {
                            font-size: 16px;
                            font-weight: bold;
                            color: #4a5568;
                        }
                        .total-amount {
                            font-size: 24px;
                            font-weight: bold;
                            color: #b45309;
                            margin-left: 15px;
                        }
                        .status {
                            display: inline-block;
                            background: #fef3c7;
                            color: #b45309;
                            padding: 4px 12px;
                            border-radius: 20px;
                            font-size: 11px;
                            font-weight: bold;
                        }
                        .footer {
                            margin-top: 40px;
                            text-align: center;
                            font-size: 10px;
                            color: #718096;
                            border-top: 1px solid #e2e8f0;
                            padding-top: 15px;
                        }
                        .observaciones {
                            margin-top: 20px;
                            padding: 15px;
                            background: #f8fafc;
                            border-radius: 8px;
                            font-size: 11px;
                            color: #4a5568;
                        }
                        .observaciones p {
                            margin: 5px 0;
                        }
                    </style>
                </head>
                <body>
                    <div class="container">
                        <div class="header">
                            <h1>🥛 LÓGICA LÁCTEA</h1>
                            <h2>Productos Lácteos Artesanales</h2>
                        </div>
                        
                        <div class="titulo-orden">
                            <h3>📄 ORDEN DE COMPRA A PROVEEDOR</h3>
                        </div>

                        <div class="info-section">
                            <div class="info-title">📋 INFORMACIÓN DE LA ORDEN</div>
                            <div class="info-content">
                                <div class="info-item">
                                    <div class="info-label">N° Factura/Orden:</div>
                                    <div class="info-value">${factura}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Fecha de Emisión:</div>
                                    <div class="info-value">${fecha}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Estado:</div>
                                    <div class="info-value"><span class="status">⏳ PENDIENTE DE RECEPCIÓN</span></div>
                                </div>
                            </div>
                        </div>

                        <div class="info-section">
                            <div class="info-title">🏢 DATOS DEL PROVEEDOR</div>
                            <div class="info-content">
                                <div class="info-item">
                                    <div class="info-label">Razón Social:</div>
                                    <div class="info-value">${proveedorData.nombre}</div>

        function descargarPDF() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            
            if (!proveedor || carritoDeCompras.length === 0) {
                Swal.fire("Error", "Agrega productos y selecciona un proveedor", "warning");
                return;
            }

            Swal.fire({
                title: 'Generando PDF...',
                text: 'Por favor espera',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            const htmlContent = generarHTMLPDF();
            
            // Crear una ventana nueva para el PDF
            const printWindow = window.open('', '_blank');
            printWindow.document.write(htmlContent);
            printWindow.document.close();
            
            setTimeout(() => {
                printWindow.print();
                Swal.close();
            }, 500);
        }

        // ==================== WHATSAPP ====================
        function enviarWhatsApp() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            if (!proveedor || carritoDeCompras.length === 0) {
                Swal.fire("Error", "Agrega productos y selecciona un proveedor", "warning");
                return;
            }

            let mensaje = `*🛒 ORDEN DE COMPRA - LÓGICA LÁCTEA*\n\n`;
            mensaje += `*Proveedor:* ${proveedor}\n`;
            mensaje += `*Fecha:* ${document.getElementById("fecha_pedido").value}\n`;
            mensaje += `*Factura:* ${document.getElementById("com_factura").value}\n\n`;
            mensaje += `*📋 PRODUCTOS SOLICITADOS:*\n`;
            
            let total = 0;
            carritoDeCompras.forEach(item => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                mensaje += `▸ ${item.cantidad} x ${item.producto} = $${subtotal.toFixed(2)}\n`;
            });
            
            mensaje += `\n*💰 TOTAL: $${total.toFixed(2)}*\n`;
            mensaje += `\n📌 Estado: PENDIENTE DE RECEPCIÓN\n`;
            mensaje += `📍 Entregar en: Lógica Láctea\n\n`;
            mensaje += `_Este pedido fue generado automáticamente_`;
            
            const url = `https://wa.me/593984016027?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // ==================== GUARDAR COMPRA ====================
        async function guardarCompra() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            const factura = document.getElementById("com_factura").value;

            if (!proveedor || carritoDeCompras.length === 0) {
                Swal.fire("Error", "Completa todos los datos", "warning");
                return;
            }

            Swal.fire({ 
                title: 'Guardando compra...', 
                didOpen: () => Swal.showLoading(), 
                allowOutsideClick: false 
            });

            try {
                const orden = {
                    factura: factura,
                    proveedor: proveedor,
                    fecha: new Date().toISOString().split('T')[0],
                    items: carritoDeCompras.map(item => ({
                        producto_id: item.id,
                        producto_nombre: item.producto,
                        cantidad: item.cantidad,
                        costo: item.precio
                    }))
                };

                await DairyAPI.registrarCompra(orden);
                
                const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
                
                Swal.fire({
                    title: '✅ Compra Guardada',
                    html: `<strong>Factura:</strong> ${factura}<br>
                           <strong>Proveedor:</strong> ${proveedor}<br>
                           <strong>Total:</strong> $${total.toFixed(2)}<br><br>
                           <span class="text-amber-600">⚠️ Stock NO modificado</span><br>
                           <span class="text-green-600">📄 Puedes descargar el PDF para enviar al proveedor</span>`,
                    icon: 'success'
                });

                carritoDeCompras = [];
                renderizarCarrito();
                document.getElementById("com_proveedor").value = "";
                generarFacturaAuto();
            } catch (err) {
                console.error("Error:", err);
                Swal.fire("Error", "No se pudo guardar la compra", "error");
            }
        }
    </script>
