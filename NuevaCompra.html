<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Nueva Orden de Compra | Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js?v=1.4"></script>
    <script src="menu-logic.js?v=1.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#2563eb' } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="pb-32 bg-slate-50 text-slate-800">
    <header class="fixed top-0 w-full z-40 flex justify-between items-center px-6 h-20 bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-md">
        <div>
            <h1 class="text-[9px] font-black text-blue-200 uppercase tracking-widest">Abastecimiento</h1>
            <h2 class="text-base font-black uppercase tracking-tight">Nueva Orden de Compra</h2>
        </div>
    </header>

    <main class="pt-24 px-4 max-w-xl mx-auto">
        <form id="form-compra" onsubmit="guardar(event)" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4">
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Proveedor:</label>
                <select id="proveedor" class="w-full rounded-xl border-slate-200 text-xs font-bold focus:ring-blue-500" required></select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Producto:</label>
                <select id="producto" class="w-full rounded-xl border-slate-200 text-xs font-bold focus:ring-blue-500" required></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Cantidad:</label>
                    <input type="number" id="cantidad" class="w-full rounded-xl border-slate-200 text-xs font-bold focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase block mb-1">Costo Distribuidor:</label>
                    <input type="number" step="0.01" id="precio" class="w-full rounded-xl border-slate-200 text-xs font-bold focus:ring-blue-500" required>
                </div>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-black py-4 rounded-xl text-xs uppercase tracking-widest shadow-md mt-4">Generar Orden</button>
        </form>
    </main>
    <nav id="menu-container"></nav>

    <script>
        async function inicializar() {
            try {
                const [provs, inv] = await Promise.all([DairyAPI.obtenerDatos("Proveedores"), DairyAPI.obtenerDatos("Inventario")]);
                document.getElementById('proveedor').innerHTML = provs.map(p => `<option value="${p['Nombre del Proveedor']}">${p['Nombre del Proveedor']}</option>`).join('');
                document.getElementById('producto').innerHTML = inv.map(i => `<option value="${i.Producto}">${i.Producto}</option>`).join('');
            } catch(e) { console.error(e); }
        }
        async function guardar(e) {
            e.preventDefault();
            const payload = {
                accion: "insertar", pestaña: "Compras",
                datos: {
                    Fecha: new Date().toISOString().split('T')[0],
                    Proveedor: document.getElementById('proveedor').value,
                    Producto: document.getElementById('producto').value,
                    Cantidad: parseFloat(document.getElementById('cantidad').value),
                    Precio_Distribuidor: parseFloat(document.getElementById('precio').value),
                    Total: parseFloat(document.getElementById('cantidad').value) * parseFloat(document.getElementById('precio').value),
                    Estado_Entrega: "PENDIENTE", ID_Compra: "CMP-" + Date.now().toString().slice(-6)
                }
            };
            if(await DairyAPI.guardarDatos("Compras", payload) === "OK") { alert("Orden Generada"); location.reload(); }
        }
        window.onload = inicializar;
    </script>
</body>
</html>
