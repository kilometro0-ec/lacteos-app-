<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .step-active {
            background-color: #b45309;
            color: white;
            border-color: #b45309;
        }
        .step-completed {
            background-color: #10b981;
            color: white;
            border-color: #10b981;
        }
        .step-pending {
            background-color: #e2e8f0;
            color: #64748b;
            border-color: #cbd5e1;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <div class="bg-amber-900 text-white p-4 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥛 Lógica Láctea</h1>
        </div>
    </div>

    <header class="bg-amber-800 text-white shadow-md px-6 py-4 no-print">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-bag" class="w-8 h-8 text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold">Orden de Compra a Proveedor</h1>
                <p class="text-xs text-amber-200">Sigue los pasos para completar tu pedido</p>
            </div>
        </div>
    </header>


        <!-- Panel Izquierdo - PASO 1: Realizar Compra -->
        <div id="step1-panel" class="space-y-6 lg:col-span-1 fade-in">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Datos de la Compra
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Factura N°</label>
                    <input type="text" id="com_factura" class="w-full border rounded-lg px-3 py-2 text-sm font-mono bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Proveedor *</label>
                    <select id="com_proveedor" class="w-full border rounded-lg px-3 py-2 text-sm bg-white">
                        <option value="">-- Seleccione un proveedor --</option>
                        <option value="Grupo del Campo Artesano">Grupo del Campo Artesano</option>
                        <option value="Kilómetro 0">Kilómetro 0</option>
                        <option value="Lácteos La Vaquita">Lácteos La Vaquita</option>
                        <option value="Ganadería Los Andes">Ganadería Los Andes</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Fecha de Pedido</label>
                    <input type="text" id="fecha_pedido" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="w-4 h-4 text-amber-600"></i> Agregar Producto
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Producto</label>
                    <select id="sel_producto" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="">Cargando productos...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Cantidad</label>
                        <input type="number" id="txt_cantidad" min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Precio Distribuidor</label>
                        <input type="text" id="txt_costo" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                    </div>
                </div>
                <button onclick="agregarItemAlCarrito()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-sm font-bold transition-all">
                    + Agregar Producto
                </button>
            </div>
            
            <button id="btnSiguiente1" onclick="siguientePaso()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2">
                <i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Generar PDF
            </button>
        </div>

        <!-- Panel Central - Tabla Carrito -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b">
                        <tr>
                            <th class="py-3 px-4 text-left">Código</th>
                            <th class="py-3 px-4 text-left">Producto</th>
                            <th class="py-3 px-4 text-center">Cantidad</th>
                            <th class="py-3 px-4 text-right">Precio</th>
                            <th class="py-3 px-4 text-right">Subtotal</th>
                            <th class="py-3 px-4 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyCarrito">
                        <tr>
                            <td colspan="6" class="text-center py-20 text-slate-400">
                                <i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>
                                Carrito vacío - Agrega productos
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="bg-slate-50 p-5 border-t flex justify-between items-center">
                <div>
                    <span class="text-xs text-slate-400 uppercase font-bold">Total Compra</span>
                    <span id="lblTotalCompra" class="text-3xl font-bold text-slate-900 ml-2">$0.00</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd8JyMA9NRqsxqoH762o3iR2khHpemBoVxCl-aMOEtxdp2FTnHE68p-hgnDGg-q83tog/exec";
        
        let catalogoProductos = [];
        let catalogoProveedores = [];
        let carritoDeCompras = [];
        let pasoActual = 1;
        let datosProveedorSeleccionado = {};

        // ==================== API ====================
        const DairyAPI = {
            async obtenerDatos(hoja) {
                try {
                    const url = `${SCRIPT_URL}?action=obtenerDatos&hoja=${encodeURIComponent(hoja)}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    if (result.status === 'success') return result.data;
                    throw new Error(result.message);
                } catch (error) {
                    console.error(`Error en obtenerDatos (${hoja}):`, error);
                    throw error;
                }
            },
            async registrarCompra(data) {
                try {
                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'registrarNuevaCompra', ...data })
                    });
                    return { status: 'success' };
                } catch (error) {
                    console.error('Error al registrar compra:', error);
                    throw error;
                }
            }
        };

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            
            Swal.fire({
                title: 'Cargando datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            try {
                await Promise.all([cargarProductos(), cargarProveedores()]);
                generarFacturaAuto();
                configurarFecha();
                await cargarProveedoresEnSelect();
                Swal.close();
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los datos', 'error');
            }
        });

        function generarFacturaAuto() {
            const fecha = new Date();
            const factura = `FAC-${fecha.getFullYear()}${String(fecha.getMonth()+1).padStart(2,'0')}${String(fecha.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*1000000)}`;
            document.getElementById("com_factura").value = factura;
        }

        function configurarFecha() {
            const fecha = new Date();
            const fechaStr = fecha.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById("fecha_pedido").value = fechaStr;
        }

        async function cargarProveedoresEnSelect() {
            const select = document.getElementById("com_proveedor");
            if (catalogoProveedores.length > 0) {
                select.innerHTML = '<option value="">-- Seleccione un proveedor --</option>';
                catalogoProveedores.forEach(p => {
                    select.innerHTML += `<option value="${p.nombre}" data-telefono="${p.telefono}" data-direccion="${p.direccion}" data-ruc="${p.ruc}" data-ciudad="${p.ciudad}">${p.nombre} - ${p.ciudad || ''}</option>`;
                });
            }
            select.addEventListener("change", (e) => {
                const opt = e.target.options[e.target.selectedIndex];
                datosProveedorSeleccionado = {
                    nombre: opt.value,
                    telefono: opt.dataset.telefono || '',
                    direccion: opt.dataset.direccion || '',
                    ruc: opt.dataset.ruc || '',
                    ciudad: opt.dataset.ciudad || ''
                };
            });
        }

        // ==================== PRODUCTOS ====================
        async function cargarProductos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Inventario");
                if (datos && datos.length > 0) {
                    catalogoProductos = datos.filter(p => p.ID && p.Producto).map(p => ({
                        id: p.ID,
                        producto: p.Producto,
                        precio: parseFloat(String(p.Precio_Distribuidor).replace('$', '').replace(',', '.')) || 0
                    }));
                } else {
                    catalogoProductos = [
                        { id: "P-103", producto: "Yogurt de Fruta 1/2 L", precio: 0.70 },
                        { id: "P-128", producto: "Queso Mozarella 500g", precio: 3.50 },
                        { id: "P-164", producto: "Queso Cremoso 500 g", precio: 3.00 }
                    ];
                }
                const select = document.getElementById("sel_producto");
                select.innerHTML = '<option value="">-- Selecciona un producto --</option>';
                catalogoProductos.forEach(p => {
                    select.innerHTML += `<option value="${p.id}" data-precio="${p.precio}">${p.producto} (${p.id}) - $${p.precio.toFixed(2)}</option>`;
                });
                document.getElementById("sel_producto").addEventListener("change", (e) => {
                    const opt = e.target.options[e.target.selectedIndex];
                    const precio = parseFloat(opt.dataset.precio) || 0;
                    document.getElementById("txt_costo").value = precio.toFixed(2);
                });
            } catch (err) {
                console.error("Error cargando productos:", err);
            }
        }

        async function cargarProveedores() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                if (datos && datos.length > 0) {
                    catalogoProveedores = datos.filter(p => p["Nombre del Proveedor"] || p.Nombre).map(p => ({
                        nombre: p["Nombre del Proveedor"] || p.Nombre,
                        telefono: p["Contacto / Teléfono"] || p.telefono || '',
                        ciudad: p.Ciudad || p.ciudad || '',
                        direccion: p.Direccion || p.direccion || '',
                        ruc: p.RUC || p.ruc || ''
                    }));
                } else {
                    catalogoProveedores = [
                        { nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE", direccion: "Calle Rivas", ruc: "123456789" },
                        { nombre: "Kilómetro 0", telefono: "0984016027", ciudad: "Quito", direccion: "Moro Moro", ruc: "1111111111" },
                        { nombre: "Lácteos La Vaquita", telefono: "555-0102", ciudad: "Quito", direccion: "Av. Principal", ruc: "20987654321" },
                        { nombre: "Ganadería Los Andes", telefono: "555-0101", ciudad: "Cayambe", direccion: "Av. Los Andes", ruc: "20123456789" }
                    ];
                }
            } catch (err) {
                console.error("Error cargando proveedores:", err);
            }
        }

        // ==================== CARRITO ====================
        function agregarItemAlCarrito() {
            const select = document.getElementById("sel_producto");
            const id = select.value;
            const cantidad = parseInt(document.getElementById("txt_cantidad").value);
            const precio = parseFloat(document.getElementById("txt_costo").value);

            if (!id || cantidad < 1 || precio <= 0) {
                Swal.fire("Error", "Selecciona un producto y cantidad válida", "warning");
                return;
            }

            const producto = catalogoProductos.find(p => p.id === id);
            const existente = carritoDeCompras.find(i => i.id === id);
            
            if (existente) {
                existente.cantidad += cantidad;
            } else {
                carritoDeCompras.push({
                    id: id,
                    producto: producto.producto,
                    cantidad: cantidad,
                    precio: precio
                });
            }

            document.getElementById("txt_cantidad").value = "1";
            document.getElementById("sel_producto").value = "";
            document.getElementById("txt_costo").value = "";
            renderizarCarrito();
            
            Swal.fire({ title: "✓ Agregado", text: `${cantidad} x ${producto.producto}`, icon: "success", timer: 1500, showConfirmButton: false });
        }

        function removerItem(index) {
            carritoDeCompras.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            let total = 0;

            if (carritoDeCompras.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-slate-400"><i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>Carrito vacío</td></tr>`;
                document.getElementById("lblTotalCompra").innerText = "$0.00";
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = "";
            carritoDeCompras.forEach((item, idx) => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="py-3 px-4 font-mono text-xs">${item.id}</td>
                        <td class="py-3 px-4">${item.producto}</td>
                        <td class="py-3 px-4 text-center font-bold">${item.cantidad}</td>
                        <td class="py-3 px-4 text-right">$${item.precio.toFixed(2)}</td>
                        <td class="py-3 px-4 text-right font-bold">$${subtotal.toFixed(2)}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="removerItem(${idx})" class="text-red-500 hover:text-red-700">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById("lblTotalCompra").innerText = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        // ==================== PASOS ====================
        function actualizarPasos() {
            const steps = [
                { id: 'step1-indicator', panel: 'step1-panel', paso: 1 },
                { id: 'step2-indicator', paso: 2 },
                { id: 'step3-indicator', paso: 3 },
                { id: 'step4-indicator', paso: 4 }
            ];
            
            steps.forEach(step => {
                const element = document.getElementById(step.id);
                if (step.paso < pasoActual) {
                    element.className = 'step-completed flex-1 text-center py-2 mx-1 rounded-lg font-bold transition-all';
                    element.innerHTML = step.paso === 1 ? '✅ Realizar Compra' : 
                                       step.paso === 2 ? '📄 Descargar PDF' :
                                       step.paso === 3 ? '📱 Enviar WhatsApp' : '💾 Guardar en BD';
                } else if (step.paso === pasoActual) {
                    element.className = 'step-active flex-1 text-center py-2 mx-1 rounded-lg font-bold transition-all';
                    element.innerHTML = step.paso === 1 ? '1️⃣ Realizar Compra' : 
                                       step.paso === 2 ? '2️⃣ Descargar PDF' :
                                       step.paso === 3 ? '3️⃣ Enviar WhatsApp' : '4️⃣ Guardar en BD';
                } else {
                    element.className = 'step-pending flex-1 text-center py-2 mx-1 rounded-lg font-bold transition-all';
                    element.innerHTML = step.paso === 1 ? '1️⃣ Realizar Compra' : 
                                       step.paso === 2 ? '2️⃣ Descargar PDF' :
                                       step.paso === 3 ? '3️⃣ Enviar WhatsApp' : '4️⃣ Guardar en BD';
                }
            });
            
            // Mostrar/ocultar paneles
            document.getElementById('step1-panel').style.display = pasoActual === 1 ? 'block' : 'none';
        }

        function siguientePaso() {
            if (pasoActual === 1) {
                const proveedor = document.getElementById("com_proveedor").value;
                if (!proveedor) {
                    Swal.fire("Error", "Selecciona un proveedor", "warning");
                    return;
                }
                if (carritoDeCompras.length === 0) {
                    Swal.fire("Error", "Agrega al menos un producto", "warning");
                    return;
                }
                pasoActual = 2;
                actualizarPasos();
                descargarPDF();
            } else if (pasoActual === 2) {
                pasoActual = 3;
                actualizarPasos();
                enviarWhatsApp();
            } else if (pasoActual === 3) {
                pasoActual = 4;
                actualizarPasos();
                guardarCompra();
            }
        }

        // ==================== GENERAR PDF ====================
        function generarHTMLPDF() {
            const proveedor = document.getElementById("com_proveedor").value;
            const factura = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            
            let tablaProductos = '';
            carritoDeCompras.forEach(item => {
                const subtotal = item.cantidad * item.precio;
                tablaProductos += `<tr><td style="padding:8px">${item.id}</td><td style="padding:8px">${item.producto}</td><td style="padding:8px;text-align:center">${item.cantidad}</td><td style="padding:8px;text-align:right">$${item.precio.toFixed(2)}</td><td style="padding:8px;text-align:right">$${subtotal.toFixed(2)}</td></tr>`;
            });

            return `<!DOCTYPE html>
            <html><head><meta charset="UTF-8"><title>Orden Compra ${factura}</title>
            <style>
                body{font-family:Arial;padding:30px;background:white}
                .header{text-align:center;border-bottom:3px solid #b45309;padding-bottom:15px;margin-bottom:20px}
                .header h1{color:#b45309;font-size:28px}
                .titulo{background:#fef3c7;text-align:center;padding:10px;border-radius:8px;margin:15px 0}
                .section{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:15px;overflow:hidden}
                .section-title{background:#fef3c7;padding:10px;font-weight:bold;color:#b45309}
                .section-content{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
                table{width:100%;border-collapse:collapse}
                th{background:#fef3c7;padding:10px;text-align:left;border-bottom:2px solid #b45309}
                td{padding:8px;border-bottom:1px solid #e2e8f0}
                .total{text-align:right;margin-top:20px;padding:15px;background:#fef3c7;border-radius:8px}
                .total span{font-size:20px;font-weight:bold;color:#b45309}
                .footer{margin-top:30px;text-align:center;font-size:10px;color:#718096}
            </style>
            </head><body>
            <div class="header"><h1>🥛 LÓGICA LÁCTEA</h1><p>Productos Lácteos Artesanales</p></div>
            <div class="titulo"><h3>📄 ORDEN DE COMPRA A PROVEEDOR</h3></div>
            <div class="section"><div class="section-title">📋 INFORMACIÓN DE LA ORDEN</div>
            <div class="section-content"><div><strong>N° Factura:</strong><br>${factura}</div><div><strong>Fecha:</strong><br>${fecha}</div><div><strong>Estado:</strong><br><span style="background:#fef3c7;padding:4px 12px;border-radius:20px">⏳ PENDIENTE</span></div></div></div>
            <div class="section"><div class="section-title">🏢 DATOS DEL PROVEEDOR</div>
            <div class="section-content"><div><strong>Proveedor:</strong><br>${proveedor}</div></div></div>
            <div class="section"><div class="section-title">📦 PRODUCTOS SOLICITADOS</div>
            <table><thead><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>${tablaProductos}</tbody></table></div>
            <div class="total"><strong>TOTAL DE LA COMPRA:</strong> <span>$${total.toFixed(2)}</span></div>
            <div class="footer"><p>Lógica Láctea - Este pedido está pendiente de confirmar recepción</p></div>
            </body></html>`;
        }

        function descargarPDF() {
            const ventana = window.open('', '_blank');
            ventana.document.write(generarHTMLPDF());
            ventana.document.close();
            setTimeout(() => ventana.print(), 500);
            Swal.fire({ title: '📄 PDF Generado', text: 'Descarga el PDF para enviar al proveedor', icon: 'success', timer: 2000, showConfirmButton: false });
        }

        function enviarWhatsApp() {
            const proveedor = document.getElementById("com_proveedor").value;
            if (!proveedor || carritoDeCompras.length === 0) return;
            let total = 0, productos = "";
            carritoDeCompras.forEach(item => { total += item.cantidad * item.precio; productos += `▸ ${item.cantidad} x ${item.producto} = $${(item.cantidad*item.precio).toFixed(2)}\n`; });
            const mensaje = `*🛒 ORDEN DE COMPRA - LÓGICA LÁCTEA*\n\nProveedor: ${proveedor}\nFactura: ${document.getElementById("com_factura").value}\nFecha: ${document.getElementById("fecha_pedido").value}\n\n*PRODUCTOS:*\n${productos}\n*TOTAL: $${total.toFixed(2)}*\n\n📌 Adjunto encontrarás el PDF de la orden.\n📍 Entregar en: Lógica Láctea`;
            window.open(`https://wa.me/593984016027?text=${encodeURIComponent(mensaje)}`, '_blank');
            Swal.fire({ title: '📱 WhatsApp', text: 'Envía el mensaje y adjunta el PDF', icon: 'success', timer: 2000, showConfirmButton: false });
        }

        async function guardarCompra() {
            const proveedor = document.getElementById("com_proveedor").value;
            const factura = document.getElementById("com_factura").value;
            if (!proveedor || !carritoDeCompras.length) return;
            
            Swal.fire({ title: 'Guardando...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            try {
                await DairyAPI.registrarCompra({
                    factura, proveedor,
                    fecha: new Date().toISOString().split('T')[0],
                    items: carritoDeCompras.map(item => ({ producto_id: item.id, producto_nombre: item.producto, cantidad: item.cantidad, costo: item.precio }))
                });
                Swal.fire({ title: '✅ Compra Guardada', text: `Factura: ${factura}\nProveedor: ${proveedor}`, icon: 'success' });
                carritoDeCompras = [];
                renderizarCarrito();
                document.getElementById("com_proveedor").value = "";
                generarFacturaAuto();
            } catch (err) {
                Swal.fire("Error", "No se pudo guardar", "error");
            }
        }
    </script>
</body>
</html>
