<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
        
        /* Estilos para los selects con búsqueda */
        .search-select-container {
            position: relative;
            width: 100%;
        }
        .search-select-input {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 8px 12px;
            font-size: 14px;
            background-color: white;
        }
        .search-select-input:focus {
            outline: none;
            ring: 2px solid #f59e0b;
            border-color: #f59e0b;
        }
        .search-select-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            z-index: 50;
            display: none;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .search-select-option {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
        }
        .search-select-option:hover {
            background-color: #fef3c7;
        }
        .select-flecha {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 8px 12px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
        }
        .select-flecha:focus {
            outline: none;
            ring: 2px solid #f59e0b;
            border-color: #f59e0b;
        }
        .doble-busqueda {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .doble-busqueda .search-select-container {
            flex: 2;
        }
        .doble-busqueda select {
            flex: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <div class="bg-amber-900 text-white p-4 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥛 Lógica Láctea</h1>
        </div>
    </div>

    <header class="bg-amber-800 text-white shadow-md px-6 py-4 no-print">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-bag" class="w-8 h-8 text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold">Orden de Compra a Proveedor</h1>
                <p class="text-xs text-amber-200">Selecciona un proveedor y agrega sus productos</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo -->
        <div class="space-y-6 lg:col-span-1">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Datos de la Compra
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Orden de Compra N°</label>
                    <input type="text" id="com_factura" class="w-full border rounded-lg px-3 py-2 text-sm font-mono bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Proveedor *</label>
                    <div class="doble-busqueda">
                        <div class="search-select-container">
                            <input type="text" id="proveedorInput" class="search-select-input" placeholder="Buscar proveedor..." autocomplete="off">
                            <div id="proveedorDropdown" class="search-select-dropdown"></div>
                            <input type="hidden" id="com_proveedor_hidden" value="">
                        </div>
                        <select id="com_proveedor" class="select-flecha" onchange="seleccionarProveedorDesdeSelect()">
                            <option value="">-- Seleccione --</option>
                        </select>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Teléfono Proveedor</label>
                    <input type="text" id="telefono_proveedor" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Fecha de Pedido</label>
                    <input type="text" id="fecha_pedido" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="w-4 h-4 text-amber-600"></i> Agregar Producto
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Producto</label>
                    <div class="doble-busqueda">
                        <div class="search-select-container">
                            <input type="text" id="productoInput" class="search-select-input" placeholder="Buscar producto..." autocomplete="off" disabled>
                            <div id="productoDropdown" class="search-select-dropdown"></div>
                            <input type="hidden" id="sel_producto_hidden" value="">
                        </div>
                        <select id="sel_producto" class="select-flecha" onchange="seleccionarProductoDesdeSelect()" disabled>
                            <option value="">-- Seleccione --</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Cantidad</label>
                        <input type="number" id="txt_cantidad" min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Precio Distribuidor</label>
                        <input type="text" id="txt_costo" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                    </div>
                </div>
                <button onclick="agregarItemAlCarrito()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-sm font-bold transition-all">
                    + Agregar Producto
                </button>
            </div>
        </div>

        <!-- Tabla Carrito y Total -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="py-3 px-4 text-left">Código</th>
                                <th class="py-3 px-4 text-left">Producto</th>
                                <th class="py-3 px-4 text-center">Cantidad</th>
                                <th class="py-3 px-4 text-right">Precio</th>
                                <th class="py-3 px-4 text-right">Subtotal</th>
                                <th class="py-3 px-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCarrito">
                            <tr>
                                <td colspan="6" class="text-center py-20 text-slate-400">
                                    <i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>
                                    Carrito vacío - Selecciona un proveedor y agrega productos
                                 </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="bg-slate-50 p-5 border-t">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <span class="text-xs text-slate-400 uppercase font-bold">Total Compra</span>
                            <span id="lblTotalCompra" class="text-3xl font-bold text-slate-900 ml-2">$0.00</span>
                        </div>
                        <button id="btnSiguiente" onclick="siguientePaso()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold transition-all flex items-center gap-2">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Generar PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd8JyMA9NRqsxqoH762o3iR2khHpemBoVxCl-aMOEtxdp2FTnHE68p-hgnDGg-q83tog/exec";
        
        let catalogoProductos = [];
        let catalogoProveedores = [];
        let productosFiltrados = [];
        let carritoDeCompras = [];
        let pasoActual = 1;
        let ordenesGeneradas = new Set();

        // ==================== API ====================
        const DairyAPI = {
            async obtenerDatos(hoja) {
                try {
                    const url = `${SCRIPT_URL}?action=obtenerDatos&hoja=${encodeURIComponent(hoja)}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    if (result.status === 'success') return result.data;
                    throw new Error(result.message);
                } catch (error) {
                    console.error(`Error en obtenerDatos (${hoja}):`, error);
                    throw error;
                }
            },
            async registrarCompra(data) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'registrarNuevaCompra', ...data })
                    });
                    return { status: 'success' };
                } catch (error) {
                    console.error('Error al registrar compra:', error);
                    throw error;
                }
            }
        };

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            
            Swal.fire({
                title: 'Cargando datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            try {
                await cargarProveedores();
                await cargarProductos();
                configurarFecha();
                generarOrdenAuto();
                inicializarSelectProveedor();
                Swal.close();
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los datos', 'error');
            }
        });

        // Generar orden de compra única
        function generarOrdenAuto() {
            const fecha = new Date();
            let orden;
            do {
                orden = `COM-${fecha.getFullYear()}${String(fecha.getMonth()+1).padStart(2,'0')}${String(fecha.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*1000000)}`;
            } while (ordenesGeneradas.has(orden));
            ordenesGeneradas.add(orden);
            document.getElementById("com_factura").value = orden;
            return orden;
        }

        function configurarFecha() {
            const fecha = new Date();
            const fechaStr = fecha.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById("fecha_pedido").value = fechaStr;
        }

        // ==================== SELECTOR DE PROVEEDOR (BÚSQUEDA + SELECT) ====================
        function inicializarSelectProveedor() {
            const input = document.getElementById("proveedorInput");
            const dropdown = document.getElementById("proveedorDropdown");
            const select = document.getElementById("com_proveedor");
            
            // Llenar el select con flecha
            select.innerHTML = '<option value="">-- Seleccione un proveedor --</option>';
            catalogoProveedores.forEach(p => {
                select.innerHTML += `<option value="${p.nombre}" data-telefono="${p.telefono || ''}">${p.nombre} ${p.ciudad ? '- ' + p.ciudad : ''}</option>`;
            });
            
            // Búsqueda en input
            input.addEventListener("input", function() {
                const texto = this.value.toLowerCase();
                const filtrados = catalogoProveedores.filter(p => 
                    p.nombre.toLowerCase().includes(texto)
                );
                
                if (filtrados.length === 0) {
                    dropdown.style.display = "none";
                    return;
                }
                
                dropdown.innerHTML = "";
                filtrados.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "search-select-option";
                    div.innerHTML = `<div class="font-medium">${p.nombre}</div><div class="text-xs text-slate-500">📞 ${p.telefono || 'N/A'}</div>`;
                    div.onclick = () => {
                        input.value = p.nombre;
                        select.value = p.nombre;
                        document.getElementById("telefono_proveedor").value = p.telefono || '';
                        dropdown.style.display = "none";
                        cargarProductosPorProveedor(p.nombre);
                    };
                    dropdown.appendChild(div);
                });
                dropdown.style.display = "block";
            });
            
            document.addEventListener("click", (e) => {
                if (e.target !== input && !dropdown.contains(e.target) && e.target !== select) {
                    dropdown.style.display = "none";
                }
            });
        }

        function seleccionarProveedorDesdeSelect() {
            const select = document.getElementById("com_proveedor");
            const input = document.getElementById("proveedorInput");
            const selectedOption = select.options[select.selectedIndex];
            const proveedor = select.value;
            const telefono = selectedOption?.dataset?.telefono || '';
            
            input.value = proveedor;
            document.getElementById("telefono_proveedor").value = telefono;
            
            if (proveedor) {
                cargarProductosPorProveedor(proveedor);
            } else {
                // Limpiar productos
                const productoSelect = document.getElementById("sel_producto");
                productoSelect.innerHTML = '<option value="">-- Seleccione un proveedor primero --</option>';
                productoSelect.disabled = true;
                document.getElementById("productoInput").disabled = true;
                document.getElementById("productoInput").placeholder = "Seleccione un proveedor primero";
                productosFiltrados = [];
            }
        }

        // ==================== SELECTOR DE PRODUCTO (BÚSQUEDA + SELECT) ====================
        function inicializarSelectProducto() {
            const input = document.getElementById("productoInput");
            const dropdown = document.getElementById("productoDropdown");
            const select = document.getElementById("sel_producto");
            
            // Llenar el select con flecha
            select.innerHTML = '<option value="">-- Seleccione un producto --</option>';
            productosFiltrados.forEach(p => {
                select.innerHTML += `<option value="${p.id}" data-precio="${p.precio}">${p.producto} (${p.id}) - $${p.precio.toFixed(2)}</option>`;
            });
            
            input.removeEventListener("input", this);
            
            input.addEventListener("input", function() {
                const texto = this.value.toLowerCase();
                const filtrados = productosFiltrados.filter(p => 
                    p.producto.toLowerCase().includes(texto)
                );
                
                if (filtrados.length === 0 || !productosFiltrados.length) {
                    dropdown.style.display = "none";
                    return;
                }
                
                dropdown.innerHTML = "";
                filtrados.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "search-select-option";
                    div.innerHTML = `<div class="font-medium">${p.producto}</div><div class="text-xs text-slate-500">${p.id} - $${p.precio.toFixed(2)}</div>`;
                    div.onclick = () => {
                        input.value = p.producto;
                        select.value = p.id;
                        document.getElementById("txt_costo").value = p.precio.toFixed(2);
                        dropdown.style.display = "none";
                    };
                    dropdown.appendChild(div);
                });
                dropdown.style.display = "block";
            });
            
            document.addEventListener("click", (e) => {
                if (e.target !== input && !dropdown.contains(e.target) && e.target !== select) {
                    dropdown.style.display = "none";
                }
            });
        }

        function seleccionarProductoDesdeSelect() {
            const select = document.getElementById("sel_producto");
            const input = document.getElementById("productoInput");
            const selectedOption = select.options[select.selectedIndex];
            const producto = select.value;
            const precio = parseFloat(selectedOption?.dataset?.precio || 0);
            const textoProducto = selectedOption?.text?.split('(')[0]?.trim() || '';
            
            if (producto && precio) {
                input.value = textoProducto;
                document.getElementById("txt_costo").value = precio.toFixed(2);
                document.getElementById("sel_producto_hidden").value = producto;
            } else {
                input.value = "";
                document.getElementById("txt_costo").value = "";
                document.getElementById("sel_producto_hidden").value = "";
            }
        }

        // ==================== PROVEEDORES ====================
        async function cargarProveedores() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                if (datos && datos.length > 0) {
                    catalogoProveedores = datos.filter(p => p["Nombre del Proveedor"]).map(p => ({
                        nombre: p["Nombre del Proveedor"],
                        telefono: p["Contacto / Teléfono"] || '',
                        ciudad: p.Ciudad || '',
                        direccion: p.Direccion || '',
                        ruc: p.RUC || ''
                    }));
                } else {
                    catalogoProveedores = [
                        { nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE" },
                        { nombre: "Kilómetro 0", telefono: "0984016027", ciudad: "Quito" }
                    ];
                }
            } catch (err) {
                console.error("Error cargando proveedores:", err);
            }
        }

        // ==================== PRODUCTOS ====================
        async function cargarProductos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Inventario");
                if (datos && datos.length > 0) {
                    catalogoProductos = datos.filter(p => p.ID && p.Producto).map(p => ({
                        id: p.ID,
                        producto: p.Producto,
                        precio: parseFloat(String(p.Precio_Distribuidor).replace('$', '').replace(',', '.')) || 0,
                        proveedorHabitual: p["Proveedor Habitual"] || p.Proveedor || ''
                    }));
                } else {
                    catalogoProductos = [
                        { id: "P-103", producto: "Yogurt de Fruta 1/2 L", precio: 0.70, proveedorHabitual: "Grupo del Campo Artesano" },
                        { id: "P-128", producto: "Queso Mozarella 500g", precio: 3.50, proveedorHabitual: "Grupo del Campo Artesano" }
                    ];
                }
            } catch (err) {
                console.error("Error cargando productos:", err);
                catalogoProductos = [];
            }
        }

        function cargarProductosPorProveedor(proveedorSeleccionado) {
            if (!proveedorSeleccionado) {
                productosFiltrados = [];
                const productoInput = document.getElementById("productoInput");
                const productoSelect = document.getElementById("sel_producto");
                productoInput.disabled = true;
                productoInput.placeholder = "Seleccione un proveedor primero";
                productoSelect.disabled = true;
                productoSelect.innerHTML = '<option value="">-- Seleccione un proveedor primero --</option>';
                return;
            }
            
            productosFiltrados = catalogoProductos.filter(p => 
                p.proveedorHabitual === proveedorSeleccionado
            );
            
            const productoInput = document.getElementById("productoInput");
            const productoSelect = document.getElementById("sel_producto");
            
            if (productosFiltrados.length === 0) {
                productoInput.disabled = false;
                productoInput.placeholder = "No hay productos para este proveedor";
                productoSelect.disabled = false;
                productoSelect.innerHTML = '<option value="">-- No hay productos --</option>';
                Swal.fire("Info", "Este proveedor no tiene productos registrados", "info");
                return;
            }
            
            productoInput.disabled = false;
            productoInput.placeholder = "Buscar producto...";
            productoInput.value = "";
            productoSelect.disabled = false;
            document.getElementById("txt_costo").value = "";
            document.getElementById("sel_producto_hidden").value = "";
            
            inicializarSelectProducto();
        }

        // ==================== CARRITO ====================
        function agregarItemAlCarrito() {
            const proveedor = document.getElementById("com_proveedor").value;
            if (!proveedor) {
                Swal.fire("Error", "Primero selecciona un proveedor", "warning");
                return;
            }
            
            const id = document.getElementById("sel_producto").value;
            const cantidad = parseInt(document.getElementById("txt_cantidad").value);
            const precio = parseFloat(document.getElementById("txt_costo").value);

            if (!id || cantidad < 1 || precio <= 0) {
                Swal.fire("Error", "Selecciona un producto y cantidad válida", "warning");
                return;
            }

            const producto = productosFiltrados.find(p => p.id === id);
            const existente = carritoDeCompras.find(i => i.id === id);
            
            if (existente) {
                existente.cantidad += cantidad;
            } else {
                carritoDeCompras.push({
                    id: id,
                    producto: producto.producto,
                    cantidad: cantidad,
                    precio: precio
                });
            }

            document.getElementById("txt_cantidad").value = "1";
            document.getElementById("productoInput").value = "";
            document.getElementById("sel_producto").value = "";
            document.getElementById("txt_costo").value = "";
            renderizarCarrito();
            
            Swal.fire({ title: "✓ Agregado", text: `${cantidad} x ${producto.producto}`, icon: "success", timer: 1500, showConfirmButton: false });
        }

        function removerItem(index) {
            carritoDeCompras.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            let total = 0;

            if (carritoDeCompras.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-slate-400"><i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>Carrito vacío - Agrega productos</td></tr>`;
                document.getElementById("lblTotalCompra").innerHTML = "$0.00";
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = "";
            carritoDeCompras.forEach((item, idx) => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="py-3 px-4 font-mono text-xs">${item.id}</td>
                        <td class="py-3 px-4">${item.producto}</td>
                        <td class="py-3 px-4 text-center font-bold">${item.cantidad}</td>
                        <td class="py-3 px-4 text-right">$${item.precio.toFixed(2)}</td>
                        <td class="py-3 px-4 text-right font-bold">$${subtotal.toFixed(2)}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="removerItem(${idx})" class="text-red-500 hover:text-red-700">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById("lblTotalCompra").innerHTML = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        // ==================== ACTUALIZAR BOTÓN ====================
        function actualizarBoton() {
            const btn = document.getElementById("btnSiguiente");
            if (pasoActual === 1) {
                btn.innerHTML = '<i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Generar PDF';
                btn.style.display = "flex";
            } else if (pasoActual === 2) {
                btn.innerHTML = '<i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Enviar WhatsApp';
            } else if (pasoActual === 3) {
                btn.style.display = "none";
            }
            lucide.createIcons();
        }

        // ==================== SIGUIENTE PASO ====================
        function siguientePaso() {
            if (pasoActual === 1) {
                const proveedor = document.getElementById("com_proveedor").value;
                if (!proveedor) {
                    Swal.fire("Error", "Selecciona un proveedor", "warning");
                    return;
                }
                if (carritoDeCompras.length === 0) {
                    Swal.fire("Error", "Agrega al menos un producto", "warning");
                    return;
                }
                pasoActual = 2;
                actualizarBoton();
                descargarPDF();
            } else if (pasoActual === 2) {
                pasoActual = 3;
                actualizarBoton();
                enviarWhatsAppYGuardar();
            }
        }

        // ==================== ENVIAR WHATSAPP Y GUARDAR ====================
        function enviarWhatsAppYGuardar() {
            const proveedor = document.getElementById("com_proveedor").value;
            const ordenCompra = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            let telefono = document.getElementById("telefono_proveedor").value;
            
            if (!proveedor || carritoDeCompras.length === 0) return;
            
            let numeroWhatsApp = telefono.replace(/\D/g, '');
            if (!numeroWhatsApp) numeroWhatsApp = "593984016027";
            if (!numeroWhatsApp.startsWith('593')) numeroWhatsApp = '593' + numeroWhatsApp;
            
            const mensaje = `🛒 ORDEN DE COMPRA - LÓGICA LÁCTEA\n\nProveedor: ${proveedor}\nOrden de Compra N°: ${ordenCompra}\nFecha: ${fecha}\nTOTAL: $${total.toFixed(2)}\n\n📌 Adjunto encontrarás el PDF de la orden.\n📍 Entregar en: Lógica Láctea`;
            
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
            
            Swal.fire({ title: 'Guardando...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            
            setTimeout(async () => {
                try {
                    await DairyAPI.registrarCompra({
                        factura: ordenCompra, proveedor,
                        fecha: new Date().toISOString().split('T')[0],
                        items: carritoDeCompras.map(item => ({ producto_id: item.id, producto_nombre: item.producto, cantidad: item.cantidad, costo: item.precio }))
                    });
                    Swal.fire({ title: '✅ Compra Completada', text: `Orden: ${ordenCompra}\nGuardado en ComprasPendientes`, icon: 'success' });
                    carritoDeCompras = [];
                    renderizarCarrito();
                    document.getElementById("proveedorInput").value = "";
                    document.getElementById("com_proveedor").value = "";
                    document.getElementById("telefono_proveedor").value = "";
                    document.getElementById("productoInput").value = "";
                    document.getElementById("productoInput").disabled = true;

                    document.getElementById("sel_producto").disabled = true;
                    generarOrdenAuto();
                    pasoActual = 1;
                    actualizarBoton();
                    document.getElementById("btnSiguiente").style.display = "flex";
                } catch (err) {
                    Swal.fire("Error", "No se pudo guardar", "error");
                }
            }, 1000);
