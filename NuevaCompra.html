<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <div class="bg-amber-900 text-white p-4 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥛 Lógica Láctea</h1>
        </div>
    </div>

    <header class="bg-amber-800 text-white shadow-md px-6 py-4 no-print">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-bag" class="w-8 h-8 text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold">Orden de Compra a Proveedor</h1>
                <p class="text-xs text-amber-200">Selecciona un proveedor y agrega sus productos</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel Izquierdo -->
        <div class="space-y-6 lg:col-span-1">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Datos de la Compra
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Factura N°</label>
                    <input type="text" id="com_factura" class="w-full border rounded-lg px-3 py-2 text-sm font-mono bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Proveedor *</label>
                    <select id="com_proveedor" class="w-full border rounded-lg px-3 py-2 text-sm bg-white" onchange="cargarProductosPorProveedor()">
                        <option value="">-- Seleccione un proveedor --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Teléfono Proveedor</label>
                    <input type="text" id="telefono_proveedor" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Fecha de Pedido</label>
                    <input type="text" id="fecha_pedido" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="w-4 h-4 text-amber-600"></i> Agregar Producto
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Producto</label>
                    <select id="sel_producto" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="">-- Seleccione un proveedor primero --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Cantidad</label>
                        <input type="number" id="txt_cantidad" min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Precio Distribuidor</label>
                        <input type="text" id="txt_costo" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                    </div>
                </div>
                <button onclick="agregarItemAlCarrito()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-sm font-bold transition-all">
                    + Agregar Producto
                </button>
            </div>
        </div>

        <!-- Tabla Carrito y Total -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b">
                            <tr>
                                <th class="py-3 px-4 text-left">Código</th>
                                <th class="py-3 px-4 text-left">Producto</th>
                                <th class="py-3 px-4 text-center">Cantidad</th>
                                <th class="py-3 px-4 text-right">Precio</th>
                                <th class="py-3 px-4 text-right">Subtotal</th>
                                <th class="py-3 px-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCarrito">
                            <tr>
                                <td colspan="6" class="text-center py-20 text-slate-400">
                                    <i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>
                                    Carrito vacío - Selecciona un proveedor y agrega productos
                                 </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="bg-slate-50 p-5 border-t">
                    <div class="flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <span class="text-xs text-slate-400 uppercase font-bold">Total Compra</span>
                            <span id="lblTotalCompra" class="text-3xl font-bold text-slate-900 ml-2">$0.00</span>
                        </div>
                        <button id="btnSiguiente" onclick="siguientePaso()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg font-bold transition-all flex items-center gap-2">
                            <i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Generar PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ==================== CONFIGURACIÓN ====================
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4m1Xe19wjVXzcaxkiIFBXm9G2cAgWgwrjjVuK2CBSnCj6uWzWX5vLr7IUrGCOILUkLw/exec";
        
        let catalogoProductos = [];
        let catalogoProveedores = [];
        let carritoDeCompras = [];
        let pasoActual = 1;
        let facturasGeneradas = new Set(); // Para evitar facturas repetidas

        // ==================== API ====================
        const DairyAPI = {
            async obtenerDatos(hoja) {
                try {
                    const url = `${SCRIPT_URL}?action=obtenerDatos&hoja=${encodeURIComponent(hoja)}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    if (result.status === 'success') return result.data;
                    throw new Error(result.message);
                } catch (error) {
                    console.error(`Error en obtenerDatos (${hoja}):`, error);
                    throw error;
                }
            },
            async registrarCompra(data) {
                try {
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'registrarNuevaCompra', ...data })
                    });
                    return { status: 'success' };
                } catch (error) {
                    console.error('Error al registrar compra:', error);
                    throw error;
                }
            }
        };

        // ==================== INICIALIZACIÓN ====================
        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            
            Swal.fire({
                title: 'Cargando datos...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });
            
            try {
                await cargarProveedores();
                await cargarProductos();
                configurarFecha();
                Swal.close();
            } catch (error) {
                Swal.fire('Error', 'No se pudieron cargar los datos', 'error');
            }
        });

        // Generar factura única (no repetible)
        function generarFacturaAuto() {
            const fecha = new Date();
            let factura;
            do {
                factura = `FAC-${fecha.getFullYear()}${String(fecha.getMonth()+1).padStart(2,'0')}${String(fecha.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*10000000)}`;
            } while (facturasGeneradas.has(factura));
            facturasGeneradas.add(factura);
            document.getElementById("com_factura").value = factura;
            return factura;
        }

        function configurarFecha() {
            const fecha = new Date();
            const fechaStr = fecha.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById("fecha_pedido").value = fechaStr;
        }

        // ==================== PROVEEDORES ====================
        async function cargarProveedores() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                if (datos && datos.length > 0) {
                    catalogoProveedores = datos.filter(p => p["Nombre del Proveedor"]).map(p => ({
                        nombre: p["Nombre del Proveedor"],
                        telefono: p["Contacto / Teléfono"] || '',
                        ciudad: p.Ciudad || '',
                        direccion: p.Direccion || '',
                        ruc: p.RUC || ''
                    }));
                } else {
                    catalogoProveedores = [
                        { nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE" },
                        { nombre: "Kilómetro 0", telefono: "0984016027", ciudad: "Quito" }
                    ];
                }
                
                const select = document.getElementById("com_proveedor");
                select.innerHTML = '<option value="">-- Seleccione un proveedor --</option>';
                catalogoProveedores.forEach(p => {
                    select.innerHTML += `<option value="${p.nombre}" data-telefono="${p.telefono}" data-ciudad="${p.ciudad}" data-direccion="${p.direccion}" data-ruc="${p.ruc}">${p.nombre} ${p.ciudad ? '- ' + p.ciudad : ''}</option>`;
                });
            } catch (err) {
                console.error("Error cargando proveedores:", err);
            }
        }

        // ==================== PRODUCTOS (filtrados por proveedor) ====================
        async function cargarProductos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Inventario");
                if (datos && datos.length > 0) {
                    catalogoProductos = datos.filter(p => p.ID && p.Producto).map(p => ({
                        id: p.ID,
                        producto: p.Producto,
                        precio: parseFloat(String(p.Precio_Distribuidor).replace('$', '').replace(',', '.')) || 0,
                        proveedorHabitual: p["Proveedor Habitual"] || p.Proveedor || ''
                    }));
                } else {
                    catalogoProductos = [
                        { id: "P-103", producto: "Yogurt de Fruta 1/2 L", precio: 0.70, proveedorHabitual: "Grupo del Campo Artesano" },
                        { id: "P-128", producto: "Queso Mozarella 500g", precio: 3.50, proveedorHabitual: "Grupo del Campo Artesano" },
                        { id: "P-164", producto: "Queso Cremoso 500 g", precio: 3.00, proveedorHabitual: "Grupo del Campo Artesano" }
                    ];
                }
            } catch (err) {
                console.error("Error cargando productos:", err);
                catalogoProductos = [];
            }
        }

        function cargarProductosPorProveedor() {
            const selectProveedor = document.getElementById("com_proveedor");
            const proveedorSeleccionado = selectProveedor.value;
            const selectedOption = selectProveedor.options[selectProveedor.selectedIndex];
            const telefono = selectedOption?.dataset?.telefono || '';
            document.getElementById("telefono_proveedor").value = telefono;
            
            if (!proveedorSeleccionado) {
                const selectProducto = document.getElementById("sel_producto");
                selectProducto.innerHTML = '<option value="">-- Seleccione un proveedor primero --</option>';
                return;
            }
            
            // Filtrar productos por proveedor habitual
            const productosFiltrados = catalogoProductos.filter(p => 
                p.proveedorHabitual === proveedorSeleccionado
            );
            
            const selectProducto = document.getElementById("sel_producto");
            if (productosFiltrados.length === 0) {
                selectProducto.innerHTML = '<option value="">-- No hay productos para este proveedor --</option>';
                Swal.fire("Info", "Este proveedor no tiene productos registrados", "info");
                return;
            }
            
            selectProducto.innerHTML = '<option value="">-- Selecciona un producto --</option>';
            productosFiltrados.forEach(p => {
                selectProducto.innerHTML += `<option value="${p.id}" data-precio="${p.precio}">${p.producto} (${p.id}) - $${p.precio.toFixed(2)}</option>`;
            });
            
            document.getElementById("sel_producto").addEventListener("change", (e) => {
                const opt = e.target.options[e.target.selectedIndex];
                const precio = parseFloat(opt.dataset.precio) || 0;
                document.getElementById("txt_costo").value = precio.toFixed(2);
            });
        }

        // ==================== CARRITO ====================
        function agregarItemAlCarrito() {
            const selectProveedor = document.getElementById("com_proveedor").value;
            if (!selectProveedor) {
                Swal.fire("Error", "Primero selecciona un proveedor", "warning");
                return;
            }
            
            const select = document.getElementById("sel_producto");
            const id = select.value;
            const cantidad = parseInt(document.getElementById("txt_cantidad").value);
            const precio = parseFloat(document.getElementById("txt_costo").value);

            if (!id || cantidad < 1 || precio <= 0) {
                Swal.fire("Error", "Selecciona un producto y cantidad válida", "warning");
                return;
            }

            const producto = catalogoProductos.find(p => p.id === id);
            const existente = carritoDeCompras.find(i => i.id === id);
            
            if (existente) {
                existente.cantidad += cantidad;
            } else {
                carritoDeCompras.push({
                    id: id,
                    producto: producto.producto,
                    cantidad: cantidad,
                    precio: precio
                });
            }

            document.getElementById("txt_cantidad").value = "1";
            document.getElementById("sel_producto").value = "";
            document.getElementById("txt_costo").value = "";
            renderizarCarrito();
            
            Swal.fire({ title: "✓ Agregado", text: `${cantidad} x ${producto.producto}`, icon: "success", timer: 1500, showConfirmButton: false });
        }

        function removerItem(index) {
            carritoDeCompras.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            let total = 0;

            if (carritoDeCompras.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-slate-400"><i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>Carrito vacío - Agrega productos</td></tr>`;
                document.getElementById("lblTotalCompra").innerHTML = "$0.00";
                lucide.createIcons();
                return;
            }

            tbody.innerHTML = "";
            carritoDeCompras.forEach((item, idx) => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="py-3 px-4 font-mono text-xs">${item.id}</td>
                        <td class="py-3 px-4">${item.producto}</td>
                        <td class="py-3 px-4 text-center font-bold">${item.cantidad}</td>
                        <td class="py-3 px-4 text-right">$${item.precio.toFixed(2)}</td>
                        <td class="py-3 px-4 text-right font-bold">$${subtotal.toFixed(2)}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="removerItem(${idx})" class="text-red-500 hover:text-red-700">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById("lblTotalCompra").innerHTML = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        // ==================== ACTUALIZAR BOTÓN ====================
        function actualizarBoton() {
            const btn = document.getElementById("btnSiguiente");
            if (pasoActual === 1) {
                btn.innerHTML = '<i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Generar PDF';
                btn.style.display = "flex";
            } else if (pasoActual === 2) {
                btn.innerHTML = '<i data-lucide="arrow-right" class="w-4 h-4"></i> Siguiente: Enviar WhatsApp';
            } else if (pasoActual === 3) {
                btn.style.display = "none";
            }
            lucide.createIcons();
        }

        // ==================== SIGUIENTE PASO ====================
        function siguientePaso() {
            if (pasoActual === 1) {
                const proveedor = document.getElementById("com_proveedor").value;
                if (!proveedor) {
                    Swal.fire("Error", "Selecciona un proveedor", "warning");
                    return;
                }
                if (carritoDeCompras.length === 0) {
                    Swal.fire("Error", "Agrega al menos un producto", "warning");
                    return;
                }
                generarFacturaAuto(); // Generar factura única
                pasoActual = 2;
                actualizarBoton();
                descargarPDF();
            } else if (pasoActual === 2) {
                pasoActual = 3;
                actualizarBoton();
                enviarWhatsAppYGuardar();
            }
        }

        // ==================== GENERAR PDF COMPLETO ====================
        function generarHTMLPDF() {
            const proveedor = document.getElementById("com_proveedor").value;
            const factura = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            
            let tablaProductos = '';
            carritoDeCompras.forEach(item => {
                const subtotal = item.cantidad * item.precio;
                tablaProductos += `
                    <tr style="border-bottom: 1px solid #e2e8f0;">
                        <td style="padding: 8px; text-align: left;">${item.id}</td>
                        <td style="padding: 8px; text-align: left;">${item.producto}</td>
                        <td style="padding: 8px; text-align: center;">${item.cantidad}</td>
                        <td style="padding: 8px; text-align: right;">$${item.precio.toFixed(2)}</td>
                        <td style="padding: 8px; text-align: right;">$${subtotal.toFixed(2)}</td>
                      </tr>
                `;
            });

            return `<!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Orden de Compra - ${factura}</title>
                <style>
                    * { margin: 0; padding: 0; box-sizing: border-box; }
                    body {
                        font-family: 'Arial', sans-serif;
                        background: white;
                        padding: 40px;
                        font-size: 14px;
                    }
                    .container {
                        max-width: 900px;
                        margin: 0 auto;
                        background: white;
                    }
                    .header {
                        text-align: center;
                        margin-bottom: 30px;
                        border-bottom: 3px solid #b45309;
                        padding-bottom: 20px;
                    }
                    .header h1 {
                        color: #b45309;
                        font-size: 28px;
                        margin-bottom: 5px;
                    }
                    .header h2 {
                        color: #78350f;
                        font-size: 16px;
                        font-weight: normal;
                    }
                    .titulo-orden {
                        background: #fef3c7;
                        text-align: center;
                        padding: 10px;
                        margin: 20px 0;
                        border-radius: 8px;
                    }
                    .titulo-orden h3 {
                        color: #b45309;
                        font-size: 18px;
                    }
                    .info-section {
                        margin-bottom: 20px;
                        border: 1px solid #e2e8f0;
                        border-radius: 10px;
                        overflow: hidden;
                    }
                    .info-title {
                        background: #fef3c7;
                        padding: 10px 15px;
                        font-weight: bold;
                        color: #b45309;
                        font-size: 14px;
                        border-bottom: 1px solid #e2e8f0;
                    }
                    .info-content {
                        padding: 15px;
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 10px;
                    }
                    .info-item {
                        margin-bottom: 5px;
                    }
                    .info-label {
                        font-weight: bold;
                        color: #4a5568;
                        font-size: 11px;
                        text-transform: uppercase;
                    }
                    .info-value {
                        font-size: 13px;
                        color: #1a202c;
                    }
                    table {
                        width: 100%;
                        border-collapse: collapse;
                        margin: 0;
                    }
                    th {
                        background: #fef3c7;
                        padding: 10px;
                        text-align: left;
                        font-weight: bold;
                        color: #78350f;
                        font-size: 12px;
                        border-bottom: 2px solid #b45309;
                    }
                    td {
                        padding: 8px;
                        border-bottom: 1px solid #e2e8f0;
                    }
                    .total-section {
                        text-align: right;
                        margin-top: 20px;
                        padding: 15px;
                        background: #fef3c7;
                        border-radius: 8px;
                    }
                    .total-label {
                        font-size: 16px;
                        font-weight: bold;
                        color: #4a5568;
                    }
                    .total-amount {
                        font-size: 24px;
                        font-weight: bold;
                        color: #b45309;
                        margin-left: 15px;
                    }
                    .status {
                        display: inline-block;
                        background: #fef3c7;
                        color: #b45309;
                        padding: 4px 12px;
                        border-radius: 20px;
                        font-size: 11px;
                        font-weight: bold;
                    }
                    .footer {
                        margin-top: 40px;
                        text-align: center;
                        font-size: 10px;
                        color: #718096;
                        border-top: 1px solid #e2e8f0;
                        padding-top: 15px;
                    }
                    .observaciones {
                        margin-top: 20px;
                        padding: 15px;
                        background: #f8fafc;
                        border-radius: 8px;
                        font-size: 11px;
                        color: #4a5568;
                    }
                    .observaciones p {
                        margin: 5px 0;
                    }
                </style>
            </head>
            <body>
                <div class="container">
                    <div class="header">
                        <h1>🥛 LÓGICA LÁCTEA</h1>
                        <h2>Productos Lácteos Artesanales</h2>
                    </div>
                    
                    <div class="titulo-orden">
                        <h3>📄 ORDEN DE COMPRA A PROVEEDOR</h3>
                    </div>

                    <div class="info-section">
                        <div class="info-title">📋 INFORMACIÓN DE LA ORDEN</div>
                        <div class="info-content">
                            <div class="info-item">
                                <div class="info-label">N° Factura/Orden:</div>
                                <div class="info-value">${factura}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Fecha de Emisión:</div>
                                <div class="info-value">${fecha}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Estado:</div>
                                <div class="info-value"><span class="status">⏳ PENDIENTE DE RECEPCIÓN</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="info-title">🏢 DATOS DEL PROVEEDOR</div>
                        <div class="info-content">
                            <div class="info-item">
                                <div class="info-label">Razón Social:</div>
                                <div class="info-value">${proveedor}</div>
                            </div>
                        </div>
                    </div>

                    <div class="info-section">
                        <div class="info-title">📦 PRODUCTOS SOLICITADOS</div>
                        <table style="width: 100%;">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Subtotal</th>
                                  </tr>
                            </thead>
                            <tbody>
                                ${tablaProductos}
                            </tbody>
                        </table>
                    </div>

                    <div class="total-section">
                        <span class="total-label">TOTAL DE LA COMPRA:</span>
                        <span class="total-amount">$${total.toFixed(2)}</span>
                    </div>

                    <div class="observaciones">
                        <strong>📌 OBSERVACIONES IMPORTANTES:</strong>
                        <p>• Esta orden está pendiente de confirmar recepción de mercadería.</p>
                        <p>• El stock se actualizará una vez que se confirme la recepción en el sistema.</p>
                        <p>• Favor entregar los productos en: <strong>Lógica Láctea - Centro de Acopio</strong></p>
                        <p>• Horario de recepción: Lunes a Viernes de 8:00 a 17:00</p>
                        <p>• Esta orden no es un comprobante de pago.</p>
                    </div>

                    <div class="footer">
                        <p>Lógica Láctea - Todos los derechos reservados © ${new Date().getFullYear()}</p>
                        <p>Este documento es una orden de compra generada automáticamente.</p>
                    </div>
                </div>
            </body>
            </html>`;
        }

        function descargarPDF() {
            const ventana = window.open('', '_blank');
            ventana.document.write(generarHTMLPDF());
            ventana.document.close();
            setTimeout(() => ventana.print(), 500);
            Swal.fire({ title: '📄 PDF Generado', text: 'Descarga el PDF para enviar al proveedor', icon: 'success', timer: 2000, showConfirmButton: false });
        }

        // ==================== ENVIAR WHATSAPP Y GUARDAR ====================
        function enviarWhatsAppYGuardar() {
            const proveedor = document.getElementById("com_proveedor").value;
            const factura = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            const telefono = document.getElementById("telefono_proveedor").value;
            
            if (!proveedor || carritoDeCompras.length === 0) return;
            
            // Limpiar número de teléfono (solo dígitos)
            let numeroWhatsApp = telefono.replace(/\D/g, '');
            if (!numeroWhatsApp) {
                numeroWhatsApp = "593984016027"; // Número por defecto
            }
            if (!numeroWhatsApp.startsWith('593')) {
                numeroWhatsApp = '593' + numeroWhatsApp;
            }
            
            // Mensaje simplificado
            const mensaje = `🛒 ORDEN DE COMPRA - LÓGICA LÁCTEA

Proveedor: ${proveedor}
Factura: ${factura}
Fecha: ${fecha}
TOTAL: $${total.toFixed(2)}

📌 Adjunto encontrarás el PDF de la orden.
📍 Entregar en: Lógica Láctea`;
            
            // Abrir WhatsApp con el número del proveedor
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`, '_blank');
            
            // Guardar en Google Sheets
            Swal.fire({ title: 'Guardando compra...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            
            setTimeout(async () => {
                try {
                    await DairyAPI.registrarCompra({
                        factura, proveedor,
                        fecha: new Date().toISOString().split('T')[0],
                        items: carritoDeCompras.map(item => ({ 
                            producto_id: item.id, 
                            producto_nombre: item.producto, 
                            cantidad: item.cantidad, 
                            costo: item.precio 
                        }))
                    });
                    
                    Swal.fire({ 
                        title: '✅ Compra Completada', 
                        text: `Factura: ${factura}\nProveedor: ${proveedor}\nGuardado en ComprasPendientes`, 
                        icon: 'success' 
                    });
                    
                    // Limpiar todo
                    carritoDeCompras = [];
                    renderizarCarrito();
                    document.getElementById("com_proveedor").value = "";
                    document.getElementById("telefono_proveedor").value = "";
                    document.getElementById("sel_producto").innerHTML = '<option value="">-- Seleccione un proveedor primero --</option>';
                    pasoActual = 1;
                    actualizarBoton();
                    document.getElementById("btnSiguiente").style.display = "flex";
                    
                } catch (err) {
                    Swal.fire("Error", "No se pudo guardar la compra", "error");
                }
            }, 1000);
        }
    </script>
</body>
</html>
