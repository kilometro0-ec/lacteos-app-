<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orden de Compra - Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .sugerencias-list { max-height: 250px; overflow-y: auto; }
        .sugerencia-item { transition: all 0.2s ease; }
        .sugerencia-item:hover { background-color: #fef3c7; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <div class="bg-amber-900 text-white p-4 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">🥛 Lógica Láctea</h1>
        </div>
    </div>

    <header class="bg-amber-800 text-white shadow-md px-6 py-4 no-print">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-bag" class="w-8 h-8 text-amber-300"></i>
            <div>
                <h1 class="text-xl font-bold">Orden de Compra a Proveedor</h1>
                <p class="text-xs text-amber-200">Genera la orden, descarga PDF y envía por WhatsApp</p>
            </div>
        </div>
    </header>

    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="space-y-6 lg:col-span-1 no-print">
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="file-text" class="w-4 h-4 text-amber-600"></i> Datos de la Compra
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Factura N°</label>
                    <input type="text" id="com_factura" class="w-full border rounded-lg px-3 py-2 text-sm font-mono bg-slate-100" readonly>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Proveedor *</label>
                    <div class="relative">
                        <input type="text" id="com_proveedor" 
                               class="w-full border rounded-lg px-3 py-2 text-sm" 
                               placeholder="Escribe para buscar proveedor..." 
                               autocomplete="off">
                        <div id="sugerenciasProveedor" class="absolute z-20 w-full bg-white border rounded-lg mt-1 hidden shadow-lg"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Fecha de Pedido</label>
                    <input type="text" id="fecha_pedido" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h2 class="text-sm font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="package-plus" class="w-4 h-4 text-amber-600"></i> Agregar Producto
                </h2>
                <div class="mb-3">
                    <label class="block text-xs font-bold mb-1">Producto</label>
                    <select id="sel_producto" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="">Cargando productos...</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-xs font-bold mb-1">Cantidad</label>
                        <input type="number" id="txt_cantidad" min="1" value="1" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Precio Distribuidor</label>
                        <input type="text" id="txt_costo" class="w-full border rounded-lg px-3 py-2 text-sm bg-slate-100" readonly>
                    </div>
                </div>
                <button onclick="agregarItemAlCarrito()" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 rounded-lg text-sm font-bold">
                    + Agregar Producto
                </button>
            </div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="overflow-x-auto no-print">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b">
                        <tr><th class="py-3 px-4">Código</th><th class="py-3 px-4">Producto</th><th class="py-3 px-4 text-center">Cantidad</th><th class="py-3 px-4 text-right">Precio</th><th class="py-3 px-4 text-right">Subtotal</th><th class="py-3 px-4 text-center">Acción</th></tr>
                    </thead>
                    <tbody id="tbodyCarrito">
                        <tr><td colspan="6" class="text-center py-20 text-slate-400"><i data-lucide="shopping-cart" class="w-10 h-10 mx-auto mb-2"></i>Carrito vacío</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="pdfContent" class="print-only" style="padding: 20px;"></div>

            <div class="bg-slate-50 p-5 border-t flex flex-col sm:flex-row justify-between items-center gap-4 no-print">
                <div><span class="text-xs text-slate-400">TOTAL</span><span id="lblTotalCompra" class="text-3xl font-bold text-slate-900 ml-2">$0.00</span></div>
                <div class="flex gap-3 flex-wrap">
                    <button onclick="enviarWhatsApp()" class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> WhatsApp
                    </button>
                    <button onclick="descargarPDF()" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="printer" class="w-4 h-4"></i> Descargar PDF
                    </button>
                    <button onclick="guardarCompra()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold flex items-center gap-2">
                        <i data-lucide="save" class="w-4 h-4"></i> Guardar en Google Sheets
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ⚠️ IMPORTANTE: Abre este archivo LOCALMENTE (no desde GitHub Pages)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxd8JyMA9NRqsxqoH762o3iR2khHpemBoVxCl-aMOEtxdp2FTnHE68p-hgnDGg-q83tog/exec";
        
        let catalogoProductos = [];
        let catalogoProveedores = [];
        let carritoDeCompras = [];

        const DairyAPI = {
            async obtenerDatos(hoja) {
                const url = `${SCRIPT_URL}?action=obtenerDatos&hoja=${encodeURIComponent(hoja)}`;
                const response = await fetch(url);
                const result = await response.json();
                if (result.status === 'success') return result.data;
                throw new Error(result.message);
            },
            async registrarCompra(data) {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'registrarNuevaCompra', ...data })
                });
                return { status: 'success' };
            }
        };

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            await cargarProductos();
            await cargarProveedores();
            generarFacturaAuto();
            configurarFecha();
            configurarBuscadorProveedores();
        });

        function generarFacturaAuto() {
            const fecha = new Date();
            const factura = `FAC-${fecha.getFullYear()}${String(fecha.getMonth()+1).padStart(2,'0')}${String(fecha.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*1000000)}`;
            document.getElementById("com_factura").value = factura;
        }

        function configurarFecha() {
            const fecha = new Date();
            document.getElementById("fecha_pedido").value = fecha.toLocaleDateString('es-ES');
        }

        async function cargarProductos() {
            try {
                const datos = await DairyAPI.obtenerDatos("Inventario");
                if (datos && datos.length) {
                    catalogoProductos = datos.filter(p => p.ID && p.Producto).map(p => ({
                        id: p.ID,
                        producto: p.Producto,
                        precio: parseFloat(String(p.Precio_Distribuidor).replace('$', '').replace(',', '.')) || 0
                    }));
                } else {
                    catalogoProductos = [
                        { id: "P-103", producto: "Yogurt de Fruta 1/2 L", precio: 0.70 },
                        { id: "P-128", producto: "Queso Mozarella 500g", precio: 3.50 }
                    ];
                }
                const select = document.getElementById("sel_producto");
                select.innerHTML = '<option value="">-- Seleccionar --</option>';
                catalogoProductos.forEach(p => {
                    select.innerHTML += `<option value="${p.id}" data-precio="${p.precio}">${p.producto} - $${p.precio.toFixed(2)}</option>`;
                });
                document.getElementById("sel_producto").addEventListener("change", (e) => {
                    const opt = e.target.options[e.target.selectedIndex];
                    document.getElementById("txt_costo").value = parseFloat(opt.dataset.precio || 0).toFixed(2);
                });
            } catch(err) { console.error(err); }
        }

        async function cargarProveedores() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                if (datos && datos.length) {
                    catalogoProveedores = datos.map(p => ({ nombre: p["Nombre del Proveedor"] || p.Nombre, telefono: p["Contacto / Teléfono"] || '', ciudad: p.Ciudad || '' }));
                } else {
                    catalogoProveedores = [{ nombre: "Grupo del Campo Artesano", telefono: "984016027", ciudad: "CAYAMBE" }];
                }
            } catch(err) { console.error(err); }
        }

        function configurarBuscadorProveedores() {
            const input = document.getElementById("com_proveedor");
            const sugerencias = document.getElementById("sugerenciasProveedor");
            input.addEventListener("input", () => {
                const texto = input.value.toLowerCase().trim();
                if (texto.length < 1) { sugerencias.classList.add("hidden"); return; }
                const filtrados = catalogoProveedores.filter(p => p.nombre && p.nombre.toLowerCase().includes(texto));
                if (!filtrados.length) { sugerencias.classList.add("hidden"); return; }
                sugerencias.innerHTML = "";
                filtrados.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "sugerencia-item px-3 py-2 cursor-pointer border-b text-sm";
                    div.innerHTML = `<div class="font-bold text-amber-800">${p.nombre}</div><div class="text-xs">📞 ${p.telefono || 'N/A'} | 📍 ${p.ciudad || 'N/A'}</div>`;
                    div.onclick = () => { input.value = p.nombre; sugerencias.classList.add("hidden"); };
                    sugerencias.appendChild(div);
                });
                sugerencias.classList.remove("hidden");
            });
            document.addEventListener("click", (e) => { if (e.target !== input) sugerencias.classList.add("hidden"); });
        }

        function agregarItemAlCarrito() {
            const select = document.getElementById("sel_producto");
            const id = select.value;
            const cantidad = parseInt(document.getElementById("txt_cantidad").value);
            const precio = parseFloat(document.getElementById("txt_costo").value);
            if (!id || cantidad < 1 || precio <= 0) { Swal.fire("Error", "Selecciona producto", "warning"); return; }
            const producto = catalogoProductos.find(p => p.id === id);
            const existente = carritoDeCompras.find(i => i.id === id);
            if (existente) existente.cantidad += cantidad;
            else carritoDeCompras.push({ id, producto: producto.producto, cantidad, precio });
            document.getElementById("txt_cantidad").value = "1";
            document.getElementById("sel_producto").value = "";
            document.getElementById("txt_costo").value = "";
            renderizarCarrito();
            Swal.fire({ title: "✓ Agregado", text: `${cantidad} x ${producto.producto}`, icon: "success", timer: 1500, showConfirmButton: false });
        }

        function removerItem(index) { carritoDeCompras.splice(index, 1); renderizarCarrito(); }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            let total = 0;
            if (!carritoDeCompras.length) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-20 text-slate-400">Carrito vacío</td></tr>`;
                document.getElementById("lblTotalCompra").innerText = "$0.00";
                lucide.createIcons();
                return;
            }
            tbody.innerHTML = "";
            carritoDeCompras.forEach((item, idx) => {
                const subtotal = item.cantidad * item.precio;
                total += subtotal;
                tbody.innerHTML += `<tr class="border-b"><td class="py-3 px-4">${item.id}</td><td class="py-3 px-4">${item.producto}</td><td class="py-3 px-4 text-center">${item.cantidad}</td><td class="py-3 px-4 text-right">$${item.precio.toFixed(2)}</td><td class="py-3 px-4 text-right font-bold">$${subtotal.toFixed(2)}</td><td class="py-3 px-4 text-center"><button onclick="removerItem(${idx})" class="text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`;
            });
            document.getElementById("lblTotalCompra").innerText = `$${total.toFixed(2)}`;
            lucide.createIcons();
        }

        function generarHTMLPDF() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            const factura = document.getElementById("com_factura").value;
            const fecha = document.getElementById("fecha_pedido").value;
            const total = carritoDeCompras.reduce((s, i) => s + (i.cantidad * i.precio), 0);
            let filas = "";
            carritoDeCompras.forEach(item => {
                filas += `<tr><td style="padding:8px">${item.id}</td><td style="padding:8px">${item.producto}</td><td style="padding:8px;text-align:center">${item.cantidad}</td><td style="padding:8px;text-align:right">$${item.precio.toFixed(2)}</td><td style="padding:8px;text-align:right">$${(item.cantidad*item.precio).toFixed(2)}</td></tr>`;
            });
            return `
                <html><head><meta charset="UTF-8"><title>Orden Compra ${factura}</title>
                <style>body{font-family:Arial;padding:20px} h1{color:#b45309} table{width:100%;border-collapse:collapse} th,td{border:1px solid #ddd;padding:8px;text-align:left} th{background:#fef3c7} .total{text-align:right;margin-top:20px;font-size:18px;font-weight:bold}</style>
                </head><body>
                <h1>🥛 LÓGICA LÁCTEA</h1>
                <h2>ORDEN DE COMPRA A PROVEEDOR</h2>
                <p><strong>N° Factura:</strong> ${factura}</p>
                <p><strong>Fecha:</strong> ${fecha}</p>
                <p><strong>Proveedor:</strong> ${proveedor}</p>
                <p><strong>Estado:</strong> PENDIENTE DE RECEPCIÓN</p>
                <table><tr><th>Código</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr>${filas}</table>
                <div class="total">TOTAL: $${total.toFixed(2)}</div>
                <p style="margin-top:40px;font-size:12px">Este pedido está pendiente de confirmar recepción. El stock se actualizará al confirmar.</p>
                </body></html>
            `;
        }

        function descargarPDF() {
            if (!document.getElementById("com_proveedor").value.trim() || !carritoDeCompras.length) {
                Swal.fire("Error", "Agrega productos y selecciona proveedor", "warning");
                return;
            }
            const ventana = window.open('', '_blank');
            ventana.document.write(generarHTMLPDF());
            ventana.document.close();
            setTimeout(() => ventana.print(), 500);
        }

        function enviarWhatsApp() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            if (!proveedor || !carritoDeCompras.length) { Swal.fire("Error", "Complete los datos", "warning"); return; }
            let total = 0;
            let productos = "";
            carritoDeCompras.forEach(item => { total += item.cantidad * item.precio; productos += `▸ ${item.cantidad} x ${item.producto} = $${(item.cantidad*item.precio).toFixed(2)}\n`; });
            const mensaje = `*ORDEN DE COMPRA - LÓGICA LÁCTEA*\n\nProveedor: ${proveedor}\nFactura: ${document.getElementById("com_factura").value}\nFecha: ${document.getElementById("fecha_pedido").value}\n\n*PRODUCTOS:*\n${productos}\n*TOTAL: $${total.toFixed(2)}*\n\n📌 Estado: PENDIENTE DE RECEPCIÓN`;
            window.open(`https://wa.me/593984016027?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        async function guardarCompra() {
            const proveedor = document.getElementById("com_proveedor").value.trim();
            const factura = document.getElementById("com_factura").value;
            if (!proveedor || !carritoDeCompras.length) { Swal.fire("Error", "Complete los datos", "warning"); return; }
            Swal.fire({ title: 'Guardando...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });
            try {
                await DairyAPI.registrarCompra({
                    factura, proveedor,
                    fecha: new Date().toISOString().split('T')[0],
                    items: carritoDeCompras.map(item => ({ producto_id: item.id, producto_nombre: item.producto, cantidad: item.cantidad, costo: item.precio }))
                });
                Swal.fire({ title: '✅ Compra Guardada', text: `Factura: ${factura}\nProveedor: ${proveedor}`, icon: 'success' });
                carritoDeCompras = [];
                renderizarCarrito();
                document.getElementById("com_proveedor").value = "";
                generarFacturaAuto();
            } catch (err) {
                Swal.fire("Error", "No se pudo guardar. Verifica que el script esté desplegado.", "error");
            }
        }
    </script>
</body>
</html>
