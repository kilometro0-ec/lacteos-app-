<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Proveedores | Lógica Láctea</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js?v=1.4"></script>
    <script src="menu-logic.js?v=1.4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#4f46e5' } } } }
    </script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="pb-32 bg-slate-50 text-slate-800">
    <header class="fixed top-0 w-full z-40 flex justify-between items-center px-6 h-20 bg-gradient-to-r from-indigo-700 to-indigo-900 text-white shadow-md">
        <div>
            <h1 class="text-[9px] font-black text-indigo-200 uppercase tracking-widest">Catálogos</h1>
            <h2 class="text-base font-black uppercase tracking-tight">Proveedores Aliados</h2>
        </div>
        <span class="material-symbols-outlined text-2xl">local_mall</span>
    </header>

    <main class="pt-24 px-4 max-w-xl mx-auto space-y-4">
        <div id="lista-proveedores" class="grid gap-3"></div>
    </main>
    <nav id="menu-container"></nav>

    <script>
        async function cargar() {
            try {
                const datos = await DairyAPI.obtenerDatos("Proveedores");
                document.getElementById('lista-proveedores').innerHTML = datos.map(p => `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-1">
                        <span class="text-[8px] font-black bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded uppercase border border-indigo-100">${p.Categoría || 'General'}</span>
                        <h3 class="text-xs font-black uppercase text-slate-900 mt-1">${p['Nombre del Proveedor']}</h3>
                        <p class="text-[10px] font-medium text-slate-500 flex items-center gap-1 mt-2">
                            <span class="material-symbols-outlined text-xs text-indigo-600">location_on</span> ${p.Ciudad}, ${p.Provincia}
                        </p>
                    </div>`).join('');
            } catch(e) { console.error(e); }
        }
        window.onload = cargar;
    </script>
</body>
</html>
