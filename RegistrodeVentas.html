<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Nueva Venta - Lógica Láctea</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="api-config.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <style>
        body { background-color: #f8fafc; padding-bottom: 100px; font-family: sans-serif; overflow-x: hidden; }
        .card-venta { background: white; border-radius: 2.5rem; border: 1px solid #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .input-especial { background: #f1f5f9; border: 2px solid transparent; border-radius: 1.5rem; transition: all 0.3s; }
        .input-especial:focus { border-color: #a21caf; background: white; outline: none; }
        .btn-plus { background: #a21caf; color: white; width: 45px; height: 45px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; shadow: 0 4px 12px rgba(162, 28, 175, 0.3); }
        
        /* Nav Fija */
        .nav-fija { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); border-top: 1px solid #f3e8ff; padding: 10px 0 14px 0; z-index: 9999; }
        .menu-grid { max-width: 500px; margin: 0 auto; display: flex; justify-content: space-around; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: #94a3b8; background: none; border: none; }
        .nav-btn .material-symbols-outlined { font-size: 22px !important; }
        .nav-btn span:last-child { font-size: 8px !important; font-weight: 800; text-transform: uppercase; }
        .active-btn { color: #a21caf !important; }

        /* Estilo para los items del carrito */
        .cart-item { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 h-20 bg-white/80 backdrop-blur-sm border-b border-purple-50">
    <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-[#a21caf] to-[#db2777] flex items-center justify-center text-white shadow-md">
            <span class="material-symbols-outlined font-black">add_shopping_cart</span>
        </div>
        <h1 class="font-black text-slate-800 tracking-tight">NUEVA VENTA</h1>
    </div>
    <div id="loader" class="hidden">
        <span class="material-symbols-outlined animate-spin text-purple-600">sync</span>
    </div>
</header>

<main class="pt-24 px-5 max-w-lg mx-auto space-y-6">
    
    <!-- SECCIÓN CLIENTE -->
    <section class="card-venta p-6">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-2 block">Cliente Destinatario</label>
        <select id="select-cliente" class="w-full p-4 input-especial font-bold text-slate-700 appearance-none">
            <option value="">Seleccionar Cliente...</option>
        </select>
    </section>

    <!-- AGREGAR PRODUCTO -->
    <section class="card-venta p-6 space-y-4">
        <div class="grid grid-cols-12 gap-3">
            <div class="col-span-8">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-1 block">Producto</label>
                <select id="select-producto" class="w-full p-4 input-especial font-bold text-slate-700 text-sm appearance-none">
                    <option value="">Cargando...</option>
                </select>
            </div>
            <div class="col-span-4">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2 mb-1 block">Cant.</label>
                <input type="number" id="input-cantidad" value="1" min="1" class="w-full p-4 input-especial font-black text-center text-lg">
            </div>
        </div>
        
        <button onclick="agregarAlCarrito()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase shadow-xl active:scale-95 transition-transform flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-sm">add</span> Añadir al Pedido
        </button>
    </section>

    <!-- LISTA DE PEDIDO (CARRITO) -->
    <section id="seccion-carrito" class="hidden space-y-4">
        <div class="flex justify-between items-center px-2">
            <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-widest">Resumen del Pedido</h3>
            <button onclick="vaciarCarrito()" class="text-red-400 font-black text-[9px] uppercase">Vaciar</button>
        </div>
        
        <div id="lista-carrito" class="space-y-3">
            <!-- Items dinámicos -->
        </div>

        <!-- TOTAL Y CONFIRMACIÓN -->
        <div class="bg-gradient-to-br from-purple-600 to-fuchsia-700 p-8 rounded-[3rem] text-white shadow-2xl shadow-purple-200">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <p class="text-[10px] font-bold opacity-70 uppercase">Total a Cobrar</p>
                    <h2 id="total-venta" class="text-5xl font-black">$0.00</h2>
                </div>
                <div class="text-right">
                    <p id="conteo-items" class="text-xs font-black bg-white/20 px-3 py-1 rounded-full text-white">0 Items</p>
                </div>
            </div>
            
            <button onclick="finalizarVenta()" class="w-full py-5 bg-white text-purple-700 rounded-2xl font-black text-sm uppercase shadow-lg active:scale-95 transition-transform">
                Confirmar y Agendar Ruta
            </button>
        </div>
    </section>

</main>

<div id="menu-container"></div>

<script>
let carrito = [];
let listaPrecios = {};

async function cargarMaestros() {
    const loader = document.getElementById('loader');
    loader.classList.remove('hidden');
    try {
        const [clientes, stock] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Stock")
        ]);

        // Poblar Clientes
        const selCliente = document.getElementById('select-cliente');
        selCliente.innerHTML = '<option value="">Seleccionar Cliente...</option>' + 
            clientes.map(c => `<option value="${c.Nombre}">${c.Nombre}</option>`).join('');

        // Poblar Productos y Guardar Precios
        const selProd = document.getElementById('select-producto');
        selProd.innerHTML = stock.map(p => {
            listaPrecios[p.Producto] = parseFloat(String(p.Precio_Venta || 0).replace(',', '.'));
            return `<option value="${p.Producto}">${p.Producto} - $${p.Precio_Venta}</option>`;
        }).join('');

    } catch (e) {
        console.error("Error cargando datos maestros", e);
    } finally {
        loader.classList.add('hidden');
    }
}

function agregarAlCarrito() {
    const prod = document.getElementById('select-producto').value;
    const cant = parseInt(document.getElementById('input-cantidad').value);
    
    if(!prod || cant <= 0) return;

    const precio = listaPrecios[prod] || 0;
    const subtotal = precio * cant;

    carrito.push({ prod, cant, precio, subtotal });
    renderCarrito();
    
    // Reset cantidad
    document.getElementById('input-cantidad').value = 1;
}

function eliminarDelCarrito(index) {
    carrito.splice(index, 1);
    renderCarrito();
}

function vaciarCarrito() {
    carrito = [];
    renderCarrito();
}

function renderCarrito() {
    const container = document.getElementById('lista-carrito');
    const secCarrito = document.getElementById('seccion-carrito');
    
    if(carrito.length === 0) {
        secCarrito.classList.add('hidden');
        return;
    }
    
    secCarrito.classList.remove('hidden');
    let total = 0;
    
    container.innerHTML = carrito.map((item, index) => {
        total += item.subtotal;
        return `
            <div class="cart-item bg-white p-4 rounded-3xl border border-slate-100 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 flex items-center justify-center text-purple-600 font-black text-xs">
                        ${item.cant}x
                    </div>
                    <div>
                        <h4 class="font-black text-slate-800 text-xs uppercase">${item.prod}</h4>
                        <p class="text-[10px] text-slate-400 font-bold">$${item.precio.toFixed(2)} c/u</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <p class="font-black text-slate-700 text-sm">$${item.subtotal.toFixed(2)}</p>
                    <button onclick="eliminarDelCarrito(${index})" class="text-red-300">
                        <span class="material-symbols-outlined">cancel</span>
                    </button>
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('total-venta').innerText = `$${total.toFixed(2)}`;
    document.getElementById('conteo-items').innerText = `${carrito.length} Items`;
}

async function finalizarVenta() {
    const cliente = document.getElementById('select-cliente').value;
    if(!cliente) return alert("Selecciona un cliente");

    const loader = document.getElementById('loader');
    loader.classList.remove('hidden');

    const idVenta = "V" + Date.now().toString().slice(-6);
    const fecha = new Date().toLocaleDateString('es-ES');

    try {
        // Enviamos cada item del carrito como una fila a la pestaña Ventas
        for (const item of carrito) {
            await DairyAPI.enviarDatos("Ventas", {
                pestaña: "Ventas",
                accion: "insertar",
                ID_Venta: idVenta,
                Fecha: fecha,
                Cliente: cliente,
                Producto: item.prod,
                Cantidad: item.cant,
                Total: item.subtotal,
                Estado: "PENDIENTE"
            });
        }

        alert("Venta registrada con éxito. Aparecerá en Rutas.");
        window.location.href = 'GestióndeDespachos.html';

    } catch (e) {
        alert("Error al procesar la venta");
    } finally {
        loader.classList.add('hidden');
    }
}

function renderMenu() {
    const container = document.getElementById('menu-container');
    const opciones = [
        { nombre: 'Panel', icon: 'dashboard', link: 'DashboardLacteo.html' },
        { nombre: 'Ventas', icon: 'add_shopping_cart', link: 'RegistrodeVentas.html' },
        { nombre: 'Stock', icon: 'inventory', link: 'ControldeInventario.html' },
        { nombre: 'Clientes', icon: 'group', link: 'GestiondeClientes.html' },
        { nombre: 'Rutas', icon: 'local_shipping', link: 'GestióndeDespachos.html' }
    ];
    let html = '<nav class="nav-fija"><div class="menu-grid">';
    opciones.forEach(opt => {
        const esActivo = window.location.pathname.includes(opt.link) ? 'active-btn' : '';
        html += `<button onclick="location.href='${opt.link}'" class="nav-btn ${esActivo}"><span class="material-symbols-outlined">${opt.icon}</span><span>${opt.nombre}</span></button>`;
    });
    container.innerHTML = html + '</div></nav>';
}

window.onload = () => {
    cargarMaestros();
    renderMenu();
}
</script>

</body>
</html>
