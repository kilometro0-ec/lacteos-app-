<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Ventas - Lógica Láctea</title>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="api-config.js"></script>
<script src="menu-logic.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
theme: {
extend: {
colors: {
primary: "#a21caf",
secondary: "#db2777",
whatsapp: "#25d366",
surface: "#f8fafc"
}
}
}
}
</script>

<style>
body { font-family:'Plus Jakarta Sans'; background:#fdfaff; }

.input-sutil {
background:#f8fafc;
border:1px solid #f1f5f9;
border-radius:1.25rem;
padding:0.8rem 1rem;
width:100%;
font-weight:700;
}

.card-producto{
background:white;
border-radius:1.5rem;
border:1px solid #f1f5f9;
padding:16px;
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.bloqueado{opacity:.3;pointer-events:none}
</style>
</head>

<body class="pb-96">

<!-- HEADER -->
<header class="h-20 bg-white/80 backdrop-blur-md border-b flex justify-between items-center px-6 sticky top-0 z-50">

<div>
<h1 class="font-black uppercase">Nueva Venta</h1>
<span id="id-venta-display" class="text-xs text-purple-600">ID---</span>
</div>

<div class="flex gap-2">

<!-- 🔥 VENTA RÁPIDA -->
<button onclick="ventaRapida()" class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">bolt</span>
</button>

<!-- REFRESH -->
<button onclick="location.reload()" class="w-10 h-10 bg-fuchsia-50 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined">refresh</span>
</button>

</div>
</header>

<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">

<!-- CLIENTE -->
<section class="bg-white p-6 rounded-[2.5rem] border">
<div class="flex justify-between mb-3">
<span class="text-xs font-black">Cliente</span>
<button onclick="alternarFormulario(true)" class="text-xs bg-secondary text-white px-3 py-1 rounded-full">Nuevo</button>
</div>

<select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
<option value="">Seleccionar</option>
</select>

<div id="vista-nuevo-cliente" class="hidden mt-3 space-y-2">
<input id="reg-nombre" class="input-sutil" placeholder="Nombre">
<input id="reg-ruc" class="input-sutil" placeholder="CI">
<button onclick="guardarCliente()" class="bg-primary text-white w-full py-3 rounded-xl font-bold">Guardar</button>
</div>
</section>

<!-- PRODUCTOS -->
<div id="seccion-operativa" class="bloqueado">
<input id="buscarProducto" oninput="filtrar()" class="input-sutil mb-3" placeholder="Buscar">

<div id="contenedor-productos"></div>
</div>

</main>

<script>

let productosData=[];
let carrito={};
let idVenta="";

async function iniciar(){

const d=new Date();
idVenta="V-"+Date.now();
document.getElementById("id-venta-display").innerText=idVenta;

const [cl,pr]=await Promise.all([
DairyAPI.obtenerDatos("Clientes"),
DairyAPI.obtenerDatos("Inventario")
]);

productosData=(pr||[]).filter(p=>Number(p.Stock)>0);

document.getElementById("select-cliente").innerHTML+=
(cl||[]).map(c=>`<option>${c.Nombre}</option>`).join("");

render();
}

function render(){
const cont=document.getElementById("contenedor-productos");
cont.innerHTML="";

productosData.forEach(p=>{
cont.innerHTML+=`
<div class="card-producto">
<div>
<b>${p.Producto}</b>
<div>$${p.Precio_Venta} | Stock ${p.Stock}</div>
</div>

<div class="flex gap-2">
<button onclick="add('${p.Producto}',-1)">-</button>
<span>${carrito[p.Producto]||0}</span>
<button onclick="add('${p.Producto}',1)">+</button>
</div>
</div>`;
});
}

function add(n,d){
const p=productosData.find(x=>x.Producto===n);
carrito[n]=(carrito[n]||0)+d;
if(carrito[n]<0)carrito[n]=0;
if(carrito[n]>p.Stock)carrito[n]=p.Stock;
render();
}

function activarInterfaz(){
document.getElementById("seccion-operativa").classList.remove("bloqueado");
}

async function ventaRapida(){

const prod=productosData.find(p=>p.Stock>0);
if(!prod)return alert("Sin stock");

await DairyAPI.enviarDatos({
pestaña:"Ventas",
ID_Venta:"TEST-"+Date.now(),
Cliente:"TEST",
Producto:prod.Producto,
Cantidad:1,
Precio_PVP:prod.Precio_Venta,
Estado_Entrega:"PENDIENTE"
});

// 🔥 DESCUENTO REAL
await DairyAPI.enviarDatos({
pestaña:"InventarioUpdate",
Producto:prod.Producto,
Cantidad:1
});

alert("Venta rápida OK (stock descontado)");
location.reload();
}

async function guardarCliente(){
await DairyAPI.enviarDatos({
pestaña:"Clientes",
Nombre:document.getElementById("reg-nombre").value,
CI_RUC:document.getElementById("reg-ruc").value
});
location.reload();
}

function filtrar(){
const q=document.getElementById("buscarProducto").value.toLowerCase();
document.querySelectorAll(".card-producto").forEach(e=>{
e.style.display=e.innerText.toLowerCase().includes(q)?"flex":"none";
});
}

window.onload=iniciar;

</script>
</body>
</html>
