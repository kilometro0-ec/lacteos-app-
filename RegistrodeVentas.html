<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <link rel="stylesheet" href="estilos-lacteos.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
      tailwind.config = {
        theme: {
            extend: {
                colors: {
                    primary: "#a21caf",
                    secondary: "#db2777",
                    surface: "#faf5ff"
                }
            }
        }
      }
    </script>

    <style>
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        #overlay-exito {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }
        .btn-wa-premium {
            background: #25d366; color: white; width: 100%; padding: 16px;
            border-radius: 1.5rem; font-weight: 800; display: none;
            align-items: center; justify-content: center; gap: 10px;
        }
    </style>
</head>

<body class="pb-96">

<div id="overlay-exito">
    <span class="material-symbols-outlined" id="icono-estado">sync</span>
    <h2 id="titulo-estado">Guardando...</h2>
    <p id="p-estado">Sincronizando con la nube</p>
</div>

<header class="h-20 bg-white/80 backdrop-blur-md border-b border-purple-100 flex justify-between items-center px-6 sticky top-0 z-50">
    <div class="flex flex-col">
        <h1 class="text-xl">Nueva Venta</h1>
        <span id="id-venta-display">ID: ---</span>
    </div>

    <div class="flex gap-2">
        <button onclick="location.reload()">🔄</button>
    </div>
</header>

<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">

    <section>
        <select id="select-cliente" onchange="activarInterfaz()">
            <option value="">-- SELECCIONAR CLIENTE --</option>
        </select>
    </section>

    <div id="seccion-operativa" class="bloqueado">
        <input type="text" id="buscarProducto" oninput="filtrar()" placeholder="Buscar...">
        <div id="contenedor-productos"></div>
    </div>

</main>

<div id="carrito-flotante" class="bloqueado">
    <p id="car-cliente">Esperando...</p>
    <p id="car-id"></p>

    <div id="car-detalle"></div>

    <h2 id="car-total">$0.00</h2>
    <p id="car-items">0</p>

    <input type="date" id="fecha-entrega">

    <button onclick="procesarVenta()">Confirmar Pedido</button>
    <button onclick="enviarWhatsApp()" class="btn-wa-premium" id="btn-whatsapp">WhatsApp</button>
</div>

<div id="menu-container"></div>

<script>
let carrito = {};
let productosData = [];
let idVenta = "";
let clientesLoaded = false;

// ===============================
// USAR API GLOBAL (NO DUPLICAR)
// ===============================
const API_URL = window.API_URL;
const DairyAPI = window.DairyAPI;

// ===============================
// INICIO
// ===============================
async function iniciar() {

    const d = new Date();

    idVenta = `V-${Date.now()}`;

    document.getElementById('car-id').innerText = idVenta;
    document.getElementById('id-venta-display').innerText = idVenta;
    document.getElementById('fecha-entrega').value = d.toISOString().split('T')[0];

    try {

        console.log("📡 Cargando datos...");

        const [clientes, inventario] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Inventario")
        ]);

        console.log("CLIENTES:", clientes);
        console.log("INVENTARIO:", inventario);

        productosData = inventario || [];

        const sel = document.getElementById('select-cliente');
        sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>';

        (clientes || []).forEach(c => {
            sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`;
        });

        renderizar();
        clientesLoaded = true;

        document.getElementById('seccion-operativa').classList.remove('bloqueado');
        document.getElementById('carrito-flotante').classList.remove('bloqueado');

    } catch (e) {
        console.error("ERROR:", e);
        alert("Error cargando datos (ver consola)");
    }
}

// ===============================
function activarInterfaz() {

    const cli = document.getElementById('select-cliente').value;

    if (!clientesLoaded) return alert("Cargando...");

    document.getElementById('car-cliente').innerText = cli || "Esperando...";
}

// ===============================
function renderizar() {

    const cont = document.getElementById('contenedor-productos');
    cont.innerHTML = "";

    productosData.forEach(p => {

        const nombre = p.Producto;
        const precio = Number(p.Precio_Venta) || 0;
        const stock = Number(p.Stock) || 0;

        const id = `cant-${nombre.replace(/\s+/g,'-')}`;

        cont.innerHTML += `
            <div>
                <b>${nombre}</b> $${precio} Stock:${stock}
                <button onclick="cambiarCant('${nombre}',-1)">-</button>
                <span id="${id}">0</span>
                <button onclick="cambiarCant('${nombre}',1)">+</button>
            </div>
        `;
    });
}

// ===============================
function cambiarCant(nombre, d) {

    if (!carrito[nombre]) carrito[nombre] = 0;

    const p = productosData.find(x => x.Producto === nombre);
    if (!p) return;

    const stock = Number(p.Stock) || 0;

    const n = carrito[nombre] + d;

    if (n < 0) return;
    if (n > stock) return alert("Sin stock");

    carrito[nombre] = n;

    document.getElementById(`cant-${nombre.replace(/\s+/g,'-')}`).innerText = n;

    actualizarCarrito();
}

// ===============================
function actualizarCarrito() {

    let total = 0;
    let items = 0;
    let html = "";

    Object.keys(carrito).forEach(n => {

        if (carrito[n] > 0) {

            const p = productosData.find(x => x.Producto === n);
            const price = Number(p?.Precio_Venta) || 0;

            total += carrito[n] * price;
            items += carrito[n];

            html += `<div>${n} x${carrito[n]}</div>`;
        }
    });

    document.getElementById('car-detalle').innerHTML = html || "Vacío";
    document.getElementById('car-total').innerText = `$${total.toFixed(2)}`;
    document.getElementById('car-items').innerText = items;
}

// ===============================
window.onload = iniciar;
</script>

</body>
</html>
