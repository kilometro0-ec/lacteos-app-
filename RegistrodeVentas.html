<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    
    <link rel="stylesheet" href="estilos-lacteos.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <script>
      tailwind.config = {
        theme: { 
            extend: { 
                colors: { 
                    primary: "#a21caf", 
                    secondary: "#db2777", 
                    surface: "#faf5ff"
                } 
            } 
        }
      }
    </script>

    <style>
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        #overlay-exito {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }
        .check-anim { font-size: 80px; color: var(--primary); animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        #carrito-flotante {
            position: fixed; bottom: 100px; left: 16px; right: 16px;
            background: white; border-radius: 2.5rem;
            padding: 20px; box-shadow: 0 20px 50px rgba(162, 28, 175, 0.15); 
            z-index: 100; border: 1px solid var(--outline);
        }
        .btn-wa-premium { 
            background: #25d366; color: white; width: 100%; padding: 16px; border-radius: 1.5rem; 
            font-weight: 800; display: none; align-items: center; justify-content: center; 
            gap: 10px; animation: pulse-wa 2s infinite; border: none;
        }
    </style>
</head>
<body class="pb-96"> 

<div id="overlay-exito">
    <span class="material-symbols-outlined check-anim" id="icono-estado">sync</span>
    <h2 class="text-titulo mt-4" id="titulo-estado">Guardando...</h2>
    <p class="text-label mt-2" id="p-estado">Sincronizando con la nube</p>
</div>

<header class="h-20 bg-white/80 backdrop-blur-md border-b border-purple-100 flex justify-between items-center px-6 sticky top-0 z-50">
    <div class="flex flex-col">
        <h1 class="brand-logo text-xl leading-none">Nueva Venta</h1>
        <span id="id-venta-display" class="text-label text-primary mt-1">ID: ---</span>
    </div>
    <div class="flex gap-2">
        <!-- BOTÓN PRUEBA DE CALIDAD (Fuerza valor 0) -->
        <button onclick="registrarPruebaCalidadRapida()" class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center active:scale-90 transition-transform shadow-sm">
            <span class="material-symbols-outlined text-xl">science</span>
        </button>
        <button onclick="location.reload()" class="w-10 h-10 rounded-2xl bg-purple-50 text-primary flex items-center justify-center active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-xl">refresh</span>
        </button>
    </div>
</header>

<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">
    <section class="card-sutil">
        <div id="vista-seleccion-cliente">
            <div class="flex justify-between items-center mb-4">
                <span class="text-label">Paso 1: Cliente</span>
                <button onclick="alternarFormulario(true)" class="tag tag-warning" style="background: var(--secondary); color: white;">Nuevo +</button>
            </div>
            <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
        </div>

        <div id="vista-nuevo-cliente" class="hidden space-y-3">
            <p class="text-label text-secondary italic">Nuevo Registro</p>
            <input type="text" id="reg-nombre" placeholder="NOMBRE COMPLETO" class="input-sutil uppercase" oninput="this.value = this.value.toUpperCase()">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="reg-ruc" placeholder="CI / RUC" class="input-sutil">
                <input type="tel" id="reg-tel" placeholder="TELÉFONO" class="input-sutil">
            </div>
            <input type="text" id="reg-dir" placeholder="DIRECCIÓN EXACTA" class="input-sutil">
            <input type="text" id="reg-ref" placeholder="REFERENCIA" class="input-sutil">
            <select id="reg-sector" class="input-sutil">
                <option value="SUR">SUR</option>
                <option value="NORTE">NORTE</option>
                <option value="CENTRO">CENTRO</option>
                <option value="VALLES">VALLES</option>
            </select>
            <div class="flex gap-2 pt-2">
                <button onclick="guardarCliente()" id="btn-guardar-cliente" class="btn-magenta flex-1">Guardar</button>
                <button onclick="alternarFormulario(false)" class="flex-1 bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl text-[10px] uppercase">Cancelar</button>
            </div>
        </div>
    </section>

    <div id="seccion-operativa" class="bloqueado transition-all duration-500">
        <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1">
                <span class="material-symbols-outlined absolute left-4 top-4 text-slate-300">search</span>
                <input type="text" id="buscarProducto" oninput="filtrar()" placeholder="Buscar producto..." class="input-sutil pl-12 bg-white">
            </div>
        </div>
        <div id="contenedor-productos" class="space-y-3"></div>
    </div>
</main>

<div id="carrito-flotante" class="bloqueado">
    <div class="flex justify-between items-center mb-4 border-b border-purple-50 pb-4">
        <div class="flex-1">
            <p id="car-cliente" class="text-xs font-black text-primary uppercase italic truncate">Esperando...</p>
            <p id="car-id" class="text-label text-[8px]">ID: ---</p>
        </div>
        <div class="text-right">
            <p id="car-total" class="text-3xl font-black text-slate-900 leading-none">$0.00</p>
            <p id="car-items" class="text-label text-secondary mt-1">0 ÍTEMS</p>
        </div>
    </div>
    
    <div id="car-detalle" class="max-h-24 overflow-y-auto mb-4 space-y-1 text-[11px] font-semibold text-slate-500 italic">
        <p class="text-center text-slate-300 py-2">No hay productos aún</p>
    </div>

    <div class="flex gap-2 mb-4">
        <input type="date" id="fecha-entrega" class="input-sutil bg-purple-50 border-none h-12 text-center text-primary font-bold">
    </div>

    <button id="btn-confirmar" onclick="procesarVenta()" class="btn-magenta">Confirmar Pedido</button>
    
    <button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-wa-premium">
        <span class="material-symbols-outlined">send</span> ENVIAR A WHATSAPP
    </button>
</div>

<div id="menu-container"></div>

<script>
let carrito = {};
let productosData = [];
let idVenta = "";
let clientesLoaded = false;

// ===============================
// CONFIG SEGURA API
// ===============================
const API_URL = window.API_URL || "https://script.google.com/macros/s/XXXX/exec";

// ===============================
// API WRAPPER ROBUSTO
// ===============================
const DairyAPI = window.DairyAPI || {

    async obtenerDatos(pestaña) {
        try {
            const res = await fetch(`${API_URL}?pestaña=${encodeURIComponent(pestaña)}`);
            const json = await res.json();

            if (!json || json.status !== "OK") {
                console.error("API ERROR:", json);
                return [];
            }

            return json.data || [];

        } catch (err) {
            console.error("GET ERROR:", err);
            return [];
        }
    },

    async enviarDatos(datos) {
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datos)
            });

            return await res.json();

        } catch (err) {
            console.error("POST ERROR:", err);
            throw err;
        }
    }
};

// ===============================
// BLOQUEO UI
// ===============================
function bloquearUI(v) {
    document.getElementById('seccion-operativa').classList.toggle('bloqueado', v);
    document.getElementById('carrito-flotante').classList.toggle('bloqueado', v);
}

// ===============================
// INICIO
// ===============================
async function iniciar() {

    bloquearUI(true);

    const d = new Date();

    idVenta = `V-${d.getFullYear().toString().slice(-2)}${Math.floor(100000 + Math.random() * 900000)}`;

    document.getElementById('car-id').innerText = `ID: ${idVenta}`;
    document.getElementById('id-venta-display').innerText = `ID: ${idVenta}`;
    document.getElementById('fecha-entrega').value = d.toISOString().split('T')[0];

    try {

        console.log("📡 Cargando clientes e inventario...");

        const [clientes, inventario] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Inventario")
        ]);

        console.log("CLIENTES:", clientes);
        console.log("INVENTARIO:", inventario);

        productosData = Array.isArray(inventario) ? inventario : [];

        // ===============================
        // CLIENTES
        // ===============================
        const sel = document.getElementById('select-cliente');

        sel.innerHTML = '<option value="">-- SELECCIONAR CLIENTE --</option>';

        const listaClientes = Array.isArray(clientes) ? clientes : [];

        if (listaClientes.length === 0) {
            console.warn("⚠ No llegaron clientes");
        }

        listaClientes
            .sort((a, b) => String(a.Nombre || "").localeCompare(String(b.Nombre || "")))
            .forEach(c => {
                sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`;
            });

        // ===============================
        // PRODUCTOS
        // ===============================
        renderizar();

        clientesLoaded = true;

        bloquearUI(false);

    } catch (e) {
        console.error("ERROR GENERAL:", e);
        alert("❌ Error cargando datos. Revisa consola (F12)");
        bloquearUI(true);
    }
}

// ===============================
// ACTIVAR INTERFAZ
// ===============================
function activarInterfaz() {

    const cli = document.getElementById('select-cliente').value;

    if (!clientesLoaded) {
        alert("⏳ Cargando base de datos...");
        return;
    }

    bloquearUI(!cli);

    document.getElementById('car-cliente').innerText =
        cli || "Esperando Cliente...";
}

// ===============================
// RENDER PRODUCTOS
// ===============================
function renderizar() {

    const cont = document.getElementById('contenedor-productos');
    cont.innerHTML = "";

    if (!productosData.length) {
        cont.innerHTML = "<p class='text-slate-400'>No hay productos</p>";
        return;
    }

    productosData.forEach(p => {

        const producto = p.Producto || "";
        const precio = Number(p.Precio_Venta) || 0;
        const stock = Number(p.Stock) || 0;

        const idCant = `cant-${producto.replace(/\s+/g,'-')}`;

        cont.innerHTML += `
            <div class="card-sutil flex justify-between items-center mb-2">

                <div>
                    <h4 class="font-black text-sm">${producto}</h4>
                    <div class="text-xs text-primary">$${precio.toFixed(2)} | Stock: ${stock}</div>
                </div>

                <div class="flex items-center gap-2 bg-purple-50 p-1 rounded-xl">

                    <button onclick="cambiarCant('${producto}',-1)" class="w-8 h-8 bg-white">-</button>

                    <span id="${idCant}" class="w-6 text-center">0</span>

                    <button onclick="cambiarCant('${producto}',1)" class="w-8 h-8 bg-white">+</button>

                </div>

            </div>
        `;
    });
}

// ===============================
function cambiarCant(nombre, delta) {

    if (!carrito[nombre]) carrito[nombre] = 0;

    const p = productosData.find(x => x.Producto === nombre);
    if (!p) return;

    const stock = Number(p.Stock) || 0;

    const nueva = carrito[nombre] + delta;

    if (nueva < 0) return;
    if (nueva > stock) return alert("Sin stock");

    carrito[nombre] = nueva;

    document.getElementById(`cant-${nombre.replace(/\s+/g,'-')}`).innerText = nueva;

    actualizarCarrito();
}

// ===============================
function actualizarCarrito() {

    let total = 0;
    let items = 0;
    let html = "";

    Object.keys(carrito).forEach(n => {

        if (carrito[n] > 0) {

            const p = productosData.find(x => x.Producto === n);
            const precio = Number(p?.Precio_Venta) || 0;

            total += carrito[n] * precio;
            items += carrito[n];

            html += `<div>${n} x${carrito[n]} = $${(carrito[n]*precio).toFixed(2)}</div>`;
        }
    });

    document.getElementById('car-detalle').innerHTML =
        html || "<p>Sin productos</p>";

    document.getElementById('car-total').innerText = `$${total.toFixed(2)}`;
    document.getElementById('car-items').innerText = `${items}`;
}

// ===============================
window.onload = iniciar;
</script>   
</body>
</html>
