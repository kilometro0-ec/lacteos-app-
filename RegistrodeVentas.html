<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <!-- ✅ TAILWIND CONFIG CORREGIDO -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#a21caf",
              secondary: "#db2777",
              whatsapp: "#25d366"
            }
          }
        }
      };
    </script>

    <style>
        body { font-family: 'Work Sans', sans-serif; background-color: #faf5ff; -webkit-tap-highlight-color: transparent; }
        .card-producto { background: white; border-radius: 1rem; border: 1px solid #e9d5ff; padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .input-sutil { background-color: #fdfaff; border: 1.5px solid #f3e8ff; border-radius: 0.75rem; padding: 0.6rem; width: 100%; font-size: 13px; font-weight: 600; }

        #overlay-exito {
            position: fixed; inset: 0; background: rgba(255,255,255,0.95);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }

        .check-anim { font-size: 80px; color: #a21caf; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        #carrito-flotante {
            position: fixed; bottom: 90px; left: 10px; right: 10px;
            background: white; border: 2.5px solid #a21caf; border-radius: 1.5rem;
            padding: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.2); z-index: 100;
        }

        .btn-whatsapp {
            background: #25d366; color: white; width: 100%; padding: 14px;
            border-radius: 1rem; font-weight: 900; display: none;
            align-items: center; justify-content: center; gap: 10px;
            animation: pulse-wa 2s infinite;
        }

        @keyframes pulse-wa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }
    </style>
</head>

<body class="pb-96">

<!-- OVERLAY -->
<div id="overlay-exito">
    <span class="material-symbols-outlined check-anim" id="icono-estado">sync</span>
    <h2 class="text-2xl font-black text-slate-800" id="titulo-estado">GUARDANDO...</h2>
    <p class="text-slate-500 font-bold uppercase text-[10px]">No cierres esta ventana</p>
</div>

<header class="h-14 bg-white border-b flex justify-between items-center px-4 sticky top-0 z-50">
    <div class="flex flex-col">
        <h1 class="text-lg font-black text-primary italic uppercase leading-none">Ventas</h1>
        <span id="id-venta-display" class="text-[9px] font-mono text-slate-400 font-bold">ID: ---</span>
    </div>
    <button onclick="location.reload()" class="text-primary">
        <span class="material-symbols-outlined">sync</span>
    </button>
</header>

<main class="mt-4 px-4 max-w-xl mx-auto">

    <!-- CLIENTE -->
    <section class="bg-white p-4 rounded-2xl border-2 border-primary/20 mb-4 shadow-sm">
        <div id="vista-seleccion-cliente">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-black text-primary uppercase">1. Seleccionar Cliente</span>
                <button onclick="alternarFormulario(true)" class="text-[9px] font-bold text-white bg-secondary px-3 py-1 rounded-full uppercase">Nuevo +</button>
            </div>

            <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
                <option value="">-- BUSCAR CLIENTE --</option>
            </select>
        </div>

        <div id="vista-nuevo-cliente" class="hidden space-y-2">
            <input id="reg-id" class="hidden"/>
            <input id="reg-nombre" placeholder="Nombre" class="input-sutil"/>
            <input id="reg-ruc" placeholder="CI/RUC" class="input-sutil"/>
            <input id="reg-tel" placeholder="Teléfono" class="input-sutil"/>
            <input id="reg-dir" placeholder="Dirección" class="input-sutil"/>
            <input id="reg-ref" placeholder="Referencia" class="input-sutil"/>

            <select id="reg-sector" class="input-sutil">
                <option value="">SECTOR</option>
                <option>NORTE</option>
                <option>SUR</option>
                <option>CENTRO</option>
                <option>VALLES</option>
            </select>

            <div class="flex gap-2 pt-2">
                <button onclick="guardarCliente()" id="btn-guardar-cliente" class="flex-1 bg-primary text-white py-3 rounded-xl">Guardar</button>
                <button onclick="alternarFormulario(false)" class="flex-1 bg-slate-100 py-3 rounded-xl">Cancelar</button>
            </div>
        </div>
    </section>

    <!-- PRODUCTOS -->
    <div id="seccion-operativa" class="bloqueado">
        <input id="buscarProducto" oninput="filtrar()" class="input-sutil mb-4" placeholder="Buscar producto...">
        <div id="contenedor-productos"></div>
    </div>

</main>

<!-- CARRITO -->
<div id="carrito-flotante" class="bloqueado">
    <div class="flex justify-between mb-2">
        <div>
            <p id="car-cliente" class="text-xs font-black text-primary">Sin Cliente</p>
            <p id="car-id" class="text-[9px]">ID ---</p>
        </div>
        <div class="text-right">
            <p id="car-total" class="text-2xl font-black">$0.00</p>
            <p id="car-items" class="text-[9px]">0 ÍTEMS</p>
        </div>
    </div>

    <div id="car-detalle" class="text-[10px] mb-3"></div>

    <input type="date" id="fecha-entrega" class="input-sutil mb-2">

    <button id="btn-confirmar" onclick="procesarVenta()" class="bg-secondary text-white w-full py-4 rounded-xl font-black">
        Confirmar Pedido
    </button>

    <button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-whatsapp">
        <span class="material-symbols-outlined">chat</span> WhatsApp
    </button>
</div>

<div id="menu-container"></div>

<!-- ================= JS ================= -->
<script>
let carrito = {};
let productosData = [];
let idVenta = "";

function normalizar(res) {
    if (!res) return [];
    if (Array.isArray(res)) return res;
    if (Array.isArray(res.data)) return res.data;
    return [];
}

async function iniciar() {
    const d = new Date();

    idVenta = `V-${d.getFullYear().toString().slice(-2)}${Math.floor(100000 + Math.random()*900000)}`;

    document.getElementById('car-id').innerText = `ID: ${idVenta}`;
    document.getElementById('id-venta-display').innerText = `ID: ${idVenta}`;
    document.getElementById('fecha-entrega').value = d.toISOString().split('T')[0];

    try {
        const [clRes, prRes] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Inventario")
        ]);

        const cl = normalizar(clRes);
        productosData = normalizar(prRes);

        const sel = document.getElementById('select-cliente');
        sel.innerHTML = `<option value="">-- BUSCAR CLIENTE --</option>`;

        cl.sort((a,b)=>(a.Nombre||"").localeCompare(b.Nombre||""))
          .forEach(c => sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`);

        renderizar();

    } catch (e) {
        console.error(e);
    }
}

function activarInterfaz(){
    const cli = document.getElementById('select-cliente').value;
    document.getElementById('seccion-operativa').classList.toggle('bloqueado', !cli);
    document.getElementById('carrito-flotante').classList.toggle('bloqueado', !cli);
    document.getElementById('car-cliente').innerText = cli || "Sin Cliente";
}

function renderizar(){
    const cont = document.getElementById('contenedor-productos');
    cont.innerHTML = "";

    productosData.forEach(p=>{
        const id = `cant-${p.Producto.replace(/\s+/g,'-')}`;

        cont.innerHTML += `
        <div class="card-producto">
            <div>
                <b>${p.Producto}</b>
                <div>$${p.Precio_Venta}</div>
                <small>Stock: ${p.Stock}</small>
            </div>
            <div>
                <button onclick="cambiarCant('${p.Producto}',-1)">-</button>
                <span id="${id}">0</span>
                <button onclick="cambiarCant('${p.Producto}',1)">+</button>
            </div>
        </div>`;
    });
}

function cambiarCant(n,d){
    if(!carrito[n]) carrito[n]=0;

    const p = productosData.find(x=>x.Producto===n);
    if(!p) return;

    const stock = parseInt(p.Stock||0);

    if(carrito[n]+d>=0 && carrito[n]+d<=stock){
        carrito[n]+=d;
        document.getElementById(`cant-${n.replace(/\s+/g,'-')}`).innerText=carrito[n];
        actualizarCarrito();
    }
}

function actualizarCarrito(){
    let t=0,items=0,html="";

    Object.keys(carrito).forEach(n=>{
        if(carrito[n]>0){
            const p = productosData.find(x=>x.Producto===n);
            const sub = carrito[n]*p.Precio_Venta;
            t+=sub; items+=carrito[n];
            html+=`${n} x${carrito[n]} = $${sub}<br>`;
        }
    });

    document.getElementById('car-detalle').innerHTML=html;
    document.getElementById('car-total').innerText=`$${t.toFixed(2)}`;
    document.getElementById('car-items').innerText=`${items} ÍTEMS`;
}

window.onload=iniciar;
</script>

</body>
</html>
