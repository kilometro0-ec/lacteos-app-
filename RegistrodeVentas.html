<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Ventas - Lógica Láctea</title>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="api-config.js"></script>
<script src="menu-logic.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#a21caf",
        secondary: "#db2777",
        whatsapp: "#25d366"
      }
    }
  }
};
</script>

<style>
body { font-family: 'Work Sans', sans-serif; background:#faf5ff; }
.card-producto{background:white;border:1px solid #e9d5ff;border-radius:1rem;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bloqueado{opacity:.3;pointer-events:none;filter:grayscale(1)}
.input-sutil{width:100%;padding:.6rem;border-radius:.75rem;border:1px solid #f3e8ff}
#carrito-flotante{position:fixed;bottom:90px;left:10px;right:10px;background:white;border:2px solid #a21caf;border-radius:1.5rem;padding:15px}
.btn-whatsapp{background:#25d366;color:white;width:100%;padding:14px;border-radius:1rem;font-weight:900;display:none}
</style>
</head>

<body class="pb-96">

<!-- HEADER -->
<header class="h-14 bg-white border-b flex justify-between items-center px-4 sticky top-0 z-50">
<div>
<h1 class="text-lg font-black text-primary">Ventas</h1>
<span id="id-venta-display" class="text-[10px] text-gray-400">ID---</span>
</div>
<button onclick="location.reload()">🔄</button>
</header>

<main class="p-4 max-w-xl mx-auto">

<!-- CLIENTE -->
<section class="bg-white p-4 rounded-2xl mb-4">
<select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
<option value="">-- CLIENTE --</option>
</select>
</section>

<!-- BUSCADOR -->
<input id="buscarProducto" oninput="filtrar()" class="input-sutil mb-4" placeholder="Buscar producto...">

<!-- PRODUCTOS -->
<div id="contenedor-productos"></div>

</main>

<!-- CARRITO -->
<div id="carrito-flotante" class="bloqueado">
<div class="flex justify-between">
<div>
<p id="car-cliente">Sin cliente</p>
<p id="car-id">ID---</p>
</div>
<div>
<p id="car-total">$0</p>
<p id="car-items">0</p>
</div>
</div>

<div id="car-detalle" class="text-xs my-2"></div>

<input type="date" id="fecha-entrega" class="input-sutil mb-2">

<button id="btn-confirmar" onclick="procesarVenta()" class="bg-secondary text-white w-full py-3 rounded-xl">
Confirmar Pedido
</button>

<button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-whatsapp">
WhatsApp
</button>
</div>

<!-- ================= JS ================= -->
<script>
let carrito = {};
let productosData = [];
let filtrados = [];
let idVenta = "";

function safe(id, val){
  const el = document.getElementById(id);
  if(el) el.innerText = val;
}

function normalizar(r){
  if(!r) return [];
  if(Array.isArray(r)) return r;
  if(Array.isArray(r.data)) return r.data;
  return [];
}

async function iniciar(){
  const d = new Date();

  idVenta = "V-" + Date.now().toString().slice(-6);

  safe("id-venta-display", "ID: " + idVenta);
  safe("car-id", "ID: " + idVenta);

  const fecha = document.getElementById("fecha-entrega");
  if(fecha) fecha.value = d.toISOString().split("T")[0];

  try{
    const [cl, pr] = await Promise.all([
      DairyAPI.obtenerDatos("Clientes"),
      DairyAPI.obtenerDatos("Inventario")
    ]);

    const clientes = normalizar(cl);
    productosData = normalizar(pr);

    filtrados = productosData;

    const sel = document.getElementById("select-cliente");
    sel.innerHTML = `<option value="">-- CLIENTE --</option>`;

    clientes.forEach(c=>{
      sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`;
    });

    render();

  }catch(e){
    console.error(e);
  }
}

function activarInterfaz(){
  const cli = document.getElementById("select-cliente").value;
  document.getElementById("carrito-flotante").classList.toggle("bloqueado", !cli);
}

function filtrar(){
  const q = document.getElementById("buscarProducto").value.toLowerCase();

  filtrados = productosData.filter(p=>{
    return (p.Stock>0) && p.Producto.toLowerCase().includes(q);
  });

  render();
}

function render(){
  const cont = document.getElementById("contenedor-productos");
  cont.innerHTML = "";

  filtrados.filter(p=>p.Stock>0).forEach(p=>{
    const id = "c-" + p.Producto.replace(/\s+/g,'-');

    cont.innerHTML += `
    <div class="card-producto">
      <div>
        <b>${p.Producto}</b>
        <div>$${p.Precio_Venta}</div>
        <small>Stock ${p.Stock}</small>
      </div>

      <div>
        <button onclick="add('${p.Producto}',-1)">-</button>
        <span id="${id}">0</span>
        <button onclick="add('${p.Producto}',1)">+</button>
      </div>
    </div>`;
  });
}

function add(n,d){
  if(!carrito[n]) carrito[n]=0;

  const p = productosData.find(x=>x.Producto===n);
  if(!p) return;

  const stock = +p.Stock || 0;

  if(carrito[n]+d>=0 && carrito[n]+d<=stock){
    carrito[n]+=d;
    const el = document.getElementById("c-"+n.replace(/\s+/g,'-'));
    if(el) el.innerText = carrito[n];
    update();
  }
}

function update(){
  let t=0,i=0,h="";

  Object.keys(carrito).forEach(n=>{
    if(carrito[n]>0){
      const p = productosData.find(x=>x.Producto===n);
      const s = carrito[n]*p.Precio_Venta;
      t+=s;i+=carrito[n];
      h+=`${n} x${carrito[n]} = $${s.toFixed(2)}<br>`;
    }
  });

  safe("car-detalle", h||"Sin productos");
  safe("car-total", "$"+t.toFixed(2));
  safe("car-items", i+" ítems");

  const btn = document.getElementById("btn-confirmar");
  if(btn){
    btn.disabled = i===0;
    btn.style.opacity = i===0?0.4:1;
  }
}

window.addEventListener("DOMContentLoaded", iniciar);
</script>

</body>
</html>
