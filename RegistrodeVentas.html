<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>

    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="estilos-lacteos.css">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#a21caf",
              secondary: "#db2777",
              whatsapp: "#25d366",
              surface: "#f8fafc"
            }
          }
        }
      }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfaff;
            -webkit-tap-highlight-color: transparent;
        }

        .card-producto {
            background: white;
            border-radius: 1.5rem;
            border: 1px solid #f1f5f9;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .card-producto:active { transform: scale(0.98); }

        .bloqueado {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(1);
        }

        .input-sutil {
            background-color: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 1.25rem;
            padding: 0.8rem 1rem;
            width: 100%;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            outline: none;
        }

        .input-sutil:focus {
            background: white;
            border-color: #a21caf;
            box-shadow: 0 0 0 4px rgba(162, 28, 175, 0.05);
        }

        #carrito-flotante {
            position: fixed;
            bottom: 100px;
            left: 16px;
            right: 16px;
            background: white;
            border-radius: 2.5rem;
            padding: 20px;
            z-index: 100;
            border: 1px solid rgba(162, 28, 175, 0.1);
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
            width: 100%;
            padding: 16px;
            border-radius: 1.5rem;
            font-weight: 800;
            display: none;
        }
    </style>
</head>

<body class="pb-96">

<!-- OVERLAY -->
<div id="overlay-exito" style="display:none"></div>

<!-- HEADER -->
<header class="h-20 bg-white/80 backdrop-blur-md border-b border-fuchsia-50 flex justify-between items-center px-6 sticky top-0 z-50">

    <div class="flex flex-col">
        <h1 class="text-xl font-black uppercase">Nueva Venta</h1>
        <span id="id-venta-display" class="text-[10px] font-bold text-primary">ID: ---</span>
    </div>

    <!-- BOTONES (RESPETA DISEÑO) -->
    <div class="flex gap-2">

        <button onclick="location.reload()"
            class="w-10 h-10 rounded-2xl bg-fuchsia-50 text-primary flex items-center justify-center">
            <span class="material-symbols-outlined">refresh</span>
        </button>

        <!-- VENTA RÁPIDA -->
        <button onclick="ventaRapida()"
            class="w-10 h-10 rounded-2xl bg-primary text-white flex items-center justify-center">
            <span class="material-symbols-outlined">bolt</span>
        </button>

    </div>
</header>

<!-- MAIN -->
<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">

<section class="bg-white p-6 rounded-[2.5rem] border border-fuchsia-50">

    <div class="flex justify-between mb-4">
        <span class="text-[10px] font-black text-slate-400 uppercase">Paso 1: Cliente</span>
        <button onclick="alternarFormulario(true)"
            class="text-[10px] font-black text-white bg-secondary px-4 py-1.5 rounded-full">
            Nuevo +
        </button>
    </div>

    <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
        <option value="">-- SELECCIONAR CLIENTE --</option>
    </select>

    <div id="vista-nuevo-cliente" class="hidden mt-4 space-y-2">
        <input id="reg-nombre" class="input-sutil uppercase" placeholder="NOMBRE">
        <input id="reg-ruc" class="input-sutil" placeholder="CI / RUC">
        <input id="reg-tel" class="input-sutil" placeholder="TELÉFONO">

        <div class="flex gap-2">
            <button onclick="guardarCliente()" class="flex-1 bg-primary text-white py-3 rounded-xl font-bold">Guardar</button>
            <button onclick="alternarFormulario(false)" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancelar</button>
        </div>
    </div>

</section>

<!-- PRODUCTOS -->
<div id="seccion-operativa" class="bloqueado">
    <input id="buscarProducto" oninput="filtrar()" class="input-sutil mb-4" placeholder="Buscar producto...">
    <div id="contenedor-productos"></div>
</div>

</main>

<!-- CARRITO -->
<div id="carrito-flotante" class="bloqueado">

    <div class="flex justify-between mb-3">
        <div>
            <p id="car-cliente" class="font-black text-primary">Esperando...</p>
            <p id="car-id" class="text-xs">ID</p>
        </div>

        <div class="text-right">
            <p id="car-total" class="text-2xl font-black">$0.00</p>
            <p id="car-items" class="text-xs">0</p>
        </div>
    </div>

    <div id="car-detalle" class="text-xs mb-3"></div>

    <input type="date" id="fecha-entrega" class="input-sutil mb-3">

    <button id="btn-confirmar" onclick="procesarVenta()"
        class="bg-black text-white w-full py-4 rounded-xl font-bold">
        Confirmar Pedido
    </button>

    <button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-whatsapp">
        Enviar WhatsApp
    </button>

</div>

<!-- MENÚ INFERIOR -->
<div id="menu-container"></div>

<!-- SCRIPT MENÚ -->
<script>
window.addEventListener("load", () => {
    if (typeof initMenu === "function") {
        initMenu("ventas");
    }
});
</script>

<!-- LOGICA -->
<script>
let carrito = {};
let productosData = [];
let idVenta = "";

function ventaRapida() {
    alert("Venta rápida activa");
}

window.onload = iniciar;
</script>

</body>
</html>
