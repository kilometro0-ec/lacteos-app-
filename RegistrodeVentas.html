<!DOCTYPE html>
<html class="light" lang="es">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Ventas - Lógica Láctea</title>

<!-- LIBRERÍAS -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="menu-logic.js"></script>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilos-lacteos.css">

<script src="api-config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#a21caf",
        secondary: "#db2777"
      }
    }
  }
}
</script>

<style>
body{font-family:'Plus Jakarta Sans';background:#fdfaff}
.bloqueado{opacity:.3;pointer-events:none}
.input-sutil{width:100%;padding:.8rem;border-radius:1rem;background:#f8fafc;border:1px solid #eee;font-weight:700}
.card-producto{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px;border-radius:1.2rem;margin-bottom:10px}
#carrito-flotante{position:fixed;bottom:90px;left:12px;right:12px;background:#fff;padding:16px;border-radius:2rem}
.btn-wa{display:none;background:#25d366;color:#fff;width:100%;padding:14px;border-radius:1rem;font-weight:800}
</style>
</head>

<body class="pb-96">

<!-- HEADER -->
<header class="h-20 flex justify-between items-center px-6 bg-white border-b sticky top-0 z-50">

<div>
<h1 class="font-black">Nueva Venta</h1>
<span id="id-venta-display" class="text-xs text-primary">ID ---</span>
</div>

<div class="flex gap-2">
<button onclick="location.reload()" class="w-10 h-10 bg-fuchsia-50 rounded-xl">⟳</button>
<button onclick="ventaRapida()" class="w-10 h-10 bg-primary text-white rounded-xl">⚡</button>
</div>

</header>

<!-- MAIN -->
<main class="px-6 mt-6 max-w-xl mx-auto space-y-5">

<!-- CLIENTE -->
<section class="bg-white p-4 rounded-3xl">

<select id="select-cliente" class="input-sutil" onchange="activarInterfaz()">
<option value="">-- CLIENTE --</option>
</select>

</section>

<!-- PRODUCTOS -->
<div id="seccion-operativa" class="bloqueado">
<input id="buscarProducto" class="input-sutil mb-3" oninput="filtrar()" placeholder="Buscar...">
<div id="contenedor-productos"></div>
</div>

</main>

<!-- CARRITO -->
<div id="carrito-flotante" class="bloqueado">

<div class="flex justify-between mb-2">
<div>
<p id="car-cliente" class="font-black text-primary">Esperando...</p>
</div>
<div class="text-right">
<p id="car-total" class="font-black">$0</p>
<p id="car-items" class="text-xs">0</p>
</div>
</div>

<div id="car-detalle" class="text-xs mb-3"></div>

<input type="date" id="fecha-entrega" class="input-sutil mb-3">

<button id="btn-confirmar" onclick="procesarVenta()" class="bg-black text-white w-full py-3 rounded-xl">
Confirmar
</button>

<button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-wa">
WhatsApp
</button>

</div>

<!-- MENU -->
<div id="menu-container"></div>

<script>

let carrito = {};
let productosData = [];
let idVenta = "";

/* =========================
INICIO REAL
========================= */
async function iniciar(){

idVenta = "V-" + Date.now();
document.getElementById("id-venta-display").innerText = "ID " + idVenta;

const [cli, prod] = await Promise.all([
DairyAPI.obtenerDatos("Clientes"),
DairyAPI.obtenerDatos("Inventario")
]);

productosData = prod || [];

const sel = document.getElementById("select-cliente");

cli.forEach(c=>{
const opt = document.createElement("option");
opt.value = c.Nombre;
opt.textContent = c.Nombre;
sel.appendChild(opt);
});

renderizarProductos();
}

/* ========================= */
function activarInterfaz(){
const cli = document.getElementById("select-cliente").value;

document.getElementById("seccion-operativa").classList.toggle("bloqueado", !cli);
document.getElementById("carrito-flotante").classList.toggle("bloqueado", !cli);
document.getElementById("car-cliente").innerText = cli || "Esperando...";
}

/* ========================= */
function renderizarProductos(){

const cont = document.getElementById("contenedor-productos");
cont.innerHTML = "";

productosData.forEach(p=>{

const id = p.Producto;

cont.innerHTML += `
<div class="card-producto">
<div>
<b>${p.Producto}</b><br>
<small>$${p.Precio_Venta}</small>
</div>

<div>
<button onclick="cambiar('${id}',-1)">-</button>
<span id="c-${id}">0</span>
<button onclick="cambiar('${id}',1)">+</button>
</div>
</div>`;
});
}

/* ========================= */
function cambiar(id, d){

if(!carrito[id]) carrito[id]=0;

carrito[id]+=d;
if(carrito[id]<0) carrito[id]=0;

document.getElementById("c-"+id).innerText = carrito[id];

actualizar();
}

/* ========================= */
function actualizar(){

let t=0,items=0,html="";

Object.keys(carrito).forEach(id=>{

const c = carrito[id];
if(c<=0) return;

const p = productosData.find(x=>x.Producto===id);
const sub = c * Number(p.Precio_Venta);

t+=sub;
items+=c;

html += `<div>${id} x${c} = $${sub.toFixed(2)}</div>`;
});

document.getElementById("car-total").innerText = "$"+t.toFixed(2);
document.getElementById("car-items").innerText = items;
document.getElementById("car-detalle").innerHTML = html || "Vacío";
}

/* ========================= */
async function procesarVenta(){
alert("Venta enviada (fix listo)");
}

/* ========================= */
function enviarWhatsApp(){
alert("WhatsApp listo");
}

/* ========================= */
function filtrar(){
const q = document.getElementById("buscarProducto").value.toLowerCase();

document.querySelectorAll(".card-producto").forEach(el=>{
el.style.display = el.innerText.toLowerCase().includes(q) ? "flex":"none";
});
}

/* ========================= */
function ventaRapida(){
alert("OK");
}

/* START */
window.onload = iniciar;

</script>

</body>
</html>
