<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>POS Ventas - Lógica Láctea</title>

<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="api-config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;800;900&display=swap" rel="stylesheet"/>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#a21caf",
        secondary: "#db2777"
      }
    }
  }
};
</script>

<style>
body{font-family:Work Sans;background:#faf5ff}
.card{background:white;border:1px solid #e9d5ff;border-radius:12px;padding:10px;display:flex;justify-content:space-between;margin-bottom:8px}
.bloq{opacity:.4;pointer-events:none}
.btn{padding:10px;border-radius:10px;font-weight:800}
</style>
</head>

<body class="p-4 pb-40">

<!-- HEADER -->
<header class="flex justify-between items-center mb-4">
<h1 class="font-black text-xl text-primary">POS VENTAS</h1>
<div id="idVenta">ID---</div>
</header>

<!-- CLIENTE -->
<div class="bg-white p-3 rounded-xl mb-3">
<select id="clientes" class="w-full border p-2 rounded" onchange="activar()"></select>

<button onclick="mostrarNuevoCliente()" class="mt-2 bg-primary text-white btn w-full">
+ Nuevo Cliente
</button>
</div>

<!-- FORM NUEVO CLIENTE -->
<div id="formCliente" class="hidden bg-white p-3 rounded-xl mb-3">
<input id="nc_nombre" placeholder="Nombre" class="w-full border p-2 mb-2"/>
<input id="nc_ci" placeholder="CI/RUC" class="w-full border p-2 mb-2"/>

<button onclick="guardarCliente()" class="bg-secondary text-white btn w-full">
Guardar Cliente
</button>
</div>

<!-- BUSCADOR -->
<input id="buscar" oninput="filtrar()" class="w-full p-2 border rounded mb-3" placeholder="Buscar producto...">

<!-- PRODUCTOS -->
<div id="productos"></div>

<!-- CARRITO -->
<div id="carrito" class="fixed bottom-0 left-0 right-0 bg-white border-t p-3">

<div class="flex justify-between mb-2">
<div id="cliSel">Sin cliente</div>
<div id="total">$0</div>
</div>

<div id="detalle" class="text-xs mb-2"></div>

<input type="date" id="fecha" class="w-full border p-2 mb-2">

<button id="btnConfirm" onclick="procesarVenta()" class="bg-secondary text-white w-full btn">
Confirmar Pedido
</button>

<button onclick="enviarWhatsApp()" class="bg-green-500 text-white w-full btn mt-2">
WhatsApp
</button>

</div>

<script>

let productos=[], carrito={}, filtro=[];

let idVenta="";

function safe(id,val){
  const el=document.getElementById(id);
  if(el) el.innerText=val;
}

/* INIT */
async function iniciar(){

idVenta="V-"+Date.now().toString().slice(-6);
safe("idVenta","ID "+idVenta);

document.getElementById("fecha").value=new Date().toISOString().split("T")[0];

const cl=await DairyAPI.obtenerDatos("Clientes");
const pr=await DairyAPI.obtenerDatos("Inventario");

productos = Array.isArray(pr)?pr:(pr.data||[]);
filtro=productos;

const sel=document.getElementById("clientes");
sel.innerHTML="<option value=''>Cliente</option>";

(cl.data||cl).forEach(c=>{
sel.innerHTML+=`<option value="${c.Nombre}">${c.Nombre}</option>`;
});

render();

}

function activar(){
const v=document.getElementById("clientes").value;
document.getElementById("cliSel").innerText=v||"Sin cliente";
}

function mostrarNuevoCliente(){
document.getElementById("formCliente").classList.toggle("hidden");
}

async function guardarCliente(){

await DairyAPI.enviarDatos("Clientes",{
Nombre:document.getElementById("nc_nombre").value,
CI_RUC:document.getElementById("nc_ci").value,
pestaña:"Clientes"
});

alert("Cliente guardado");
location.reload();
}

/* FILTRO */
function filtrar(){
const q=document.getElementById("buscar").value.toLowerCase();

filtro=productos.filter(p=>
p.Stock>0 &&
p.Producto.toLowerCase().includes(q)
);

render();
}

/* RENDER */
function render(){

const c=document.getElementById("productos");
c.innerHTML="";

filtro.filter(p=>p.Stock>0).forEach(p=>{

const id="p-"+p.Producto.replace(/\s+/g,"-");

c.innerHTML+=`
<div class="card">
<div>
<b>${p.Producto}</b>
<div>$${p.Precio_Venta}</div>
</div>

<div>
<button onclick="add('${p.Producto}',-1)">-</button>
<span id="${id}">0</span>
<button onclick="add('${p.Producto}',1)">+</button>
</div>
</div>`;
});

}

/* CARRITO */
function add(n,d){

if(!carrito[n])carrito[n]=0;

const p=productos.find(x=>x.Producto===n);
if(!p)return;

const stock=+p.Stock||0;

if(carrito[n]+d>=0&&carrito[n]+d<=stock){
carrito[n]+=d;
document.getElementById("p-"+n.replace(/\s+/g,"-")).innerText=carrito[n];
update();
}

}

/* UPDATE */
function update(){

let t=0,i=0,h="";

Object.keys(carrito).forEach(n=>{
if(carrito[n]>0){
const p=productos.find(x=>x.Producto===n);
const s=carrito[n]*p.Precio_Venta;
t+=s;i+=carrito[n];
h+=`${n} x${carrito[n]} = $${s.toFixed(2)}<br>`;
}
});

safe("detalle",h||"vacío");
safe("total","$"+t.toFixed(2));

const btn=document.getElementById("btnConfirm");
btn.disabled=i===0;

}

/* VENTA */
async function procesarVenta(){

const cli=document.getElementById("clientes").value;
const fec=document.getElementById("fecha").value;

if(!cli)return alert("Selecciona cliente");

for(const n in carrito){
if(carrito[n]>0){
const p=productos.find(x=>x.Producto===n);

await DairyAPI.enviarDatos("Ventas",{
ID_Venta:idVenta,
Cliente:cli,
Producto:n,
Cantidad:carrito[n],
Precio_PVP:p.Precio_Venta,
Fecha_Entrega:fec,
pestaña:"Ventas"
});
}
}

alert("Venta guardada");
location.reload();

}

/* WHATSAPP */
function enviarWhatsApp(){

let msg="*PEDIDO*\n";
let t=0;

Object.keys(carrito).forEach(n=>{
if(carrito[n]>0){
const p=productos.find(x=>x.Producto===n);
msg+=`${carrito[n]}x ${n}\n`;
t+=carrito[n]*p.Precio_Venta;
}
});

window.open(`https://wa.me/?text=${encodeURIComponent(msg+"TOTAL $"+t)}`);

}

window.onload=iniciar;

</script>

</body>
</html>
