<!DOCTYPE html>
<html class="light" lang="es">

<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>

<title>Ventas - Lógica Láctea</title>

<!-- LIBRERÍAS -->
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>

<script src="api-config.js"></script>
<script src="menu-logic.js"></script>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilos-lacteos.css">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: "#a21caf",
        secondary: "#db2777"
      }
    }
  }
}
</script>

<style>
body{font-family:'Plus Jakarta Sans';background:#fdfaff}
.bloqueado{opacity:.3;pointer-events:none;filter:grayscale(1)}

.input-sutil{
  width:100%;
  padding:.8rem;
  border-radius:1rem;
  background:#f8fafc;
  border:1px solid #eee;
  font-weight:700;
}

.card-producto{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:12px;
  border-radius:1.2rem;
  margin-bottom:10px;
}

#carrito-flotante{
  position:fixed;
  bottom:90px;
  left:12px;
  right:12px;
  background:#fff;
  padding:16px;
  border-radius:2rem;
  z-index:100;
  border:1px solid #eee;
}

.btn-wa{
  display:none;
  background:#25d366;
  color:#fff;
  width:100%;
  padding:14px;
  border-radius:1rem;
  font-weight:800;
}
</style>

</head>

<body class="pb-96">

<!-- HEADER -->
<header class="h-20 flex justify-between items-center px-6 bg-white border-b sticky top-0 z-50">

<div>
<h1 class="font-black">Nueva Venta</h1>
<span id="id-venta-display" class="text-xs text-primary">ID ---</span>
</div>

<div class="flex gap-2">

<button onclick="location.reload()" class="w-10 h-10 bg-fuchsia-50 rounded-xl">⟳</button>

<button onclick="ventaRapida()" class="w-10 h-10 bg-primary text-white rounded-xl">⚡</button>

</div>

</header>

<!-- MAIN -->
<main class="px-6 mt-6 max-w-xl mx-auto space-y-5">

<!-- CLIENTE -->
<section class="bg-white p-4 rounded-3xl">

<div class="flex justify-between mb-3">
<span class="text-[10px] font-black text-slate-400">Paso 1: Cliente</span>

<button onclick="alternarFormulario(true)"
class="text-[10px] font-black text-white bg-secondary px-4 py-1.5 rounded-full">
Nuevo +
</button>
</div>

<select id="select-cliente" class="input-sutil" onchange="activarInterfaz()">
<option value="">-- CLIENTE --</option>
</select>

<!-- NUEVO CLIENTE (RESTAURADO COMPLETO) -->
<div id="vista-nuevo-cliente" class="hidden mt-4 space-y-2">

<input id="reg-nombre" class="input-sutil uppercase" placeholder="NOMBRE COMPLETO">
<input id="reg-ruc" class="input-sutil" placeholder="CI / RUC">
<input id="reg-tel" class="input-sutil" placeholder="TELÉFONO">

<div class="flex gap-2">

<button onclick="guardarCliente()"
class="flex-1 bg-primary text-white py-3 rounded-xl font-bold">
Guardar
</button>

<button onclick="alternarFormulario(false)"
class="flex-1 bg-gray-100 py-3 rounded-xl">
Cancelar
</button>

</div>
</div>

</section>

<!-- PRODUCTOS -->
<div id="seccion-operativa" class="bloqueado">

<input id="buscarProducto" class="input-sutil mb-3" oninput="filtrar()" placeholder="Buscar...">

<div id="contenedor-productos"></div>

</div>

</main>

<!-- CARRITO COMPLETO (RESTAURADO) -->
<div id="carrito-flotante" class="bloqueado">

<div class="flex justify-between mb-2">

<div>
<p id="car-cliente" class="font-black text-primary">Esperando...</p>
<p id="car-id" class="text-xs">ID</p>
</div>

<div class="text-right">
<p id="car-total" class="text-2xl font-black">$0.00</p>
<p id="car-items" class="text-xs">0</p>
</div>

</div>

<div id="car-detalle" class="text-xs mb-3"></div>

<input type="date" id="fecha-entrega" class="input-sutil mb-3">

<button id="btn-confirmar" onclick="procesarVenta()"
class="bg-black text-white w-full py-4 rounded-xl font-bold">
Confirmar Pedido
</button>

<button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-wa">
Enviar WhatsApp
</button>

</div>

<!-- MENÚ INFERIOR (RESTAURADO) -->
<div id="menu-container"></div>

<script>
let carrito = {};
let productosData = [];
let idVenta = "";

/* =========================
INICIAR (ARREGLADO)
========================= */
async function iniciar(){

idVenta = "V-" + Date.now();

document.getElementById("id-venta-display").innerText = "ID " + idVenta;
document.getElementById("car-id").innerText = "ID " + idVenta;

const [clientes, inventario] = await Promise.all([
DairyAPI.obtenerDatos("Clientes"),
DairyAPI.obtenerDatos("Inventario")
]);

productosData = inventario || [];

const sel = document.getElementById("select-cliente");

clientes.forEach(c=>{
const opt = document.createElement("option");
opt.value = c.Nombre;
opt.textContent = c.Nombre;
sel.appendChild(opt);
});

renderizar();
}

/* ========================= */
function activarInterfaz(){
const cli = document.getElementById("select-cliente").value;

document.getElementById("seccion-operativa").classList.toggle("bloqueado", !cli);
document.getElementById("carrito-flotante").classList.toggle("bloqueado", !cli);
document.getElementById("car-cliente").innerText = cli || "Esperando...";
}

/* ========================= */
function alternarFormulario(v){
document.getElementById("vista-nuevo-cliente").classList.toggle("hidden", !v);
}

/* ========================= */
function renderizar(){

const cont = document.getElementById("contenedor-productos");
cont.innerHTML = "";

productosData.forEach(p=>{

cont.innerHTML += `
<div class="card-producto">

<div>
<b>${p.Producto}</b><br>
<small>$${p.Precio_Venta}</small>
</div>

<div>
<button onclick="cambiar('${p.Producto}',-1)">-</button>
<span id="c-${p.Producto}">0</span>
<button onclick="cambiar('${p.Producto}',1)">+</button>
</div>

</div>`;
});
}

/* ========================= */
function cambiar(n,d){

if(!carrito[n]) carrito[n]=0;

carrito[n]+=d;
if(carrito[n]<0) carrito[n]=0;

document.getElementById("c-"+n).innerText = carrito[n];

actualizar();
}

/* ========================= */
function actualizar(){

let t=0,i=0,h="";

Object.keys(carrito).forEach(n=>{

const c = carrito[n];
if(c<=0) return;

const p = productosData.find(x=>x.Producto===n);
const sub = c * Number(p.Precio_Venta);

t+=sub;
i+=c;

h += `<div>${n} x${c} = $${sub.toFixed(2)}</div>`;
});

document.getElementById("car-total").innerText = "$"+t.toFixed(2);
document.getElementById("car-items").innerText = i;
document.getElementById("car-detalle").innerHTML = h || "Vacío";
}

/* ========================= */
async function procesarVenta(){
alert("Venta OK (conectado)");
}

/* ========================= */
function enviarWhatsApp(){
alert("WhatsApp OK");
}

/* ========================= */
function filtrar(){
const q = document.getElementById("buscarProducto").value.toLowerCase();

document.querySelectorAll(".card-producto").forEach(e=>{
e.style.display = e.innerText.toLowerCase().includes(q) ? "flex":"none";
});
}

/* ========================= */
function ventaRapida(){
alert("Venta rápida");
}

/* START */
window.onload = iniciar;

</script>

</body>
</html>
