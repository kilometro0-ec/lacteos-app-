<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
      tailwind.config = {
        theme: { 
            extend: { 
                colors: { 
                    primary: "#a21caf", 
                    secondary: "#db2777", 
                    whatsapp: "#25d366",
                    surface: "#f8fafc"
                } 
            } 
        }
      }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfaff; -webkit-tap-highlight-color: transparent; }
        .card-producto { background: white; border-radius: 1.5rem; border: 1px solid #f1f5f9; padding: 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; transition: all 0.2s; }
        .card-producto:active { transform: scale(0.98); background: #faf5ff; }
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        .input-sutil { 
            background-color: #f8fafc; 
            border: 1px solid #f1f5f9; 
            border-radius: 1.25rem; 
            padding: 0.8rem 1rem; 
            width: 100%; 
            font-size: 13px; 
            font-weight: 700;
            color: #1e293b;
            outline: none;
        }

        #overlay-exito {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,0.98);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999;
        }
    </style>
</head>

<body class="pb-96">

<!-- OVERLAY -->
<div id="overlay-exito">
    <span class="material-symbols-outlined text-6xl text-primary">sync</span>
    <p class="font-black mt-4">Guardando venta...</p>
</div>

<!-- HEADER -->
<header class="h-20 bg-white flex justify-between items-center px-6 sticky top-0">

    <div>
        <h1 class="font-black text-xl">Nueva Venta</h1>
        <span id="id-venta-display" class="text-xs text-primary">ID: ---</span>
    </div>

    <div class="flex gap-2">

        <!-- 🔥 BOTÓN VENTA RÁPIDA -->
        <button onclick="ventaRapida()" class="p-2 bg-green-100 text-green-600 rounded-xl font-black">
            ⚡
        </button>

        <!-- REFRESH -->
        <button onclick="location.reload()" class="p-2 bg-slate-100 rounded-xl">
            🔄
        </button>

    </div>
</header>

<main class="px-6 mt-6 max-w-xl mx-auto">

<!-- CLIENTE -->
<section class="bg-white p-5 rounded-3xl">

    <div id="vista-seleccion-cliente">

        <div class="flex justify-between mb-3">
            <span class="text-xs font-black">Cliente</span>
            <button onclick="alternarFormulario(true)" class="text-xs bg-pink-600 text-white px-3 py-1 rounded-full">
                Nuevo +
            </button>
        </div>

        <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
            <option value="">Seleccionar cliente</option>
        </select>

    </div>

</section>

<!-- PRODUCTOS -->
<div id="seccion-operativa" class="bloqueado mt-6">

    <input id="buscarProducto" oninput="filtrar()" class="input-sutil mb-3" placeholder="Buscar producto">

    <div id="contenedor-productos"></div>

</div>

</main>

<!-- CARRITO -->
<div id="carrito-flotante" class="bloqueado fixed bottom-0 left-0 right-0 bg-white p-4 shadow-2xl">

    <div class="flex justify-between">
        <div>
            <p id="car-cliente" class="font-black text-primary">Cliente</p>
            <p id="car-items" class="text-xs">0 unidades</p>
        </div>
        <div>
            <p id="car-total" class="font-black text-xl">$0</p>
        </div>
    </div>

    <div id="car-detalle" class="text-xs mt-2"></div>

    <input type="date" id="fecha-entrega" class="input-sutil mt-3">

    <button onclick="procesarVenta()" class="bg-black text-white w-full py-4 mt-3 rounded-2xl font-black">
        Confirmar Venta
    </button>

</div>

<script>

let carrito = {};
let productosData = [];
let idVenta = "";

async function iniciar() {

    const d = new Date();
    idVenta = "V-" + Date.now();

    document.getElementById("id-venta-display").innerText = "ID: " + idVenta;
    document.getElementById("fecha-entrega").value = d.toISOString().split("T")[0];

    const [cl, pr] = await Promise.all([
        DairyAPI.obtenerDatos("Clientes"),
        DairyAPI.obtenerDatos("Inventario")
    ]);

    productosData = pr || [];

    const sel = document.getElementById("select-cliente");

    cl.forEach(c => {
        sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`;
    });

    renderizar();
}

function activarInterfaz() {
    const cli = document.getElementById("select-cliente").value;

    document.getElementById("seccion-operativa").classList.toggle("bloqueado", !cli);
    document.getElementById("carrito-flotante").classList.toggle("bloqueado", !cli);

    document.getElementById("car-cliente").innerText = cli;
}

function renderizar() {

    const cont = document.getElementById("contenedor-productos");
    cont.innerHTML = "";

    productosData.forEach(p => {

        const id = p.Producto.replace(/\s+/g, "-");

        cont.innerHTML += `
        <div class="card-producto">
            <div>
                <p class="font-black">${p.Producto}</p>
                <p class="text-sm">$${p.Precio_Venta}</p>
            </div>

            <div>
                <button onclick="cambiar('${p.Producto}',-1)">-</button>
                <span id="cant-${id}">0</span>
                <button onclick="cambiar('${p.Producto}',1)">+</button>
            </div>
        </div>`;
    });
}

function cambiar(n, d) {

    if (!carrito[n]) carrito[n] = 0;

    const p = productosData.find(x => x.Producto === n);

    if (carrito[n] + d > p.Stock || carrito[n] + d < 0) return;

    carrito[n] += d;

    document.getElementById("cant-" + n.replace(/\s+/g,"-")).innerText = carrito[n];

    actualizar();
}

function actualizar() {

    let total = 0;
    let items = 0;
    let html = "";

    for (let n in carrito) {

        if (carrito[n] > 0) {

            const p = productosData.find(x => x.Producto === n);

            total += carrito[n] * p.Precio_Venta;
            items += carrito[n];

            html += `${n} x${carrito[n]}<br>`;
        }
    }

    document.getElementById("car-detalle").innerHTML = html;
    document.getElementById("car-total").innerText = "$" + total.toFixed(2);
    document.getElementById("car-items").innerText = items + " unidades";
}

/* ======================================================
   ⚡ VENTA RÁPIDA (SOLO STOCK + REGISTRO EN 0)
====================================================== */
async function ventaRapida() {

    const cli = document.getElementById("select-cliente").value || "CONSUMO INTERNO";
    const fec = new Date().toISOString().split("T")[0];

    if (Object.keys(carrito).length === 0) {
        return alert("No hay productos");
    }

    document.getElementById("overlay-exito").style.display = "flex";

    for (let n in carrito) {

        if (carrito[n] > 0) {

            const p = productosData.find(x => x.Producto === n);

            await DairyAPI.enviarDatos({
                pestaña: "Ventas",
                ID_Venta: "RAPIDA-" + Date.now(),
                Cliente: cli,
                Producto: n,
                Cantidad: carrito[n],

                // 🔥 IMPORTANTE: todo en cero
                Precio_PVP: 0,
                Total: 0,

                Estado_Entrega: "CONSUMO_INTERNO",
                Fecha_Entrega: fec
            });

            // descontar stock igual
            await DairyAPI.enviarDatos({
                pestaña: "Inventario",
                Producto: n,
                Stock: p.Stock - carrito[n]
            });
        }
    }

    location.reload();
}

/* ====================================================== */

async function procesarVenta() {

    const cli = document.getElementById("select-cliente").value;
    const fec = document.getElementById("fecha-entrega").value;

    if (!cli) return alert("Falta cliente");

    document.getElementById("overlay-exito").style.display = "flex";

    for (let n in carrito) {

        if (carrito[n] > 0) {

            const p = productosData.find(x => x.Producto === n);

            await DairyAPI.enviarDatos({
                pestaña: "Ventas",
                ID_Venta: idVenta,
                Cliente: cli,
                Producto: n,
                Cantidad: carrito[n],
                Precio_PVP: p.Precio_Venta,
                Fecha_Entrega: fec,
                Estado_Entrega: "PENDIENTE"
            });
        }
    }

    location.reload();
}

function alternarFormulario(m) {
    document.getElementById("vista-seleccion-cliente").classList.toggle("hidden", m);
}

function filtrar() {
    const q = document.getElementById("buscarProducto").value.toLowerCase();

    document.querySelectorAll(".card-producto").forEach(e => {
        e.style.display = e.innerText.toLowerCase().includes(q) ? "flex" : "none";
    });
}

window.onload = iniciar;

</script>

</body>
</html>
