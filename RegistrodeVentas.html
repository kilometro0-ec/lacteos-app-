<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>
    
    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    
    <!-- Estilos Externos -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <script>
      tailwind.config = {
        theme: { 
            extend: { 
                colors: { 
                    primary: "#a21caf", 
                    secondary: "#db2777", 
                    surface: "#faf5ff"
                } 
            } 
        }
      }
    </script>

    <style>
        /* Ajustes específicos para esta vista que no están en el CSS global */
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        
        #overlay-exito {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }
        .check-anim { font-size: 80px; color: var(--primary); animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        #carrito-flotante {
            position: fixed; bottom: 100px; left: 16px; right: 16px;
            background: white; border-radius: 2.5rem;
            padding: 20px; box-shadow: 0 20px 50px rgba(162, 28, 175, 0.15); 
            z-index: 100; border: 1px solid var(--outline);
        }
        .btn-wa-premium { 
            background: #25d366; color: white; width: 100%; padding: 16px; border-radius: 1.5rem; 
            font-weight: 800; display: none; align-items: center; justify-content: center; 
            gap: 10px; animation: pulse-wa 2s infinite; border: none;
        }
        @keyframes pulse-wa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
    </style>
</head>
<body class="pb-96"> 

<!-- Pantalla de Éxito -->
<div id="overlay-exito">
    <span class="material-symbols-outlined check-anim" id="icono-estado">sync</span>
    <h2 class="text-titulo mt-4" id="titulo-estado">Guardando...</h2>
    <p class="text-label mt-2" id="p-estado">Sincronizando con la nube</p>
</div>

<!-- Cabecera -->
<header class="h-20 bg-white/80 backdrop-blur-md border-b border-purple-100 flex justify-between items-center px-6 sticky top-0 z-50">
    <div class="flex flex-col">
        <h1 class="brand-logo text-xl leading-none">Nueva Venta</h1>
        <span id="id-venta-display" class="text-label text-primary mt-1">ID: ---</span>
    </div>
    <button onclick="location.reload()" class="w-10 h-10 rounded-2xl bg-purple-50 text-primary flex items-center justify-center active:scale-90 transition-transform">
        <span class="material-symbols-outlined text-xl">refresh</span>
    </button>
</header>

<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">
    <!-- 1. SELECCIÓN DE CLIENTE -->
    <section class="card-sutil">
        <div id="vista-seleccion-cliente">
            <div class="flex justify-between items-center mb-4">
                <span class="text-label">Paso 1: Cliente</span>
                <button onclick="alternarFormulario(true)" class="tag tag-warning" style="background: var(--secondary); color: white;">Nuevo +</button>
            </div>
            <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
        </div>

        <!-- Registro Nuevo Cliente -->
        <div id="vista-nuevo-cliente" class="hidden space-y-3">
            <p class="text-label text-secondary italic">Nuevo Registro</p>
            <input type="text" id="reg-nombre" placeholder="NOMBRE COMPLETO" class="input-sutil uppercase" oninput="this.value = this.value.toUpperCase()">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="reg-ruc" placeholder="CI / RUC" class="input-sutil">
                <input type="tel" id="reg-tel" placeholder="TELÉFONO" class="input-sutil">
            </div>
            <input type="text" id="reg-dir" placeholder="DIRECCIÓN EXACTA" class="input-sutil">
            <input type="text" id="reg-ref" placeholder="REFERENCIA" class="input-sutil">
            <select id="reg-sector" class="input-sutil">
                <option value="SUR">SUR</option>
                <option value="NORTE">NORTE</option>
                <option value="CENTRO">CENTRO</option>
                <option value="VALLES">VALLES</option>
            </select>
            <div class="flex gap-2 pt-2">
                <button onclick="guardarCliente()" id="btn-guardar-cliente" class="btn-magenta flex-1">Guardar</button>
                <button onclick="alternarFormulario(false)" class="flex-1 bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl text-[10px] uppercase">Cancelar</button>
            </div>
        </div>
    </section>

    <!-- 2. PRODUCTOS -->
    <div id="seccion-operativa" class="bloqueado transition-all duration-500">
        <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1">
                <span class="material-symbols-outlined absolute left-4 top-4 text-slate-300">search</span>
                <input type="text" id="buscarProducto" oninput="filtrar()" placeholder="Buscar producto..." class="input-sutil pl-12 bg-white">
            </div>
        </div>
        <div id="contenedor-productos" class="space-y-3"></div>
    </div>
</main>

<!-- 3. CARRITO FLOTANTE -->
<div id="carrito-flotante" class="bloqueado">
    <div class="flex justify-between items-center mb-4 border-b border-purple-50 pb-4">
        <div class="flex-1">
            <p id="car-cliente" class="text-xs font-black text-primary uppercase italic truncate">Esperando...</p>
            <p id="car-id" class="text-label text-[8px]">ID: ---</p>
        </div>
        <div class="text-right">
            <p id="car-total" class="text-3xl font-black text-slate-900 leading-none">$0.00</p>
            <p id="car-items" class="text-label text-secondary mt-1">0 ÍTEMS</p>
        </div>
    </div>
    
    <div id="car-detalle" class="max-h-24 overflow-y-auto mb-4 space-y-1 text-[11px] font-semibold text-slate-500 italic">
        <p class="text-center text-slate-300 py-2">No hay productos aún</p>
    </div>

    <div class="flex gap-2 mb-4">
        <input type="date" id="fecha-entrega" class="input-sutil bg-purple-50 border-none h-12 text-center text-primary font-bold">
    </div>

    <button id="btn-confirmar" onclick="procesarVenta()" class="btn-magenta">Confirmar Pedido</button>
    
    <button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-wa-premium">
        <span class="material-symbols-outlined">send</span> ENVIAR A WHATSAPP
    </button>
</div>

<!-- Menú inferior -->
<div id="menu-container"></div>

<script>
// (Aquí se mantiene el mismo script funcional que ya tenías, solo asegúrate de que esté debajo del HTML)
let carrito = {}; 
let productosData = []; 
let idVenta = "";

async function iniciar() {
    const d = new Date();
    idVenta = `V-${d.getFullYear().toString().slice(-2)}${Math.floor(100000 + Math.random() * 900000)}`;
    document.getElementById('car-id').innerText = `ID: ${idVenta}`;
    document.getElementById('id-venta-display').innerText = `ID: ${idVenta}`;
    document.getElementById('fecha-entrega').value = d.toISOString().split('T')[0];

    try {
        const [cl, pr] = await Promise.all([DairyAPI.obtenerDatos("Clientes"), DairyAPI.obtenerDatos("Inventario")]);
        productosData = pr || [];
        const sel = document.getElementById('select-cliente');
        
        const listaClientes = Array.isArray(cl) ? cl : [];
        listaClientes.sort((a,b)=>String(a.Nombre).localeCompare(b.Nombre)).forEach(c => { 
            sel.innerHTML += `<option value="${c.Nombre}">${c.Nombre}</option>`; 
        });
        renderizar();
    } catch(e) { console.error("Error al cargar:", e); }
}

function activarInterfaz() {
    const cli = document.getElementById('select-cliente').value;
    document.getElementById('seccion-operativa').classList.toggle('bloqueado', !cli);
    document.getElementById('carrito-flotante').classList.toggle('bloqueado', !cli);
    document.getElementById('car-cliente').innerText = cli || "Esperando Cliente...";
}

function renderizar() {
    const cont = document.getElementById('contenedor-productos'); cont.innerHTML = "";
    productosData.forEach(p => {
        const idCant = `cant-${p.Producto.replace(/\s+/g,'-')}`;
        cont.innerHTML += `
            <div class="card-sutil flex items-center justify-between mb-2">
                <div class="flex-1">
                    <h4 class="font-black text-[13px] uppercase text-slate-800 leading-tight">${p.Producto}</h4>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-sm font-black text-primary">$${parseFloat(p.Precio_Venta).toFixed(2)}</span>
                        <span class="tag tag-success" style="font-size:8px">Stock: ${p.Stock}</span>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-purple-50 p-1 rounded-2xl">
                    <button onclick="cambiarCant('${p.Producto}',-1)" class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-primary">-</button>
                    <span id="${idCant}" class="w-6 text-center font-black text-lg text-slate-900">0</span>
                    <button onclick="cambiarCant('${p.Producto}',1)" class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-primary">+</button>
                </div>
            </div>`;
    });
}

function cambiarCant(n, d) {
    if(!carrito[n]) carrito[n] = 0;
    const p = productosData.find(x => x.Producto === n);
    const stockDisp = parseInt(p.Stock || 0);
    
    if(carrito[n]+d >= 0 && (carrito[n]+d <= stockDisp)) {
        carrito[n] += d;
        document.getElementById(`cant-${n.replace(/\s+/g,'-')}`).innerText = carrito[n];
        actualizarCarrito();
    } else if (d > 0) {
        alert("¡Stock insuficiente!");
    }
}

function actualizarCarrito() {
    let t = 0; let items = 0; let html = "";
    Object.keys(carrito).forEach(n => {
        if(carrito[n] > 0) {
            const p = productosData.find(x => x.Producto === n);
            const sub = (carrito[n] * parseFloat(p.Precio_Venta));
            t += sub; items += carrito[n];
            html += `<div class="flex justify-between py-1 border-b border-purple-50 last:border-0"><span>${n} (x${carrito[n]})</span><span class="text-slate-900">$${sub.toFixed(2)}</span></div>`;
        }
    });
    document.getElementById('car-detalle').innerHTML = html || '<p class="text-center text-slate-200 py-2 italic">Sin productos elegidos</p>';
    document.getElementById('car-total').innerText = `$${t.toFixed(2)}`;
    document.getElementById('car-items').innerText = `${items} Unidades`;
}

async function procesarVenta() {
    const cli = document.getElementById('select-cliente').value;
    const fec = document.getElementById('fecha-entrega').value;
    if(!cli || document.getElementById('car-items').innerText === "0 Unidades") return alert("Selecciona cliente y productos");
    
    const overlay = document.getElementById('overlay-exito');
    overlay.style.display = 'flex';
    document.getElementById('titulo-estado').innerText = "Guardando...";
    document.getElementById('icono-estado').innerText = "sync";
    document.getElementById('icono-estado').classList.add('animate-spin');

    try {
        for(const n in carrito) {
            if(carrito[n] > 0) {
                const p = productosData.find(x => x.Producto === n);
                await DairyAPI.enviarDatos({ 
                    pestaña: "Ventas",
                    ID_Venta: idVenta, 
                    Cliente: cli, 
                    Producto: n, 
                    Cantidad: carrito[n], 
                    Precio_PVP: p.Precio_Venta, 
                    Fecha_Entrega: fec,
                    Estado_Entrega: "PENDIENTE"
                });
            }
        }
        
        document.getElementById('icono-estado').classList.remove('animate-spin');
        document.getElementById('icono-estado').innerText = "check_circle";
        document.getElementById('titulo-estado').innerText = "¡Pedido Guardado!";

        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('btn-confirmar').style.display = 'none';
            document.getElementById('btn-whatsapp').style.display = 'flex';
        }, 1500);
    } catch(e) { 
        overlay.style.display = 'none';
        alert("Error de conexión"); 
    }
}

async function guardarCliente() {
    const btn = document.getElementById('btn-guardar-cliente');
    const nom = document.getElementById('reg-nombre').value.trim();
    const ruc = document.getElementById('reg-ruc').value.trim();

    if(!nom || ruc.length < 10) return alert("Nombre y CI (10 dígitos) obligatorios");

    btn.innerText = "PROCESANDO...";
    btn.disabled = true;

    const ahora = new Date();
    const data = {
        pestaña: "Clientes",
        ID: `C-${Date.now().toString().slice(-6)}`,
        Nombre: nom.toUpperCase(),
        CI_RUC: ruc,
        Teléfono: document.getElementById('reg-tel').value.trim(),
        Dirección: document.getElementById('reg-dir').value.trim(),
        Sector: document.getElementById('reg-sector').value,
        "Fecha Registro": ahora.toLocaleString()
    };

    try {
        await DairyAPI.enviarDatos(data);
        alert("✅ CLIENTE REGISTRADO");
        location.reload();
    } catch(e) { alert("Error"); btn.disabled = false; btn.innerText = "Guardar"; }
}

function enviarWhatsApp() {
    const cli = document.getElementById('select-cliente').value;
    const fec = document.getElementById('fecha-entrega').value;
    let listado = ""; let t = 0;
    Object.keys(carrito).forEach(n => {
        if(carrito[n] > 0) {
            const p = productosData.find(x => x.Producto === n);
            listado += `• *${carrito[n]}* ${n} ($${p.Precio_Venta})\n`;
            t += (carrito[n] * parseFloat(p.Precio_Venta));
        }
    });

    const msg = `*LÓGICA LÁCTEA - PEDIDO*\n\n*ID:* ${idVenta}\n*Cliente:* ${cli}\n*Entrega:* ${fec}\n\n*PRODUCTOS:*\n${listado}\n*TOTAL: $${t.toFixed(2)}*\n\n¡Gracias! 🥛`;
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    location.reload();
}

function alternarFormulario(m) {
    document.getElementById('vista-seleccion-cliente').classList.toggle('hidden', m);
    document.getElementById('vista-nuevo-cliente').classList.toggle('hidden', !m);
}

function filtrar() {
    const q = document.getElementById('buscarProducto').value.toLowerCase();
    document.querySelectorAll('.card-sutil').forEach(c => {
        if(c.querySelector('h4')) {
            c.style.display = c.querySelector('h4').innerText.toLowerCase().includes(q) ? "flex" : "none";
        }
    });
}

window.onload = iniciar;
</script>
</body>
</html>
