<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ventas - Lógica Láctea</title>
    <!-- CONEXIÓN A ARCHIVOS RAÍZ -->
    <link rel="stylesheet" href="estilos-lacteos.css">
    <!-- Tailwind CSS para estructura y diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 para alertas, cargas y confirmaciones -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col pb-16">

    <!-- EL MENÚ SE INYECTA DINÁMICAMENTE DESDE menu-logic.js -->
    <div id="menu-container"></div>

    <!-- Encabezado del Módulo -->
    <header class="bg-emerald-600 text-white shadow-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <i data-lucide="shopping-cart" class="w-8 h-8"></i>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Punto de Venta / Salidas</h1>
                <p class="text-xs text-emerald-100">Facturación, Despachos y Consumo Interno</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Selector de Consumo Interno (Precio Cero) -->
            <label class="inline-flex items-center cursor-pointer bg-emerald-700/50 px-3 py-1.5 rounded-lg border border-emerald-500 select-none">
                <input type="checkbox" id="chkConsumoInterno" onchange="alternarConsumoInterno()" class="sr-only peer">
                <span class="text-xs font-bold mr-2 text-emerald-100 peer-checked:text-white">CONSUMO INTERNO</span>
                <div class="relative w-9 h-5 bg-emerald-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
            </label>
        </div>
    </header>

    <!-- Contenedor Principal (Grid de 2 Columnas) -->
    <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Panel Izquierdo: Configuración del Cliente y Selección de Producto (5 columnas) -->
        <div class="lg:col-span-5 space-y-6">
            
            <!-- Bloque 1: Cliente -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-black text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="user" class="w-4 h-4 text-emerald-600"></i> Datos del Cliente
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Seleccionar Cliente *</label>
                        <select id="selectCliente" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50">
                            <option value="">-- Buscando Cartera de Clientes --</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Bloque 2: Selector de Items -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-black text-slate-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="package" class="w-4 h-4 text-emerald-600"></i> Agregar Producto
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Producto / Derivado Lácteo</label>
                        <select id="selectProducto" onchange="verificarStockDisponible()" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50">
                            <option value="">-- Seleccione un ítem --</option>
                        </select>
                    </div>

                    <!-- Visualizador Dinámico de Stock en tiempo real -->
                    <div id="wrapperStock" class="hidden p-3 rounded-lg border text-xs flex justify-between items-center transition-all">
                        <div>
                            <span class="font-bold block text-slate-600">Disponibilidad en Kárdex:</span>
                            <span id="txtStockMinimo" class="text-base font-black">0 Uds</span>
                        </div>
                        <span id="badgeEstadoStock" class="px-2 py-1 rounded font-bold uppercase text-[10px]"></span>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Precio Unitario ($)</label>
                            <input type="number" id="numPrecioUnitario" readonly class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-100 font-bold text-slate-600 outline-none">
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Cantidad a Vender</label>
                            <input type="number" id="numCantidadVenta" min="1" value="1" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 font-black outline-none">
                        </div>
                    </div>

                    <button type="button" onclick="agregarItemAlCarrito()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-lg flex items-center justify-center gap-2 shadow-sm transition-all active:scale-95">
                        <i data-lucide="list-plus" class="w-4 h-4"></i> Insertar a la Lista
                    </button>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Carrito de Compras / Factura Actual (7 columnas) -->
        <div class="lg:col-span-7 bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between h-[calc(100vh-12rem)] min-h-[500px]">
            
            <div class="flex flex-col flex-1 overflow-hidden">
                <div class="border-b border-slate-100 pb-3 mb-4 flex justify-between items-center">
                    <h2 class="font-black text-slate-700 uppercase tracking-wider text-sm flex items-center gap-2">
                        <i data-lucide="receipt" class="w-4 h-4 text-emerald-600"></i> Detalle de la Operación
                    </h2>
                    <span id="badgeTipoVenta" class="bg-emerald-100 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded uppercase tracking-wider">Venta Comercial</span>
                </div>

                <!-- Tabla del Carrito -->
                <div class="flex-1 overflow-y-auto pr-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-400 font-bold uppercase tracking-wider text-[10px]">
                                <th class="py-3 px-4">Producto</th>
                                <th class="py-3 px-2 text-center">Cant.</th>
                                <th class="py-3 px-2 text-right">P. Unit</th>
                                <th class="py-3 px-2 text-right">Subtotal</th>
                                <th class="py-3 px-4 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyCarrito" class="divide-y divide-slate-100 font-medium text-slate-700">
                            <tr>
                                <td colspan="5" class="text-center py-16 text-slate-400 italic">
                                    <i data-lucide="shopping-bag" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                                    No hay productos agregados a la orden.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Resumen de Totales e Impulsor Financiero -->
            <div class="border-t border-slate-100 pt-4 mt-4 space-y-4">
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Neto a Liquidar:</span>
                    <span id="txtTotalFactura" class="text-3xl font-black text-slate-800">$0.00</span>
                </div>

                <button type="button" id="btnRegistrarVenta" onclick="confirmarYEnviarVenta()" disabled class="w-full bg-slate-400 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 cursor-not-allowed transition-all uppercase tracking-widest text-sm active:scale-95">
                    <i data-lucide="check-square" class="w-5 h-5"></i>
                    Registrar y Descontar Stock
                </button>
            </div>
        </div>
    </main>

    <!-- SCRIPTS DE CONEXIÓN CON RAÍZ -->
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>

    <script>
        let catalogoProductos = [];
        let clientesGlobal = [];
        let carrito = [];
        let esConsumoInterno = false;

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            inicializarModulo();
        });

        // Saneador reutilizable para formatos de moneda complejos (ej: "$ 1,5")
        const limpiarMoneda = (valor) => {
            if (valor === undefined || valor === null || valor === "") return 0;
            let texto = String(valor).replace(/[^0-9.,-]/g, '').replace(',', '.');
            let numero = parseFloat(texto);
            return isNaN(numero) ? 0 : numero;
        };

        async function inicializarModulo() {
            try {
                // 1. Obtener Cartera de Clientes
                const datosClientes = await DairyAPI.obtenerDatos("Clientes");
                const selectCli = document.getElementById("selectCliente");
                
                if (Array.isArray(datosClientes)) {
                    clientesGlobal = datosClientes;
                    selectCli.innerHTML = '<option value="">-- Seleccione un Cliente --</option>';
                    datosClientes.forEach(c => {
                        const ruc = String(c.ci_ruc || c.CI_RUC || c.ruc || c.id || "").trim();
                        const nombre = c.nombre || c.Nombre || c.razon_social || "Cliente Desconocido";
                        if(ruc) {
                            selectCli.innerHTML += `<option value="${ruc}">${nombre} (${ruc})</option>`;
                        }
                    });
                }

                // 2. Obtener Catálogo e Inventario Vigente
                const datosInventario = await DairyAPI.obtenerDatos("Inventario");
                const selectProd = document.getElementById("selectProducto");
                
                if (Array.isArray(datosInventario)) {
                    catalogoProductos = datosInventario;
                    selectProd.innerHTML = '<option value="">-- Seleccione un ítem --</option>';
                    catalogoProductos.forEach(p => {
                        const id = String(p.id || p.ID || p.codigo || "").trim();
                        const producto = p.producto || p.Producto || p.nombre;
                        if(id) {
                            selectProd.innerHTML += `<option value="${id}">${producto}</option>`;
                        }
                    });
                }
            } catch (err) {
                console.error("Error al inicializar Punto de Venta:", err);
                Swal.fire("Error Estructural", "Fallo al conectar con el servidor central de Google Sheets.", "error");
            }
        }

        function verificarStockDisponible() {
            const selectP = document.getElementById("selectProducto");
            const idProd = selectP.value;
            const wrapper = document.getElementById("wrapperStock");
            
            if(!idProd) {
                wrapper.classList.add("hidden");
                document.getElementById("numPrecioUnitario").value = "";
                return;
            }

            const prod = catalogoProductos.find(p => String(p.id || p.ID || p.codigo).trim() === idProd);
            if(!prod) return;

            const stockActual = parseInt(prod.stock || prod.Stock || 0);
            const precioVenta = limpiarMoneda(prod.precioVenta || prod.PrecioVenta || prod.Precio_Venta || prod.precio || 0);
            
            wrapper.classList.remove("hidden");
            document.getElementById("txtStockMinimo").innerText = `${stockActual} Unidades`;
            document.getElementById("numPrecioUnitario").value = esConsumoInterno ? "0.00" : precioVenta.toFixed(2);

            const badge = document.getElementById("badgeEstadoStock");
            if(stockActual <= 0) {
                badge.className = "px-2 py-1 rounded font-bold uppercase text-[10px] bg-rose-100 text-rose-700";
                badge.innerText = "Sin Stock";
            } else if(stockActual <= 10) {
                badge.className = "px-2 py-1 rounded font-bold uppercase text-[10px] bg-amber-100 text-amber-700";
                badge.innerText = "Stock Crítico";
            } else {
                badge.className = "px-2 py-1 rounded font-bold uppercase text-[10px] bg-emerald-100 text-emerald-700";
                badge.innerText = "Disponible";
            }
        }

        function alternarConsumoInterno() {
            esConsumoInterno = document.getElementById("chkConsumoInterno").checked;
            const badgeTipo = document.getElementById("badgeTipoVenta");

            if(esConsumoInterno) {
                badgeTipo.className = "bg-amber-100 text-amber-800 text-[10px] font-black px-2.5 py-1 rounded uppercase tracking-wider";
                badgeTipo.innerText = "Consumo Interno ($0)";
            } else {
                badgeTipo.className = "bg-emerald-100 text-emerald-800 text-[10px] font-black px-2.5 py-1 rounded uppercase tracking-wider";
                badgeTipo.innerText = "Venta Comercial";
            }

            verificarStockDisponible();
            
            carrito.forEach(item => {
                const original = catalogoProductos.find(p => String(p.id || p.ID || p.codigo).trim() === item.id);
                const precioOrig = limpiarMoneda(original.precioVenta || original.PrecioVenta || original.Precio_Venta || original.precio || 0);
                
                item.precio = esConsumoInterno ? 0.00 : precioOrig;
                item.subtotal = item.precio * item.cantidad;
            });
            renderizarCarrito();
        }

        function agregarItemAlCarrito() {
            const idProd = document.getElementById("selectProducto").value;
            const cant = parseInt(document.getElementById("numCantidadVenta").value) || 0;

            if(!idProd || cant <= 0) {
                return Swal.fire("Campos Incompletos", "Selecciona un producto y define una cantidad válida.", "warning");
            }

            const prod = catalogoProductos.find(p => String(p.id || p.ID || p.codigo).trim() === idProd);
            const stockActual = parseInt(prod.stock || prod.Stock || 0);

            const yaEnCarrito = carrito.find(item => item.id === idProd);
            const cantidadTotalSolicitada = cant + (yaEnCarrito ? yaEnCarrito.cantidad : 0);

            if(cantidadTotalSolicitada > stockActual) {
                return Swal.fire("Quiebre de Stock", `No puedes despachar ${cantidadTotalSolicitada} unidades. El stock disponible actual es de ${stockActual} unidades.`, "error");
            }

            if(yaEnCarrito) {
                yaEnCarrito.cantidad = cantidadTotalSolicitada;
                yaEnCarrito.subtotal = yaEnCarrito.cantidad * yaEnCarrito.precio;
            } else {
                const nombreProd = prod.producto || prod.Producto || prod.nombre;
                const precioUnidad = esConsumoInterno ? 0.00 : limpiarMoneda(prod.precioVenta || prod.PrecioVenta || prod.Precio_Venta || prod.precio || 0);
                
                carrito.push({
                    id: idProd,
                    producto: nombreProd,
                    cantidad: cant,
                    precio: precioUnidad,
                    subtotal: cant * precioUnidad
                });
            }

            renderizarCarrito();
            
            document.getElementById("selectProducto").value = "";
            document.getElementById("numCantidadVenta").value = "1";
            document.getElementById("wrapperStock").classList.add("hidden");
        }

        function eliminarItem(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const tbody = document.getElementById("tbodyCarrito");
            tbody.innerHTML = "";

            if(carrito.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-16 text-slate-400 italic"><i data-lucide="shopping-bag" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>No hay productos agregados a la orden.</td></tr>`;
                document.getElementById("txtTotalFactura").innerText = "$0.00";
                toggleBtnRegistrar(false);
                lucide.createIcons();
                return;
            }

            let totalAcumulado = 0;
            carrito.forEach((item, index) => {
                totalAcumulado += item.subtotal;
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-bold text-slate-800">${item.producto}</td>
                    <td class="py-3 px-2 text-center font-black text-slate-600">${item.cantidad}</td>
                    <td class="py-3 px-2 text-right">$${item.precio.toFixed(2)}</td>
                    <td class="py-3 px-2 text-right font-bold text-emerald-700">$${item.subtotal.toFixed(2)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="eliminarItem(${index})" class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4 mx-auto"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById("txtTotalFactura").innerText = `$${totalAcumulado.toFixed(2)}`;
            toggleBtnRegistrar(true);
            lucide.createIcons();
        }

        function toggleBtnRegistrar(activar) {
            const btn = document.getElementById("btnRegistrarVenta");
            if(activar) {
                btn.disabled = false;
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 cursor-pointer transition-all uppercase tracking-widest text-sm active:scale-95";
            } else {
                btn.disabled = true;
                btn.className = "w-full bg-slate-400 text-white font-black py-4 rounded-xl shadow-lg flex items-center justify-center gap-3 cursor-not-allowed transition-all uppercase tracking-widest text-sm";
            }
        }

        // CONTROL DE ESCRITURA TOTALMENTE ADAPTADO A LAS COLUMNAS EXACTAS DE TU HOJA VENTAS
        async function confirmarYEnviarVenta() {
            const rucCliente = document.getElementById("selectCliente").value;
            if(!rucCliente) {
                return Swal.fire("Cliente Requerido", "Por favor, asigne un cliente válido para esta transacción.", "warning");
            }

            // Ubicar el nombre legible del cliente
            const objCliente = clientesGlobal.find(c => String(c.ci_ruc || c.CI_RUC || c.ruc || c.id || "").trim() === rucCliente);
            const nombreCliente = objCliente ? (objCliente.nombre || objCliente.Nombre || objCliente.razon_social) : rucCliente;

            const confirmacion = await Swal.fire({
                title: '¿Confirmar Despacho?',
                text: esConsumoInterno ? "Se registrará como Consumo Interno con costo de $0.00." : "Se procesará la venta y se descontarán las existencias del inventario.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#059669',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Sí, procesar salida',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmacion.isConfirmed) return;

            Swal.fire({
                title: 'Procesando Operación...',
                text: 'Deduciendo inventarios y asentando transacciones en Google Sheets...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // Generador de clave correlativa única para agrupar la orden
            const idVentaUnico = `V-${Math.floor(100000 + Math.random() * 900000)}`;
            const fechaActual = new Date().toLocaleDateString('es-EC');

            // Enviamos un arreglo plano fila por fila para impactar directamente las columnas de la hoja
            try {
                for (const item of carrito) {
                    const payloadfijo = {
                        pestana: "Ventas",
                        accion: "escribir", // Forzado en español para match con api-config
                        ID_Venta: idVentaUnico,
                        Fecha: fechaActual,
                        Cliente: nombreCliente,
                        Producto: item.producto,
                        Cantidad: parseInt(item.cantidad),
                        Precio_PVP: parseFloat(item.precio),
                        Total: parseFloat(item.subtotal),
                        Estado: "PAGADO",
                        Fecha_Entrega: fechaActual
                    };

                    // Ejecución secuencial controlada para evitar colisiones en la API de Sheets
                    await DairyAPI.guardarDatos("Ventas", payloadfijo);
                }

                Swal.fire({
                    title: '¡Operación Exitosa!',
                    text: 'Venta asentada columna por columna en Google Sheets sin errores.',
                    icon: 'success',
                    confirmButtonColor: '#059669'
                });

                // Limpieza absoluta de la interfaz
                carrito = [];
                document.getElementById("selectCliente").value = "";
                if(document.getElementById("chkConsumoInterno").checked) {
                    document.getElementById("chkConsumoInterno").checked = false;
                    alternarConsumoInterno();
                }
                renderizarCarrito();
                inicializarModulo(); // Sincroniza en caliente nuevos stocks
                
            } catch (err) {
                console.error("Error al asentar orden de salida:", err);
                Swal.fire("Error Operativo", "Se perdió la comunicación. Verifica si algunas filas se guardaron de manera parcial en Sheets.", "error");
            }
        }
    </script>
</body>
</html>
