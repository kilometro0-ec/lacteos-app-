<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Ventas - Lógica Láctea</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="api-config.js"></script>
    <script src="menu-logic.js"></script>
    
    <link rel="stylesheet" href="estilos-lacteos.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    
    <script>
      tailwind.config = {
        theme: { 
            extend: { 
                colors: { 
                    primary: "#a21caf", 
                    secondary: "#db2777", 
                    surface: "#faf5ff"
                } 
            } 
        }
      }
    </script>

    <style>
        .bloqueado { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        #overlay-exito {
            position: fixed; inset: 0; background: rgba(255,255,255,0.98);
            display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200;
        }
        .check-anim { font-size: 80px; color: var(--primary); animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        #carrito-flotante {
            position: fixed; bottom: 100px; left: 16px; right: 16px;
            background: white; border-radius: 2.5rem;
            padding: 20px; box-shadow: 0 20px 50px rgba(162, 28, 175, 0.15); 
            z-index: 100; border: 1px solid var(--outline);
        }
        .btn-wa-premium { 
            background: #25d366; color: white; width: 100%; padding: 16px; border-radius: 1.5rem; 
            font-weight: 800; display: none; align-items: center; justify-content: center; 
            gap: 10px; animation: pulse-wa 2s infinite; border: none;
        }
    </style>
</head>
<body class="pb-96"> 

<div id="overlay-exito">
    <span class="material-symbols-outlined check-anim" id="icono-estado">sync</span>
    <h2 class="text-titulo mt-4" id="titulo-estado">Guardando...</h2>
    <p class="text-label mt-2" id="p-estado">Sincronizando con la nube</p>
</div>

<header class="h-20 bg-white/80 backdrop-blur-md border-b border-purple-100 flex justify-between items-center px-6 sticky top-0 z-50">
    <div class="flex flex-col">
        <h1 class="brand-logo text-xl leading-none">Nueva Venta</h1>
        <span id="id-venta-display" class="text-label text-primary mt-1">ID: ---</span>
    </div>
    <div class="flex gap-2">
        <!-- BOTÓN PRUEBA DE CALIDAD (Fuerza valor 0) -->
        <button onclick="registrarPruebaCalidadRapida()" class="w-10 h-10 rounded-2xl bg-indigo-100 text-indigo-700 flex items-center justify-center active:scale-90 transition-transform shadow-sm">
            <span class="material-symbols-outlined text-xl">science</span>
        </button>
        <button onclick="location.reload()" class="w-10 h-10 rounded-2xl bg-purple-50 text-primary flex items-center justify-center active:scale-90 transition-transform">
            <span class="material-symbols-outlined text-xl">refresh</span>
        </button>
    </div>
</header>

<main class="mt-6 px-6 max-w-xl mx-auto space-y-6">
    <section class="card-sutil">
        <div id="vista-seleccion-cliente">
            <div class="flex justify-between items-center mb-4">
                <span class="text-label">Paso 1: Cliente</span>
                <button onclick="alternarFormulario(true)" class="tag tag-warning" style="background: var(--secondary); color: white;">Nuevo +</button>
            </div>
            <select id="select-cliente" onchange="activarInterfaz()" class="input-sutil">
                <option value="">-- SELECCIONAR CLIENTE --</option>
            </select>
        </div>

        <div id="vista-nuevo-cliente" class="hidden space-y-3">
            <p class="text-label text-secondary italic">Nuevo Registro</p>
            <input type="text" id="reg-nombre" placeholder="NOMBRE COMPLETO" class="input-sutil uppercase" oninput="this.value = this.value.toUpperCase()">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="reg-ruc" placeholder="CI / RUC" class="input-sutil">
                <input type="tel" id="reg-tel" placeholder="TELÉFONO" class="input-sutil">
            </div>
            <input type="text" id="reg-dir" placeholder="DIRECCIÓN EXACTA" class="input-sutil">
            <input type="text" id="reg-ref" placeholder="REFERENCIA" class="input-sutil">
            <select id="reg-sector" class="input-sutil">
                <option value="SUR">SUR</option>
                <option value="NORTE">NORTE</option>
                <option value="CENTRO">CENTRO</option>
                <option value="VALLES">VALLES</option>
            </select>
            <div class="flex gap-2 pt-2">
                <button onclick="guardarCliente()" id="btn-guardar-cliente" class="btn-magenta flex-1">Guardar</button>
                <button onclick="alternarFormulario(false)" class="flex-1 bg-slate-100 text-slate-500 font-bold py-4 rounded-2xl text-[10px] uppercase">Cancelar</button>
            </div>
        </div>
    </section>

    <div id="seccion-operativa" class="bloqueado transition-all duration-500">
        <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1">
                <span class="material-symbols-outlined absolute left-4 top-4 text-slate-300">search</span>
                <input type="text" id="buscarProducto" oninput="filtrar()" placeholder="Buscar producto..." class="input-sutil pl-12 bg-white">
            </div>
        </div>
        <div id="contenedor-productos" class="space-y-3"></div>
    </div>
</main>

<div id="carrito-flotante" class="bloqueado">
    <div class="flex justify-between items-center mb-4 border-b border-purple-50 pb-4">
        <div class="flex-1">
            <p id="car-cliente" class="text-xs font-black text-primary uppercase italic truncate">Esperando...</p>
            <p id="car-id" class="text-label text-[8px]">ID: ---</p>
        </div>
        <div class="text-right">
            <p id="car-total" class="text-3xl font-black text-slate-900 leading-none">$0.00</p>
            <p id="car-items" class="text-label text-secondary mt-1">0 ÍTEMS</p>
        </div>
    </div>
    
    <div id="car-detalle" class="max-h-24 overflow-y-auto mb-4 space-y-1 text-[11px] font-semibold text-slate-500 italic">
        <p class="text-center text-slate-300 py-2">No hay productos aún</p>
    </div>

    <div class="flex gap-2 mb-4">
        <input type="date" id="fecha-entrega" class="input-sutil bg-purple-50 border-none h-12 text-center text-primary font-bold">
    </div>

    <button id="btn-confirmar" onclick="procesarVenta()" class="btn-magenta">Confirmar Pedido</button>
    
    <button id="btn-whatsapp" onclick="enviarWhatsApp()" class="btn-wa-premium">
        <span class="material-symbols-outlined">send</span> ENVIAR A WHATSAPP
    </button>
</div>

<div id="menu-container"></div>

    <script>
let carrito = {};
let productosData = [];
let idVenta = "";

// ===============================
// INICIO
// ===============================
async function iniciar() {

    const d = new Date();

    idVenta =
        `V-${d.getFullYear().toString().slice(-2)}${Math.floor(100000 + Math.random() * 900000)}`;

    document.getElementById('car-id').innerText =
        `ID: ${idVenta}`;

    document.getElementById('id-venta-display').innerText =
        `ID: ${idVenta}`;

    document.getElementById('fecha-entrega').value =
        d.toISOString().split('T')[0];

    try {

        // ===============================
        // OBTENER CLIENTES + INVENTARIO
        // ===============================
        const [clientes, inventario] = await Promise.all([
            DairyAPI.obtenerDatos("Clientes"),
            DairyAPI.obtenerDatos("Inventario")
        ]);

        productosData =
            Array.isArray(inventario)
                ? inventario
                : [];

        // ===============================
        // CARGAR CLIENTES
        // ===============================
        const sel =
            document.getElementById('select-cliente');

        sel.innerHTML =
            '<option value="">-- SELECCIONAR CLIENTE --</option>';

        const listaClientes =
            Array.isArray(clientes)
                ? clientes
                : [];

        listaClientes
            .sort((a, b) =>
                String(a.Nombre || "")
                    .localeCompare(String(b.Nombre || ""))
            )
            .forEach(c => {

                sel.innerHTML += `
                    <option value="${c.Nombre}">
                        ${c.Nombre}
                    </option>
                `;
            });

        // ===============================
        // RENDER PRODUCTOS
        // ===============================
        renderizar();

    } catch (e) {

        console.error("Error al cargar:", e);

        alert("Error cargando información");
    }
}

// ===============================
// ACTIVAR INTERFAZ
// ===============================
function activarInterfaz() {

    const cli =
        document.getElementById('select-cliente').value;

    document
        .getElementById('seccion-operativa')
        .classList.toggle('bloqueado', !cli);

    document
        .getElementById('carrito-flotante')
        .classList.toggle('bloqueado', !cli);

    document.getElementById('car-cliente').innerText =
        cli || "Esperando Cliente...";
}

// ===============================
// RENDER PRODUCTOS
// ===============================
function renderizar() {

    const cont =
        document.getElementById('contenedor-productos');

    cont.innerHTML = "";

    productosData.forEach(p => {

        const producto =
            p.Producto || "";

        const precio =
            Number(p.Precio_Venta) || 0;

        const stock =
            Number(p.Stock) || 0;

        const idCant =
            `cant-${producto.replace(/\s+/g,'-')}`;

        cont.innerHTML += `
            <div class="card-sutil flex items-center justify-between mb-2">

                <div class="flex-1">

                    <h4 class="font-black text-[13px] uppercase text-slate-800 leading-tight">
                        ${producto}
                    </h4>

                    <div class="flex items-center gap-2 mt-1">

                        <span class="text-sm font-black text-primary">
                            $${precio.toFixed(2)}
                        </span>

                        <span class="tag tag-success" style="font-size:8px">
                            Stock: ${stock}
                        </span>

                    </div>

                </div>

                <div class="flex items-center gap-3 bg-purple-50 p-1 rounded-2xl">

                    <button
                        onclick="cambiarCant('${producto}',-1)"
                        class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-primary">
                        -
                    </button>

                    <span id="${idCant}"
                        class="w-6 text-center font-black text-lg text-slate-900">
                        0
                    </span>

                    <button
                        onclick="cambiarCant('${producto}',1)"
                        class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-xl text-primary">
                        +
                    </button>

                </div>
            </div>
        `;
    });
}

// ===============================
// CAMBIAR CANTIDAD
// ===============================
function cambiarCant(nombre, delta) {

    if (!carrito[nombre]) {
        carrito[nombre] = 0;
    }

    const p =
        productosData.find(x => x.Producto === nombre);

    if (!p) return;

    const stockDisp =
        Number(p.Stock) || 0;

    const nuevaCant =
        carrito[nombre] + delta;

    if (nuevaCant < 0) return;

    if (nuevaCant > stockDisp) {

        alert("¡Stock insuficiente!");

        return;
    }

    carrito[nombre] = nuevaCant;

    document.getElementById(
        `cant-${nombre.replace(/\s+/g,'-')}`
    ).innerText = nuevaCant;

    actualizarCarrito();
}

// ===============================
// ACTUALIZAR CARRITO
// ===============================
function actualizarCarrito() {

    let total = 0;
    let items = 0;
    let html = "";

    Object.keys(carrito).forEach(nombre => {

        const cantidad =
            carrito[nombre];

        if (cantidad > 0) {

            const p =
                productosData.find(x => x.Producto === nombre);

            const precio =
                Number(p.Precio_Venta) || 0;

            const subtotal =
                cantidad * precio;

            total += subtotal;

            items += cantidad;

            html += `
                <div class="flex justify-between py-1 border-b border-purple-50 last:border-0">

                    <span>
                        ${nombre} (x${cantidad})
                    </span>

                    <span class="text-slate-900">
                        $${subtotal.toFixed(2)}
                    </span>

                </div>
            `;
        }
    });

    document.getElementById('car-detalle').innerHTML =
        html ||
        '<p class="text-center text-slate-200 py-2 italic">Sin productos elegidos</p>';

    document.getElementById('car-total').innerText =
        `$${total.toFixed(2)}`;

    document.getElementById('car-items').innerText =
        `${items} Unidades`;
}

// ===============================
// PRUEBA CALIDAD
// ===============================
async function registrarPruebaCalidadRapida() {

    const cli =
        document.getElementById('select-cliente').value;

    const fec =
        document.getElementById('fecha-entrega').value;

    const items =
        Object.keys(carrito)
            .filter(n => carrito[n] > 0);

    if (!cli) {
        return alert("Primero selecciona un cliente");
    }

    if (items.length === 0) {
        return alert("Añade productos");
    }

    if (!confirm("¿CONFIRMAR PRUEBA DE CALIDAD?")) {
        return;
    }

    const overlay =
        document.getElementById('overlay-exito');

    overlay.style.display = 'flex';

    document.getElementById('titulo-estado').innerText =
        "Enviando Prueba...";

    try {

        for (const nombre of items) {

            await DairyAPI.enviarDatos({

                pestaña: "Ventas",

                ID_Venta:
                    "PRUEBA-" + Math.floor(Math.random() * 9999),

                Cliente: cli,

                Producto: nombre,

                Cantidad: carrito[nombre],

                Precio_PVP: 0,

                Fecha_Entrega: fec,

                Estado: "ENTREGADO"
            });
        }

        document.getElementById('icono-estado').innerText =
            "check_circle";

        document.getElementById('titulo-estado').innerText =
            "¡Prueba Guardada!";

        setTimeout(() => {
            location.reload();
        }, 1500);

    } catch (e) {

        console.error(e);

        overlay.style.display = 'none';

        alert("Error de conexión");
    }
}

// ===============================
// PROCESAR VENTA
// ===============================
async function procesarVenta() {

    const cli =
        document.getElementById('select-cliente').value;

    const fec =
        document.getElementById('fecha-entrega').value;

    const items =
        Object.keys(carrito)
            .filter(n => carrito[n] > 0);

    if (!cli || items.length === 0) {

        alert("Selecciona cliente y productos");

        return;
    }

    const overlay =
        document.getElementById('overlay-exito');

    overlay.style.display = 'flex';

    document.getElementById('titulo-estado').innerText =
        "Guardando Pedido...";

    try {

        for (const nombre of items) {

            const p =
                productosData.find(x => x.Producto === nombre);

            await DairyAPI.enviarDatos({

                pestaña: "Ventas",

                ID_Venta: idVenta,

                Cliente: cli,

                Producto: nombre,

                Cantidad: carrito[nombre],

                Precio_PVP:
                    Number(p.Precio_Venta) || 0,

                Fecha_Entrega: fec,

                Estado: "PENDIENTE"
            });
        }

        document.getElementById('icono-estado').innerText =
            "check_circle";

        document.getElementById('titulo-estado').innerText =
            "¡Pedido Guardado!";

        setTimeout(() => {

            overlay.style.display = 'none';

            document.getElementById('btn-confirmar').style.display =
                'none';

            document.getElementById('btn-whatsapp').style.display =
                'flex';

        }, 1500);

    } catch (e) {

        console.error(e);

        overlay.style.display = 'none';

        alert("Error guardando venta");
    }
}

// ===============================
// GUARDAR CLIENTE
// ===============================
async function guardarCliente() {

    const btn =
        document.getElementById('btn-guardar-cliente');

    const nom =
        document.getElementById('reg-nombre')
            .value.trim();

    const ruc =
        document.getElementById('reg-ruc')
            .value.trim();

    if (!nom || ruc.length < 10) {

        alert("Nombre y CI/RUC obligatorios");

        return;
    }

    btn.innerText = "PROCESANDO...";
    btn.disabled = true;

    try {

        await DairyAPI.enviarDatos({

            pestaña: "Clientes",

            ID:
                `C-${Date.now().toString().slice(-6)}`,

            Nombre:
                nom.toUpperCase(),

            CI_RUC: ruc,

            "Teléfono":
                document.getElementById('reg-tel').value.trim(),

            "Dirección":
                document.getElementById('reg-dir').value.trim(),

            "Referencia":
                document.getElementById('reg-ref').value.trim(),

            "Sector":
                document.getElementById('reg-sector').value,

            "Fecha Registro":
                new Date().toLocaleString()
        });

        alert("✅ CLIENTE REGISTRADO");

        location.reload();

    } catch (e) {

        console.error(e);

        alert("Error registrando cliente");

        btn.disabled = false;

        btn.innerText = "Guardar";
    }
}

// ===============================
// WHATSAPP
// ===============================
function enviarWhatsApp() {

    const cli =
        document.getElementById('select-cliente').value;

    const fec =
        document.getElementById('fecha-entrega').value;

    let listado = "";
    let total = 0;

    Object.keys(carrito).forEach(nombre => {

        if (carrito[nombre] > 0) {

            const p =
                productosData.find(x => x.Producto === nombre);

            const precio =
                Number(p.Precio_Venta) || 0;

            listado +=
                `• *${carrito[nombre]}* ${nombre}\n`;

            total +=
                carrito[nombre] * precio;
        }
    });

    const mensaje = `
*LÓGICA LÁCTEA - PEDIDO*

*ID:* ${idVenta}
*Cliente:* ${cli}
*Entrega:* ${fec}

*PRODUCTOS:*
${listado}

*TOTAL: $${total.toFixed(2)}*
`;

    window.open(
        `https://wa.me/?text=${encodeURIComponent(mensaje)}`,
        '_blank'
    );

    location.reload();
}

// ===============================
// FORMULARIO
// ===============================
function alternarFormulario(mostrar) {

    document
        .getElementById('vista-seleccion-cliente')
        .classList.toggle('hidden', mostrar);

    document
        .getElementById('vista-nuevo-cliente')
        .classList.toggle('hidden', !mostrar);
}

// ===============================
// FILTRO
// ===============================
function filtrar() {

    const q =
        document.getElementById('buscarProducto')
            .value.toLowerCase();

    document
        .querySelectorAll('.card-sutil')
        .forEach(c => {

            const h4 =
                c.querySelector('h4');

            if (h4) {

                c.style.display =
                    h4.innerText.toLowerCase().includes(q)
                        ? "flex"
                        : "none";
            }
        });
}

// ===============================
// START
// ===============================
window.onload = iniciar;
</script>
</body>
</html>
