<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Finanzas Lácteos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
padding:20px;
}

h1{
margin-bottom:20px;
color:#111;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card h3{
font-size:15px;
margin-bottom:10px;
color:#777;
}

.card span{
font-size:30px;
font-weight:bold;
color:#111;
}

.ventas{
border-left:6px solid #3498db;
}

.cobrado{
border-left:6px solid #2ecc71;
}

.pendiente{
border-left:6px solid #f39c12;
}

.proveedor{
border-left:6px solid #e74c3c;
}

.ganancia{
border-left:6px solid #9b59b6;
}

.items{
border-left:6px solid #1abc9c;
}

.loading{
text-align:center;
margin-top:40px;
font-size:18px;
color:#555;
}

</style>

</head>

<body>

<h1>
Resumen Financiero
</h1>

<div class="grid">

<div class="card ventas">
<h3>Total Ventas</h3>
<span id="ventas">$0</span>
</div>

<div class="card cobrado">
<h3>Total Cobrado</h3>
<span id="cobrado">$0</span>
</div>

<div class="card pendiente">
<h3>Por Cobrar</h3>
<span id="pendiente">$0</span>
</div>

<div class="card proveedor">
<h3>Pago Proveedor</h3>
<span id="proveedor">$0</span>
</div>

<div class="card ganancia">
<h3>Ganancia</h3>
<span id="ganancia">$0</span>
</div>

<div class="card items">
<h3>Productos Vendidos</h3>
<span id="items">0</span>
</div>

</div>

<div class="loading" id="loading">
Cargando resumen financiero...
</div>

<!-- ================================================= -->
<!-- API CENTRAL -->
<!-- ================================================= -->

<script src="./js/api-config.js"></script>

<script>

/**
 * =====================================================
 * CARGAR RESUMEN
 * =====================================================
 */

async function cargarResumenFinanciero() {

    try {

        const loading =
            document.getElementById("loading");

        loading.style.display = "block";

        /**
         * =============================================
         * PETICIÓN DIRECTA
         * =============================================
         */

        const response = await fetch(
            `${DairyConfig.SCRIPT_URL}?accion=resumenFinanciero`,
            {
                method: "GET",
                mode: "cors",
                headers: {
                    "Content-Type": "text/plain"
                }
            }
        );

        const data = await response.json();

        console.log(
            "Resumen financiero:",
            data
        );

        if (data.status !== "success") {

            alert(
                data.message ||
                "Error obteniendo resumen."
            );

            return;
        }

        const r = data.resumen;

        /**
         * =============================================
         * RENDER
         * =============================================
         */

        document.getElementById(
            "ventas"
        ).innerText =
            "$" +
            Number(
                r.totalVentas || 0
            ).toFixed(2);

        document.getElementById(
            "cobrado"
        ).innerText =
            "$" +
            Number(
                r.totalCobrado || 0
            ).toFixed(2);

        document.getElementById(
            "pendiente"
        ).innerText =
            "$" +
            Number(
                r.totalPendiente || 0
            ).toFixed(2);

        document.getElementById(
            "proveedor"
        ).innerText =
            "$" +
            Number(
                r.totalCostoProveedor || 0
            ).toFixed(2);

        document.getElementById(
            "ganancia"
        ).innerText =
            "$" +
            Number(
                r.totalGanancia || 0
            ).toFixed(2);

        document.getElementById(
            "items"
        ).innerText =
            Number(
                r.totalItems || 0
            );

        loading.style.display = "none";

    } catch(error) {

        console.error(
            "Error cargando finanzas:",
            error
        );

        alert(
            "No se pudo cargar el resumen."
        );
    }
}

/**
 * =====================================================
 * INICIO
 * =====================================================
 */

document.addEventListener(
    "DOMContentLoaded",
    cargarResumenFinanciero
);

</script>

</body>
</html>
