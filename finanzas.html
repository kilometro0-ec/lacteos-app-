<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Finanzas Lácteas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f0fa; padding: 12px; padding-bottom: 30px; }
        .header { background: white; padding: 14px; border-radius: 24px; margin-bottom: 14px; border: 1px solid #e9d5ff; }
        h1 { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #a21caf, #db2777); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
        .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .filtros select, .filtros input, .filtros button { padding: 10px 12px; border-radius: 40px; border: 1px solid #e9d5ff; background: white; font-size: 0.8rem; }
        .filtros button { background: #a21caf; color: white; border: none; cursor: pointer; }
        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .card { background: white; padding: 12px; border-radius: 18px; border-left: 4px solid; }
        .card h3 { font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .card span { font-size: 1.3rem; font-weight: 800; display: block; }
        .ventas { border-left-color: #3498db; }
        .cobrado { border-left-color: #2ecc71; }
        .pendiente { border-left-color: #f39c12; }
        .proveedor { border-left-color: #e74c3c; }
        .ganancia { border-left-color: #9b59b6; }
        .items { border-left-color: #1abc9c; }
        .panel { background: white; border-radius: 24px; padding: 14px; margin-bottom: 14px; border: 1px solid #e9d5ff; }
        .panel h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; border-left: 4px solid #a21caf; padding-left: 10px; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.7rem; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px 12px; border-radius: 40px; border: 1px solid #e2d6f0; background: #fefcff; font-size: 0.85rem; box-sizing: border-box; }
        button { background: #a21caf; color: white; border: none; padding: 12px; border-radius: 40px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.9rem; transition: opacity 0.3s; }
        button.success { background: #10b981; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .checkbox-group { max-height: 300px; overflow-y: auto; border: 1px solid #e2d6f0; border-radius: 20px; padding: 10px; background: #fefcff; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0e6ff; }
        .checkbox-item input { width: 20px; margin: 0; }
        .checkbox-item label { margin: 0; flex: 1; font-size: 0.8rem; color: #333; }
        .checkbox-item .cliente { font-size: 0.7rem; color: #888; }
        .select-all { background: #f0e9ff; padding: 8px; border-radius: 40px; margin-bottom: 10px; text-align: center; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .total-pago { background: #f0e9ff; padding: 10px; border-radius: 40px; text-align: center; margin-top: 10px; }
        .total-pago strong { font-size: 1.2rem; color: #a21caf; }
        .historial { max-height: 350px; overflow-y: auto; }
        .historial-item { background: #faf5ff; border-radius: 16px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #a21caf; }
        .historial-item .fecha { font-size: 0.7rem; color: #888; }
        .historial-item .detalle { font-weight: 600; margin: 4px 0; font-size: 0.85rem; }
        .historial-item .monto { color: #10b981; font-weight: 800; }
        @media (min-width: 768px) { body { padding: 20px; max-width: 900px; margin: 0 auto; } .grid-cards { grid-template-columns: repeat(3, 1fr); } }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="header">
    <h1>📊 Finanzas Lácteas</h1>
    <div class="filtros">
        <select id="filtroTipo" style="flex:1">
            <option value="dia">📅 Día</option>
            <option value="mes">🗓️ Mes</option>
            <option value="ano">📆 Año</option>
        </select>
        <input type="date" id="fechaDia" style="flex:1">
        <select id="fechaMes" style="flex:1; display:none;">
            <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
            <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
            <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
            <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
        </select>
        <input type="number" id="fechaAno" placeholder="Año" style="flex:1; display:none;">
        <button id="btnFiltrar" style="flex:0.5">🔍</button>
    </div>
</div>

<div class="grid-cards">
    <div class="card ventas"><h3>💰 Total Ventas</h3><span id="ventas">$0</span></div>
    <div class="card cobrado"><h3>✅ Cobrado</h3><span id="cobrado">$0</span></div>
    <div class="card pendiente"><h3>⏳ Por Cobrar</h3><span id="pendiente">$0</span></div>
    <div class="card proveedor"><h3>🏭 Pagado Proveedores</h3><span id="proveedor">$0</span></div>
    <div class="card ganancia"><h3>📈 Ganancia</h3><span id="ganancia">$0</span></div>
    <div class="card items"><h3>📦 Items Vendidos</h3><span id="items">0</span></div>
</div>

<div class="panel">
    <h2>🏭 Registrar Pago a Proveedor</h2>
    <div class="form-group">
        <label>Seleccionar Proveedor</label>
        <select id="selectProveedor">
            <option value="">Cargando proveedores...</option>
        </select>
    </div>
    <div class="form-group">
        <label>Fecha de Pago</label>
        <input type="date" id="fechaPagoProveedor">
    </div>
    <div class="form-group">
        <label>Productos Entregados a Pagar (Costo Proveedor)</label>
        <div class="select-all" id="btnSeleccionarTodos">✅ Seleccionar Todos</div>
        <div id="listaProductos" class="checkbox-group">
            <div class="checkbox-item">Seleccione un proveedor</div>
        </div>
    </div>
    <div class="total-pago">💰 Total a Pagar: <strong id="totalPagar">$0.00</strong></div>
    <button id="btnRegistrarPago" class="success">💸 Registrar Pago</button>
</div>

<div class="panel">
    <h2>📋 Historial de Pagos a Proveedores</h2>
    <div id="historialPagos" class="historial">
        <div class="historial-item">Cargando historial...</div>
    </div>
</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxps4vLr5wYI41zgemxTWqbvcrrU9zFLjWiZ-HH9pPapYMdFJK7_I4WZzze0l07JLKO6A/exec";
    
    let proveedores = [];
    let productosDisponibles = [];
    let productosSeleccionados = [];
    let filtroActual = { tipo: 'dia', valor: '' };
    let registrando = false;

    async function cargarProveedores() {
        try {
            const response = await fetch(`${SCRIPT_URL}?accion=leer&pestana=Proveedores`);
            const data = await response.json();
            if (data.status === 'success' && Array.isArray(data.data)) {
                proveedores = data.data;
                const select = document.getElementById('selectProveedor');
                select.innerHTML = '<option value="">Seleccionar proveedor</option>';
                proveedores.forEach(prov => {
                    const nombre = prov['Nombre del Proveedor'] || prov.nombre;
                    if (nombre && nombre !== 'Seleccionar proveedor') {
                        const option = document.createElement('option');
                        option.value = nombre;
                        option.textContent = nombre;
                        select.appendChild(option);
                    }
                });
            }
        } catch (error) {
            console.error('Error cargando proveedores:', error);
        }
    }

    async function cargarProductosPorProveedor(proveedor) {
        if (!proveedor) return;
        try {
            const response = await fetch(`${SCRIPT_URL}?accion=obtenerProductosPorProveedor&proveedor=${encodeURIComponent(proveedor)}`);
            const data = await response.json();
            if (data.status === 'success' && Array.isArray(data.data)) {
                productosDisponibles = data.data;
                renderListaProductos();
            } else {
                document.getElementById('listaProductos').innerHTML = '<div class="checkbox-item">No hay productos pendientes de pago</div>';
            }
        } catch (error) {
            console.error('Error cargando productos:', error);
        }
    }

    function renderListaProductos() {
        const container = document.getElementById('listaProductos');
        if (productosDisponibles.length === 0) {
            container.innerHTML = '<div class="checkbox-item">✅ No hay productos pendientes de pago para este proveedor</div>';
            return;
        }
        
        container.innerHTML = productosDisponibles.map((p, idx) => `
            <div class="checkbox-item">
                <input type="checkbox" 
                       value="${p.uniqueId || p.idVenta + '_' + p.producto}"
                       data-idventa="${p.idVenta}"
                       data-producto="${p.producto}"
                       data-cliente="${p.cliente}"
                       data-costo="${p.costoProveedor}"
                       data-idx="${idx}">
                <label>
                    <strong>${p.producto}</strong><br>
                    <span class="cliente">🧑 ${p.cliente} | ID: ${p.idVenta}</span><br>
                    <span style="color:#e74c3c; font-weight:600;">💰 A pagar: $${(p.costoProveedor || 0).toFixed(2)}</span>
                </label>
            </div>
        `).join('');
        
        document.querySelectorAll('#listaProductos input[type="checkbox"]').forEach(cb => {
            cb.addEventListener('change', calcularTotal);
        });
        
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        productosSeleccionados = [];
        document.querySelectorAll('#listaProductos input[type="checkbox"]:checked').forEach(cb => {
            const costo = parseFloat(cb.dataset.costo || 0);
            total += costo;
            productosSeleccionados.push({
                idVenta: cb.dataset.idventa,
                producto: cb.dataset.producto,
                cliente: cb.dataset.cliente,
                costoProveedor: costo
            });
        });
        document.getElementById('totalPagar').innerHTML = `$${total.toFixed(2)}`;
    }

    function seleccionarTodos() {
        const cbs = document.querySelectorAll('#listaProductos input[type="checkbox"]');
        if (cbs.length === 0) return;
        const todosCheckeados = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !todosCheckeados);
        calcularTotal();
    }

    // ==================== GENERAR PDF ====================
    function generarHTMLComprobante(proveedor, fecha, productos, total, numeroComprobante) {
        const ahora = new Date();
        const fechaHora = ahora.toLocaleString('es-EC');
        
        let detalleProductos = "";
        productos.forEach((p, index) => {
            detalleProductos += `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 8px; text-align: center;">${index + 1}</td>
                    <td style="padding: 8px;">${p.producto}</td>
                    <td style="padding: 8px;">${p.cliente}</td>
                    <td style="padding: 8px; text-align: right;">$${p.costoProveedor.toFixed(2)}</td>
                </tr>
            `;
        });
        
        return `
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>Comprobante Pago Proveedor</title>
                <style>
                    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; background: white; }
                    .comprobante { max-width: 800px; margin: 0 auto; border: 2px solid #a21caf; border-radius: 20px; padding: 25px; background: linear-gradient(135deg, #fff 0%, #faf0ff 100%); }
                    .header { text-align: center; border-bottom: 2px solid #a21caf; padding-bottom: 15px; margin-bottom: 20px; }
                    .logo { font-size: 28px; font-weight: bold; color: #a21caf; }
                    .sub-logo { font-size: 14px; color: #666; margin-top: 5px; }
                    .titulo { text-align: center; font-size: 18px; font-weight: bold; background: #a21caf; color: white; padding: 10px; border-radius: 40px; margin: 15px 0; }
                    .info { background: #f5f0fa; padding: 15px; border-radius: 15px; margin: 15px 0; }
                    .info p { margin: 8px 0; font-size: 14px; }
                    table { width: 100%; border-collapse: collapse; margin: 15px 0; }
                    th { background: #a21caf; color: white; padding: 10px; font-size: 12px; }
                    td { padding: 8px; font-size: 12px; }
                    .total { text-align: right; font-size: 18px; font-weight: bold; margin: 15px 0; padding: 10px; background: #f0e9ff; border-radius: 40px; }
                    .footer { text-align: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 12px; color: #666; }
                    .eslogan { text-align: center; font-size: 14px; font-style: italic; color: #a21caf; margin: 15px 0; }
                    .comprobante-numero { text-align: right; font-size: 10px; color: #999; margin-bottom: 10px; }
                </style>
            </head>
            <body>
                <div class="comprobante">
                    <div class="comprobante-numero">Comprobante #: ${numeroComprobante}</div>
                    <div class="header">
                        <div class="logo">🥛 LÓGICA LÁCTEA</div>
                        <div class="sub-logo">Productos Naturales y Artesanales</div>
                    </div>
                    <div class="titulo">COMPROBANTE DE PAGO A PROVEEDOR</div>
                    <div class="info">
                        <p><strong>📅 Fecha de emisión:</strong> ${fechaHora}</p>
                        <p><strong>🏭 Proveedor:</strong> ${proveedor}</p>
                        <p><strong>📅 Fecha de pago:</strong> ${fecha}</p>
                        <p><strong>📦 Total de items pagados:</strong> ${productos.length}</p>
                    </div>
                    <table>
                        <thead><tr><th>#</th><th>Producto</th><th>Cliente</th><th>Valor Pagado</th></tr></thead>
                        <tbody>${detalleProductos}</tbody>
                    </table>
                    <div class="total">💰 TOTAL PAGADO: $${total.toFixed(2)}</div>
                    <div class="eslogan">🌿 "De nuestra tierra a tu mesa, con amor y tradición láctea" 🌿</div>
                    <div class="footer">
                        <p>Un país sano con productos naturales y artesanales</p>
                        <p>✨ ¡Gracias por trabajar juntos por un Ecuador más saludable! ✨</p>
                        <p>LÓGICA LÁCTEA - Calidad y Tradición desde el Campo Ecuatoriano</p>
                    </div>
                </div>
            </body>
            </html>
        `;
    }

    async function generarPDF(proveedor, fecha, productos, total) {
        const numeroComprobante = 'PAG-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
        const htmlContent = generarHTMLComprobante(proveedor, fecha, productos, total, numeroComprobante);
        
        const element = document.createElement('div');
        element.innerHTML = htmlContent;
        element.style.position = 'absolute';
        element.style.left = '-9999px';
        document.body.appendChild(element);
        
        const opt = {
            margin: [0.5, 0.5, 0.5, 0.5],
            filename: `Comprobante_Pago_${proveedor.replace(/\s/g, '_')}_${fecha}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
        };
        
        try {
            await html2pdf().set(opt).from(element).save();
            document.body.removeChild(element);
            return { success: true, numeroComprobante };
        } catch (error) {
            console.error('Error generando PDF:', error);
            document.body.removeChild(element);
            return { success: false, error: error.message };
        }
    }

    // ==================== REGISTRAR PAGO ====================
    async function registrarPago() {
        if (registrando) {
            alert('⏳ Procesando pago, espere...');
            return;
        }
        
        const proveedor = document.getElementById('selectProveedor').value;
        const fecha = document.getElementById('fechaPagoProveedor').value;
        
        if (!proveedor) return alert('❌ Seleccione un proveedor');
        if (!fecha) return alert('❌ Seleccione la fecha de pago');
        if (productosSeleccionados.length === 0) return alert('❌ Seleccione al menos un producto');
        
        registrando = true;
        const btn = document.getElementById('btnRegistrarPago');
        btn.disabled = true;
        btn.textContent = '⏳ Procesando...';
        
        const total = productosSeleccionados.reduce((sum, p) => sum + p.costoProveedor, 0);
        const productosTexto = productosSeleccionados.map(p => `${p.producto} (${p.cliente})`).join(', ');
        
        try {
            const payload = {
                action: 'registrarPagoProveedor',
                proveedor: proveedor,
                fecha: fecha,
                productosJson: JSON.stringify(productosSeleccionados),
                productosTexto: productosTexto,
                total: total,
                items: productosSeleccionados.length
            };
            
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            const accion = confirm(`✅ Pago registrado exitosamente!\n\n📊 Resumen:\n🏭 Proveedor: ${proveedor}\n💰 Total: $${total.toFixed(2)}\n📦 Items: ${productosSeleccionados.length}\n\n¿Desea generar el comprobante PDF?`);
            
            if (accion) {
                const pdfResult = await generarPDF(proveedor, fecha, productosSeleccionados, total);
                
                if (pdfResult.success) {
                    const enviarWA = confirm(`📄 PDF generado correctamente!\n\n¿Desea abrir WhatsApp para enviar el comprobante?\n\n📌 INSTRUCCIÓN: Adjunte el PDF que acaba de descargar en el chat.`);
                    
                    if (enviarWA) {
                        const mensaje = `*🥛 LÓGICA LÁCTEA - COMPROBANTE DE PAGO* 🥛\n\n` +
                                        `🏭 *Proveedor:* ${proveedor}\n` +
                                        `📅 *Fecha:* ${fecha}\n` +
                                        `💰 *Total Pagado:* $${total.toFixed(2)}\n` +
                                        `📦 *Items pagados:* ${productosSeleccionados.length}\n` +
                                        `🆔 *Comprobante #:* ${pdfResult.numeroComprobante}\n\n` +
                                        `🌿 *"De nuestra tierra a tu mesa, con amor y tradición láctea"* 🌿\n\n` +
                                        `✨ ¡Gracias por trabajar juntos por un Ecuador más saludable! ✨\n\n` +
                                        `📎 *Adjunte el PDF que se descargó automáticamente*`;
                        
                        const waUrl = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
                        window.open(waUrl, '_blank');
                    }
                } else {
                    alert('❌ Error al generar el PDF');
                }
            }
            
            document.querySelectorAll('#listaProductos input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.getElementById('selectProveedor').value = '';
            productosSeleccionados = [];
            calcularTotal();
            
            await cargarHistorialPagos();
            await cargarResumenFinanciero();
            document.getElementById('listaProductos').innerHTML = '<div class="checkbox-item">Seleccione un proveedor</div>';
            
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error al registrar pago');
        } finally {
            registrando = false;
            btn.disabled = false;
            btn.textContent = '💸 Registrar Pago';
        }
    }

    // ==================== CARGAR HISTORIAL ====================
    async function cargarHistorialPagos() {
        try {
            const response = await fetch(`${SCRIPT_URL}?accion=leer&pestana=Finanzas`);
            const data = await response.json();
            
            if (data.status === 'success' && Array.isArray(data.data)) {
                const pagosRealizados = data.data.filter(fila => fila['Fecha Pago'] && fila['Fecha Pago'].toString().trim() !== '');
                
                const pagosAgrupados = {};
                pagosRealizados.forEach(fila => {
                    const key = `${fila['Fecha Pago']}_${fila['Proveedor']}`;
                    if (!pagosAgrupados[key]) {
                        pagosAgrupados[key] = {
                            fecha: fila['Fecha Pago'],
                            proveedor: fila['Proveedor'],
                            total: 0,
                            items: 0
                        };
                    }
                    const costo = parseFloat(String(fila['Costo Proveedor'] || 0).replace(',', '.'));
                    pagosAgrupados[key].total += costo;
                    pagosAgrupados[key].items++;
                });
                
                const historial = Object.values(pagosAgrupados).sort((a, b) => b.fecha.localeCompare(a.fecha));
                renderHistorial(historial);
            }
        } catch (error) {
            console.error('Error cargando historial:', error);
            document.getElementById('historialPagos').innerHTML = '<div class="historial-item">Error cargando historial</div>';
        }
    }

    function renderHistorial(historial) {
        const container = document.getElementById('historialPagos');
        if (!historial || historial.length === 0) {
            container.innerHTML = '<div class="historial-item">No hay pagos registrados</div>';
            return;
        }
        
        container.innerHTML = historial.map(p => `
            <div class="historial-item">
                <div class="fecha">📅 ${p.fecha}</div>
                <div class="detalle">🏭 ${p.proveedor}</div>
                <div class="detalle">📦 ${p.items} productos pagados</div>
                <div class="monto">💰 $${p.total.toFixed(2)}</div>
            </div>
        `).join('');
    }

    // ==================== RESUMEN FINANCIERO ====================
    async function cargarResumenFinanciero() {
        try {
            let url = `${SCRIPT_URL}?accion=resumenFinanciero`;
            if (filtroActual.tipo === 'dia' && filtroActual.valor) url += `&fecha=${filtroActual.valor}`;
            else if (filtroActual.tipo === 'mes' && filtroActual.valor) {
                const [mes, ano] = filtroActual.valor.split('-');
                url += `&mes=${mes}&ano=${ano}`;
            } else if (filtroActual.tipo === 'ano' && filtroActual.valor) url += `&ano=${filtroActual.valor}`;
            
            const response = await fetch(url);
            const data = await response.json();
            if (data.status === 'success' && data.resumen) {
                const r = data.resumen;
                document.getElementById('ventas').innerHTML = `$${(r.totalVentas || 0).toFixed(2)}`;
                document.getElementById('cobrado').innerHTML = `$${(r.totalCobrado || 0).toFixed(2)}`;
                document.getElementById('pendiente').innerHTML = `$${(r.totalPendiente || 0).toFixed(2)}`;
                document.getElementById('proveedor').innerHTML = `$${(r.totalCostoProveedor || 0).toFixed(2)}`;
                document.getElementById('ganancia').innerHTML = `$${(r.totalGanancia || 0).toFixed(2)}`;
                document.getElementById('items').innerHTML = r.totalItems || 0;
            }
        } catch (error) {
            console.error('Error cargando resumen:', error);
        }
    }

    // ==================== FILTROS ====================
    function actualizarVisibilidad() {
        const tipo = document.getElementById('filtroTipo').value;
        document.getElementById('fechaDia').style.display = tipo === 'dia' ? 'inline-block' : 'none';
        document.getElementById('fechaMes').style.display = tipo === 'mes' ? 'inline-block' : 'none';
        document.getElementById('fechaAno').style.display = tipo === 'ano' ? 'inline-block' : 'none';
        if (tipo === 'mes') document.getElementById('fechaAno').style.display = 'inline-block';
    }

    function aplicarFiltro() {
        const tipo = document.getElementById('filtroTipo').value;
        if (tipo === 'dia') {
            const dia = document.getElementById('fechaDia').value;
            if (!dia) return alert('Seleccione fecha');
            filtroActual = { tipo: 'dia', valor: dia };
        } else if (tipo === 'mes') {
            const mes = document.getElementById('fechaMes').value;
            const ano = document.getElementById('fechaAno').value;
            if (!ano) return alert('Ingrese año');
            filtroActual = { tipo: 'mes', valor: `${mes}-${ano}` };
        } else if (tipo === 'ano') {
            const ano = document.getElementById('fechaAno').value;
            if (!ano) return alert('Ingrese año');
            filtroActual = { tipo: 'ano', valor: ano };
        }
        cargarResumenFinanciero();
    }

    // ==================== INICIALIZACIÓN ====================
    window.addEventListener('DOMContentLoaded', async () => {
        await cargarProveedores();
        await cargarHistorialPagos();
        
        document.getElementById('selectProveedor').addEventListener('change', (e) => {
            if (e.target.value) cargarProductosPorProveedor(e.target.value);
            else document.getElementById('listaProductos').innerHTML = '<div class="checkbox-item">Seleccione un proveedor</div>';
        });
        document.getElementById('btnSeleccionarTodos').addEventListener('click', seleccionarTodos);
        document.getElementById('btnRegistrarPago').addEventListener('click', registrarPago);
        document.getElementById('filtroTipo').addEventListener('change', actualizarVisibilidad);
        document.getElementById('btnFiltrar').addEventListener('click', aplicarFiltro);
        
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fechaDia').value = hoy;
        document.getElementById('fechaPagoProveedor').value = hoy;
        document.getElementById('fechaAno').value = new Date().getFullYear();
        actualizarVisibilidad();
        filtroActual = { tipo: 'dia', valor: hoy };
        await cargarResumenFinanciero();
    });
</script>
</body>
</html>
