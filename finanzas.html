<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Finanzas Lácteas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #f5f0fa; padding: 12px; padding-bottom: 30px; }
        .header { background: white; padding: 14px; border-radius: 24px; margin-bottom: 14px; border: 1px solid #e9d5ff; }
        h1 { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, #a21caf, #db2777); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
        .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .filtros select, .filtros input, .filtros button { padding: 10px 12px; border-radius: 40px; border: 1px solid #e9d5ff; background: white; font-size: 0.8rem; }
        .filtros button { background: #a21caf; color: white; border: none; cursor: pointer; }
        .grid-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .card { background: white; padding: 12px; border-radius: 18px; border-left: 4px solid; }
        .card h3 { font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; }
        .card span { font-size: 1.3rem; font-weight: 800; display: block; }
        .ventas { border-left-color: #3498db; }
        .cobrado { border-left-color: #2ecc71; }
        .pendiente { border-left-color: #f39c12; }
        .proveedor { border-left-color: #e74c3c; }
        .ganancia { border-left-color: #9b59b6; }
        .items { border-left-color: #1abc9c; }
        .panel { background: white; border-radius: 24px; padding: 14px; margin-bottom: 14px; border: 1px solid #e9d5ff; }
        .panel h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; border-left: 4px solid #a21caf; padding-left: 10px; }
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.7rem; font-weight: 600; color: #666; display: block; margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px 12px; border-radius: 40px; border: 1px solid #e2d6f0; background: #fefcff; font-size: 0.85rem; box-sizing: border-box; }
        button { background: #a21caf; color: white; border: none; padding: 12px; border-radius: 40px; font-weight: 700; cursor: pointer; width: 100%; font-size: 0.9rem; }
        button.success { background: #10b981; }
        .checkbox-group { max-height: 300px; overflow-y: auto; border: 1px solid #e2d6f0; border-radius: 20px; padding: 10px; background: #fefcff; }
        .checkbox-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0e6ff; }
        .checkbox-item input { width: 20px; margin: 0; }
        .checkbox-item label { margin: 0; flex: 1; font-size: 0.8rem; color: #333; }
        .select-all { background: #f0e9ff; padding: 8px; border-radius: 40px; margin-bottom: 10px; text-align: center; cursor: pointer; font-size: 0.75rem; font-weight: 600; }
        .total-pago { background: #f0e9ff; padding: 10px; border-radius: 40px; text-align: center; margin-top: 10px; }
        .total-pago strong { font-size: 1.2rem; color: #a21caf; }
        .historial { max-height: 350px; overflow-y: auto; }
        .historial-item { background: #faf5ff; border-radius: 16px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #a21caf; }
        .historial-item .fecha { font-size: 0.7rem; color: #888; }
        .historial-item .detalle { font-weight: 600; margin: 4px 0; font-size: 0.85rem; }
        .historial-item .monto { color: #10b981; font-weight: 800; }
        @media (min-width: 768px) { body { padding: 20px; max-width: 900px; margin: 0 auto; } .grid-cards { grid-template-columns: repeat(3, 1fr); } }
    </style>
    <script src="./js/api-config.js"></script>
</head>
<body>
<div class="header">
    <h1>📊 Finanzas Lácteas</h1>
    <div class="filtros">
        <select id="filtroTipo" style="flex:1">
            <option value="dia">📅 Día</option>
            <option value="mes">🗓️ Mes</option>
            <option value="ano">📆 Año</option>
        </select>
        <input type="date" id="fechaDia" style="flex:1">
        <select id="fechaMes" style="flex:1; display:none;">
            <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
            <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
            <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
            <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
        </select>
        <input type="number" id="fechaAno" placeholder="Año" style="flex:1; display:none;">
        <button id="btnFiltrar" style="flex:0.5">🔍</button>
    </div>
</div>

<div class="grid-cards">
    <div class="card ventas"><h3>💰 Total Ventas</h3><span id="ventas">$0</span></div>
    <div class="card cobrado"><h3>✅ Cobrado</h3><span id="cobrado">$0</span></div>
    <div class="card pendiente"><h3>⏳ Por Cobrar</h3><span id="pendiente">$0</span></div>
    <div class="card proveedor"><h3>🏭 Pagado Proveedores</h3><span id="proveedor">$0</span></div>
    <div class="card ganancia"><h3>📈 Ganancia</h3><span id="ganancia">$0</span></div>
    <div class="card items"><h3>📦 Items Vendidos</h3><span id="items">0</span></div>
</div>

<div class="panel">
    <h2>🏭 Registrar Pago a Proveedor</h2>
    <div class="form-group">
        <label>Seleccionar Proveedor</label>
        <select id="selectProveedor">
            <option value="">Cargando proveedores...</option>
        </select>
    </div>
    <div class="form-group">
        <label>Fecha de Pago</label>
        <input type="date" id="fechaPagoProveedor">
    </div>
    <div class="form-group">
        <label>Productos Entregados a Pagar</label>
        <div class="select-all" id="btnSeleccionarTodos">✅ Seleccionar Todos</div>
        <div id="listaProductos" class="checkbox-group">
            <div class="checkbox-item">Seleccione un proveedor</div>
        </div>
    </div>
    <div class="total-pago">💰 Total a Pagar: <strong id="totalPagar">$0.00</strong></div>
    <button id="btnRegistrarPago" class="success">💸 Registrar Pago</button>
</div>

<div class="panel">
    <h2>📋 Historial de Pagos</h2>
    <div id="historialPagos" class="historial">
        <div class="historial-item">No hay pagos registrados</div>
    </div>
</div>

<script>
    let proveedores = [];
    let productosDisponibles = [];
    let productosSeleccionados = [];
    let historialPagos = [];
    let filtroActual = { tipo: 'dia', valor: '' };

    async function cargarProveedores() {
        const response = await fetch(`${DairyConfig.SCRIPT_URL}?accion=leer&pestana=Proveedores`);
        const data = await response.json();
        if (data.status === 'success' && Array.isArray(data.data)) {
            proveedores = data.data;
            const select = document.getElementById('selectProveedor');
            select.innerHTML = '<option value="">Seleccionar proveedor</option>';
            proveedores.forEach(prov => {
                const nombre = prov['Nombre del Proveedor'] || prov.nombre || 'Proveedor';
                if (nombre) {
                    const option = document.createElement('option');
                    option.value = nombre;
                    option.textContent = nombre;
                    select.appendChild(option);
                }
            });
        }
    }

    async function cargarProductosPorProveedor(proveedor) {
        if (!proveedor) return;
        const response = await fetch(`${DairyConfig.SCRIPT_URL}?accion=obtenerProductosPorProveedor&proveedor=${encodeURIComponent(proveedor)}`);
        const data = await response.json();
        if (data.status === 'success' && Array.isArray(data.data)) {
            productosDisponibles = data.data;
            renderListaProductos();
        }
    }

    function renderListaProductos() {
        const container = document.getElementById('listaProductos');
        if (productosDisponibles.length === 0) {
            container.innerHTML = '<div class="checkbox-item">No hay productos entregados para este proveedor</div>';
            return;
        }
        container.innerHTML = productosDisponibles.map((p, idx) => `
            <div class="checkbox-item">
                <input type="checkbox" value="${p.idVenta}" data-producto="${p.producto}" data-cliente="${p.cliente}" data-total="${p.totalVenta}" data-idx="${idx}">
                <label>${p.producto} - ${p.cliente} - $${p.totalVenta.toFixed(2)}</label>
            </div>
        `).join('');
        document.querySelectorAll('#listaProductos input[type="checkbox"]').forEach(cb => cb.addEventListener('change', calcularTotal));
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        productosSeleccionados = [];
        document.querySelectorAll('#listaProductos input[type="checkbox"]:checked').forEach(cb => {
            total += parseFloat(cb.dataset.total || 0);
            productosSeleccionados.push({
                idVenta: cb.value,
                producto: cb.dataset.producto,
                cliente: cb.dataset.cliente,
                total: parseFloat(cb.dataset.total)
            });
        });
        document.getElementById('totalPagar').innerHTML = `$${total.toFixed(2)}`;
    }

    function seleccionarTodos() {
        const cbs = document.querySelectorAll('#listaProductos input[type="checkbox"]');
        const todosCheckeados = Array.from(cbs).every(cb => cb.checked);
        cbs.forEach(cb => cb.checked = !todosCheckeados);
        calcularTotal();
    }

    async function registrarPago() {
        const proveedor = document.getElementById('selectProveedor').value;
        const fecha = document.getElementById('fechaPagoProveedor').value;
        if (!proveedor) return alert('Seleccione proveedor');
        if (!fecha) return alert('Seleccione fecha');
        if (productosSeleccionados.length === 0) return alert('Seleccione productos');
        
        const total = productosSeleccionados.reduce((sum, p) => sum + p.total, 0);
        const productosTexto = productosSeleccionados.map(p => `${p.producto} (${p.cliente})`).join(', ');
        
        const pago = { id: Date.now(), proveedor, fecha, productos: productosTexto, total, items: productosSeleccionados.length, timestamp: new Date().toISOString() };
        historialPagos.unshift(pago);
        if (historialPagos.length > 50) historialPagos.pop();
        localStorage.setItem('historialPagos', JSON.stringify(historialPagos));
        
        alert(`✅ Pago registrado\nProveedor: ${proveedor}\nTotal: $${total.toFixed(2)}`);
        
        document.querySelectorAll('#listaProductos input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.getElementById('selectProveedor').value = '';
        productosSeleccionados = [];
        calcularTotal();
        renderHistorial();
        await cargarResumenFinanciero();
    }

    function renderHistorial() {
        const container = document.getElementById('historialPagos');
        if (historialPagos.length === 0) {
            container.innerHTML = '<div class="historial-item">No hay pagos registrados</div>';
            return;
        }
        container.innerHTML = historialPagos.map(p => `
            <div class="historial-item">
                <div class="fecha">📅 ${p.fecha}</div>
                <div class="detalle">🏭 ${p.proveedor}</div>
                <div class="detalle">📦 ${p.items} productos</div>
                <div class="monto">💰 $${p.total.toFixed(2)}</div>
            </div>
        `).join('');
    }

    async function cargarResumenFinanciero() {
        let url = `${DairyConfig.SCRIPT_URL}?accion=resumenFinanciero`;
        if (filtroActual.tipo === 'dia' && filtroActual.valor) url += `&fecha=${filtroActual.valor}`;
        else if (filtroActual.tipo === 'mes' && filtroActual.valor) {
            const [mes, ano] = filtroActual.valor.split('-');
            url += `&mes=${mes}&ano=${ano}`;
        } else if (filtroActual.tipo === 'ano' && filtroActual.valor) url += `&ano=${filtroActual.valor}`;
        
        const response = await fetch(url);
        const data = await response.json();
        if (data.status === 'success' && data.resumen) {
            const r = data.resumen;
            document.getElementById('ventas').innerHTML = `$${r.totalVentas.toFixed(2)}`;
            document.getElementById('cobrado').innerHTML = `$${r.totalCobrado.toFixed(2)}`;
            document.getElementById('pendiente').innerHTML = `$${r.totalPendiente.toFixed(2)}`;
            const totalPagado = historialPagos.reduce((sum, p) => sum + p.total, 0);
            document.getElementById('proveedor').innerHTML = `$${totalPagado.toFixed(2)}`;
            document.getElementById('ganancia').innerHTML = `$${(r.totalGanancia - totalPagado).toFixed(2)}`;
            document.getElementById('items').innerHTML = r.totalItems;
        }
    }

    function actualizarVisibilidad() {
        const tipo = document.getElementById('filtroTipo').value;
        document.getElementById('fechaDia').style.display = tipo === 'dia' ? 'inline-block' : 'none';
        document.getElementById('fechaMes').style.display = tipo === 'mes' ? 'inline-block' : 'none';
        document.getElementById('fechaAno').style.display = tipo === 'ano' ? 'inline-block' : 'none';
        if (tipo === 'mes') document.getElementById('fechaAno').style.display = 'inline-block';
    }

    function aplicarFiltro() {
        const tipo = document.getElementById('filtroTipo').value;
        if (tipo === 'dia') {
            const dia = document.getElementById('fechaDia').value;
            if (!dia) return alert('Seleccione fecha');
            filtroActual = { tipo: 'dia', valor: dia };
        } else if (tipo === 'mes') {
            const mes = document.getElementById('fechaMes').value;
            const ano = document.getElementById('fechaAno').value;
            if (!ano) return alert('Ingrese año');
            filtroActual = { tipo: 'mes', valor: `${mes}-${ano}` };
        } else if (tipo === 'ano') {
            const ano = document.getElementById('fechaAno').value;
            if (!ano) return alert('Ingrese año');
            filtroActual = { tipo: 'ano', valor: ano };
        }
        cargarResumenFinanciero();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const stored = localStorage.getItem('historialPagos');
        if (stored) historialPagos = JSON.parse(stored);
        renderHistorial();
        
        await cargarProveedores();
        
        document.getElementById('selectProveedor').addEventListener('change', (e) => {
            if (e.target.value) cargarProductosPorProveedor(e.target.value);
            else document.getElementById('listaProductos').innerHTML = '<div class="checkbox-item">Seleccione un proveedor</div>';
        });
        document.getElementById('btnSeleccionarTodos').addEventListener('click', seleccionarTodos);
        document.getElementById('btnRegistrarPago').addEventListener('click', registrarPago);
        document.getElementById('filtroTipo').addEventListener('change', actualizarVisibilidad);
        document.getElementById('btnFiltrar').addEventListener('click', aplicarFiltro);
        
        const hoy = new Date().toISOString().split('T')[0];
        document.getElementById('fechaDia').value = hoy;
        document.getElementById('fechaPagoProveedor').value = hoy;
        document.getElementById('fechaAno').value = new Date().getFullYear();
        actualizarVisibilidad();
        filtroActual = { tipo: 'dia', valor: hoy };
        await cargarResumenFinanciero();
    });
</script>
</body>
</html>
